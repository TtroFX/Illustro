name: Verify M0 engineering foundation batch 4

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'biome.json'
      - 'vitest.config.ts'
      - 'src/**'
      - 'scripts/**'
      - 'bench/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/m0-batch4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Generate dependency lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Restore from generated lock
        run: npm ci --ignore-scripts
      - name: Apply canonical formatting
        run: npm run format
      - name: Verify formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Production build
        env:
          ILLUSTRO_BUILD_MODE: production
          ILLUSTRO_BUILD_SHA: ${{ github.sha }}
        run: npm run build
      - name: Integration tests
        run: npm run test:integration
      - name: Verify batch contract
        run: npm run verify:m0-batch4
      - name: Close verified progress items
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ids = ['M0-020', 'M0-021', 'M0-022', 'M0-023', 'M0-024', 'M0-025', 'M0-026']
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text(encoding='utf-8')
          for item in ids:
              prefix = f'{item} '
              matches = [line for line in text.splitlines() if line.startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f'expected exactly one progress line for {item}')
              line = matches[0]
              if line.endswith(':未完了'):
                  text = text.replace(line, line[:-3] + '完了', 1)
              elif not line.endswith(':完了'):
                  raise SystemExit(f'unexpected progress state for {item}: {line}')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit verified lock, formatting, and progress
        run: |
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: close M0 engineering foundation batch 4 [skip ci]'
          git push origin HEAD:main
