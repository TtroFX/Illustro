name: Apply M5C difference blend modes once

on:
  push:
    branches:
      - work/m5c-difference-blends-20260902
    paths:
      - '.github/workflows/apply-m5c-difference-blends-once.yml'

permissions:
  contents: write

jobs:
  apply-verify-persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply M5C-019 through M5C-022
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, before, after):
              p = Path(path)
              text = p.read_text()
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {before[:120]!r}')
              p.write_text(text.replace(before, after, 1))

          replace_once(
              'src/gpu/blend-modes.ts',
              """  'pin-light',\n  'hard-mix',\n] as const satisfies readonly BlendModeId[]);\n""",
              """  'pin-light',\n  'hard-mix',\n  'difference',\n  'exclusion',\n  'subtract',\n  'divide',\n] as const satisfies readonly BlendModeId[]);\n""",
          )
          replace_once(
              'src/gpu/blend-modes.ts',
              """      case 'hard-mix':\n        return backdropChannel + sourceChannel >= 1 ? 1 : 0;\n    }\n""",
              """      case 'hard-mix':\n        return backdropChannel + sourceChannel >= 1 ? 1 : 0;\n      case 'difference':\n        return Math.abs(backdropChannel - sourceChannel);\n      case 'exclusion':\n        return backdropChannel + sourceChannel - 2 * backdropChannel * sourceChannel;\n      case 'subtract':\n        return Math.max(0, backdropChannel - sourceChannel);\n      case 'divide':\n        return sourceChannel <= 0 ? 1 : Math.min(1, backdropChannel / sourceChannel);\n    }\n""",
          )

          replace_once(
              'tests/unit/blend-modes.test.ts',
              """  'pin-light': [0.6, 0.4, 0.6],\n  'hard-mix': [1, 0, 1],\n};\n""",
              """  'pin-light': [0.6, 0.4, 0.6],\n  'hard-mix': [1, 0, 1],\n  difference: [0.1, 0.15, 0.6],\n  exclusion: [0.5, 0.45, 0.68],\n  subtract: [0.1, 0.15, 0],\n  divide: [1, 1, 0.25],\n};\n""",
          )
          replace_once(
              'tests/unit/blend-modes.test.ts',
              """  it('selects complete RGB tuples for Darker/Lighter Color instead of mixing channels', () => {\n    expect(blendRgbV1('darker-color', [0.9, 0.1, 0.1], [0.4, 0.4, 0.4])).toEqual([0.9, 0.1, 0.1]);\n    expect(blendRgbV1('darker-color', [0.8, 0.8, 0.1], [0.2, 0.2, 0.2])).toEqual([0.2, 0.2, 0.2]);\n    expect(blendRgbV1('lighter-color', [0.9, 0.1, 0.1], [0.4, 0.4, 0.4])).toEqual([0.4, 0.4, 0.4]);\n    expect(blendRgbV1('lighter-color', [0.8, 0.8, 0.1], [0.2, 0.2, 0.2])).toEqual([0.8, 0.8, 0.1]);\n  });\n""",
              """  it('selects complete RGB tuples for Darker/Lighter Color instead of mixing channels', () => {\n    expect(blendRgbV1('darker-color', [0.9, 0.1, 0.1], [0.4, 0.4, 0.4])).toEqual([0.9, 0.1, 0.1]);\n    expect(blendRgbV1('darker-color', [0.8, 0.8, 0.1], [0.2, 0.2, 0.2])).toEqual([0.2, 0.2, 0.2]);\n    expect(blendRgbV1('lighter-color', [0.9, 0.1, 0.1], [0.4, 0.4, 0.4])).toEqual([0.4, 0.4, 0.4]);\n    expect(blendRgbV1('lighter-color', [0.8, 0.8, 0.1], [0.2, 0.2, 0.2])).toEqual([0.8, 0.8, 0.1]);\n  });\n\n  it('keeps comparative arithmetic edge cases bounded', () => {\n    expect(blendRgbV1('difference', [0.2, 0.4, 0.6], [1, 0, 0.6])).toEqual([0.8, 0.4, 0]);\n    expect(blendRgbV1('subtract', [0.2, 0.4, 0.6], [0.8, 0.1, 1])).toEqual([0, 0.30000000000000004, 0]);\n    expect(blendRgbV1('divide', [0.2, 0.4, 0.6], [0, 1, 0.3])).toEqual([1, 0.4, 1]);\n  });\n""",
          )

          replace_once(
              'tests/unit/baseline-blend-compositor.test.ts',
              """    store.setLayers([\n      { layerId: 'bottom', visible: true, opacity: 1 },\n      { layerId: 'top', visible: true, opacity: 1, blendMode: 'hard-mix' },\n    ]);\n    expect([...store.compositeTiles()[0]!.bytes]).toEqual([255, 255, 255, 255]);\n  });\n""",
              """    store.setLayers([\n      { layerId: 'bottom', visible: true, opacity: 1 },\n      { layerId: 'top', visible: true, opacity: 1, blendMode: 'hard-mix' },\n    ]);\n    expect([...store.compositeTiles()[0]!.bytes]).toEqual([255, 255, 255, 255]);\n\n    store.setLayers([\n      { layerId: 'bottom', visible: true, opacity: 1 },\n      { layerId: 'top', visible: true, opacity: 1, blendMode: 'difference' },\n    ]);\n    expect([...store.compositeTiles()[0]!.bytes]).toEqual([0, 0, 0, 255]);\n  });\n""",
          )

          replace_once(
              'src/index.html',
              """<option value=\"pin-light\">ピンライト</option><option value=\"hard-mix\">ハードミックス</option></select>""",
              """<option value=\"pin-light\">ピンライト</option><option value=\"hard-mix\">ハードミックス</option><option value=\"difference\">差の絶対値</option><option value=\"exclusion\">除外</option><option value=\"subtract\">減算</option><option value=\"divide\">除算</option></select>""",
          )

          replace_once(
              'scripts/verify-m5c-compositor.mjs',
              """  \"'pin-light'\",\n  \"'hard-mix'\",\n  'compositeBlendRgbaV1',\n""",
              """  \"'pin-light'\",\n  \"'hard-mix'\",\n  \"'difference'\",\n  \"'exclusion'\",\n  \"'subtract'\",\n  \"'divide'\",\n  'compositeBlendRgbaV1',\n""",
          )
          replace_once(
              'scripts/verify-m5c-compositor.mjs',
              """  'value=\"pin-light\"',\n  'value=\"hard-mix\"',\n]);\n""",
              """  'value=\"pin-light\"',\n  'value=\"hard-mix\"',\n  'value=\"difference\"',\n  'value=\"exclusion\"',\n  'value=\"subtract\"',\n  'value=\"divide\"',\n]);\n""",
          )
          replace_once(
              'scripts/verify-m5c-compositor.mjs',
              """  'M5C-018 Hard Mix:完了',\n  'M5C-019 Difference:未完了',\n]);\n""",
              """  'M5C-018 Hard Mix:完了',\n  'M5C-019 Difference:完了',\n  'M5C-020 Exclusion:完了',\n  'M5C-021 Subtract:完了',\n  'M5C-022 Divide:完了',\n  'M5C-023 Hue:未完了',\n]);\n""",
          )

          for item in [
              'M5C-019 Difference',
              'M5C-020 Exclusion',
              'M5C-021 Subtract',
              'M5C-022 Divide',
          ]:
              replace_once('IMPLEMENTATION_PROGRESS.md', f'{item}:未完了', f'{item}:完了')
          replace_once(
              'IMPLEMENTATION_PROGRESS.md',
              'M5C-011〜018のLighter Color / contrast-light系blend modeはcanonical Raster Tile compositorへ接続済み。次はM5C-019 Differenceから再開する。',
              'M5C-011〜018のLighter Color / contrast-light系とM5C-019〜022のdifference arithmetic系blend modeはcanonical Raster Tile compositorへ接続済み。次はM5C-023 Hueから再開する。',
          )
          PY
      - name: Format
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Prepare generated assets
        run: npm run prepare:generated
      - name: Focused M5C tests
        run: npx vitest run tests/unit/blend-modes.test.ts tests/unit/baseline-blend-compositor.test.ts tests/unit/layer-blend-mode.test.ts tests/unit/renderer-controller.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: M5C contract inspection
        run: npm run verify:m5c
      - name: Full unit regression
        run: npm run test:unit
      - name: Production build
        env:
          ILLUSTRO_BUILD_MODE: production
        run: npm run build
      - name: Integration regression
        run: npm run test:integration
      - name: Persist verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gpu/blend-modes.ts src/index.html tests/unit/blend-modes.test.ts tests/unit/baseline-blend-compositor.test.ts scripts/verify-m5c-compositor.mjs IMPLEMENTATION_PROGRESS.md
          git commit -m 'feat: implement M5C difference blend modes [skip ci]'
          git push origin HEAD:work/m5c-difference-blends-20260902
