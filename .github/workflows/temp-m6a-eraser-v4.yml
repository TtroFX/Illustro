name: Temporary M6A Eraser v4

on:
  push:
    branches: [work/m6a-eraser-20260902]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/m6a-eraser-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Repair staging anchors
        run: |
          python scripts/fix-m6a-eraser-patcher.py
          python scripts/fix-m6a-eraser-patcher-v2.py
          python scripts/fix-m6a-eraser-patcher-v3.py
          python scripts/fix-m6a-eraser-patcher-v4.py
          python scripts/fix-m6a-eraser-patcher-v5.py
      - name: Apply M6A Eraser
        run: python scripts/apply-m6a-eraser.py
      - name: Formatting
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Prepare generated assets
        run: npm run prepare:generated
      - name: Focused M6A Eraser tests
        run: npx vitest run tests/unit/eraser-mode.test.ts tests/unit/canonical-raster-brush.test.ts tests/unit/baseline-paint-renderer.test.ts tests/unit/paint-session-controller.test.ts tests/unit/paint-raster-tile-bridge.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: M5D compatibility inspection
        run: npm run verify:m5d
      - name: M6A contract inspection
        run: npm run verify:m6a
      - name: Full unit suite
        run: npm run test:unit
      - name: Production build
        env:
          ILLUSTRO_BUILD_MODE: production
        run: npm run build
      - name: Integration tests
        run: npm run test:integration
      - name: Persist verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ILLUSTRO_DESIGN_MEMO.md \
            IMPLEMENTATION_PROGRESS.md \
            public/app-shell.css \
            scripts/verify-m6a-brush.mjs \
            src/app/canonical-raster-brush.ts \
            src/app/main.ts \
            src/app/paint-session-controller.ts \
            src/app/renderer-controller.ts \
            src/gpu/baseline-brush.ts \
            src/gpu/baseline-paint-renderer.ts \
            src/gpu/baseline-raster-tile-store.ts \
            src/index.html \
            src/workers/render.worker.ts \
            tests/unit/eraser-mode.test.ts
          git commit -m "feat: implement M6A Eraser mode"
          git push origin HEAD:work/m6a-eraser-20260902
