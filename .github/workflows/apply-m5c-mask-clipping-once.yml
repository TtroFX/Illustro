function maskDescriptor(bytes: readonly number[], options: Partial<BaselineRasterMaskDescriptorV1> = {}): BaselineRasterMaskDescriptorV1 {
  const coverage = new Uint8Array(bytes.length * 4);
  bytes.forEach((value, pixel) => {
    coverage[pixel * 4] = value;
    coverage[pixel * 4 + 1] = value;
    coverage[pixel * 4 + 2] = value;
    coverage[pixel * 4 + 3] = 255;
  });
  return Object.freeze({
    maskId: 'mask-1',
    enabled: true,
    inverted: false,
    defaultCoverage: 1,
    effects: Object.freeze([]),
    tiles: Object.freeze([
      Object.freeze({
        coordinate: Object.freeze({ tx: 0, ty: 0 }),
        width: bytes.length,
        height: 1,
        bytes: coverage,
      }),
    ]),
    ...options,
  });
}

