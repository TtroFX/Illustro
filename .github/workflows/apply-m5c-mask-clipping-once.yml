name: Apply M5C mask clipping compositor once

on:
  push:
    branches:
      - work/m5c-mask-clipping-compositor-20260902
    paths:
      - .github/workflows/apply-m5c-mask-clipping-once.yml

permissions:
  contents: write

jobs:
  apply-verify-persist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Correct temporary patch helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-m5c-mask-clipping.py')
          t = p.read_text()
          t = t.replace('"""  type BaselineRasterLayerDescriptorV1,\\n  type BaselineRasterTileImageV1,\\n"""', '"""  BaselineRasterLayerDescriptorV1,\\n  BaselineRasterTileImageV1,\\n"""')
          t = t.replace('"""  type BaselineAffineMatrixV1,\\n  type BaselineRasterLayerDescriptorV1,\\n  type BaselineRasterMaskDescriptorV1,\\n  type BaselineRasterMaskTileImageV1,\\n  type BaselineRasterTileImageV1,\\n"""', '"""  BaselineAffineMatrixV1,\\n  BaselineRasterLayerDescriptorV1,\\n  BaselineRasterMaskDescriptorV1,\\n  BaselineRasterMaskTileImageV1,\\n  BaselineRasterTileImageV1,\\n"""')
          p.write_text(t)
          PY
      - name: Apply M5C-028 compositor integration
        run: python scripts/apply-m5c-mask-clipping.py
      - name: Format
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Prepare generated assets
        run: npm run prepare:generated
      - name: Focused M5C tests
        run: npx vitest run tests/unit/m5c-mask-clipping-compositor.test.ts tests/unit/baseline-blend-compositor.test.ts tests/unit/blend-modes.test.ts tests/unit/layer-mask-paint.test.ts tests/unit/layer-mask-effects.test.ts tests/unit/renderer-controller.test.ts tests/unit/paint-session-controller.test.ts tests/unit/paint-persistence-controller.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: M5C contract inspection
        run: npm run verify:m5c
      - name: Full unit regression
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - name: Integration regression
        run: npm run test:integration
      - name: Persist verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-m5c-mask-clipping-once.yml scripts/apply-m5c-mask-clipping.py
          git config user.name "TtroFX"
          git config user.email "ttro0419@gmail.com"
          git add -A
          git commit -m "feat: integrate M5C mask clipping compositor"
          git push origin HEAD:work/m5c-mask-clipping-compositor-20260902
