name: Apply M5C mask clipping compositor once

on:
  push:
    branches:
      - work/m5c-mask-clipping-compositor-20260902
    paths:
      - .github/workflows/apply-m5c-mask-clipping-once.yml

permissions:
  contents: write

jobs:
  apply-verify-persist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply M5C-028 compositor integration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, before, after):
              p = Path(path)
              text = p.read_text()
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {before[:160]!r}')
              p.write_text(text.replace(before, after, 1))

