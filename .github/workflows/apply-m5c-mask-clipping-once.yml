function rasterTile(layerId: string, width: number, height: number, rgba: readonly number[]): BaselineRasterTileImageV1 {
  const bytes = new Uint8Array(width * height * 4);
  for (let pixel = 0; pixel < width * height; pixel += 1) {
    bytes.set(rgba, pixel * 4);
