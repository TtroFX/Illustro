name: Repair USER-01 verifier trigger

on:
  push:
    paths:
      - '.github/workflows/repair-user01-verifier-trigger.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Update verifier contract and retrigger patch workflow
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          verifier = Path('scripts/verify-m4-vertical-slice.mjs')
          text = verifier.read_text()
          old = "  'paintPersistence.markDirty',"
          new = "  'paintPersistence.scheduleDirty',"
          if old not in text:
              raise SystemExit('old M4 persistence contract not found')
          verifier.write_text(text.replace(old, new, 1))

          workflow = Path('.github/workflows/fix-user01-performance-history.yml')
          wtext = workflow.read_text()
          marker = 'name: Apply USER-01 performance and history controls fix\n'
          replacement = 'name: Apply USER-01 performance and history controls fix\n# verifier-contract-v2\n'
          if marker not in wtext:
              raise SystemExit('USER-01 patch workflow marker not found')
          workflow.write_text(wtext.replace(marker, replacement, 1))
          PY
          rm .github/workflows/repair-user01-verifier-trigger.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: align M4 verifier with deferred brush persistence'
          git push origin HEAD:main
