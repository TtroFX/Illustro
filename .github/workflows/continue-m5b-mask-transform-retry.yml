name: Retry M5B mask transform continuation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  retry-m5b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - name: Reapply continuation with canonical affine zeros
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/continue-m5b-mask-transform-once.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          body = source[start:end]
          lines = []
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines)
          script = script.replace(
              'const c = -sine * input.scaleY;',
              'const cValue = -sine * input.scaleY;\n  const c = Object.is(cValue, -0) ? 0 : cValue;',
              1,
          )
          exec(compile(script, '<m5b-continuation>', 'exec'))
          PY
      - name: Format focused changes
        run: npm run format
      - name: Focused mask transform tests
        run: npx vitest run tests/unit/layer-mask-transform.test.ts tests/unit/layer-mask-link.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Verify progress closure
        shell: bash
        run: |
          grep -F 'USER-01 新規作成・描画・Undo/Redo・保存再読込・PNG Exportユーザー確認PASS:完了' IMPLEMENTATION_PROGRESS.md
          grep -F 'M5B-039 Mask independent move:完了' IMPLEMENTATION_PROGRESS.md
          grep -F 'M5B-040 Mask independent transform:完了' IMPLEMENTATION_PROGRESS.md
      - name: Commit checkpoint
        shell: bash
        run: |
          rm .github/workflows/continue-m5b-mask-transform-once.yml
          rm .github/workflows/continue-m5b-mask-transform-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/layer-mask-transform.ts src/app/layer-workflow-controller.ts src/index.html tests/unit/layer-mask-transform.test.ts IMPLEMENTATION_PROGRESS.md .github/workflows/continue-m5b-mask-transform-once.yml .github/workflows/continue-m5b-mask-transform-retry.yml
          git commit -m 'feat: add independent mask transforms and close USER-01'
          git push origin HEAD:main
