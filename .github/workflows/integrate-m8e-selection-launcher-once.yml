name: Integrate M8E Selection Launcher once

on:
  push:
    branches: [main]
    paths:
      - '.github/m8e-selection-launcher-trigger'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Rebase latest main
        run: git pull --rebase origin main
      - name: Wire M8E and record staged progress
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path('src/app/main.ts')
          main = main_path.read_text()
          import_anchor = "import { SelectionCoverageControllerV1 } from './selection-coverage-controller.js';\n"
          import_line = "import { installM8SelectionLauncherV1 } from './m8-selection-launcher.js';\n"
          if import_line not in main:
              if import_anchor not in main:
                  raise SystemExit('M8E main import anchor missing')
              main = main.replace(import_anchor, import_anchor + import_line, 1)

          install_anchor = "let localLibraryController: LocalProjectLibraryControllerV1 | null = null;\n"
          install_block = "const selectionLauncher = installM8SelectionLauncherV1({\n  root,\n  paintSession,\n  paintPersistence,\n  selectionCoverage,\n  viewport,\n});\nvoid selectionLauncher;\n"
          if install_block not in main:
              if install_anchor not in main:
                  raise SystemExit('M8E install anchor missing')
              main = main.replace(install_anchor, install_block + install_anchor, 1)
          main_path.write_text(main)

          launcher_path = Path('src/app/m8-selection-launcher.ts')
          launcher = launcher_path.read_text()
          old_add = "  stage.addEventListener('pointerup', (event) => void completeSelection(event), true);\n"
          new_add = "  const onStagePointerUp = (event: PointerEvent): void => {\n    void completeSelection(event);\n  };\n  stage.addEventListener('pointerup', onStagePointerUp, true);\n"
          if old_add in launcher:
              launcher = launcher.replace(old_add, new_add, 1)
          elif new_add not in launcher:
              raise SystemExit('M8E pointerup listener anchor missing')
          dispose_anchor = "      stage.removeEventListener('pointermove', moveSelection, true);\n"
          dispose_new = dispose_anchor + "      stage.removeEventListener('pointerup', onStagePointerUp, true);\n"
          if "removeEventListener('pointerup', onStagePointerUp" not in launcher:
              if dispose_anchor not in launcher:
                  raise SystemExit('M8E pointerup dispose anchor missing')
              launcher = launcher.replace(dispose_anchor, dispose_new, 1)
          launcher_path.write_text(launcher)

          progress_path = Path('IMPLEMENTATION_PROGRESS.md')
          progress = progress_path.read_text()
          m8d_old = 'USER-M8D M8D UI/UX/Visualユーザー確認PASS:未完了'
          m8d_new = 'USER-M8D M8D UI/UX/Visualユーザー確認PASS:完了'
          if m8d_old in progress:
              progress = progress.replace(m8d_old, m8d_new, 1)
          elif m8d_new not in progress:
              raise SystemExit('M8D user gate anchor missing')

          for index in range(1, 17):
              prefix = f'M8E-{index:03d} '
              lines = progress.splitlines()
              matches = [line for line in lines if line.startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f'M8E progress anchor missing/duplicate: {prefix}')
              old = matches[0]
              if old.endswith(':未完了'):
                  progress = progress.replace(old, old[:-3] + '仮完了', 1)
              elif not old.endswith(':仮完了'):
                  raise SystemExit(f'M8E unexpected state: {old}')
          progress = progress.replace('M8E-検査 M8E内部検査:未完了', 'M8E-検査 M8E内部検査:仮完了', 1)
          progress_path.write_text(progress)
          PY
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Format M8E TypeScript
        run: npx biome format --write src/app/main.ts src/app/selection-coverage-controller.ts src/app/m8-selection-launcher.ts tests/unit/m8-selection-launcher.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Focused M8E tests
        run: npx vitest run tests/unit/m8-selection-launcher.test.ts tests/unit/m8-tool-rail.test.ts tests/unit/m8-inspector-dock.test.ts
      - name: Production build
        run: npm run build
      - name: Remove temporary helpers
        run: rm .github/workflows/integrate-m8e-selection-launcher-once.yml .github/m8e-selection-launcher-trigger
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrate canonical M8E Selection Launcher'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
