name: Integrate M3 render scheduling foundation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m3-render-foundation-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - name: Wire render worker
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/workers/render.worker.ts')
          text = path.read_text()
          replacements = [
              (
                  "import { RendererTileStateV1 } from '../gpu/renderer-tile-state.js';\n",
                  "import { RendererTileStateV1 } from '../gpu/renderer-tile-state.js';\nimport {\n  installRenderSchedulingExtensionV1,\n  type RenderSchedulingControllerV1,\n} from './render-scheduling-extension.js';\n",
              ),
              (
                  "let tileState: RendererTileStateV1 | null = null;\n",
                  "let tileState: RendererTileStateV1 | null = null;\nlet renderSchedulingController: RenderSchedulingControllerV1 | null = null;\n",
              ),
              (
                  "    tileState?.attachGpuDevice(device);\n",
                  "    tileState?.attachGpuDevice(device);\n    renderSchedulingController?.attachGpuDevice(device);\n",
              ),
              (
                  "    tileState?.attachGpuDevice(null);\n",
                  "    tileState?.attachGpuDevice(null);\n    renderSchedulingController?.attachGpuDevice(null);\n",
              ),
              (
                  "    tileState?.dispose();\n    tileState = null;\n    deviceManager.dispose();\n",
                  "    tileState?.dispose();\n    tileState = null;\n    renderSchedulingController?.dispose();\n    renderSchedulingController = null;\n    deviceManager.dispose();\n",
              ),
              (
                  "scope.addEventListener('message', (event) => {\n",
                  "renderSchedulingController = installRenderSchedulingExtensionV1(scope, {\n  getTileState: () => tileState,\n});\nrenderSchedulingController.attachGpuDevice(deviceManager.currentDevice());\n\nscope.addEventListener('message', (event) => {\n",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing render worker integration anchor: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Format M3 render foundation
        run: >-
          npx biome format --write
          src/gpu/transient-targets.ts
          src/gpu/render-scheduler.ts
          src/gpu/frame-compositor.ts
          src/workers/render-scheduling-extension.ts
          src/workers/render.worker.ts
          tests/unit/transient-targets.test.ts
          tests/unit/render-scheduler.test.ts
          tests/unit/frame-compositor.test.ts
          tests/unit/render-scheduling-extension.test.ts
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - name: Commit verified integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gpu/transient-targets.ts src/gpu/render-scheduler.ts src/gpu/frame-compositor.ts src/workers/render-scheduling-extension.ts src/workers/render.worker.ts tests/unit/transient-targets.test.ts tests/unit/render-scheduler.test.ts tests/unit/frame-compositor.test.ts tests/unit/render-scheduling-extension.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'feat: connect M3 render scheduling foundation [skip ci]'
          git push
