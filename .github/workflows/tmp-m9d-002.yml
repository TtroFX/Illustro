name: Temporary M9D-002 linked object refresh

on:
  push:
    branches:
      - feature/m9d-002-linked-object-refresh

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - run: python scripts/tmp-m9d-002.py
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run tests/unit/linked-object-external-controller.test.ts tests/unit/linked-object-refresh-workflow.test.ts
      - name: Commit verified M9D-002 implementation
        run: |
          rm .github/workflows/tmp-m9d-002.yml scripts/tmp-m9d-002.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/linked-object-external-controller.ts tests/unit/linked-object-refresh-workflow.test.ts .github/workflows/tmp-m9d-002.yml scripts/tmp-m9d-002.py
          git commit -m 'feat(M9D-002): add explicit linked-object refresh workflow'
          git push
