name: Temporary M6A Procedural Tip
on:
  push:
    branches: [work/m6a-procedural-tip-20260903]
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/m6a-procedural-tip-20260903
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci
      - name: Fix patch anchors
        run: |
          python3 scripts/fix-m6a-procedural-tip-patcher.py
          python3 scripts/fix-m6a-procedural-tip-patcher-v2.py
          python3 scripts/fix-m6a-procedural-tip-test.py
      - name: Apply M6A procedural tip
        run: python3 scripts/apply-m6a-procedural-tip.py
      - name: Formatting
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Focused M6A procedural-tip tests
        run: npx vitest run tests/unit/procedural-brush-tip.test.ts tests/unit/baseline-brush.test.ts tests/unit/brush-preset-library.test.ts tests/unit/canonical-raster-brush.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: M5D compatibility inspection
        run: npm run verify:m5d
      - name: M6A contract inspection
        run: npm run verify:m6a
      - name: Full unit suite
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - name: Integration tests
        run: npm run test:integration
      - name: Persist verified implementation
        run: |
          rm scripts/apply-m6a-procedural-tip.py scripts/fix-m6a-procedural-tip-patcher.py scripts/fix-m6a-procedural-tip-patcher-v2.py scripts/fix-m6a-procedural-tip-test.py
          rm .github/workflows/temp-m6a-procedural-tip.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: implement M6A procedural tip"
          git push origin HEAD:work/m6a-procedural-tip-20260903
