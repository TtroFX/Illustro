name: Illustro one-shot M6A-040 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/illustro-m6a040-patch.py'
      - '.github/workflows/illustro-m6a040-patch.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Align patch with current brush-schema import layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/illustro-m6a040-patch.py')
          source = path.read_text(encoding='utf-8')
          anchor = source.index('# Runtime state captures mode independently of the sampled resource payload.')
          first = source.index('replace_once(', anchor)
          second = source.index('\nreplace_once(', first + 1)
          replacement = '''replace_once(
              'src/app/paint-session-controller.ts',
              """import {
            DEFAULT_BRUSH_PARAMETER_VALUES_V1,
            type BrushParameterValuesV1,
          } from '../domain/brush-schema.js';
          """,
              """import {
            DEFAULT_BRUSH_PARAMETER_VALUES_V1,
            type BrushParameterValuesV1,
            type BrushTextureBlendModeV1,
          } from '../domain/brush-schema.js';
          """,
          )
          '''
          path.write_text(source[:first] + replacement + source[second:], encoding='utf-8')
          PY
      - name: Apply M6A-040 texture-blend patch
        run: python .github/illustro-m6a040-patch.py
      - name: Format changed TypeScript and verifier
        run: >-
          npx biome format --write
          src/domain/brush-schema.ts
          src/gpu/brush-texture-composite.ts
          src/app/paint-session-controller.ts
          src/app/brush-preset-library.ts
          src/app/brush-preset-controller.ts
          tests/unit/brush-texture-blend.test.ts
          scripts/verify-m6a-brush.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted regression tests
        run: >-
          npx vitest run
          tests/unit/brush-texture-blend.test.ts
          tests/unit/brush-texture-rotation.test.ts
          tests/unit/brush-texture-scale.test.ts
          tests/unit/brush-texture-strength.test.ts
          tests/unit/brush-paper-texture-selection.test.ts
          tests/unit/brush-grain-selection.test.ts
          tests/unit/brush-preset-library.test.ts
          tests/unit/paint-session-controller.test.ts
          tests/unit/canonical-raster-brush.test.ts
          tests/unit/baseline-raster-tile-store.test.ts
          tests/unit/baseline-paint-renderer.test.ts
      - name: M6A verification
        run: npm run verify:m6a
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/illustro-m6a040-patch.py
          rm -f .github/workflows/illustro-m6a040-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: implement M6A texture blend behavior"
          git push origin HEAD:main
