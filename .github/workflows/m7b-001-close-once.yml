name: Close M7B-001 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m7b-001-close-once.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Close canonical Flood Fill progress
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          old = 'M7B-001 Flood Fill:未完了'
          new = 'M7B-001 Flood Fill:完了'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('M7B-001 progress anchor missing')
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPLEMENTATION_PROGRESS.md
          git commit -m 'chore: close M7B-001 Flood Fill'
          git pull --rebase origin main
          git push origin HEAD:main
