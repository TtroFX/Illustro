name: Illustro one-shot M6A-041 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/illustro-m6a041-patch.py'
      - '.github/workflows/illustro-m6a041-patch.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply M6A-041 pressure-size patch
        run: python .github/illustro-m6a041-patch.py
      - name: Update stabilization verifier for pressure-aware geometry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-m6a-brush.mjs')
          source = path.read_text(encoding='utf-8')
          old = "const stabilizedAdditions = additions.map((sample) => stabilizer.push(sample));"
          new = "const stabilizedAdditions = additions.map((sample) => {"
          if source.count(old) != 1:
              raise RuntimeError(f'expected one legacy stabilization verifier marker, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Format changed TypeScript and verifier
        run: >-
          npx biome format --write
          src/domain/brush-schema.ts
          src/gpu/baseline-brush.ts
          src/app/canonical-raster-brush.ts
          src/app/paint-session-controller.ts
          src/app/brush-preset-library.ts
          src/app/brush-preset-controller.ts
          tests/unit/brush-pressure-size.test.ts
          scripts/verify-m6a-brush.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted regression tests
        run: >-
          npx vitest run
          tests/unit/brush-pressure-size.test.ts
          tests/unit/brush-texture-blend.test.ts
          tests/unit/brush-post-stroke-correction.test.ts
          tests/unit/brush-realtime-stabilizer.test.ts
          tests/unit/brush-forced-taper.test.ts
          tests/unit/brush-size-taper.test.ts
          tests/unit/baseline-brush.test.ts
          tests/unit/canonical-raster-brush.test.ts
          tests/unit/paint-session-controller.test.ts
          tests/unit/baseline-raster-tile-store.test.ts
          tests/unit/baseline-paint-renderer.test.ts
      - name: M6A verification
        run: npm run verify:m6a
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/illustro-m6a041-patch.py
          rm -f .github/workflows/illustro-m6a041-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: implement M6A pressure to size"
          git push origin HEAD:main
