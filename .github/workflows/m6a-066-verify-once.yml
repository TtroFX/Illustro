name: Verify M6A-066 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m6a-066-verify-once.yml'

permissions:
  contents: write

jobs:
  verify-m6a-066:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply M6A-066 patch
        run: python3 .github/m6a-066-apply-once.py

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Format changed sources
        run: >-
          npx biome format --write
          src/input/hover-state.ts
          src/app/brush-hover-outline-controller.ts
          src/app/main.ts
          tests/unit/hover-state.test.ts
          tests/unit/brush-hover-outline.test.ts
          scripts/verify-m6a-brush.mjs

      - name: Dedicated hover tests
        run: npx vitest run tests/unit/hover-state.test.ts tests/unit/brush-hover-outline.test.ts

      - name: Lint
        run: npx biome lint --max-diagnostics=200 src tests scripts bench vitest.config.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Verify M6A contracts
        run: npm run verify:m6a

      - name: Production build
        run: npm run build

      - name: Integration tests
        run: npm run test:integration

      - name: Commit verified M6A-066
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            ILLUSTRO_DESIGN_MEMO.md \
            IMPLEMENTATION_PROGRESS.md \
            scripts/verify-m6a-brush.mjs \
            src/input/hover-state.ts \
            src/app/brush-hover-outline-controller.ts \
            src/app/main.ts \
            src/index.html \
            public/app-shell.css \
            tests/unit/hover-state.test.ts \
            tests/unit/brush-hover-outline.test.ts
          git diff --cached --check
          git commit -m 'feat: implement hover brush outline'
          git push origin HEAD:main
