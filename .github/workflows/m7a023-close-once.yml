name: Close M7A023 once

on:
  push:
    branches: [main]
    paths:
      - '.github/m7a023-close-trigger'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Record M7A-023 progress and clean helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text(encoding='utf-8')
          old = 'M7A-023 selection-scoped filter:未完了'
          new = 'M7A-023 selection-scoped filter:完了'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one M7A-023 open row, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/m7a023-close-once.yml .github/m7a023-close-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: close M7A-023 selection filter'
          git push
