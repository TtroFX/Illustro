name: Implement M5B Merge Down

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  implement-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply merge down integration
        run: python scripts/apply-m5b-merge-down.py
      - name: Canonical formatting
        run: npm run format
      - name: Formatting check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Existing milestone inspections
        run: npm run verify:m1 && npm run verify:m2 && npm run verify:m3 && npm run verify:m4 && npm run verify:m5a && npm run verify:m5b
      - name: Production build
        run: npm run build
      - name: Integration tests
        run: npm run test:integration
      - name: Deployment contract
        run: npm run verify:m0.5
      - name: Commit verified merge down
        run: |
          rm scripts/apply-m5b-merge-down.py
          rm .github/workflows/implement-m5b-merge-down.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: implement canonical raster merge down [skip ci]'
          git push origin HEAD:main
