name: Record M3 internal inspection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/record-m3-inspection-progress.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Record verified progress
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          old = 'M3-検査 M3内部検査:未完了'
          new = 'M3-検査 M3内部検査:完了'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one M3 inspection progress marker, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/record-m3-inspection-progress.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPLEMENTATION_PROGRESS.md
          git diff --cached --check
          git commit -m 'chore: record M3 internal inspection pass [skip ci]'
          git push origin HEAD:main
