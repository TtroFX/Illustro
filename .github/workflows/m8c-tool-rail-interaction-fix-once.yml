name: Fix M8C tool rail interaction once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m8c-tool-rail-interaction-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Rebase latest main
        run: git pull --rebase origin main
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply interaction patch
        run: python scripts/m8c-tool-rail-interaction-fix-once.py
      - name: Format changed files
        run: npx biome format --write src/app/m8-tool-rail.ts tests/unit/m8-tool-rail.test.ts
      - name: Verify M8C fix
        run: |
          npm run typecheck
          npx vitest run tests/unit/m8-tool-rail.test.ts
      - name: Remove temporary helpers
        run: |
          rm .github/workflows/m8c-tool-rail-interaction-fix-once.yml
          rm scripts/m8c-tool-rail-interaction-fix-once.py
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/m8-tool-rail.ts tests/unit/m8-tool-rail.test.ts .github/workflows/m8c-tool-rail-interaction-fix-once.yml scripts/m8c-tool-rail-interaction-fix-once.py
          git commit -m 'fix: harden M8C tool rail detail interactions'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
