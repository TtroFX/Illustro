name: Verify M2 project lifecycle integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m2-project-verify.yml'

permissions:
  contents: write

jobs:
  verify-project-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: Remove one-shot workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m2-project-verify.yml
          git commit -m 'ci: remove M2 project lifecycle verifier [skip ci]'
          git push
