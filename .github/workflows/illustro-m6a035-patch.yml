name: Illustro one-shot M6A-035 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/illustro-m6a035-patch.py'
      - '.github/workflows/illustro-m6a035-patch.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Normalize M6A-034 formatted handler for exact patching
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/brush-preset-controller.ts')
          source = path.read_text(encoding='utf-8')
          before = """  const onPostCorrectionNumber = (): void =>\n    updatePostCorrection(Number(postCorrectionNumber.value));\n"""
          after = """  const onPostCorrectionNumber = (): void => updatePostCorrection(Number(postCorrectionNumber.value));\n"""
          if source.count(before) != 1:
              raise RuntimeError('expected one formatted M6A-034 post-correction handler')
          path.write_text(source.replace(before, after, 1), encoding='utf-8')
          PY
      - name: Apply M6A-035 grain-selection patch
        run: python .github/illustro-m6a035-patch.py
      - name: Format changed TypeScript and verifier
        run: >-
          npx biome format --write
          src/domain/brush-schema.ts
          src/app/paint-session-controller.ts
          src/app/brush-preset-library.ts
          src/app/brush-preset-controller.ts
          tests/unit/brush-grain-selection.test.ts
          scripts/verify-m6a-brush.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted regression tests
        run: >-
          npx vitest run
          tests/unit/brush-grain-selection.test.ts
          tests/unit/brush-post-stroke-correction.test.ts
          tests/unit/brush-realtime-stabilizer.test.ts
          tests/unit/brush-forced-taper.test.ts
          tests/unit/brush-opacity-taper.test.ts
          tests/unit/brush-size-taper.test.ts
          tests/unit/brush-stroke-end.test.ts
          tests/unit/brush-stroke-start.test.ts
          tests/unit/brush-stroke-repetition.test.ts
          tests/unit/brush-follow-rotation.test.ts
          tests/unit/brush-tip-direction.test.ts
          tests/unit/brush-tip-angle.test.ts
          tests/unit/brush-spacing.test.ts
          tests/unit/brush-tip-density.test.ts
          tests/unit/baseline-brush.test.ts
          tests/unit/canonical-raster-brush.test.ts
          tests/unit/paint-session-controller.test.ts
          tests/unit/baseline-raster-tile-store.test.ts
          tests/unit/baseline-paint-renderer.test.ts
      - name: M6A verification
        run: npm run verify:m6a
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/illustro-m6a035-patch.py
          rm -f .github/workflows/illustro-m6a035-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: implement M6A grain selection"
          git push origin HEAD:main
