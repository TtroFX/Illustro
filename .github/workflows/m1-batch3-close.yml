name: Close M1 layer mask batch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-batch3-close.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Close verified M1 layer and mask items
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text(encoding='utf-8')
          items = [
              'M1-015 common Layer base schema',
              'M1-016 Raster Layer schema',
              'M1-017 Folder Layer schema',
              'M1-018 Vector/Shape Layer schema',
              'M1-019 Adjustment Layer schema',
              'M1-020 Fill Layer schema',
              'M1-021 Gradient Layer schema',
              'M1-022 Mask schema',
          ]
          for item in items:
              old = f'{item}:未完了'
              new = f'{item}:完了'
              if old not in text and new not in text:
                  raise SystemExit(f'missing progress item: {item}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit verified progress
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add IMPLEMENTATION_PROGRESS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: close M1 layer mask batch [skip ci]'
          git push origin HEAD:main
