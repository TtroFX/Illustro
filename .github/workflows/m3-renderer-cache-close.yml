name: Close M3 renderer cache foundation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m3-renderer-cache-close.yml'

permissions:
  contents: write

jobs:
  verify-close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - name: Verify renderer cache production wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          cache = Path('src/gpu/tile-cache.ts').read_text()
          atlas = Path('src/gpu/gpu-atlas.ts').read_text()
          viewport = Path('src/gpu/viewport-tiles.ts').read_text()
          state = Path('src/gpu/renderer-tile-state.ts').read_text()
          worker = Path('src/workers/render.worker.ts').read_text()
          checks = [
              ('128 * MEBIBYTE' in cache and '192 * MEBIBYTE' in cache, 'Conservative cache budgets missing'),
              ('GPU_ATLAS_PAGE_SIZE_PX = 2_048' in atlas, '2048px atlas page missing'),
              ('GPU_ATLAS_SLOTS_PER_PAGE' in atlas, 'atlas slot allocation missing'),
              ('resolveViewportTilesV1' in viewport, 'viewport resolver missing'),
              ('createTexture?' in state and 'reserveGpuTile' in state, 'GPU tile cache texture residency missing'),
              ('CpuBackingTileCacheV1' in state and 'cacheCpuBacking' in state, 'CPU backing cache missing'),
              ('discardGpuResidency' in state, 'GPU loss cache discard boundary missing'),
              ('renderer.tiles.reserveGpu' in worker and 'renderer.tiles.cacheCpu' in worker and 'renderer.tiles.viewport' in worker, 'Render Worker cache protocol missing'),
          ]
          failed = [message for ok, message in checks if not ok]
          if failed:
              raise SystemExit('\n'.join(failed))
          PY
      - name: Renderer cache unit matrix
        run: >-
          npx vitest run
          tests/unit/tile-cache.test.ts
          tests/unit/gpu-atlas.test.ts
          tests/unit/viewport-tiles.test.ts
          tests/unit/renderer-tile-state.test.ts
      - name: Close M3-020 through M3-024
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('IMPLEMENTATION_PROGRESS.md')
          s = p.read_text()
          targets = [
              'M3-020 GPU tile cache',
              'M3-021 CPU/backing tile cache',
              'M3-022 2048px atlas-page management',
              'M3-023 atlas slot allocation',
              'M3-024 viewport tile visibility resolver',
          ]
          for target in targets:
              old = f'{target}:未完了'
              new = f'{target}:完了'
              if old not in s:
                  raise SystemExit(f'progress target missing: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit verified closure and retire workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m3-renderer-cache-close.yml
          git add IMPLEMENTATION_PROGRESS.md
          git commit -m 'docs: close M3 renderer cache foundation [skip ci]'
          git push
