name: Materialize M7A022 selection transform once

on:
  push:
    branches: [main]
    paths:
      - '.github/m7a022-materialize-trigger'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Materialize implementation and tests
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > src/app/selection-transform-engine.ts
          printf '%s' '' | base64 -d | gzip -d > tests/unit/selection-transform-engine.test.ts
          npx biome format --write src/app/selection-transform-engine.ts tests/unit/selection-transform-engine.test.ts
          npm run typecheck
          npx vitest run tests/unit/selection-transform-engine.test.ts
      - name: Commit M7A022
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/selection-transform-engine.ts tests/unit/selection-transform-engine.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'feat(M7A): implement selection-scoped transform'
          git push
