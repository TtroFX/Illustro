name: Continue M5A Geometry

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  implement-verify-record:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply M5A canvas geometry
        run: python scripts/.tmp-m5a-canvas-geometry.py
      - name: Canonical formatting
        run: npm run format
      - name: Formatting check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: M1 contract inspection
        run: npm run verify:m1
      - name: M2 persistence inspection
        run: npm run verify:m2
      - name: M3 foundation inspection
        run: npm run verify:m3
      - name: M4 vertical-slice inspection
        run: npm run verify:m4
      - name: M5A inspection
        run: npm run verify:m5a
      - name: Production build
        env:
          ILLUSTRO_BUILD_MODE: production
        run: npm run build
      - name: Integration tests
        run: npm run test:integration
      - name: Deployment contract
        run: npm run verify:m0.5
      - name: Record progress and push source
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          for item in [
              'M5A-010 canvas resize',
              'M5A-012 crop',
              'M5A-013 trim',
              'M5A-014 canvas expansion',
          ]:
              old = f'{item}:未完了'
              if old not in text:
                  raise SystemExit(f'progress target missing: {old}')
              text = text.replace(old, f'{item}:完了', 1)
          path.write_text(text)
          PY
          rm scripts/.tmp-m5a-canvas-geometry.py
          git checkout HEAD -- .github/workflows/continue-m5a-geometry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add M5A canvas geometry operations [skip ci]'
          git push origin HEAD:main
