name: Illustro one-shot M6A-048 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/illustro-m6a048-patch.py'
      - '.github/workflows/illustro-m6a048-patch.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Align progress labels in patch source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/illustro-m6a048-patch.py')
          text = path.read_text()
          text = text.replace('M6A-049 min response:未完了', 'M6A-049 minimum response:未完了')
          path.write_text(text)
          PY
      - name: Apply M6A-048 random-dynamics patch
        run: python3 .github/illustro-m6a048-patch.py
      - name: Format changed TypeScript and verifier
        run: npx biome format --write src/domain/brush-schema.ts src/gpu/baseline-brush.ts src/app/canonical-raster-brush.ts src/app/paint-session-controller.ts src/app/brush-preset-library.ts src/app/brush-preset-controller.ts tests/unit/brush-random-dynamics.test.ts scripts/verify-m6a-brush.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted regression tests
        run: npx vitest run tests/unit/brush-random-dynamics.test.ts tests/unit/brush-stroke-repetition.test.ts tests/unit/brush-pressure-response-curve.test.ts tests/unit/brush-tilt-mapping.test.ts tests/unit/brush-velocity-mapping.test.ts tests/unit/brush-forced-taper.test.ts tests/unit/brush-post-stroke-correction.test.ts
      - name: M6A verification
        run: npm run verify:m6a
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        run: |
          rm -f .github/illustro-m6a048-patch.py .github/workflows/illustro-m6a048-patch.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement M6A random dynamics'
          git push origin HEAD:main
