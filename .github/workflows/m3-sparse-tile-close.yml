name: Close M3 sparse tile foundation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m3-sparse-tile-close.yml'

permissions:
  contents: write

jobs:
  verify-close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - name: Verify sparse tile production wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          model = Path('src/gpu/sparse-tile-model.ts').read_text()
          state = Path('src/gpu/renderer-tile-state.ts').read_text()
          worker = Path('src/workers/render.worker.ts').read_text()
          checks = [
              ('CANONICAL_TILE_SIZE_PX = 256' in model, '256px canonical tile core missing'),
              ('validWidth' in model and 'validHeight' in model, 'edge valid bounds missing'),
              ('addressDocumentPixelV1' in model, 'tile addressing missing'),
              ('DirtyTileTrackerV1' in model, 'dirty tile tracker missing'),
              ('WHOLE_TILE_DIRTY_PROMOTION_RATIO = 0.5' in model, '50% dirty promotion missing'),
              ('SparseTileMapV1' in model, 'sparse tile map missing'),
              ('allocate(' in state and 'deallocate(' in state, 'renderer allocation lifecycle missing'),
              ('RendererTileStateV1' in worker, 'tile state not connected to Render Worker'),
              ("renderer.tiles.configure" in worker, 'tile configure runtime path missing'),
              ("renderer.tiles.allocate" in worker, 'tile allocation runtime path missing'),
              ("renderer.tiles.deallocate" in worker, 'tile deallocation runtime path missing'),
              ("renderer.tiles.markDirty" in worker, 'dirty runtime path missing'),
          ]
          failed = [message for ok, message in checks if not ok]
          if failed:
              raise SystemExit('\n'.join(failed))
          PY
      - name: Sparse tile unit matrix
        run: npx vitest run tests/unit/sparse-tile-model.test.ts tests/unit/renderer-tile-state.test.ts
      - name: Close M3-012 through M3-019
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('IMPLEMENTATION_PROGRESS.md')
          s = p.read_text()
          targets = [
              'M3-012 canonical 256px sparse tile model',
              'M3-013 edge-tile valid bounds',
              'M3-014 tile addressing',
              'M3-015 dirty-tile tracking',
              'M3-016 per-tile dirty rectangle',
              'M3-017 50% dirty-region whole-tile promotion',
              'M3-018 tile allocation',
              'M3-019 tile deallocation',
          ]
          for target in targets:
              old = f'{target}:未完了'
              if old not in s:
                  raise SystemExit(f'progress target missing: {old}')
              s = s.replace(old, f'{target}:完了', 1)
          p.write_text(s)
          PY
      - name: Commit verified closure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m3-sparse-tile-close.yml
          git add IMPLEMENTATION_PROGRESS.md
          git commit -m 'docs: close M3 sparse tile foundation [skip ci]'
          git push
