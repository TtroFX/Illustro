name: Normalize Illustro phase 1 closure

on:
  push:
    paths:
      - '.github/workflows/normalize-phase1-closure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize phase 1 decisions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          p = Path('ILLUSTRO_DESIGN_MEMO.md')
          text = p.read_text(encoding='utf-8')
          start = text.index('### 21. Pending adoption decisions — NOT YET AUTHORITATIVE')
          end = text.index('# UX / UI Specification', start)
          payload = ''
          replacement = gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          text = text[:start] + replacement.rstrip() + '\n\n' + text[end:]
          text = text.replace('- Exact final import/export compatibility scope, including pending PSD/CMYK decisions\n', '- Exact final import/export compatibility contracts and fidelity matrices, including adopted PSD and deferred CMYK boundaries\n')
          p.write_text(text, encoding='utf-8')
          PY
          grep -F '### 21. Initial-release adoption decisions — RESOLVED 2026-08-30' ILLUSTRO_DESIGN_MEMO.md
          grep -F '### 22. Post-baseline feature-audit rule' ILLUSTRO_DESIGN_MEMO.md
          grep -F '**PSD import/export — ADOPTED FOR INITIAL RELEASE WITH BOUNDED FIDELITY.**' ILLUSTRO_DESIGN_MEMO.md
          ! grep -F 'Pending adoption decisions — NOT YET AUTHORITATIVE' ILLUSTRO_DESIGN_MEMO.md
          ! grep -F 'including pending PSD/CMYK decisions' ILLUSTRO_DESIGN_MEMO.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ILLUSTRO_DESIGN_MEMO.md
          git commit -m 'docs: normalize resolved phase 1 scope decisions'
          git push origin HEAD:main
