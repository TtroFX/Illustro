    paths: ['.github/workflows/normalize-phase1-closure.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('ILLUSTRO_DESIGN_MEMO.md'); t=p.read_text(encoding='utf-8')
          a=t.index('### 21. Pending adoption decisions — NOT YET AUTHORITATIVE'); b=t.index('# UX / UI Specification',a)
          x='IyMjIDIxLiBJbml0aWFsLXJlbGVhc2UgYWRvcHRpb24gZGVjaXNpb25zIOKAlCBSRVNPTFZFRCB2026-08-30'
          PY
