name: Integrate M8E selection once

on:
  push:
    branches: [main]
    paths:
      - '.github/m8e-selection-integration-trigger'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Rebase latest main
        run: git pull --rebase origin main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: |
          npm install --global npm@11.19.1
          npm ci --ignore-scripts
      - name: Integrate M8E selection modules
        run: python scripts/integrate-m8e-selection-once.py
      - name: Format M8E integration
        run: npx biome format --write src/app/main.ts src/app/m8-selection-context-layer.ts src/app/m8-selection-gesture-controller.ts src/app/m8-selection-launcher.ts src/app/selection-contour-presenter.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Remove temporary helpers
        run: rm scripts/integrate-m8e-selection-once.py .github/workflows/integrate-m8e-selection-once.yml .github/m8e-selection-integration-trigger
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: integrate rebuilt M8E selection architecture'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
