          from pathlib import Path

          # Painting respects full/pixel locks on the selected raster layer.
          path = Path('src/app/paint-session-controller.ts')
          text = path.read_text()
          old = "    if (activeLayer?.type !== 'raster') return this.snapshot();"
          new = "    if (\n      activeLayer?.type !== 'raster' ||\n      activeLayer.locks.all ||\n      activeLayer.locks.pixels\n    )\n      return this.snapshot();"
          if old not in text:
              raise SystemExit('paint lock guard target missing')
          path.write_text(text.replace(old, new, 1))

          # Selected-layer action footer; row itself remains compact.
          path = Path('src/index.html')
          text = path.read_text()
          anchor = '          <fieldset id="layer-list" class="shell-inspector-list" aria-label="レイヤー一覧"></fieldset>\n'
          footer = '''          <div id="layer-actions" class="shell-layer-actions" aria-label="選択レイヤー操作">\n            <div class="shell-layer-action-strip">\n              <button id="layer-duplicate" type="button" aria-label="レイヤーを複製" title="複製">⧉</button>\n              <button id="layer-rename" type="button" aria-label="レイヤー名を変更" title="名前を変更">✎</button>\n              <button id="layer-delete" type="button" aria-label="レイヤーを削除" title="削除">×</button>\n              <button id="layer-move-up" type="button" aria-label="レイヤーを上へ移動" title="上へ">↑</button>\n              <button id="layer-move-down" type="button" aria-label="レイヤーを下へ移動" title="下へ">↓</button>\n              <button id="layer-lock" type="button" aria-label="レイヤーをロック" title="ロック" aria-pressed="false">◇</button>\n              <button id="layer-alpha-lock" type="button" aria-label="透明ピクセルをロック" title="Alpha Lock" aria-pressed="false">α</button>\n              <label class="shell-layer-opacity" title="不透明度"><span aria-hidden="true">◐</span><input id="layer-opacity" type="number" min="0" max="100" step="1" value="100" aria-label="レイヤー不透明度 パーセント" /></label>\n            </div>\n            <form id="layer-rename-editor" class="shell-layer-rename-editor" hidden>\n              <input id="layer-rename-input" type="text" maxlength="120" aria-label="レイヤー名" />\n              <button type="submit" aria-label="名前変更を適用">✓</button>\n              <button id="layer-rename-cancel" type="button" aria-label="名前変更をキャンセル">×</button>\n            </form>\n            <output id="layer-action-status" class="shell-layer-action-status" aria-live="polite"></output>\n          </div>\n'''
          if anchor not in text:
              raise SystemExit('layer action footer anchor missing')
          path.write_text(text.replace(anchor, anchor + footer, 1))

          # Compact scan-first row + fixed selected-layer action area.
          path = Path('public/app-shell.css')
          text = path.read_text()
          text += '''\n\n.shell-layer-row {\n  position: relative;\n  grid-template-columns: 26px minmax(0, 1fr) 28px;\n  gap: 5px;\n  min-height: 46px;\n  padding: 4px 5px;\n  cursor: default;\n  touch-action: none;\n}\n\n.shell-layer-row[data-drop-position='before']::before,\n.shell-layer-row[data-drop-position='after']::after {\n  position: absolute;\n  right: 5px;\n  left: 5px;\n  height: 2px;\n  border-radius: 2px;\n  background: #ff3d8d;\n  content: '';\n}\n\n.shell-layer-row[data-drop-position='before']::before { top: -2px; }\n.shell-layer-row[data-drop-position='after']::after { bottom: -2px; }\n\n.shell-layer-select {\n  display: grid;\n  grid-template-columns: 32px minmax(0, 1fr) max-content;\n  align-items: center;\n  gap: 8px;\n  min-width: 0;\n  padding: 0;\n  border: 0;\n  background: transparent;\n  color: inherit;\n  font: inherit;\n  text-align: left;\n  cursor: grab;\n}\n\n.shell-layer-select:active { cursor: grabbing; }\n\n.shell-layer-icon {\n  width: 26px;\n  height: 26px;\n  padding: 0;\n  border: 0;\n  border-radius: 7px;\n  background: transparent;\n  color: #7b879d;\n  font: 600 13px/1 system-ui, sans-serif;\n}\n\n.shell-layer-icon:hover:not(:disabled),\n.shell-layer-icon:focus-visible { background: #f3f6fb; color: #26324a; }\n.shell-layer-icon[aria-pressed='true'] { color: #e52f7e; }\n.shell-layer-icon:disabled { opacity: 0.3; }\n\n.shell-layer-actions {\n  display: grid;\n  gap: 5px;\n  padding: 7px 8px 8px;\n  border-top: 1px solid #eef1f5;\n  background: #fff;\n}\n\n.shell-layer-action-strip {\n  display: flex;\n  align-items: center;\n  gap: 3px;\n  min-width: 0;\n}\n\n.shell-layer-action-strip > button,\n.shell-layer-rename-editor > button {\n  width: 27px;\n  height: 27px;\n  padding: 0;\n  border: 1px solid transparent;\n  border-radius: 7px;\n  background: #f7f8fb;\n  color: #536078;\n  font: 600 13px/1 system-ui, sans-serif;\n}\n\n.shell-layer-action-strip > button:hover:not(:disabled),\n.shell-layer-rename-editor > button:hover {\n  border-color: #e3e7ee;\n  background: #fff;\n}\n\n.shell-layer-action-strip > button[aria-pressed='true'] {\n  border-color: #ffd1e3;\n  background: #ffe8f2;\n  color: #d92b73;\n}\n\n.shell-layer-action-strip > button:disabled { opacity: 0.35; }\n\n.shell-layer-opacity {\n  display: flex;\n  align-items: center;\n  gap: 3px;\n  min-width: 0;\n  margin-left: auto;\n  color: #7b879d;\n  font-size: 10px;\n}\n\n.shell-layer-opacity input {\n  width: 48px;\n  height: 27px;\n  padding: 0 5px;\n  border: 1px solid #e2e7ef;\n  border-radius: 7px;\n  background: #fff;\n  color: #344058;\n  font: 600 10px/1 system-ui, sans-serif;\n  text-align: right;\n}\n\n.shell-layer-rename-editor {\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) 27px 27px;\n  gap: 4px;\n}\n\n.shell-layer-rename-editor[hidden] { display: none; }\n\n.shell-layer-rename-editor input {\n  min-width: 0;\n  height: 27px;\n  padding: 0 7px;\n  border: 1px solid #dce2ec;\n  border-radius: 7px;\n  font: 600 11px/1 system-ui, sans-serif;\n}\n\n.shell-layer-action-status {\n  min-height: 0;\n  overflow: hidden;\n  color: #b4234d;\n  font-size: 9px;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n'''
          path.write_text(text)

          # Extend permanent verifier (standard CI already calls verify:m5b).
          path = Path('scripts/verify-m5b-layer-foundation.mjs')
          text = path.read_text()
          insert = '''\nrequireText('src/app/layer-operations.ts', [\n  'duplicateRootLayerSnapshotV1',\n  'deleteRootLayerSnapshotV1',\n  'renameLayerSnapshotV1',\n  'reorderRootLayerSnapshotV1',\n  'setLayerVisibilitySnapshotV1',\n  'setLayerOpacitySnapshotV1',\n  'setLayerAllLockSnapshotV1',\n  'setLayerAlphaLockSnapshotV1',\n  'setLayerClippingSnapshotV1',\n]);\nrequireText('src/app/layer-workflow-controller.ts', [\n  "'layer.duplicate'",\n  "'layer.delete'",\n  "'layer.rename'",\n  "'layer.reorder'",\n  "'layer.visibility'",\n  "'layer.opacity'",\n  "'layer.lock'",\n  "'layer.alpha-lock'",\n  "'layer.clipping'",\n  'pointermove',\n]);\nrequireText('src/index.html', [\n  'id="layer-duplicate"',\n  'id="layer-delete"',\n  'id="layer-rename"',\n  'id="layer-opacity"',\n  'id="layer-lock"',\n  'id="layer-alpha-lock"',\n  'id="layer-move-up"',\n  'id="layer-move-down"',\n]);\n'''
          marker = "console.log('M5B layer creation foundation verification passed');"
          if marker not in text:
              raise SystemExit('M5B verifier footer missing')
          text = text.replace(marker, insert + "console.log('M5B layer system verification passed');", 1)
          path.write_text(text)
          PY
      - name: Canonical formatting
        run: npm run format
      - name: Formatting check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: M1 contract inspection
        run: npm run verify:m1
      - name: M2 persistence inspection
        run: npm run verify:m2
      - name: M3 foundation inspection
        run: npm run verify:m3
      - name: M4 vertical-slice inspection
        run: npm run verify:m4
      - name: M5A inspection
        run: npm run verify:m5a
      - name: M5B layer system inspection
        run: npm run verify:m5b
      - name: Production build
        env:
          ILLUSTRO_BUILD_MODE: production
        run: npm run build
      - name: Integration tests
        run: npm run test:integration
      - name: Deployment contract
        run: npm run verify:m0.5
      - name: Record verified M5B editing batch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          for item in [
              'M5B-009 layer duplicate',
              'M5B-010 layer delete',
              'M5B-011 layer rename',
              'M5B-012 layer reorder',
              'M5B-013 layer visibility',
              'M5B-014 layer opacity',
              'M5B-015 layer lock',
              'M5B-016 alpha lock',
              'M5B-017 clipping',
          ]:
              old = f'{item}:未完了'
              if old not in text:
                  raise SystemExit(f'progress target missing: {old}')
              text = text.replace(old, f'{item}:完了', 1)
          path.write_text(text)
          PY
          rm .github/workflows/continue-m5b-layer-editing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
