name: Illustro one-shot M6A-047 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/illustro-m6a047-patch.py'
      - '.github/workflows/illustro-m6a047-patch.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply M6A-047 velocity patch
        run: python3 .github/illustro-m6a047-patch.py
      - name: Widen runtime velocity maximum type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/app/paint-session-controller.ts')
          text = path.read_text()
          old = '  #brushVelocityMaximumPxPerSecond = DEFAULT_BRUSH_VELOCITY_MAXIMUM_PX_PER_SECOND_V1;'
          new = '  #brushVelocityMaximumPxPerSecond: number = DEFAULT_BRUSH_VELOCITY_MAXIMUM_PX_PER_SECOND_V1;'
          if old not in text:
              raise SystemExit('M6A-047 velocity maximum field anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Align legacy stabilizer verifier with velocity enrichment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-m6a-brush.mjs')
          text = path.read_text()
          old = "'const stabilizedAdditions = additions.map((sample) => {'"
          new = "'const stabilizedAdditions = additions.map((sample, index) => {'"
          if old not in text:
              raise SystemExit('M6A-033 stabilizer verifier anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format changed TypeScript and verifier
        run: npx biome format --write src/domain/brush-schema.ts src/gpu/baseline-brush.ts src/app/canonical-raster-brush.ts src/app/paint-session-controller.ts src/app/brush-preset-library.ts src/app/brush-preset-controller.ts tests/unit/brush-velocity-mapping.test.ts scripts/verify-m6a-brush.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted regression tests
        run: npx vitest run tests/unit/brush-velocity-mapping.test.ts tests/unit/brush-pressure-size.test.ts tests/unit/brush-pressure-opacity.test.ts tests/unit/brush-pressure-flow.test.ts tests/unit/brush-pressure-response-curve.test.ts tests/unit/brush-tilt-mapping.test.ts tests/unit/brush-orientation-mapping.test.ts tests/unit/brush-realtime-stabilizer.test.ts tests/unit/brush-post-stroke-correction.test.ts
      - name: M6A verification
        run: npm run verify:m6a
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        run: |
          rm -f .github/illustro-m6a047-patch.py .github/workflows/illustro-m6a047-patch.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement M6A velocity mapping'
          git push origin HEAD:main
