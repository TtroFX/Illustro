name: Repair M5B Layer Invert

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Capture checked out identity
        run: echo "ILLUSTRO_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify deployment branches
        run: |
          git fetch origin preview:refs/remotes/origin/preview
          git show-ref --verify refs/remotes/origin/preview
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Reapply staged invert source
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/implement-m5b-invert.yml').read_text().splitlines()
          start = source.index("          python - <<'PY'") + 1
          end = source.index('          PY', start)
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end]) + '\n'
          Path('/tmp/apply-m5b-invert.py').write_text(script)
          PY
          python /tmp/apply-m5b-invert.py
      - name: Repair RasterLayer typing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/layer-raster-invert.ts')
          text = path.read_text()
          old = "    if (layer.tiles.length === 0 && !hasUnbakedStroke) {"
          new = "    if ((layer as RasterLayerV1).tiles.length === 0 && !hasUnbakedStroke) {"
          if text.count(old) != 1:
              raise SystemExit(f'eligibility typing anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = "    const materialized = await sourceTilesV1(snapshot, source, persistence);"
          new = "    const materialized = await sourceTilesV1(snapshot, source as RasterLayerV1, persistence);"
          if text.count(old) != 1:
              raise SystemExit(f'prepare typing anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Canonical formatting
        run: npm run format
      - name: Formatting check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: M1 contract inspection
        run: npm run verify:m1
      - name: M2 persistence inspection
        run: npm run verify:m2
      - name: M3 foundation inspection
        run: npm run verify:m3
      - name: M4 vertical-slice inspection
        run: npm run verify:m4
      - name: M5A document foundation inspection
        run: npm run verify:m5a
      - name: M5B layer system inspection
        run: npm run verify:m5b
      - name: Production build
        env:
          ILLUSTRO_BUILD_MODE: production
        run: npm run build
      - name: Integration tests
        run: npm run test:integration
      - name: Deployment contract
        run: npm run verify:m0.5
      - name: Record verified progress and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          old = 'M5B-022 layer invert:未完了'
          new = 'M5B-022 layer invert:完了'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one progress marker, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/layer-raster-invert.ts src/app/layer-workflow-controller.ts src/index.html tests/unit/layer-raster-invert.test.ts scripts/verify-m5b-layer-foundation.mjs IMPLEMENTATION_PROGRESS.md
          git commit -m 'feat: implement M5B layer invert [skip ci]'
          git push origin HEAD:main
