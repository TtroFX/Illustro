name: Continue M5B Layer Creation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  implement-verify-record:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply M5B layer creation production path
        run: |
          cat > src/app/layer-creation.ts <<'EOF'
          import { createDocumentV1, type DocumentV1 } from '../domain/document.js';
          import type { LayerId, Revision } from '../domain/identity.js';
          import {
            createAdjustmentLayer,
            createEffectNode,
            createFillLayer,
            createFolderLayer,
            createGradientLayer,
            createRasterLayer,
            createRasterMask,
            createVectorLayer,
            type AdjustmentLayerV1,
            type FillLayerV1,
            type FolderLayerV1,
            type GradientLayerV1,
            type LayerBaseV1,
            type MaskAttachmentV1,
            type RasterLayerV1,
            type VectorLayerV1,
          } from '../domain/layers.js';
          import {
            createLinkedObjectLayer,
            type LinkedObjectLayerV1,
          } from '../domain/special-layers.js';
          import type { PaintProjectSnapshotV1 } from './paint-session-controller.js';

          export const CREATABLE_LAYER_KINDS_V1 = [
            'raster',
            'folder',
            'vector',
            'adjustment',
            'fill',
            'gradient',
            'linked-object',
          ] as const;

          export type CreatableLayerKindV1 = (typeof CREATABLE_LAYER_KINDS_V1)[number];
          export type CreatableLayerV1 =
            | RasterLayerV1
            | FolderLayerV1
            | VectorLayerV1
            | AdjustmentLayerV1
            | FillLayerV1
            | GradientLayerV1
            | LinkedObjectLayerV1;

          const DEFAULT_NAMES: Readonly<Record<CreatableLayerKindV1, string>> = Object.freeze({
            raster: 'Raster Layer',
            folder: 'Folder',
            vector: 'Vector Layer',
            adjustment: 'Adjustment Layer',
            fill: 'Fill Layer',
            gradient: 'Gradient Layer',
            'linked-object': 'Linked Object',
          });

          function color(document: DocumentV1, rgba: readonly [number, number, number, number]) {
            return Object.freeze({ space: document.color.workingSpace, rgba: Object.freeze(rgba) });
          }

          function blankLinkedDocument(document: DocumentV1): DocumentV1 {
            return createDocumentV1({
              width: document.canvas.width,
              height: document.canvas.height,
              ppi: document.canvas.resolution.ppi,
              background: { kind: 'transparent' },
              workingSpace: document.color.workingSpace,
              precision: document.color.precision,
            });
          }

          export function defaultLayerNameV1(kind: CreatableLayerKindV1): string {
            return DEFAULT_NAMES[kind];
          }

          export function createDefaultLayerV1(
            kind: CreatableLayerKindV1,
            document: DocumentV1,
            name = defaultLayerNameV1(kind),
          ): CreatableLayerV1 {
            switch (kind) {
              case 'raster':
                return createRasterLayer({ name });
              case 'folder':
                return createFolderLayer({ name });
              case 'vector':
                return createVectorLayer({ name });
              case 'adjustment':
                return createAdjustmentLayer({
                  name,
                  adjustment: createEffectNode('core.identity'),
                });
              case 'fill':
                return createFillLayer({
                  name,
                  fill: { kind: 'solid', color: color(document, [0, 0, 0, 1]) },
                });
              case 'gradient':
                return createGradientLayer({
                  name,
                  gradient: {
                    kind: 'linear',
                    stops: Object.freeze([
                      Object.freeze({ position: 0, color: color(document, [0, 0, 0, 1]) }),
                      Object.freeze({ position: 1, color: color(document, [1, 1, 1, 1]) }),
                    ]),
                    geometry: Object.freeze({
                      start: Object.freeze({ x: 0, y: 0 }),
                      end: Object.freeze({ x: document.canvas.width, y: 0 }),
                    }),
                  },
                });
              case 'linked-object':
                return createLinkedObjectLayer({
                  name,
                  embeddedSnapshot: blankLinkedDocument(document),
                });
            }
          }

          function documentWithLayerTree(
            snapshot: PaintProjectSnapshotV1,
            revision: Revision,
            rootLayerIds: readonly LayerId[],
            layers: Readonly<Record<string, LayerBaseV1>>,
            now: Date,
          ): PaintProjectSnapshotV1 {
            return Object.freeze({
              ...snapshot,
              document: Object.freeze({
                ...snapshot.document,
                revision,
                modifiedAt: now.toISOString(),
                layerTree: Object.freeze({
                  rootLayerIds: Object.freeze([...rootLayerIds]),
                  layers: Object.freeze({ ...layers }),
                }),
              }),
            });
          }

          export function insertRootLayerSnapshotV1(
            snapshot: PaintProjectSnapshotV1,
            layer: CreatableLayerV1,
            revision: Revision,
            now: Date = new Date(),
          ): PaintProjectSnapshotV1 {
            if (layer.parentId !== null) throw new Error('root layer creation requires parentId=null');
            if (layer.id in snapshot.document.layerTree.layers) {
              throw new Error(`layer already exists: ${layer.id}`);
            }
            return documentWithLayerTree(
              snapshot,
              revision,
              [...snapshot.document.layerTree.rootLayerIds, layer.id],
              { ...snapshot.document.layerTree.layers, [layer.id]: layer },
              now,
            );
          }

          export function attachRasterMaskSnapshotV1(
            snapshot: PaintProjectSnapshotV1,
            targetLayerId: LayerId,
            revision: Revision,
            now: Date = new Date(),
          ): PaintProjectSnapshotV1 {
            const target = snapshot.document.layerTree.layers[targetLayerId];
            if (target === undefined) throw new Error(`mask target layer is missing: ${targetLayerId}`);
            if (target.type === 'lineartBoundary') {
              throw new Error('Lineart Boundary layers cannot receive artwork masks');
            }
            const mask = createRasterMask({ defaultCoverage: 1 });
            const nextLayer = Object.freeze({
              ...target,
              revision,
              masks: Object.freeze([...target.masks, mask]),
            }) as LayerBaseV1;
            return documentWithLayerTree(
              snapshot,
              revision,
              snapshot.document.layerTree.rootLayerIds,
              { ...snapshot.document.layerTree.layers, [targetLayerId]: nextLayer },
              now,
            );
          }

          export function layerMasksV1(layer: LayerBaseV1): readonly MaskAttachmentV1[] {
            return layer.masks;
          }
          EOF

          cat > src/app/layer-workflow-controller.ts <<'EOF'
          import { parseLayerId, type LayerId } from '../domain/identity.js';
          import type { LayerBaseV1 } from '../domain/layers.js';
          import {
            CREATABLE_LAYER_KINDS_V1,
            attachRasterMaskSnapshotV1,
            createDefaultLayerV1,
            defaultLayerNameV1,
            insertRootLayerSnapshotV1,
            type CreatableLayerKindV1,
          } from './layer-creation.js';
          import type { PaintHistoryControllerV1 } from './paint-history-controller.js';
          import type { PaintPersistenceControllerV1 } from './paint-persistence-controller.js';
          import type { PaintSessionControllerV1 } from './paint-session-controller.js';

          export interface LayerWorkflowControllerV1 {
            readonly schema: 'illustro.layer-workflow/1';
            refresh(): void;
            dispose(): void;
          }

          interface OptionsV1 {
            readonly root?: HTMLElement;
            readonly paintSession: PaintSessionControllerV1;
            readonly paintHistory: PaintHistoryControllerV1;
            readonly paintPersistence: PaintPersistenceControllerV1;
            readonly schedule: (operation: () => Promise<void>) => void;
            readonly onHistoryChanged: () => void;
          }

          const BUTTON_IDS: Readonly<Record<CreatableLayerKindV1, string>> = Object.freeze({
            raster: '#layer-add-raster',
            folder: '#layer-add-folder',
            vector: '#layer-add-vector',
            adjustment: '#layer-add-adjustment',
            fill: '#layer-add-fill',
            gradient: '#layer-add-gradient',
            'linked-object': '#layer-add-linked-object',
          });

          const KIND_LABELS: Readonly<Record<string, string>> = Object.freeze({
            raster: 'ラスタ',
            folder: 'フォルダ',
            vector: 'ベクター',
            adjustment: '調整',
            fill: '塗り',
            gradient: 'グラデーション',
            linkedObject: 'リンク',
            lineartBoundary: '境界',
          });

          function required<T extends Element>(selector: string): T {
            const element = document.querySelector<T>(selector);
            if (element === null) throw new Error(`layer workflow is missing ${selector}`);
            return element;
          }

          function closeMenu(element: Element): void {
            element.closest('details')?.removeAttribute('open');
          }

          function nextName(kind: CreatableLayerKindV1, layers: Readonly<Record<string, LayerBaseV1>>): string {
            const base = defaultLayerNameV1(kind);
            const used = new Set(Object.values(layers).map((layer) => layer.name));
            if (!used.has(base)) return base;
            for (let suffix = 2; suffix < Number.MAX_SAFE_INTEGER; suffix += 1) {
              const candidate = `${base} ${suffix}`;
              if (!used.has(candidate)) return candidate;
            }
            throw new RangeError('layer name sequence is exhausted');
          }

          export function installLayerWorkflowControllerV1(options: OptionsV1): LayerWorkflowControllerV1 {
            const root = options.root ?? document.documentElement;
            const list = required<HTMLElement>('#layer-list');
            const maskButton = required<HTMLButtonElement>('#layer-add-mask');
            const buttons = new Map<CreatableLayerKindV1, HTMLButtonElement>();
            for (const kind of CREATABLE_LAYER_KINDS_V1) buttons.set(kind, required(BUTTON_IDS[kind]));
            let disposed = false;

            const publishError = (error: unknown): void => {
              root.dataset.illustroLayerError = error instanceof Error ? error.message : String(error);
            };

            const refresh = (): void => {
              if (disposed) return;
              const documentValue = options.paintSession.currentDocument();
              const activeLayerId = options.paintSession.activeLayerId();
              list.replaceChildren();
              if (documentValue === null) {
                root.dataset.illustroLayerCount = '0';
                root.dataset.illustroActiveLayerId = '';
                return;
              }
              const ordered = [...documentValue.layerTree.rootLayerIds].reverse();
              for (const layerId of ordered) {
                const layer = documentValue.layerTree.layers[layerId];
                if (layer === undefined) continue;
                const row = document.createElement('button');
                row.type = 'button';
                row.className = 'shell-layer-row';
                row.dataset.layerId = layerId;
                row.dataset.layerType = layer.type;
                row.setAttribute('aria-pressed', layerId === activeLayerId ? 'true' : 'false');
                if (layerId === activeLayerId) row.classList.add('is-selected');

                const thumbnail = document.createElement('span');
                thumbnail.className = 'shell-layer-thumbnail';
                thumbnail.dataset.layerType = layer.type;
                const copy = document.createElement('span');
                copy.className = 'shell-layer-copy';
                const name = document.createElement('span');
                name.className = 'shell-layer-name';
                name.textContent = layer.name;
                const kind = document.createElement('span');
                kind.className = 'shell-layer-kind';
                kind.textContent = KIND_LABELS[layer.type] ?? layer.type;
                copy.append(name, kind);
                const masks = document.createElement('span');
                masks.className = 'shell-layer-mask-count';
                masks.textContent = layer.masks.length === 0 ? '' : `M ${layer.masks.length}`;
                row.append(thumbnail, copy, masks);
                list.append(row);
              }
              const activeLayer = activeLayerId === null ? undefined : documentValue.layerTree.layers[activeLayerId];
              maskButton.disabled = activeLayer === undefined || activeLayer.type === 'lineartBoundary';
              root.dataset.illustroLayerCount = String(Object.keys(documentValue.layerTree.layers).length);
              root.dataset.illustroActiveLayerId = activeLayerId ?? '';
              root.dataset.illustroLayerWorkflow = 'ready';
            };

            const runCreate = (kind: CreatableLayerKindV1, source: HTMLButtonElement): void => {
              closeMenu(source);
              options.schedule(async () => {
                try {
                  const current = options.paintSession.projectSnapshot();
                  if (current === null) return;
                  const layer = createDefaultLayerV1(
                    kind,
                    current.document,
                    nextName(kind, current.document.layerTree.layers),
                  );
                  const transaction = await options.paintHistory.commitSnapshotTransform(
                    `layer.create.${kind}`,
                    (before, revision) => insertRootLayerSnapshotV1(before, layer, revision),
                  );
                  options.paintSession.setActiveLayer(layer.id);
                  await options.paintPersistence.markDirty(transaction.transactionId);
                  root.dataset.illustroLayerTransaction = transaction.transactionId;
                  root.dataset.illustroLayerError = '';
                  refresh();
                  options.onHistoryChanged();
                } catch (error) {
                  publishError(error);
                }
              });
            };

            const createHandlers = new Map<CreatableLayerKindV1, () => void>();
            for (const kind of CREATABLE_LAYER_KINDS_V1) {
              const button = buttons.get(kind);
              if (button === undefined) continue;
              const handler = (): void => runCreate(kind, button);
              createHandlers.set(kind, handler);
              button.addEventListener('click', handler);
            }

            const onMask = (): void => {
              closeMenu(maskButton);
              options.schedule(async () => {
                try {
                  const targetLayerId = options.paintSession.activeLayerId();
                  if (targetLayerId === null) throw new Error('Layer Mask requires an active layer');
                  const transaction = await options.paintHistory.commitSnapshotTransform(
                    'mask.create.raster',
                    (before, revision) =>
                      attachRasterMaskSnapshotV1(before, targetLayerId, revision),
                  );
                  options.paintSession.setActiveLayer(targetLayerId);
                  await options.paintPersistence.markDirty(transaction.transactionId);
                  root.dataset.illustroLayerTransaction = transaction.transactionId;
                  root.dataset.illustroLayerError = '';
                  refresh();
                  options.onHistoryChanged();
                } catch (error) {
                  publishError(error);
                }
              });
            };

            const onListClick = (event: MouseEvent): void => {
              const target = event.target instanceof Element ? event.target.closest<HTMLButtonElement>('[data-layer-id]') : null;
              if (target === null || !list.contains(target)) return;
              const value = target.dataset.layerId;
              if (value === undefined) return;
              try {
                options.paintSession.setActiveLayer(parseLayerId(value));
                root.dataset.illustroLayerError = '';
                refresh();
              } catch (error) {
                publishError(error);
              }
            };

            maskButton.addEventListener('click', onMask);
            list.addEventListener('click', onListClick);
            refresh();

            return Object.freeze({
              schema: 'illustro.layer-workflow/1' as const,
              refresh,
              dispose(): void {
                if (disposed) return;
                disposed = true;
                for (const [kind, handler] of createHandlers) buttons.get(kind)?.removeEventListener('click', handler);
                maskButton.removeEventListener('click', onMask);
                list.removeEventListener('click', onListClick);
                root.dataset.illustroLayerWorkflow = 'disposed';
              },
            });
          }
          EOF

          cat > tests/unit/layer-creation.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import { createDocumentV1 } from '../../src/domain/document.js';
          import { parseRevision } from '../../src/domain/identity.js';
          import {
            attachRasterMaskSnapshotV1,
            createDefaultLayerV1,
            insertRootLayerSnapshotV1,
          } from '../../src/app/layer-creation.js';
          import type { PaintProjectSnapshotV1 } from '../../src/app/paint-session-controller.js';

          function snapshot(): PaintProjectSnapshotV1 {
            const document = createDocumentV1({ width: 640, height: 480 });
            return Object.freeze({
              schema: 'illustro.paint-project-snapshot/1' as const,
              document,
              committedStrokes: Object.freeze([]),
            });
          }

          describe('M5B layer creation foundation', () => {
            it('creates every adopted M5B creation-layer shape with canonical defaults', () => {
              const document = snapshot().document;
              expect(createDefaultLayerV1('raster', document).type).toBe('raster');
              expect(createDefaultLayerV1('folder', document).type).toBe('folder');
              expect(createDefaultLayerV1('vector', document).type).toBe('vector');
              expect(createDefaultLayerV1('adjustment', document)).toMatchObject({
                type: 'adjustment',
                adjustment: { effectId: 'core.identity' },
              });
              expect(createDefaultLayerV1('fill', document)).toMatchObject({
                type: 'fill',
                fill: { kind: 'solid' },
              });
              expect(createDefaultLayerV1('gradient', document)).toMatchObject({
                type: 'gradient',
                gradient: { kind: 'linear' },
              });
              expect(createDefaultLayerV1('linked-object', document)).toMatchObject({
                type: 'linkedObject',
                embeddedSnapshot: { schema: 'illustro.document/1' },
                externalSource: null,
              });
            });

            it('inserts new layers at the canonical root stack top and advances revision', () => {
              const before = snapshot();
              const first = createDefaultLayerV1('raster', before.document, 'Layer A');
              const one = insertRootLayerSnapshotV1(before, first, parseRevision(1), new Date(0));
              const second = createDefaultLayerV1('folder', one.document, 'Folder A');
              const two = insertRootLayerSnapshotV1(one, second, parseRevision(2), new Date(1));
              expect(two.document.layerTree.rootLayerIds).toEqual([first.id, second.id]);
              expect(two.document.layerTree.layers[first.id]).toBe(first);
              expect(two.document.layerTree.layers[second.id]).toBe(second);
              expect(two.document.revision).toBe(2);
              expect(two.committedStrokes).toBe(before.committedStrokes);
            });

            it('attaches an enabled white raster mask without mutating the source snapshot', () => {
              const before = snapshot();
              const layer = createDefaultLayerV1('raster', before.document, 'Paint');
              const inserted = insertRootLayerSnapshotV1(before, layer, parseRevision(1), new Date(0));
              const masked = attachRasterMaskSnapshotV1(inserted, layer.id, parseRevision(2), new Date(1));
              const sourceLayer = inserted.document.layerTree.layers[layer.id];
              const maskedLayer = masked.document.layerTree.layers[layer.id];
              expect(sourceLayer?.masks).toHaveLength(0);
              expect(maskedLayer?.masks).toHaveLength(1);
              expect(maskedLayer?.masks[0]).toMatchObject({
                kind: 'raster-mask',
                enabled: true,
                inverted: false,
                defaultCoverage: 1,
              });
              expect(maskedLayer?.revision).toBe(2);
            });
          });
          EOF

          cat > scripts/verify-m5b-layer-foundation.mjs <<'EOF'
          import fs from 'node:fs';

          const read = (path) => fs.readFileSync(path, 'utf8');
