            background:
              linear-gradient(45deg, #eef1f5 25%, transparent 25% 75%, #eef1f5 75%),
              linear-gradient(45deg, #eef1f5 25%, #fff 25% 75%, #eef1f5 75%);
            background-position: 0 0, 4px 4px;
            background-size: 8px 8px;
          }

          .shell-layer-thumbnail[data-layer-type='folder'] {
            border-color: #c4b5fd;
            background: #ede9fe;
          }

          .shell-layer-thumbnail[data-layer-type='fill'],
          .shell-layer-thumbnail[data-layer-type='gradient'] {
            background: linear-gradient(135deg, #111827, #f8fafc);
          }

          .shell-layer-thumbnail[data-layer-type='adjustment'] {
            background: linear-gradient(135deg, #dbeafe, #fce7f3);
          }

          .shell-layer-thumbnail[data-layer-type='vector'] {
            background: linear-gradient(135deg, #ecfeff, #cffafe);
          }

          .shell-layer-thumbnail[data-layer-type='linkedObject'] {
            background: linear-gradient(135deg, #f3e8ff, #e0e7ff);
          }

          .shell-layer-copy {
            display: grid;
            min-width: 0;
            gap: 1px;
          }

          .shell-layer-name {
            overflow: hidden;
            font-size: 12px;
            font-weight: 650;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .shell-layer-kind {
            color: #7b879d;
            font-size: 9px;
          }

          .shell-layer-mask-count {
            min-width: 28px;
            color: #748199;
            font-size: 9px;
            text-align: right;
          }

          """
          if marker not in text:
              raise SystemExit('CSS layer marker missing')
          path.write_text(text.replace(marker, rules + marker, 1))

          # Main production wiring.
          path = Path('src/app/main.ts')
          text = path.read_text()
          anchor = "import { installGridControllerV1 } from './grid-controller.js';"
          text = text.replace(anchor, anchor + "\nimport { installLayerWorkflowControllerV1 } from './layer-workflow-controller.js';", 1)
          anchor = "let paintRenderTask: Promise<void> = Promise.resolve();"
          text = text.replace(anchor, anchor + "\nlet refreshLayerUi = (): void => {};", 1)
          old = "    shell.canvas.style.removeProperty('--illustro-canvas-background');\n  }\n}"
          new = "    shell.canvas.style.removeProperty('--illustro-canvas-background');\n  }\n  refreshLayerUi();\n}"
          if old not in text:
              raise SystemExit('main publish document target missing')
          text = text.replace(old, new, 1)
          anchor = "const pointerTransport = createPointerInputTransportV1(workers.render, {"
          install = """const layerWorkflow = installLayerWorkflowControllerV1({
            root,
            paintSession,
            paintHistory,
            paintPersistence,
            schedule: enqueuePaintRender,
            onHistoryChanged: publishPaintHistory,
          });
          refreshLayerUi = (): void => layerWorkflow.refresh();

          """
          if anchor not in text:
              raise SystemExit('main layer install anchor missing')
          text = text.replace(anchor, install + anchor, 1)
          old = "    documentGeometryWorkflow.dispose();\n    documentWorkflow.dispose();"
          new = "    layerWorkflow.dispose();\n    documentGeometryWorkflow.dispose();\n    documentWorkflow.dispose();"
          if old not in text:
              raise SystemExit('main disposal target missing')
          path.write_text(text.replace(old, new, 1))

          # Package verification command.
          path = Path('package.json')
          package = json.loads(path.read_text())
          package['scripts']['verify:m5b'] = 'node scripts/verify-m5b-layer-foundation.mjs'
          path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          # Standard CI permanently protects the new production path.
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          anchor = "      - name: Production build\n        env:"
          step = "      - name: M5B layer creation inspection\n        run: npm run verify:m5b\n"
          if anchor not in text:
              raise SystemExit('CI M5B anchor missing')
          path.write_text(text.replace(anchor, step + anchor, 1))
          PY
      - name: Canonical formatting
        run: npm run format
      - name: Formatting check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
