name: Verify M8E selection once

on:
  push:
    branches: [main]
    paths:
      - '.github/m8e-selection-verify-trigger'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Rebase latest main
        run: git pull --rebase origin main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: |
          npm install --global npm@11.19.1
          npm ci --ignore-scripts
      - name: Format M8E files
        run: npx biome format --write src/app/m8-selection-context-layer.ts src/app/m8-selection-gesture-controller.ts src/app/m8-selection-launcher.ts src/app/selection-contour-presenter.ts tests/unit/m8-selection-launcher.test.ts
      - name: Formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Focused M8E tests
        run: npx vitest run tests/unit/m8-selection-launcher.test.ts
      - name: Production build
        run: npm run build
      - name: Remove temporary helpers
        run: rm .github/workflows/verify-m8e-selection-once.yml .github/m8e-selection-verify-trigger
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: verify rebuilt M8E selection interaction'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
