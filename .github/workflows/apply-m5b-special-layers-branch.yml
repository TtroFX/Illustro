name: Apply M5B special layers branch

on:
  push:
    branches:
      - work/m5b-special-layers-20260902
    paths:
      - '.github/workflows/apply-m5b-special-layers-branch.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply remaining M5B implementation
        run: |
          python .github/automation/m5b-role-ui.py
          python .github/automation/m5b-draft-output.py
          python .github/automation/m5b-linked-object.py
          python .github/automation/m5b-close.py
      - name: Format
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Focused M5B tests
        run: npx vitest run tests/unit/layer-role-flags.test.ts tests/unit/draft-final-output.test.ts tests/unit/linked-object-canonical.test.ts tests/unit/special-layers.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: M5B contract inspection
        run: npm run verify:m5b
      - name: Production build
        run: npm run build
      - name: Verify closure state
        run: |
          grep -F 'M5B-045 Reference Layer designation:完了' IMPLEMENTATION_PROGRESS.md
          grep -F 'M5B-050 Linked Object canonical embedded representation:完了' IMPLEMENTATION_PROGRESS.md
          grep -F 'M5B-検査 M5B内部検査:完了' IMPLEMENTATION_PROGRESS.md
          grep -F 'M5C-001 Normal:未完了' IMPLEMENTATION_PROGRESS.md
      - name: Commit verified branch checkpoint
        run: |
          git rm .github/workflows/apply-m5b-special-layers-branch.yml
          git rm .github/automation/m5b-role-ui.py
          git rm .github/automation/m5b-draft-output.py
          git rm .github/automation/m5b-linked-object.py
          git rm .github/automation/m5b-close.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete M5B special layer roles'
          git push origin HEAD:work/m5b-special-layers-20260902
