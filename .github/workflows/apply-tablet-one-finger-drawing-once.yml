name: Apply tablet one-finger drawing once

on:
  push:
    branches:
      - fix/tablet-one-finger-drawing-20260902
    paths:
      - .github/workflows/apply-tablet-one-finger-drawing-once.yml
      - scripts/apply-tablet-one-finger-drawing.py

permissions:
  contents: write

jobs:
  apply-verify-persist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply touch-input fix
        run: python scripts/apply-tablet-one-finger-drawing.py
      - name: Format
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Prepare generated assets
        run: npm run prepare:generated
      - name: Focused input arbitration tests
        run: npx vitest run tests/unit/input-arbitration.test.ts tests/unit/pointer-input.test.ts tests/unit/input-transport.test.ts tests/unit/paint-session-controller.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Full unit regression
        run: npm run test:unit
      - name: Production build
        env:
          ILLUSTRO_BUILD_MODE: production
        run: npm run build
      - name: Integration regression
        run: npm run test:integration
      - name: Persist verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-tablet-one-finger-drawing.py
          git config user.name "TtroFX"
          git config user.email "ttro0419@gmail.com"
          git add -A
          git commit -m "fix: enable one-finger drawing on tablets"
          git push origin HEAD:fix/tablet-one-finger-drawing-20260902
