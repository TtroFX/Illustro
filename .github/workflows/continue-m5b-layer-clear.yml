name: Continue M5B Layer Clear

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  implement-verify-record:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply M5B layer clear
        run: |
          cat >> src/app/layer-operations.ts <<'EOF'

          export function clearLayerSnapshotV1(
            snapshot: PaintProjectSnapshotV1,
            layerId: LayerId,
            revision: Revision,
            now: Date = new Date(),
          ): PaintProjectSnapshotV1 {
            const layer = requireLayerV1(snapshot, layerId);
            if (layer.locks.all || layer.locks.pixels) {
              throw new Error('layer clear is blocked by the layer pixel lock');
            }

            if (layer.type === 'raster') {
              const raster = layer as RasterLayerV1;
              const hasCommittedPaint = snapshot.committedStrokes.some(
                (entry) => entry.stroke.layerId === layerId,
              );
              if (raster.tiles.length === 0 && !hasCommittedPaint) {
                throw new Error('raster layer clear has no changes');
              }
              const cleared = Object.freeze({
                ...raster,
                revision,
                tiles: Object.freeze([]),
                boundsHint: null,
              }) as RasterLayerV1;
              return documentWithStateV1(
                snapshot,
                revision,
                snapshot.document.layerTree.rootLayerIds,
                { ...snapshot.document.layerTree.layers, [layerId]: cleared },
                snapshot.committedStrokes.filter((entry) => entry.stroke.layerId !== layerId),
                now,
              );
            }

            if (layer.type === 'vector') {
              const vector = layer as VectorLayerV1;
              if (vector.objects.length === 0) throw new Error('vector layer clear has no changes');
              const cleared = Object.freeze({
                ...vector,
                revision,
                objects: Object.freeze([]),
                boundsHint: null,
              }) as VectorLayerV1;
              return documentWithStateV1(
                snapshot,
                revision,
                snapshot.document.layerTree.rootLayerIds,
                { ...snapshot.document.layerTree.layers, [layerId]: cleared },
                snapshot.committedStrokes,
                now,
              );
            }

            throw new Error(`layer clear is not applicable to ${layer.type} layers`);
          }
          EOF

          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/layer-workflow-controller.ts')
          text = path.read_text()
          text = text.replace(
              '  deleteRootLayerSnapshotV1,\n',
              '  clearLayerSnapshotV1,\n  deleteRootLayerSnapshotV1,\n',
              1,
          )
          text = text.replace(
              "  const deleteButton = required<HTMLButtonElement>('#layer-delete');\n",
              "  const deleteButton = required<HTMLButtonElement>('#layer-delete');\n  const clearButton = required<HTMLButtonElement>('#layer-clear');\n",
              1,
          )
          text = text.replace(
              '    deleteButton.disabled = disabled;\n',
              "    deleteButton.disabled = disabled;\n    clearButton.disabled =\n      disabled ||\n      (active?.layer.type !== 'raster' && active?.layer.type !== 'vector') ||\n      active.layer.locks.all ||\n      active.layer.locks.pixels;\n",
              1,
          )
          marker = """  const onRename = (): void => {
"""
          handler = """  const onClear = (): void => {
    const layerId = options.paintSession.activeLayerId();
    if (layerId === null) return;
    commitMutation(
      'layer.clear',
      (before, revision) => clearLayerSnapshotV1(before, layerId, revision),
      () => layerId,
    );
  };

"""
          if marker not in text:
              raise SystemExit('layer clear handler anchor missing')
          text = text.replace(marker, handler + marker, 1)
          text = text.replace(
              "  deleteButton.addEventListener('click', onDelete);\n",
              "  deleteButton.addEventListener('click', onDelete);\n  clearButton.addEventListener('click', onClear);\n",
              1,
          )
          text = text.replace(
              "      deleteButton.removeEventListener('click', onDelete);\n",
              "      deleteButton.removeEventListener('click', onDelete);\n      clearButton.removeEventListener('click', onClear);\n",
              1,
          )
          path.write_text(text)

          path = Path('src/index.html')
          text = path.read_text()
          anchor = '              <button id="layer-delete" type="button" aria-label="レイヤーを削除" title="削除">×</button>\n'
          addition = '              <button id="layer-clear" type="button" aria-label="レイヤー内容をクリア" title="内容をクリア">⌫</button>\n'
          if anchor not in text:
              raise SystemExit('layer clear UI anchor missing')
          path.write_text(text.replace(anchor, anchor + addition, 1))
          PY

          cat > tests/unit/layer-clear.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import { clearLayerSnapshotV1 } from '../../src/app/layer-operations.js';
          import type { PaintProjectSnapshotV1 } from '../../src/app/paint-session-controller.js';
          import { createDocumentV1 } from '../../src/domain/document.js';
          import { parseRevision } from '../../src/domain/identity.js';
          import {
            createRasterLayer,
            createRasterMask,
            createRasterTileReference,
            createVectorLayer,
            createVectorObject,
            type LayerBaseV1,
          } from '../../src/domain/layers.js';

          function snapshotWith(
            layer: LayerBaseV1,
            committedStrokes: PaintProjectSnapshotV1['committedStrokes'] = Object.freeze([]),
          ): PaintProjectSnapshotV1 {
            const document = createDocumentV1({ width: 128, height: 96 });
            return Object.freeze({
              schema: 'illustro.paint-project-snapshot/1' as const,
              document: Object.freeze({
                ...document,
                layerTree: Object.freeze({
                  rootLayerIds: Object.freeze([layer.id]),
                  layers: Object.freeze({ [layer.id]: layer }),
                }),
              }),
              committedStrokes,
            });
          }

          describe('M5B layer clear', () => {
            it('clears raster tile references and canonical baseline paint while retaining layer attachments', () => {
              const layer = createRasterLayer({
                name: 'Paint',
                masks: [createRasterMask()],
                tiles: [createRasterTileReference({ x: 0, y: 0, payloadRef: 'sha256:fixture' })],
              });
              const before = snapshotWith(
                layer,
                Object.freeze([
                  Object.freeze({
                    stroke: Object.freeze({
                      schema: 'illustro.paint-stroke/1' as const,
                      strokeId: '11111111-1111-4111-8111-111111111111',
                      pointerId: 1,
                      source: 'pen' as const,
                      layerId: layer.id,
                      samples: Object.freeze([]),
                    }),
                    dabs: Object.freeze([]),
                  }),
                ]),
              );
              const after = clearLayerSnapshotV1(before, layer.id, parseRevision(1), new Date(0));
              const cleared = after.document.layerTree.layers[layer.id];
              expect(cleared?.type).toBe('raster');
              expect(cleared?.masks).toHaveLength(1);
              expect(cleared?.revision).toBe(1);
              expect((cleared as typeof layer).tiles).toEqual([]);
              expect(after.committedStrokes).toEqual([]);
              expect(before.committedStrokes).toHaveLength(1);
              expect(layer.tiles).toHaveLength(1);
            });

            it('clears vector objects without changing the original snapshot', () => {
              const layer = createVectorLayer({
                name: 'Vector',
                objects: [createVectorObject({ kind: 'shape', geometry: { shape: 'rect' } })],
              });
              const before = snapshotWith(layer);
              const after = clearLayerSnapshotV1(before, layer.id, parseRevision(1), new Date(0));
              expect((after.document.layerTree.layers[layer.id] as typeof layer).objects).toEqual([]);
              expect(layer.objects).toHaveLength(1);
            });

            it('rejects pixel-locked and already-empty layers', () => {
              const locked = createRasterLayer({ name: 'Locked', locks: { pixels: true } });
              expect(() => clearLayerSnapshotV1(snapshotWith(locked), locked.id, parseRevision(1))).toThrow(
                /pixel lock/,
              );
              const empty = createRasterLayer({ name: 'Empty' });
              expect(() => clearLayerSnapshotV1(snapshotWith(empty), empty.id, parseRevision(1))).toThrow(
                /no changes/,
              );
            });
          });
          EOF
      - name: Canonical formatting
        run: npm run format
      - name: Formatting check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: M1 contract inspection
        run: npm run verify:m1
      - name: M2 persistence inspection
        run: npm run verify:m2
      - name: M3 foundation inspection
        run: npm run verify:m3
      - name: M4 vertical-slice inspection
        run: npm run verify:m4
      - name: M5A inspection
        run: npm run verify:m5a
      - name: Existing M5B inspection
        run: npm run verify:m5b
      - name: Layer clear contract inspection
        run: |
          grep -q 'clearLayerSnapshotV1' src/app/layer-operations.ts
          grep -q "'layer.clear'" src/app/layer-workflow-controller.ts
          grep -q 'id="layer-clear"' src/index.html
      - name: Production build
        env:
          ILLUSTRO_BUILD_MODE: production
        run: npm run build
      - name: Integration tests
        run: npm run test:integration
      - name: Deployment contract
        run: npm run verify:m0.5
      - name: Record verified M5B layer clear
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          old = 'M5B-018 layer clear:未完了'
          if old not in text:
              raise SystemExit(f'progress target missing: {old}')
          path.write_text(text.replace(old, 'M5B-018 layer clear:完了', 1))
          PY
          rm .github/workflows/continue-m5b-layer-clear.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: implement M5B layer clear [skip ci]'
          git push origin HEAD:main
