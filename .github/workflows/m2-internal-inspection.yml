name: Close M2 internal inspection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m2-internal-inspection.yml'
      - 'scripts/verify-m2-persistence.mjs'

permissions:
  contents: write

jobs:
  inspect-close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: M2 persistence contract inspection
        run: npm run verify:m2
      - name: M2 fault and safety matrix
        run: npx vitest run tests/unit/storage-foundation.test.ts tests/unit/transaction-recovery.test.ts tests/unit/history.test.ts tests/unit/history-worker-adapter.test.ts tests/unit/project-coordination.test.ts tests/unit/storage-maintenance.test.ts tests/unit/storage-growth-guard.test.ts tests/unit/project-library.test.ts
      - name: Full unit regression
        run: npm run test:unit
      - name: M1 regression contract
        run: npm run verify:m1
      - name: Production build
        run: npm run build
        env:
          ILLUSTRO_BUILD_MODE: production
      - name: Integration regression
        run: npm run test:integration
      - name: Deployment regression
        run: npm run verify:m0.5
      - name: Ensure transient M2 workflows are gone
        run: |
          test ! -e .github/workflows/m2-storage-foundation-format.yml
          test ! -e .github/workflows/m2-storage-foundation-repair.yml
          test ! -e .github/workflows/m2-storage-production-integration.yml
      - name: Close M2 internal inspection
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('IMPLEMENTATION_PROGRESS.md'); s=p.read_text()
          old='M2-検査 M2内部検査:未完了'
          if old not in s: raise SystemExit('M2 inspection progress target missing')
          p.write_text(s.replace(old,'M2-検査 M2内部検査:完了',1))
          PY
      - name: Commit M2 closure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m2-internal-inspection.yml
          git add IMPLEMENTATION_PROGRESS.md
          git commit -m 'test: close M2 persistence milestone [skip ci]'
          git push
