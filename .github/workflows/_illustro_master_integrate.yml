name: Temporary Illustro Master Integration

on:
  push:
    branches: [main]
    paths:
      - "tools/_illustro_integrate_ready"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Integrate and validate Master
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re,json,zlib,base64,hashlib,glob

          M=Path("ILLUSTRO_MASTER_DESIGN.md")
          parts=sorted(glob.glob("tools/_illustro_payload_*.part"))
          if not parts: raise SystemExit("No payload parts")
          b64="".join(Path(p).read_text().strip() for p in parts)
          P=json.loads(zlib.decompress(base64.b64decode(b64)).decode())
          expected=P["baseline_sha"]

          def normkeys(d):
              out={}
              for k,v in d.items():
                  m=re.match(r"\s*(\d+\.\d+)",str(k))
                  if not m: raise SystemExit(f"Invalid section key: {k!r}")
                  nk=m.group(1)
                  if nk in out: raise SystemExit(f"Duplicate normalized section key: {nk}")
                  out[nk]=v
              return out
          P["sec2"]=normkeys(P["sec2"])
          P["sec5"]=normkeys(P["sec5"])

          def blobsha(b): return hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()
          data=M.read_bytes()
          actual=blobsha(data)
          if actual!=expected:
              raise SystemExit(f"Latest Source changed: expected={expected} actual={actual}; abort/rebase required")
          t=data.decode("utf-8")

          # Repair the known malformed Section 2.8 boundary by the position of the heading
          # within the one source line that contains both its number and title. This preserves
          # every source character and inserts only the missing line boundary.
          lines=t.splitlines(keepends=True)
          offset=0
          repaired=False
          for line in lines:
              if "2.8" in line and "線画システム" in line:
                  p=line.find("###")
                  if p >= 0:
                      if p > 0:
                          at=offset+p
                          t=t[:at]+"\n\n"+t[at:]
                      repaired=True
                      break
              offset+=len(line)
          if not repaired:
              raise SystemExit("Cannot locate Section 2.8 heading inside the source line")
          if not any(line.startswith("###") and "2.8" in line and "線画システム" in line for line in t.splitlines()):
              raise SystemExit("Section 2.8 heading boundary repair failed")

          INVISIBLE=" \t\ufeff\u200b\u2060\u00a0"
          def canon_line(line):
              return line.rstrip("\r\n").lstrip(INVISIBLE)

          def span(t,num):
              num=str(num).strip()
              lines=t.splitlines(keepends=True)
              offset=0
              start=None
              end=None
              for line in lines:
                  stripped=canon_line(line)
                  if stripped.startswith("### "):
                      rest=stripped[4:]
                      token=rest.split(maxsplit=1)[0] if rest else ""
                      if start is None and token==num:
                          start=offset
                      elif start is not None:
                          end=offset
                          break
                  elif start is not None and stripped.startswith("## "):
                      rest=stripped[3:]
                      token=rest.split(maxsplit=1)[0] if rest else ""
                      if token and token[0].isdigit():
                          end=offset
                          break
                  offset+=len(line)
              if start is None:
                  raw=[repr(x) for x in t.splitlines() if num in x][:40]
                  raise SystemExit(f"Missing section {num!r}; raw-matches={raw!r}")
              return start, (len(t) if end is None else end)

          def xsec(t,num,fn):
              s,e=span(t,num); return t[:s]+fn(t[s:e])+t[e:]

          def rm(sec,pats):
              return "\n".join(l for l in sec.splitlines() if not any(re.search(p,l,re.I) for p in pats))

          def clean(t):
              t=t.replace("JPEG Noise Reduction","JPEG Artifact Reduction")
              t=t.replace("Cloud Generator","Procedural Noise Generator（Cloud preset）")
              t=t.replace("Opacity / Strength","Effect Mix")
              t=t.replace("Restore Brush","Reconstruct")
              for num in ("2.13","5.13"):
                  t=xsec(t,num,lambda s:rm(s,[r"Anime Background"]))
              for num in ("2.7","5.7","5.25"):
                  t=xsec(t,num,lambda s:rm(s,[r"Edge Bloom"]))
              for num in ("2.12","5.12"):
                  t=xsec(t,num,lambda s:rm(s,[r"^\s*[-*]\s*(?:\*\*)?(?:Liquify\s+)?Drag(?:\*\*)?(?:\s|[（(:]|$)"]))
              for num in ("2.2","5.2"):
                  t=xsec(t,num,lambda s:rm(s,[r"不透明度飽和",r"不透明度を弱める",r"不透明度加算",r"不透明度一定"]))
              for num in ("2.7","5.7"):
                  t=xsec(t,num,lambda s:rm(s,[r"^\s*[-*]\s*(?:\*\*)?(?:Strength|強さ)(?:\*\*)?(?:\s|[（(:]|$)"]))
              for num in ("2.13","5.13","5.22"):
                  s,e=span(t,num); t=t[:s]+t[s:e].replace("Perlin Noise","Procedural Noise")+t[e:]
              return t

          def ins(t,num,block,kind):
              marker=f"<!-- ILLUSTRO-V2-FULL:{kind}:{num} -->"
              if marker in t: raise SystemExit(f"Duplicate marker {marker}")
              s,e=span(t,num); sec=t[s:e]
              vals=[int(v) for v in re.findall(rf"^####\s+{re.escape(num)}\.(\d+)(?:\s|$)",sec,re.M)]
              n=max(vals)+1 if vals else 1
              title="Section 5詳細設計統合" if kind=="DETAIL" else "Section 5統合による機能Inventory同期"
              pre=("本項はこの節の既存仕様を失わず、詳細検討で確定した追加仕様・Default・例外・Failure semanticsを統合する。"
                   "同節内の旧記述と直接矛盾する場合は、本項の後発確定仕様を優先する。"
                   if kind=="DETAIL" else
                   "本項はこの節の既存記述を保持したまま、Section 5で確定した機能Inventoryを同期する。"
                   "同節内の旧表記と直接矛盾する場合は、本項のCanonical名称・分類・意味を優先する。")
              a=f"\n\n{marker}\n#### {num}.{n} {title}\n\n{pre}\n\n{block.strip()}\n<!-- /ILLUSTRO-V2-FULL:{kind}:{num} -->\n"
              return t[:e].rstrip()+a+"\n\n"+t[e:].lstrip("\n")

          # Confirm every target section exists before any semantic cleanup/insertion.
          for num in list(P["sec2"])+list(P["sec5"]): span(t,num)

          # `preserved` is the approved baseline after only the explicitly intended canonical cleanup.
          # The final document must retain every nonblank line from this state, in multiplicity and order.
          t=clean(t)
          preserved=t

          for num,b in P["sec2"].items(): t=ins(t,num,b,"INVENTORY")
          for num,b in P["sec5"].items(): t=ins(t,num,b,"DETAIL")

          required=[
          "Pressure 15%  → Size 24%","Pressure 20%  → Size 34%","Pressure 20%  → Size 40%",
          "Pressure 45%  → Size 68%","Size maximum reduction ≈9%","Weak-pressure minimum Density:",
          "≈1.5–1.7 Brush Diameter","Return-to-start Re-arm","XY / YZ / XZ",
          "Effect Mix","Effect Group","Tate-chu-yoko","Text on Path","Live Canvas Reference",
          "Repeat Last","Repeat With…","Portable Project Copy","Illustro Asset Pack",
          "Undo My Last Eligible Change","Boundary-distance Fill","18. Section 6–11"]
          for q in required:
              if q not in t: raise SystemExit(f"Missing required detail: {q}")

          for num,b in P["sec2"].items():
              if f"ILLUSTRO-V2-FULL:INVENTORY:{num}" not in t: raise SystemExit(f"Missing inventory marker {num}")
              if b.strip() not in t: raise SystemExit(f"Payload content mismatch in inventory {num}")
          for num,b in P["sec5"].items():
              if f"ILLUSTRO-V2-FULL:DETAIL:{num}" not in t: raise SystemExit(f"Missing detail marker {num}")
              if b.strip() not in t: raise SystemExit(f"Payload content mismatch in detail {num}")

          brushes=["HB Pencil","2B Pencil","Mechanical Pencil","Rough Pencil","Colored Pencil","Soft Graphite",
          "G Pen","Mapping Pen","Round Pen","Technical Pen","Brush Pen","Dry Ink","Felt Pen","Monoline","ととろペン",
          "Opaque Round","Flat Paint","Gouache","Acrylic","Soft Paint","Chalk Paint","Oil-like","Poster Brush",
          "Round Wash","Wet Wash","Edge Watercolor","Granulating Wash","Water Blend","Dry Watercolor",
          "Soft Airbrush","Hard Airbrush","Fine Spray","Grain Spray","Charcoal","Crayon","Pastel","Dry Media",
          "Paper Grain","Pixel 1px","Fill Brush","Soft Mask Brush"]
          miss=[b for b in brushes if b not in t]
          if miss: raise SystemExit(f"Missing brushes: {miss}")
          if len(brushes)!=41 or len(set(brushes))!=41:
              raise SystemExit("Built-in brush validation inventory is not exactly 41 unique presets")

          for bad in ("Anime Background","Edge Bloom","JPEG Noise Reduction"):
              if bad in t: raise SystemExit(f"Legacy canonical residue: {bad}")

          base_lines=[l for l in preserved.splitlines() if l.strip()]
          final_lines=[l for l in t.splitlines() if l.strip()]
          bc,fc=Counter(base_lines),Counter(final_lines)
          lost=[(line,n-fc[line]) for line,n in bc.items() if fc[line]<n]
          if lost:
              raise SystemExit(f"Baseline information loss detected: {lost[:20]}")

          j=0
          for line in final_lines:
              if j < len(base_lines) and line==base_lines[j]:
                  j+=1
          if j != len(base_lines):
              raise SystemExit(f"Baseline order changed or content displaced at preserved line {j+1}/{len(base_lines)}")

          M.write_text(t,encoding="utf-8",newline="\n")
          print("PASS",len(P["sec2"]),len(P["sec5"]),len(brushes),len(base_lines),len(t.encode()))
          PY
      - name: Commit validated Master and remove temporary integration files
        shell: bash
        run: |
          git config user.name "illustro-design-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ILLUSTRO_MASTER_DESIGN.md
          git rm tools/_illustro_payload_*.part
          git rm tools/_illustro_integrate_ready
          git rm .github/workflows/_illustro_master_integrate.yml
          git diff --cached --check
          git commit -m "docs: integrate complete Section 5 design"
          git push origin main
