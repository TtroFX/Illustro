name: Illustro one-shot M6A-022 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/illustro-m6a022-core.py'
      - '.github/illustro-m6a022-app.py'
      - '.github/illustro-m6a022-tests.py'
      - '.github/workflows/illustro-m6a022-patch.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fix stamp call matching
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/illustro-m6a022-core.py')
          source = path.read_text(encoding='utf-8')
          start = source.index("source = read('src/gpu/baseline-brush.ts')\nneedle = \"\"\"this.#hardness,")
          end = source.index("write('src/gpu/baseline-brush.ts', source)\n", start) + len("write('src/gpu/baseline-brush.ts', source)\n")
          replacement = '''source = read('src/gpu/baseline-brush.ts')
          for indent in ('      ', '        ', '          '):
              needle = 'this.#hardness,\\n' + indent + 'this.#color,'
              count = source.count(needle)
              if count != 1:
                  raise RuntimeError('src/gpu/baseline-brush.ts: expected one stamp call for indent ' + repr(indent) + ', found ' + str(count))
              replacement = 'this.#hardness,\\n' + indent + 'this.#tipDensity,\\n' + indent + 'this.#color,'
              source = source.replace(needle, replacement, 1)
          write('src/gpu/baseline-brush.ts', source)
          '''
          path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')
          PY
      - name: Apply M6A-022 core patch
        run: python .github/illustro-m6a022-core.py
      - name: Apply M6A-022 app and Worker patch
        run: python .github/illustro-m6a022-app.py
      - name: Apply M6A-022 tests and docs patch
        run: python .github/illustro-m6a022-tests.py
      - name: Format changed TypeScript
        run: >-
          npx biome format --write
          src/domain/brush-schema.ts
          src/gpu/baseline-brush.ts
          src/gpu/baseline-raster-tile-store.ts
          src/gpu/baseline-paint-renderer.ts
          src/app/canonical-raster-brush.ts
          src/app/paint-session-controller.ts
          src/app/brush-preset-library.ts
          src/app/brush-preset-controller.ts
          src/workers/render.worker.ts
          tests/unit/brush-tip-density.test.ts
          scripts/verify-m6a-brush.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted regression tests
        run: >-
          npx vitest run
          tests/unit/brush-tip-density.test.ts
          tests/unit/brush-hardness.test.ts
          tests/unit/baseline-brush.test.ts
          tests/unit/baseline-raster-tile-store.test.ts
          tests/unit/baseline-paint-renderer.test.ts
          tests/unit/paint-session-controller.test.ts
      - name: M6A verification
        run: npm run verify:m6a
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          git rm .github/illustro-m6a022-core.py
          git rm .github/illustro-m6a022-app.py
          git rm .github/illustro-m6a022-tests.py
          git rm .github/workflows/illustro-m6a022-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: implement M6A brush tip density"
          git push origin HEAD:main