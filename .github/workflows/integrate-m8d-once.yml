name: Integrate M8D once

on:
  push:
    branches: [main]
    paths:
      - '.github/m8d-integration-trigger'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Rebase latest main
        run: git pull --rebase origin main
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Integrate M8D
        run: python scripts/integrate-m8d-once.py
      - name: Format changed TypeScript
        run: npx biome format --write src/app/m8-inspector-dock.ts src/app/m8-tool-rail.ts src/app/shell.ts tests/unit/m8-inspector-dock.test.ts
      - name: Verify formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Focused M8 verification
        run: npx vitest run tests/unit/m8-inspector-dock.test.ts tests/unit/m8-product-shell.test.ts tests/unit/m8-tool-rail.test.ts tests/unit/m9a-library-production.test.ts
      - name: Production build
        run: npm run build
      - name: Remove temporary integration helpers
        run: rm .github/workflows/integrate-m8d-once.yml scripts/integrate-m8d-once.py .github/m8d-integration-trigger
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrate M8D inspector workspace'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
