name: Confirm M7A lasso remediation once

on:
  push:
    branches: [main]
    paths:
      - '.github/m7a-lasso-remediation-trigger'

permissions:
  contents: write

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Rebase latest main
        run: git pull --rebase origin main
      - name: Reopen confirmed incomplete M7A items
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('IMPLEMENTATION_PROGRESS.md')
          text = p.read_text()
          required = {
              'M7A-003 Lasso selection:完了': 'M7A-003 Lasso selection:未完了',
              'M7A-004 freehand selection:完了': 'M7A-004 freehand selection:未完了',
          }
          for old, new in required.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'missing expected M7A anchor: {old}')

          anchor = 'M7A-検査 M7A内部検査:未完了'
          note = ('再開メモ: M7A-003/004は2026-09-05のAUTHORITATIVE Lasso Selection契約再監査で、'
                  '現行selection-shape-engineがLasso/Freehand境界をpixel-centerの二値0/255でrasterizeし、'
                  '既定AA付きfractional 0..255 coverage要件を満たさないことを確認したため未完了へ戻した。'
                  '既存のdocument-space polygon/even-odd/sparse 128px tile基盤とselection-combine-engineの'
                  'Replace/Add/Subtract/Intersect fractional algebraは保持し、境界AA・degenerate gesture保持・'
                  'behavioral coverage検査をM7側で是正する。並行M7の他項目は停止・巻き戻ししない。')
          if anchor not in text:
              raise SystemExit('M7A inspection anchor missing')
          if note not in text:
              text = text.replace(anchor, anchor + '\n' + note, 1)
          p.write_text(text)
          PY
      - name: Remove temporary helpers
        run: rm .github/workflows/confirm-m7a-lasso-remediation-once.yml .github/m7a-lasso-remediation-trigger
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: reopen M7A lasso coverage remediation'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
