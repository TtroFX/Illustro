name: Append finalized Section 4

on:
  push:
    paths:
      - '.github/section4.final.md'

permissions:
  contents: write

jobs:
  append-section-4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append Section 4 to master design
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^## 4\. 全体UX / UI設計 — 確定$' ILLUSTRO_MASTER_DESIGN.md; then
            echo 'Section 4 already exists; nothing to append.'
            exit 0
          fi
          printf '\n' >> ILLUSTRO_MASTER_DESIGN.md
          cat .github/section4.final.md >> ILLUSTRO_MASTER_DESIGN.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ILLUSTRO_MASTER_DESIGN.md
          git commit -m 'docs: finalize section 4 UX and UI design'
          git push
