name: Temporary M6A Preset Management

on:
  push:
    branches:
      - work/m6a-preset-management-20260903

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/m6a-preset-management-20260903
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply M6A preset management
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-m6a-brush.mjs')
          s = p.read_text()
          s = s.replace(
              "requireText(progress, 'M6A-004 Blur brush mode:完了', 'M6A-004 progress is not complete');",
              "requireText(\n  progress,\n  'M6A-004 Blur brush mode:完了',\n  'M6A-004 progress is not complete',\n);",
              1,
          )
          s = s.replace('future brush preset status was incorrectly advanced', 'future preset-management status was incorrectly advanced', 1)
          p.write_text(s)
          PY
          python scripts/apply-m6a-preset-management.py
          python - <<'PY'
          from pathlib import Path
          html = Path('src/index.html')
          s = html.read_text()
          s = s.replace(
              '<div id="brush-preset-list" class="shell-brush-preset-list" aria-label="ブラシプリセット一覧"></div>',
              '<fieldset id="brush-preset-list" class="shell-brush-preset-list"><legend class="shell-brush-preset-legend">ブラシプリセット一覧</legend></fieldset>',
              1,
          )
          s = s.replace(
              '<div class="shell-brush-preset-actions" aria-label="ブラシプリセット操作">',
              '<fieldset class="shell-brush-preset-actions"><legend class="shell-brush-preset-legend">ブラシプリセット操作</legend>',
              1,
          )
          s = s.replace(
              '<button id="brush-preset-reset" type="button" title="保存基準へリセット">Reset</button>\n            </div>',
              '<button id="brush-preset-reset" type="button" title="保存基準へリセット">Reset</button>\n            </fieldset>',
              1,
          )
          html.write_text(s)

          controller = Path('src/app/brush-preset-controller.ts')
          s = controller.read_text().replace(
              "const list = requireElement('#brush-preset-list', HTMLDivElement);",
              "const list = requireElement('#brush-preset-list', HTMLFieldSetElement);",
              1,
          )
          controller.write_text(s)

          css = Path('public/app-shell.css')
          s = css.read_text()
          marker = '.shell-brush-preset-list {\n'
          reset = ".shell-brush-preset-list,\n.shell-brush-preset-actions {\n  min-inline-size: 0;\n  margin: 0;\n  border: 0;\n  padding: 0;\n}\n\n.shell-brush-preset-legend {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  overflow: hidden;\n  clip-path: inset(50%);\n  white-space: nowrap;\n}\n\n"
          if marker not in s:
              raise SystemExit('brush preset list CSS marker missing')
          s = s.replace(marker, reset + marker, 1)
          css.write_text(s)
          PY
          rm scripts/apply-m6a-preset-management.py .github/workflows/temp-m6a-preset-management.yml
      - name: Formatting
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Focused M6A preset tests
        run: npx vitest run tests/unit/brush-preset-library.test.ts tests/unit/canonical-raster-brush.test.ts tests/unit/eraser-mode.test.ts tests/unit/smudge-mode.test.ts tests/unit/blur-brush-mode.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: M5D compatibility inspection
        run: npm run verify:m5d
      - name: M6A contract inspection
        run: npm run verify:m6a
      - name: Full unit suite
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - name: Integration tests
        run: npm run test:integration
      - name: Persist verified implementation
        run: |
          git checkout -- src/generated || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement M6A preset management"
          git push origin HEAD:work/m6a-preset-management-20260903
