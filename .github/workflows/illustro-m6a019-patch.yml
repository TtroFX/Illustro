name: Illustro one-shot M6A-019 patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message == 'chore: stage M6A-019 verified patch runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply M6A-019 custom tip patch
        run: node scripts/apply-m6a019-patch.mjs
      - name: Format changed TypeScript
        run: npx biome format --write src/domain/brush-schema.ts src/gpu/baseline-brush.ts src/app/canonical-raster-brush.ts src/app/paint-session-controller.ts src/app/brush-preset-library.ts src/app/brush-preset-controller.ts src/app/custom-brush-tip.ts tests/unit/custom-brush-tip.test.ts scripts/verify-m6a-brush.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted regression tests
        run: npx vitest run tests/unit/custom-brush-tip.test.ts tests/unit/sampled-image-brush-tip.test.ts tests/unit/brush-preset-library.test.ts tests/unit/paint-session-controller.test.ts
      - name: M6A verification
        run: npm run verify:m6a
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: implement M6A custom tip creation'
          git push origin HEAD:main
