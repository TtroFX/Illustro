name: Illustro one-shot M6A-019 patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-m6a019-patch.mjs'
      - '.github/workflows/illustro-m6a019-patch.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Sanitize one-shot patch source
        run: >-
          python -c "from pathlib import Path; p=Path('scripts/apply-m6a019-patch.mjs'); s=p.read_text(); p.write_text(s.replace(chr(96)+'sampled-image-custom'+chr(96), 'sampled-image-custom'))"
      - name: Apply M6A-019 custom tip patch
        run: node scripts/apply-m6a019-patch.mjs
      - name: Format changed TypeScript
        run: >-
          npx biome format --write
          src/domain/brush-schema.ts
          src/gpu/baseline-brush.ts
          src/app/canonical-raster-brush.ts
          src/app/paint-session-controller.ts
          src/app/brush-preset-library.ts
          src/app/brush-preset-controller.ts
          src/app/custom-brush-tip.ts
          tests/unit/custom-brush-tip.test.ts
          scripts/verify-m6a-brush.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted regression tests
        run: >-
          npx vitest run
          tests/unit/custom-brush-tip.test.ts
          tests/unit/sampled-image-brush-tip.test.ts
          tests/unit/brush-preset-library.test.ts
          tests/unit/paint-session-controller.test.ts
      - name: M6A verification
        run: npm run verify:m6a
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: implement M6A custom tip creation"
          git push origin HEAD:main
