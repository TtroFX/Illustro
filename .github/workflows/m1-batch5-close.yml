name: Close M1 command serialization batch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-batch5-close.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Close verified M1 command and serialization items
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text(encoding='utf-8')
          items = [
              'M1-030 canonical Command Registry',
              'M1-031 command ID contract',
              'M1-032 command parameter schema',
              'M1-033 command context/availability model',
              'M1-034 command transaction identity',
              'M1-035 command enable/disable semantics',
              'M1-036 serialization primitives',
              'M1-037 deserialization primitives',
              'M1-038 schema validation',
              'M1-039 version handling',
          ]
          for item in items:
              old = f'{item}:未完了'
              new = f'{item}:完了'
              if old not in text and new not in text:
                  raise SystemExit(f'missing progress item: {item}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit verified progress
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add IMPLEMENTATION_PROGRESS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: close M1 command serialization batch [skip ci]'
          git push origin HEAD:main
