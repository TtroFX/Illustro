name: Temporary M9D-001 progress closure
on:
  push:
    branches:
      - chore/m9d-001-progress-close
permissions:
  contents: write
jobs:
  close-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Close only M9D-001 canonical progress item
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('IMPLEMENTATION_PROGRESS.md')
          s = p.read_text()
          old = 'M9D-001 external persistent file handle optional link:未完了'
          new = 'M9D-001 external persistent file handle optional link:完了'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one unfinished M9D-001 row: {old!r}')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify scoped progress diff
        run: |
          git diff --check
          test "$(git diff --name-only)" = "IMPLEMENTATION_PROGRESS.md"
          git diff -- IMPLEMENTATION_PROGRESS.md
      - name: Commit progress closure
        run: |
          rm .github/workflows/tmp-m9d-001-progress-close.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IMPLEMENTATION_PROGRESS.md .github/workflows/tmp-m9d-001-progress-close.yml
          git commit -m "chore(M9D-001): close persistent handle progress"
          git push
