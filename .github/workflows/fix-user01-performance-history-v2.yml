name: Apply USER-01 performance and history controls fix v2

on:
  push:
    paths:
      - '.github/workflows/fix-user01-performance-history-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Align verifier contract in working tree
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-m4-vertical-slice.mjs')
          text = p.read_text()
          old = "  'paintPersistence.markDirty',"
          new = "  'paintPersistence.scheduleDirty',"
          if old not in text:
              raise SystemExit('old M4 persistence contract not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Reuse focused patch script
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/fix-user01-performance-history.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/fix-user01.py').write_text(script)
          PY
          python /tmp/fix-user01.py
      - name: Format TypeScript and HTML
        run: npm run format
      - name: Typecheck
        run: npm run typecheck
      - name: Focused unit verification
        run: npx vitest run tests/unit/paint-history-controller.test.ts tests/unit/paint-persistence-controller.test.ts
      - name: M4 verification
        run: npm run verify:m4
      - name: Production build
        env:
          ILLUSTRO_BUILD_SHA: ${{ github.sha }}
        run: npm run build
      - name: Commit verified application fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src public tests scripts
          git diff --cached --quiet && exit 0
          git commit -m 'fix: keep brush history incremental and expose undo redo'
          git push origin HEAD:main
