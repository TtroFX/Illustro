name: Mark PUB-01 Complete

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mark-pub01.yml'

permissions:
  contents: write

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Mark PUB-01 and remove helper workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text(encoding='utf-8')
          old = 'PUB-01 ユーザー確認1用Preview公開:未完了'
          new = 'PUB-01 ユーザー確認1用Preview公開:完了'
          if old not in text:
              raise SystemExit('Expected PUB-01 unfinished marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/mark-pub01.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPLEMENTATION_PROGRESS.md .github/workflows/mark-pub01.yml
          git commit -m 'chore: mark PUB-01 preview published [skip ci]'
          git push origin HEAD:main
