name: Close M1 internal inspection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-inspection-close.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Close M1 inspection
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text(encoding='utf-8')
          old = 'M1-検査 M1内部検査:未完了'
          new = 'M1-検査 M1内部検査:完了'
          if old not in text and new not in text:
              raise SystemExit('missing M1 inspection progress item')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit verified progress
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add IMPLEMENTATION_PROGRESS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: close M1 internal inspection [skip ci]'
          git push origin HEAD:main
