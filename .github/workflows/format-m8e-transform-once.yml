name: Format M8E transform once

on:
  push:
    branches: [main]
    paths:
      - '.github/m8e-transform-format-trigger'

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Rebase latest main
        run: git pull --rebase origin main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: |
          npm install --global npm@11.19.1
          npm ci --ignore-scripts
      - name: Repair transform state narrowing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/m8-selection-transform-controller.ts')
          text = path.read_text()
          old = """    const viewport = input.viewport.snapshot();
    frame.setAttribute('viewBox', `0 0 ${viewport.stageWidth} ${viewport.stageHeight}`);
"""
          new = """    const currentState = state;
    const viewport = input.viewport.snapshot();
    frame.setAttribute('viewBox', `0 0 ${viewport.stageWidth} ${viewport.stageHeight}`);
"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one refresh state insertion point, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old_call = 'projectDocumentPointToStageV1(applySelectionTransformPointV1(state, point), viewport)'
          new_call = 'projectDocumentPointToStageV1(applySelectionTransformPointV1(currentState, point), viewport)'
          if text.count(old_call) != 1:
              raise SystemExit(f'expected one closure state use, found {text.count(old_call)}')
          path.write_text(text.replace(old_call, new_call, 1))
          PY
      - name: Format controller
        run: npx biome format --write src/app/m8-selection-transform-controller.ts
      - name: Repository format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Remove one-shot helpers
        run: rm .github/workflows/format-m8e-transform-once.yml .github/m8e-transform-format-trigger
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: typecheck M8E transform controller'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
