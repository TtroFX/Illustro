name: Format M2 persistence scheduler

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m2-scheduler-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - run: npx biome format --write src/storage/persistence-scheduler.ts src/workers/storage.worker.ts tests/unit/persistence-scheduler.test.ts
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/storage/persistence-scheduler.ts src/workers/storage.worker.ts tests/unit/persistence-scheduler.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style: format M2 persistence scheduler [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
