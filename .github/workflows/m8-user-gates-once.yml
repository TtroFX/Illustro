name: Apply M8 user review gates once
on:
  push:
    paths:
      - '.github/m8-user-gates-trigger'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Record authoritative M8 user-review policy
        shell: python
        run: |
          from pathlib import Path

          progress = Path('IMPLEMENTATION_PROGRESS.md')
          text = progress.read_text(encoding='utf-8')
          old = "M8 status rule: M8は先行UI/UX実装を許可するが、M7等の依存機能とのproduction path接続・History/Persistence/Command接続・必要な最終検査が未完了の項目は `仮完了` とする。`完了` へ昇格できるのは依存機能を含む本接続と最終検証まで成立した場合のみ。"
          new = old + "\nM8 user-review rule: M8B〜M8Jは各サブセクションを独立したUI確認区切りとする。各区切りは内部実装・内部検査が成立してもユーザー確認前は `仮完了` のままとし、Previewを公開してユーザーから明示的なPASSを得るまで次のM8 UIサブセクションへ進まない。ユーザーPASSはUI/UX/Visualの受入れであり、production path等が未接続なら個別実装項目を `完了` には昇格しない。M8Aはcanonical素材準備のため、このUI確認ゲートの対象外とする。"
          if old not in text:
              raise SystemExit('M8 status rule anchor not found')
          text = text.replace(old, new, 1)

          sections = [
              ('M8B', 'Product Surfaces / Editor Shell'),
              ('M8C', '14-family Tool Rail'),
              ('M8D', '13-block Inspector / PiP / Workspace Customization'),
              ('M8E', 'Selection Launcher / Contextual Canvas UI'),
              ('M8F', 'Quick Hole Controller'),
              ('M8G', 'Keyboard / Pen / Touch / Mouse Interaction'),
              ('M8H', 'Visual Design / Iconography / Motion'),
              ('M8I', 'Responsive / Accessibility / Localization'),
              ('M8J', 'Canonical Input / Parameter Interaction System'),
          ]
          for code, title in sections:
              next_heading = None
              idx = sections.index((code, title))
              if idx + 1 < len(sections):
                  nc, nt = sections[idx + 1]
                  next_heading = f"\n## {nc} — {nt}"
              else:
                  next_heading = "\n## M9"
              gate = f"\nPUB-{code} {code}ユーザー確認用Preview公開:未完了\nUSER-{code} {code} UI/UX/Visualユーザー確認PASS:未完了\n"
              if f"USER-{code} " in text:
                  continue
              pos = text.find(next_heading)
              if pos < 0:
                  raise SystemExit(f'next section anchor not found for {code}: {next_heading!r}')
              text = text[:pos] + gate + text[pos:]
          progress.write_text(text, encoding='utf-8')

          memo = Path('ILLUSTRO_DESIGN_MEMO.md')
          memo_text = memo.read_text(encoding='utf-8')
          marker = '## M8 staged user UI acceptance — 2026-09-05 — AUTHORITATIVE'
          if marker not in memo_text:
              memo_text += f'''\n\n{marker}\n\n**Status: AUTHORITATIVE / IMPLEMENTATION PROCESS RULE.**\n\nM8 UI implementation is reviewed by the user at each major UI sub-section boundary rather than only once after the entire milestone.\n\n- M8B through M8J are separate user-review boundaries.\n- Within one boundary, implementation may proceed to a coherent previewable state and internal verification may run.\n- A boundary remains provisionally complete (`仮完了`) until its user-review Preview is published and the user explicitly gives PASS for the UI/UX/Visual result.\n- The next M8 UI boundary must not begin before that explicit PASS.\n- User PASS accepts the presented UI/UX/Visual direction; it does not falsely mark production wiring complete. Items whose M7/M9/Command/History/Persistence or other production dependencies remain incomplete stay `仮完了` until those dependencies and final verification are actually satisfied.\n- M8A is canonical-reference materialization rather than a product UI review boundary and therefore is excluded from this staged user UI gate.\n- At each review, canonical visual reference and all later AUTHORITATIVE F/G/H/V refinements remain the design authority. Legacy UI that conflicts with them is replacement/removal material, not a styling baseline to preserve.\n'''
              memo.write_text(memo_text, encoding='utf-8')
      - name: Commit policy and remove helper
        run: |
          rm -f .github/workflows/m8-user-gates-once.yml .github/m8-user-gates-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPLEMENTATION_PROGRESS.md ILLUSTRO_DESIGN_MEMO.md .github/workflows/m8-user-gates-once.yml .github/m8-user-gates-trigger
          git commit -m 'docs: gate M8 UI sections on user review'
          git push
