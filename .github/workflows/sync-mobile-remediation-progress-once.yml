name: Sync mobile remediation progress once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-mobile-remediation-progress-once.yml'

permissions:
  contents: write

jobs:
  sync-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update canonical implementation progress
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()

          before = 'MOBILE-006 Canonical Raster Tile / History / Persistenceを全renderer backendで共通化:未完了'
          after = 'MOBILE-006 Canonical Raster Tile / History / Persistenceを全renderer backendで共通化:完了'
          if text.count(before) != 1:
              raise SystemExit('expected one incomplete MOBILE-006 progress line')
          text = text.replace(before, after, 1)

          old_memo = '再開メモ: USER-01スマホdiagnosticsではmain/workerともWebGPU `requestAdapter()` が `adapter-unavailable`。viewport幅やIllustro独自core-limit gate以前の失敗であり、MOBILE-004だけでは編集可能にならない。MOBILE-005のWebGPU非依存compatibility rendererが必須。検査は必要最低限とし、実装を優先する。'
          new_memo = '再開メモ: USER-01スマホdiagnosticsではmain/workerともWebGPU `requestAdapter()` が `adapter-unavailable`。viewport幅やIllustro独自core-limit gate以前の失敗であり、MOBILE-004だけでは編集可能にならない。MOBILE-005のWebGPU非依存compatibility rendererを実装済み。MOBILE-006ではWorker/Main WebGPUが復旧不能になった場合もcanonical Raster TileをStroke replayなしでcompatibility Canvas2Dへ引き継ぎ、History / Persistence / Exportの正本をrenderer backendから分離した。スマホPNG ExportはFile menu導線も共通handlerへ接続し、Androidの非同期download処理より先にBlob URLを破棄しないようobject URL保持を60秒へ延長した。MOBILE-007の実機確認とUSER-01の明示PASSは引き続き未完了。検査は必要最低限とし、実装を優先する。'
          if text.count(old_memo) != 1:
              raise SystemExit('expected one mobile remediation resume memo')
          text = text.replace(old_memo, new_memo, 1)
          path.write_text(text)
          PY

      - name: Commit progress and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/sync-mobile-remediation-progress-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPLEMENTATION_PROGRESS.md
          git commit -m 'chore: mark mobile renderer state unification complete'
          git push origin HEAD:main
