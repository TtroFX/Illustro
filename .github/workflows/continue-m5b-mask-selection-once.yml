name: Continue M5B mask selection conversion once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mask-selection-conversion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - name: Implement Mask Selection conversion bridge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor missing in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          Path('src/app/selection-coverage-controller.ts').write_text(r'''import type { LayerId, Revision } from '../domain/identity.js';
          import {
            createRasterMask,
            type EffectNodeV1,
            type LayerBaseV1,
            type RasterMaskAttachmentV1,
            type RasterTileReferenceV1,
            type TransformNodeV1,
          } from '../domain/layers.js';
          import type { PaintProjectSnapshotV1 } from './paint-session-controller.js';

          export interface RasterSelectionCoverageV1 {
            readonly schema: 'illustro.raster-selection-coverage/1';
            readonly defaultCoverage: 0 | 1;
            readonly tiles: readonly RasterTileReferenceV1[];
            readonly inverted: boolean;
            readonly transformStack: readonly TransformNodeV1[];
            readonly effectStack: readonly EffectNodeV1[];
            readonly sourceRevision: Revision;
          }

          export interface SelectionCoverageSnapshotV1 {
            readonly schema: 'illustro.selection-coverage-controller/1';
            readonly coverage: RasterSelectionCoverageV1 | null;
          }

          function freezeCoverage(input: RasterSelectionCoverageV1): RasterSelectionCoverageV1 {
            return Object.freeze({
              ...input,
              tiles: Object.freeze([...input.tiles]),
              transformStack: Object.freeze([...input.transformStack]),
              effectStack: Object.freeze([...input.effectStack]),
            });
          }

          export function rasterSelectionCoverageFromMaskV1(
            mask: RasterMaskAttachmentV1,
          ): RasterSelectionCoverageV1 {
            return freezeCoverage({
              schema: 'illustro.raster-selection-coverage/1',
              defaultCoverage: mask.defaultCoverage,
              tiles: mask.tiles,
              inverted: mask.inverted,
              transformStack: mask.transformStack,
              effectStack: mask.effectStack ?? Object.freeze([]),
              sourceRevision: mask.revision,
            });
          }

          export function attachRasterMaskFromSelectionSnapshotV1(
            snapshot: PaintProjectSnapshotV1,
            targetLayerId: LayerId,
            coverage: RasterSelectionCoverageV1,
            revision: Revision,
            now: Date = new Date(),
          ): PaintProjectSnapshotV1 {
            const target = snapshot.document.layerTree.layers[targetLayerId];
            if (target === undefined) throw new Error(`selection mask target layer is missing: ${targetLayerId}`);
            if (target.type === 'lineartBoundary') {
              throw new Error('Lineart Boundary layers cannot receive artwork masks');
            }
            if (target.locks.all) throw new Error('selection to mask is blocked by the layer lock');
            const base = createRasterMask({
              defaultCoverage: coverage.defaultCoverage,
              tiles: coverage.tiles,
              inverted: coverage.inverted,
              effectStack: coverage.effectStack,
            });
            const mask: RasterMaskAttachmentV1 = Object.freeze({
              ...base,
              revision,
              linkedToLayer: true,
              transformStack: Object.freeze([...coverage.transformStack]),
              effectStack: Object.freeze([...coverage.effectStack]),
              metadata: Object.freeze({
                ...base.metadata,
                'illustro.selection-conversion/1': Object.freeze({ sourceRevision: coverage.sourceRevision }),
              }),
            });
            const nextLayer = Object.freeze({
              ...target,
              revision,
              masks: Object.freeze([...target.masks, mask]),
            }) as LayerBaseV1;
            return Object.freeze({
              ...snapshot,
              document: Object.freeze({
                ...snapshot.document,
                revision,
                modifiedAt: now.toISOString(),
                layerTree: Object.freeze({
                  rootLayerIds: snapshot.document.layerTree.rootLayerIds,
                  layers: Object.freeze({
                    ...snapshot.document.layerTree.layers,
                    [targetLayerId]: nextLayer,
                  }),
                }),
              }),
              committedStrokes: snapshot.committedStrokes,
            });
          }

          export class SelectionCoverageControllerV1 {
            #coverage: RasterSelectionCoverageV1 | null = null;

            snapshot(): SelectionCoverageSnapshotV1 {
              return Object.freeze({
                schema: 'illustro.selection-coverage-controller/1' as const,
                coverage: this.#coverage,
              });
            }

            replaceFromRasterMask(mask: RasterMaskAttachmentV1): SelectionCoverageSnapshotV1 {
              this.#coverage = rasterSelectionCoverageFromMaskV1(mask);
              return this.snapshot();
            }

            replace(coverage: RasterSelectionCoverageV1): SelectionCoverageSnapshotV1 {
              this.#coverage = freezeCoverage(coverage);
              return this.snapshot();
            }

            clear(): SelectionCoverageSnapshotV1 {
              this.#coverage = null;
              return this.snapshot();
            }
          }
          ''')

          Path('tests/unit/mask-selection-conversion.test.ts').write_text(r'''import { describe, expect, it } from 'vitest';
          import {
            SelectionCoverageControllerV1,
            attachRasterMaskFromSelectionSnapshotV1,
          } from '../../src/app/selection-coverage-controller.js';
          import type { PaintProjectSnapshotV1 } from '../../src/app/paint-session-controller.js';
          import { createDocumentV1 } from '../../src/domain/document.js';
          import { parseRevision } from '../../src/domain/identity.js';
          import {
            createEffectNode,
            createRasterLayer,
            createRasterMask,
            createRasterTileReference,
            createTransformNode,
          } from '../../src/domain/layers.js';

          function fixture() {
            const tile = createRasterTileReference({ x: 2, y: 3, payloadRef: 'mask-coverage' });
            const mask = Object.freeze({
              ...createRasterMask({
                defaultCoverage: 0,
                tiles: [tile],
                inverted: true,
                effectStack: [createEffectNode('mask.feather', { radiusPx: 5 })],
              }),
              transformStack: Object.freeze([createTransformNode('affine', { matrix: [1, 0, 0, 1, 4, 8] })]),
            });
            const sourceLayer = createRasterLayer({ name: 'Source', masks: [mask] });
            const targetLayer = createRasterLayer({ name: 'Target' });
            const document = createDocumentV1({ width: 512, height: 512 });
            const snapshot: PaintProjectSnapshotV1 = Object.freeze({
              schema: 'illustro.paint-project-snapshot/1' as const,
              document: Object.freeze({
                ...document,
                layerTree: Object.freeze({
                  rootLayerIds: Object.freeze([sourceLayer.id, targetLayer.id]),
                  layers: Object.freeze({
                    [sourceLayer.id]: sourceLayer,
                    [targetLayer.id]: targetLayer,
                  }),
                }),
              }),
              committedStrokes: Object.freeze([]),
            });
            return { snapshot, mask, sourceLayer, targetLayer };
          }

          describe('M5B Mask Selection conversion', () => {
            it('converts Mask to transient Selection coverage without copying raster payloads', () => {
              const { mask } = fixture();
              const controller = new SelectionCoverageControllerV1();
              const selection = controller.replaceFromRasterMask(mask).coverage;
              expect(selection).not.toBeNull();
              expect(selection?.defaultCoverage).toBe(0);
              expect(selection?.inverted).toBe(true);
              expect(selection?.tiles).toEqual(mask.tiles);
              expect(selection?.tiles[0]?.payloadRef).toBe('mask-coverage');
              expect(selection?.transformStack).toEqual(mask.transformStack);
              expect(selection?.effectStack).toEqual(mask.effectStack);
            });

            it('converts Selection coverage back to a linked Raster Mask while preserving semantics', () => {
              const { snapshot, mask, targetLayer } = fixture();
              const controller = new SelectionCoverageControllerV1();
              const selection = controller.replaceFromRasterMask(mask).coverage;
              if (selection === null) throw new Error('expected selection coverage');
              const changed = attachRasterMaskFromSelectionSnapshotV1(
                snapshot,
                targetLayer.id,
                selection,
                parseRevision(3),
                new Date(0),
              );
              const attached = changed.document.layerTree.layers[targetLayer.id]?.masks[0];
              expect(attached?.kind).toBe('raster-mask');
              if (attached?.kind !== 'raster-mask') throw new Error('expected Raster Mask');
              expect(attached.defaultCoverage).toBe(mask.defaultCoverage);
              expect(attached.tiles).toEqual(mask.tiles);
              expect(attached.inverted).toBe(mask.inverted);
              expect(attached.transformStack).toEqual(mask.transformStack);
              expect(attached.effectStack).toEqual(mask.effectStack);
              expect(attached.linkedToLayer).toBe(true);
              expect(changed.document.revision).toBe(3);
            });

            it('clear removes only transient Selection state', () => {
              const { mask } = fixture();
              const controller = new SelectionCoverageControllerV1();
              controller.replaceFromRasterMask(mask);
              expect(controller.clear().coverage).toBeNull();
            });
          });
          ''')

          replace_once(
              'src/app/main.ts',
              "import { PaintSessionControllerV1 } from './paint-session-controller.js';",
              "import { PaintSessionControllerV1 } from './paint-session-controller.js';\nimport { SelectionCoverageControllerV1 } from './selection-coverage-controller.js';",
          )
          replace_once(
              'src/app/main.ts',
              "const paintHistory = new PaintHistoryControllerV1(paintSession);",
              "const paintHistory = new PaintHistoryControllerV1(paintSession);\nconst selectionCoverage = new SelectionCoverageControllerV1();",
          )
          replace_once(
              'src/app/main.ts',
              "  maskPaint,\n  schedule: enqueuePaintRender,",
              "  maskPaint,\n  selectionCoverage,\n  schedule: enqueuePaintRender,",
          )

          replace_once(
              'src/app/layer-workflow-controller.ts',
              "import type { PaintSessionControllerV1 } from './paint-session-controller.js';",
              "import type { PaintSessionControllerV1 } from './paint-session-controller.js';\nimport {\n  attachRasterMaskFromSelectionSnapshotV1,\n  type SelectionCoverageControllerV1,\n} from './selection-coverage-controller.js';",
          )
          replace_once(
              'src/app/layer-workflow-controller.ts',
              "  readonly maskPaint: MaskPaintControllerV1;\n  readonly schedule:",
              "  readonly maskPaint: MaskPaintControllerV1;\n  readonly selectionCoverage: SelectionCoverageControllerV1;\n  readonly schedule:",
          )
          replace_once(
              'src/app/layer-workflow-controller.ts',
              "  const maskBlurButton = required<HTMLButtonElement>('#mask-blur');",
              "  const maskBlurButton = required<HTMLButtonElement>('#mask-blur');\n  const maskToSelectionButton = required<HTMLButtonElement>('#mask-to-selection');\n  const selectionToMaskButton = required<HTMLButtonElement>('#selection-to-mask');",
          )
          replace_once(
              'src/app/layer-workflow-controller.ts',
              "    maskBlurButton.disabled = !maskCoverageEffectEnabled;\n    if (selectedRasterMask !== undefined) {",
              "    maskBlurButton.disabled = !maskCoverageEffectEnabled;\n    const selectionCoverageSnapshot = options.selectionCoverage.snapshot();\n    maskToSelectionButton.disabled = selectedRasterMask === undefined;\n    selectionToMaskButton.disabled =\n      selectionCoverageSnapshot.coverage === null ||\n      active === null ||\n      active.layer.type === 'lineartBoundary' ||\n      active.layer.locks.all;\n    root.dataset.illustroSelectionCoverage =\n      selectionCoverageSnapshot.coverage === null ? 'empty' : 'active';\n    if (selectedRasterMask !== undefined) {",
          )

          controller = Path('src/app/layer-workflow-controller.ts').read_text()
          anchor = "\n\n  let maskEffectMode: 'feather' | 'blur' = 'feather';"
          if anchor not in controller:
              raise SystemExit('mask-selection handler anchor missing')
          handlers = r'''

            const onMaskToSelection = (): void => {
              clearError();
              try {
                const target = options.maskPaint.snapshot();
                const current = options.paintSession.projectSnapshot();
                if (current === null || target.layerId === null || target.maskId === null) return;
                const layer = current.document.layerTree.layers[target.layerId];
                const mask = layer?.masks.find((entry) => entry.id === target.maskId);
                if (mask?.kind !== 'raster-mask') throw new Error('Mask→Selection requires a Raster Mask');
                options.selectionCoverage.replaceFromRasterMask(mask);
                root.dataset.illustroSelectionCoverage = 'active';
                root.dataset.illustroSelectionSourceMaskId = mask.id;
                status.value = 'マスクを選択範囲へ変換しました';
                refresh();
              } catch (error) {
                publishError(error);
              }
            };

            const onSelectionToMask = (): void => {
              clearError();
              try {
                const coverage = options.selectionCoverage.snapshot().coverage;
                const active = currentActive();
                if (coverage === null) throw new Error('Selection→Mask requires an active selection');
                if (active === null) throw new Error('Selection→Mask requires an active layer');
                commitMutation(
                  'mask.from-selection',
                  (before, revision) =>
                    attachRasterMaskFromSelectionSnapshotV1(
                      before,
                      active.id,
                      coverage,
                      revision,
                    ),
                  () => active.id,
                );
                status.value = '選択範囲からRaster Maskを作成しました';
              } catch (error) {
                publishError(error);
              }
            };
          '''
          Path('src/app/layer-workflow-controller.ts').write_text(controller.replace(anchor, handlers + anchor, 1))

          replace_once(
              'src/app/layer-workflow-controller.ts',
              "  maskBlurButton.addEventListener('click', onMaskBlur);\n  maskEffectCancel.addEventListener",
              "  maskBlurButton.addEventListener('click', onMaskBlur);\n  maskToSelectionButton.addEventListener('click', onMaskToSelection);\n  selectionToMaskButton.addEventListener('click', onSelectionToMask);\n  maskEffectCancel.addEventListener",
          )
          replace_once(
              'src/app/layer-workflow-controller.ts',
              "      maskBlurButton.removeEventListener('click', onMaskBlur);\n      maskEffectCancel.removeEventListener",
              "      maskBlurButton.removeEventListener('click', onMaskBlur);\n      maskToSelectionButton.removeEventListener('click', onMaskToSelection);\n      selectionToMaskButton.removeEventListener('click', onSelectionToMask);\n      maskEffectCancel.removeEventListener",
          )

          replace_once(
              'src/index.html',
              '<button id="mask-blur" type="button" aria-label="マスクぼかし" title="マスクぼかし" disabled>◌</button>',
              '<button id="mask-blur" type="button" aria-label="マスクぼかし" title="マスクぼかし" disabled>◌</button>\n              <button id="mask-to-selection" type="button" aria-label="マスクを選択範囲へ変換" title="Mask → Selection" disabled>M→S</button>\n              <button id="selection-to-mask" type="button" aria-label="選択範囲をマスクへ変換" title="Selection → Mask" disabled>S→M</button>',
          )

          p = Path('IMPLEMENTATION_PROGRESS.md')
          progress = p.read_text()
          progress = progress.replace('M5B-043 Mask→Selection:未完了', 'M5B-043 Mask→Selection:完了', 1)
          progress = progress.replace('M5B-044 Selection→Mask:未完了', 'M5B-044 Selection→Mask:完了', 1)
          progress = progress.replace(
              'M5B-041/042 Mask feather/blurまで完了。次はM5B-043 Mask→Selectionから再開する。',
              'M5B-043/044 Mask↔Selection conversionまで完了。次はM5B-045 Reference Layer designationから再開する。',
              1,
          )
          p.write_text(progress)
          PY
      - name: Format
        run: npm run format
      - name: Focused tests
        run: npx vitest run tests/unit/mask-selection-conversion.test.ts tests/unit/layer-mask-effects.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Verify progress
        shell: bash
        run: |
          grep -F 'M5B-043 Mask→Selection:完了' IMPLEMENTATION_PROGRESS.md
          grep -F 'M5B-044 Selection→Mask:完了' IMPLEMENTATION_PROGRESS.md
      - name: Commit checkpoint
        shell: bash
        run: |
          rm .github/workflows/continue-m5b-mask-selection-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/selection-coverage-controller.ts src/app/main.ts src/app/layer-workflow-controller.ts src/index.html tests/unit/mask-selection-conversion.test.ts IMPLEMENTATION_PROGRESS.md .github/workflows/continue-m5b-mask-selection-once.yml
          git commit -m 'feat: connect mask selection conversion bridge'
          git push origin HEAD:main
