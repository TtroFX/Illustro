name: Format M2 history foundation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m2-history-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - run: npx biome format --write src/history/history.ts src/storage/history-store.ts src/storage/opfs-layout.ts tests/unit/history.test.ts
      - name: Commit formatting and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/m2-history-format.yml
          git add src/history/history.ts src/storage/history-store.ts src/storage/opfs-layout.ts tests/unit/history.test.ts
          git commit -m 'style: format M2 history foundation [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
