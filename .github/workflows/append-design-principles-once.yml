name: Close M6A-076 once

'on':
  push:
    branches:
      - main
    paths:
      - '.github/design-principles-trigger'

permissions:
  contents: write

jobs:
  close-m6a-076:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark M6A-076 complete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          before = 'M6A-076 48-preset Default Brush Pack integration:未完了'
          after = 'M6A-076 48-preset Default Brush Pack integration:完了'
          if before in text:
              if text.count(before) != 1:
                  raise SystemExit('expected exactly one M6A-076 progress line')
              text = text.replace(before, after, 1)
              path.write_text(text)
          elif after not in text:
              raise SystemExit('M6A-076 progress line missing')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPLEMENTATION_PROGRESS.md
          if git diff --cached --quiet; then
            echo 'M6A-076 already complete.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'docs: close M6A-076 default brush pack'
          git push origin HEAD:main
