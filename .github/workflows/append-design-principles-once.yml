name: Format M7 UI shell once

on:
  push:
    branches: [main]
    paths:
      - '.github/design-principles-trigger'

permissions:
  contents: write

jobs:
  format-m7-ui-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact Biome formatting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/m7-ui-shell.ts')
          text = path.read_text()
          before = "    inspector\n      .querySelectorAll<HTMLElement>(selector)\n      .forEach((element) => {\n        destination.append(element);\n      });"
          after = "    inspector.querySelectorAll<HTMLElement>(selector).forEach((element) => {\n      destination.append(element);\n    });"
          if before in text:
              if text.count(before) != 1:
                  raise SystemExit('expected one M7 UI format target')
              path.write_text(text.replace(before, after, 1))
          elif after not in text:
              raise SystemExit('M7 UI format target missing')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/m7-ui-shell.ts
          if git diff --cached --quiet; then
            echo 'M7 UI shell format already applied.'
            exit 0
          fi
          git commit -m 'style: format M7 UI shell'
          git push origin HEAD:main
