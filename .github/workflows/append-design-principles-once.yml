name: Format illbrush once

on:
  push:
    branches: [main]
    paths:
      - '.github/design-principles-trigger'

permissions:
  contents: write

jobs:
  format-illbrush:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Canonical format
        run: npm run format
      - name: Verify formatted interchange sources
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test:unit
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/interchange/zip-v1.ts src/interchange/illbrush-v1.ts tests/unit/illbrush-v1.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Illbrush interchange sources are already canonically formatted.'
            exit 0
          fi
          git commit -m 'style: format illbrush interchange sources'
          git push origin HEAD:main
