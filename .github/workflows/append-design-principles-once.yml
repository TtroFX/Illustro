name: Generalize selection coverage default once

on:
  push:
    branches: [main]
    paths:
      - '.github/design-principles-trigger'

permissions:
  contents: write

jobs:
  generalize-selection-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generalize prepared coverage default
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/selection-shape-engine.ts')
          text = path.read_text()
          before = '  readonly defaultCoverage: 0;'
          after = '  readonly defaultCoverage: 0 | 1;'
          if before in text:
              if text.count(before) != 1:
                  raise SystemExit('prepared coverage default target is ambiguous')
              path.write_text(text.replace(before, after, 1))
          elif after not in text:
              raise SystemExit('prepared coverage default target is missing')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/selection-shape-engine.ts
          if git diff --cached --quiet; then
            echo 'Selection coverage default already generalized.'
            exit 0
          fi
          git commit -m 'refactor: generalize selection coverage default'
          git push origin HEAD:main
