name: Mark M7A shape selection complete once

on:
  push:
    branches: [main]
    paths:
      - '.github/design-principles-trigger'

permissions:
  contents: write

jobs:
  mark-m7a-shapes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Mark M7A-001 through M7A-005 complete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          replacements = {
              'M7A-001 rectangular selection:未完了': 'M7A-001 rectangular selection:完了',
              'M7A-002 elliptical selection:未完了': 'M7A-002 elliptical selection:完了',
              'M7A-003 Lasso selection:未完了': 'M7A-003 Lasso selection:完了',
              'M7A-004 freehand selection:未完了': 'M7A-004 freehand selection:完了',
              'M7A-005 brush-painted selection:未完了': 'M7A-005 brush-painted selection:完了',
          }
          changed = False
          for before, after in replacements.items():
              if before in text:
                  if text.count(before) != 1:
                      raise SystemExit(f'expected one progress line: {before}')
                  text = text.replace(before, after, 1)
                  changed = True
              elif after not in text:
                  raise SystemExit(f'progress line missing: {before}')
          if changed:
              path.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPLEMENTATION_PROGRESS.md
          if git diff --cached --quiet; then
            echo 'M7A shape progress already complete.'
            exit 0
          fi
          git commit -m 'chore: close M7A selection shapes'
          git push origin HEAD:main
