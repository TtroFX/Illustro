name: Mark phone UX remediation complete once

on:
  push:
    branches: [main]
    paths:
      - '.github/design-principles-trigger'

permissions:
  contents: write

jobs:
  mark-phone-ux-remediation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark implemented phone UX items complete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          replacements = {
              'MOBILE-008 phone single-finger draw → multi-touch navigation arbitration:未完了':
                  'MOBILE-008 phone single-finger draw → multi-touch navigation arbitration:完了',
              'MOBILE-009 smartphone Canvas First operation shell（compact top / bottom actions / Inspector sheet）:未完了':
                  'MOBILE-009 smartphone Canvas First operation shell（compact top / bottom actions / Inspector sheet）:完了',
              'MOBILE-010 smartphone safe-area・44px touch target responsive hardening:未完了':
                  'MOBILE-010 smartphone safe-area・44px touch target responsive hardening:完了',
          }
          changed = False
          for before, after in replacements.items():
              if before in text:
                  if text.count(before) != 1:
                      raise SystemExit(f'expected one progress line: {before}')
                  text = text.replace(before, after, 1)
                  changed = True
              elif after not in text:
                  raise SystemExit(f'progress line missing: {before}')
          if changed:
              path.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPLEMENTATION_PROGRESS.md
          if git diff --cached --quiet; then
            echo 'Phone UX implementation progress already complete.'
            exit 0
          fi
          git commit -m 'chore: mark phone drawing UX remediation complete'
          git push origin HEAD:main
