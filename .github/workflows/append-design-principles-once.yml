name: Mark USER-02 complete once

on:
  push:
    branches: [main]
    paths:
      - '.github/design-principles-trigger'

permissions:
  contents: write

jobs:
  mark-user-02:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Mark USER-02 complete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          before = 'USER-02 Layer・Color・Blend・Brush Engine・48 Brushes・筆圧傾き・ibis/CSP brush importユーザー確認PASS:未完了'
          after = 'USER-02 Layer・Color・Blend・Brush Engine・48 Brushes・筆圧傾き・ibis/CSP brush importユーザー確認PASS:完了'
          if before in text:
              if text.count(before) != 1:
                  raise SystemExit('USER-02 progress line is ambiguous')
              path.write_text(text.replace(before, after, 1))
          elif after not in text:
              raise SystemExit('USER-02 progress line is missing')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPLEMENTATION_PROGRESS.md
          if git diff --cached --quiet; then
            echo 'USER-02 already complete.'
            exit 0
          fi
          git commit -m 'chore: mark USER-02 complete'
          git push origin HEAD:main
