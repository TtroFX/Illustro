name: Repair M6A completion gate once

on:
  push:
    branches: [main]
    paths:
      - '.github/design-principles-trigger'

permissions:
  contents: write

jobs:
  repair-m6a-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair stale completion assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-m6a-brush.mjs')
          text = path.read_text()
          before = """requireText(
            progress,
            'M6A-PERF-001 incremental active-stroke rendering（stable prefix + bounded mutable tail）:未完了',
            'performance gate must remain separately incomplete',
          );
          """
          after = """for (const line of [
            'M6A-PERF-001 incremental active-stroke rendering（stable prefix + bounded mutable tail）:完了',
            'M6A-PERF-002 retained tile/dirty-region presentation（normal hot pathでwhole-stroke/whole-history replay禁止）:完了',
            'M6A-PERF-003 incremental GPU/transfer submission（累積stroke比例の毎回allocate/copy/destroy禁止）:完了',
            'M6A-PERF-004 long-stroke scaling workload verification:完了',
            'M6A-検査 M6A内部検査:完了',
          ]) {
            requireText(progress, line, `M6A completion marker missing: ${line}`);
          }
          """
          if before not in text:
              if after.strip() in text:
                  raise SystemExit(0)
              raise SystemExit('stale M6A completion assertion not found')
          path.write_text(text.replace(before, after, 1))
          PY
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Format and verify
        run: |
          npm run format
          npm run format:check
          npm run verify:m6a
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-m6a-brush.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'M6A completion gate already repaired.'
            exit 0
          fi
          git commit -m 'test: align M6A gate with completed performance work'
          git push origin HEAD:main
