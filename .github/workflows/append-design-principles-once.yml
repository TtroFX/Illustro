name: Repair phone shell lint once

on:
  push:
    branches: [main]
    paths:
      - '.github/design-principles-trigger'

permissions:
  contents: write

jobs:
  repair-phone-shell-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove unsupported span aria-label
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/index.html')
          text = path.read_text()
          before = '<span class="shell-mobile-draw-mode" aria-label="1本指で描画、2本指でキャンバス操作" title="1本指: 描画 / 2本指: 移動・拡大・回転">'
          after = '<span class="shell-mobile-draw-mode" title="1本指: 描画 / 2本指: 移動・拡大・回転">'
          if before in text:
              path.write_text(text.replace(before, after, 1))
          elif after not in text:
              raise SystemExit('phone draw-mode markup not found')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.html
          if git diff --cached --quiet; then
            echo 'Phone shell lint repair already applied.'
            exit 0
          fi
          git commit -m 'fix: repair phone shell accessibility markup'
          git push origin HEAD:main
