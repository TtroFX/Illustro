name: Append mobile support supersession once

on:
  push:
    branches: [main]
    paths:
      - '.github/design-principles-trigger'

permissions:
  contents: write

jobs:
  append-mobile-support-supersession:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record authoritative mobile editor target
        shell: bash
        env:
          MEMO_PAYLOAD: 
          PROGRESS_PAYLOAD: 
        run: |
          set -euo pipefail
          memo_marker='## Mobile full-editor target supersession — 2026-09-02'
          progress_marker='### USER-01 mobile compatibility remediation — 2026-09-02'
          changed=0
          if ! grep -Fq "$memo_marker" ILLUSTRO_DESIGN_MEMO.md; then
            printf '%s' "$MEMO_PAYLOAD" | base64 --decode >> ILLUSTRO_DESIGN_MEMO.md
            changed=1
          fi
          if ! grep -Fq "$progress_marker" IMPLEMENTATION_PROGRESS.md; then
            printf '%s' "$PROGRESS_PAYLOAD" | base64 --decode >> IMPLEMENTATION_PROGRESS.md
            changed=1
          fi
          if [ "$changed" -eq 0 ]; then
            echo 'Mobile support supersession already recorded; no change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ILLUSTRO_DESIGN_MEMO.md IMPLEMENTATION_PROGRESS.md
          git commit -m 'docs: make phone full editor support authoritative'
          git push origin HEAD:main
