name: Fix M7 UI shell lint once

on:
  push:
    branches: [main]
    paths:
      - '.github/design-principles-trigger'

permissions:
  contents: write

jobs:
  fix-m7-ui-shell-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact M7 UI shell lint fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/m7-ui-shell.ts')
          text = path.read_text()
          before = '.forEach((element) => destination.append(element));'
          after = '.forEach((element) => {\n        destination.append(element);\n      });'
          if before in text:
              if text.count(before) != 1:
                  raise SystemExit('expected one M7 UI lint target')
              path.write_text(text.replace(before, after, 1))
          elif after not in text:
              raise SystemExit('M7 UI lint target missing')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/m7-ui-shell.ts
          if git diff --cached --quiet; then
            echo 'M7 UI shell lint fix already applied.'
            exit 0
          fi
          git commit -m 'fix: satisfy M7 UI shell lint'
          git push origin HEAD:main
