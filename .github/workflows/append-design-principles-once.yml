name: Close M6B ibis parser and QR decode once

on:
  push:
    branches: [main]
    paths:
      - '.github/design-principles-trigger'

permissions:
  contents: write

jobs:
  close-ibis-parser-qr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close verified ibis parser and QR decoder
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          replacements = {
              'M6B-005 ibisPaint custom brush parser:未完了': 'M6B-005 ibisPaint custom brush parser:完了',
              'M6B-006 ibisPaint brush QR carrier decode:未完了': 'M6B-006 ibisPaint brush QR carrier decode:完了',
          }
          changed = False
          for before, after in replacements.items():
              if before in text:
                  if text.count(before) != 1:
                      raise SystemExit(f'expected one progress line: {before}')
                  text = text.replace(before, after, 1)
                  changed = True
              elif after not in text:
                  raise SystemExit(f'progress line missing: {before}')
          if changed:
              path.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPLEMENTATION_PROGRESS.md
          if git diff --cached --quiet; then
            echo 'M6B-005/006 already complete.'
            exit 0
          fi
          git commit -m 'docs: close ibis parser and QR carrier decode'
          git push origin HEAD:main
