name: Close M6A performance once

on:
  push:
    branches: [main]
    paths:
      - '.github/design-principles-trigger'

permissions:
  contents: write

jobs:
  close-m6a-performance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Close verified M6A performance items
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          replacements = {
              'M6A-PERF-001 incremental active-stroke rendering（stable prefix + bounded mutable tail）:未完了':
                  'M6A-PERF-001 incremental active-stroke rendering（stable prefix + bounded mutable tail）:完了',
              'M6A-PERF-002 retained tile/dirty-region presentation（normal hot pathでwhole-stroke/whole-history replay禁止）:未完了':
                  'M6A-PERF-002 retained tile/dirty-region presentation（normal hot pathでwhole-stroke/whole-history replay禁止）:完了',
              'M6A-PERF-003 incremental GPU/transfer submission（累積stroke比例の毎回allocate/copy/destroy禁止）:未完了':
                  'M6A-PERF-003 incremental GPU/transfer submission（累積stroke比例の毎回allocate/copy/destroy禁止）:完了',
              'M6A-PERF-004 long-stroke scaling workload verification:未完了':
                  'M6A-PERF-004 long-stroke scaling workload verification:完了',
              'M6A-検査 M6A内部検査:未完了':
                  'M6A-検査 M6A内部検査:完了',
          }
          changed = False
          for before, after in replacements.items():
              if before in text:
                  if text.count(before) != 1:
                      raise SystemExit(f'expected one progress line: {before}')
                  text = text.replace(before, after, 1)
                  changed = True
              elif after not in text:
                  raise SystemExit(f'progress line missing: {before}')
          if changed:
              path.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPLEMENTATION_PROGRESS.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'M6A performance progress already complete.'
            exit 0
          fi
          git commit -m 'docs: close M6A performance and inspection'
          git push origin HEAD:main
