name: Close M6B-008 once

on:
  push:
    branches: [main]
    paths:
      - '.github/design-principles-trigger'

permissions:
  contents: write

jobs:
  close-m6b-008:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close verified CSP SUT parser progress
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          before = 'M6B-008 CSP `.sut` parser:未完了'
          after = 'M6B-008 CSP `.sut` parser:完了'
          if before in text:
              if text.count(before) != 1:
                  raise SystemExit('expected exactly one M6B-008 progress line')
              path.write_text(text.replace(before, after, 1))
          elif after not in text:
              raise SystemExit('M6B-008 progress line missing')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPLEMENTATION_PROGRESS.md
          if git diff --cached --quiet; then
            echo 'M6B-008 already complete.'
            exit 0
          fi
          git commit -m 'chore: close M6B-008'
          git push origin HEAD:main
