name: Mark M7A region selection complete once

on:
  push:
    branches: [main]
    paths:
      - '.github/design-principles-trigger'

permissions:
  contents: write

jobs:
  mark-m7a-region:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Mark M7A-006 through M7A-011 complete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          replacements = {
              'M7A-006 Magic Wand/Auto Select:未完了': 'M7A-006 Magic Wand/Auto Select:完了',
              'M7A-007 color-range selection:未完了': 'M7A-007 color-range selection:完了',
              'M7A-008 selection Replace mode:未完了': 'M7A-008 selection Replace mode:完了',
              'M7A-009 selection Add mode:未完了': 'M7A-009 selection Add mode:完了',
              'M7A-010 selection Subtract mode:未完了': 'M7A-010 selection Subtract mode:完了',
              'M7A-011 selection Intersect mode:未完了': 'M7A-011 selection Intersect mode:完了',
          }
          changed = False
          for before, after in replacements.items():
              if before in text:
                  if text.count(before) != 1:
                      raise SystemExit(f'expected one progress line: {before}')
                  text = text.replace(before, after, 1)
                  changed = True
              elif after not in text:
                  raise SystemExit(f'progress line missing: {before}')
          if changed:
              path.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPLEMENTATION_PROGRESS.md
          if git diff --cached --quiet; then
            echo 'M7A region progress already complete.'
            exit 0
          fi
          git commit -m 'chore: close M7A region selection batch'
          git push origin HEAD:main
