name: Close M6B-003 and M6B-004 once

on:
  push:
    branches: [main]
    paths:
      - '.github/design-principles-trigger'

permissions:
  contents: write

jobs:
  close-native-brush-interchange:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Close verified native import export items
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          replacements = {
              'M6B-003 Illustro brush import:未完了': 'M6B-003 Illustro brush import:完了',
              'M6B-004 Illustro brush export:未完了': 'M6B-004 Illustro brush export:完了',
          }
          for before, after in replacements.items():
              if before in text:
                  if text.count(before) != 1:
                      raise SystemExit(f'expected one progress line: {before}')
                  text = text.replace(before, after, 1)
              elif after not in text:
                  raise SystemExit(f'progress line missing: {before}')
          path.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPLEMENTATION_PROGRESS.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'M6B-003/004 already complete.'
            exit 0
          fi
          git commit -m 'docs: close M6B native brush import and export'
          git push origin HEAD:main
