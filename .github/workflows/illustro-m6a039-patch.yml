name: Illustro one-shot M6A-039 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/illustro-m6a039-patch.py'
      - '.github/workflows/illustro-m6a039-patch.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply M6A-039 texture-rotation patch
        run: python .github/illustro-m6a039-patch.py
      - name: Format changed TypeScript and verifier
        run: >-
          npx biome format --write
          src/domain/brush-schema.ts
          src/app/paint-session-controller.ts
          src/app/brush-preset-library.ts
          src/app/brush-preset-controller.ts
          tests/unit/brush-texture-rotation.test.ts
          scripts/verify-m6a-brush.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted regression tests
        run: >-
          npx vitest run
          tests/unit/brush-texture-rotation.test.ts
          tests/unit/brush-texture-scale.test.ts
          tests/unit/brush-texture-strength.test.ts
          tests/unit/brush-paper-texture-selection.test.ts
          tests/unit/brush-grain-selection.test.ts
          tests/unit/brush-preset-library.test.ts
          tests/unit/paint-session-controller.test.ts
          tests/unit/canonical-raster-brush.test.ts
          tests/unit/baseline-raster-tile-store.test.ts
          tests/unit/baseline-paint-renderer.test.ts
      - name: M6A verification
        run: npm run verify:m6a
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/illustro-m6a039-patch.py
          rm -f .github/workflows/illustro-m6a039-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: implement M6A texture rotation"
          git push origin HEAD:main
