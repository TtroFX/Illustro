name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Capture checked out identity
        run: echo "ILLUSTRO_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi
          npm ci --ignore-scripts
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Production build
        env:
          ILLUSTRO_BUILD_MODE: production
        run: npm run build
      - name: Integration tests
        run: npm run test:integration
      - name: Report verified identity
        run: |
          echo "verified_sha=${ILLUSTRO_BUILD_SHA}"
          node -e "const fs=require('fs'); const b=JSON.parse(fs.readFileSync('dist/build-info.json','utf8')); if (b.buildSha !== process.env.ILLUSTRO_BUILD_SHA) process.exit(1); console.log(JSON.stringify(b));"
      - uses: actions/upload-artifact@v4
        with:
          name: illustro-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
