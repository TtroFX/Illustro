name: Temporary M9A formatter

on:
  push:
    branches: [feature/m9a-local-project-library]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - run: npm run format
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/local-project-library-controller.ts tests/unit/local-project-library-controller.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore: format M9A changes"
            git push
          fi
