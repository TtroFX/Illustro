name: Close M7A024 once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Mark M7A-024 complete
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('IMPLEMENTATION_PROGRESS.md')
          s = p.read_text()
          old = 'M7A-024 selection-scoped fill:未完了'
          new = 'M7A-024 selection-scoped fill:完了'
          if old not in s:
              if new in s:
                  raise SystemExit(0)
              raise SystemExit('M7A-024 progress line not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit progress
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPLEMENTATION_PROGRESS.md
          git commit -m 'chore: close M7A-024 selection fill'
          git push
