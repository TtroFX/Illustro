name: Record M0.5 preview verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m0-5-preview-verification.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Record verified M0.5 preview items
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text(encoding='utf-8')
          items = [
              'M0.5-001 HTTPS deployment基盤',
              'M0.5-003 Preview deployment target作成',
              'M0.5-005 branch/commit Preview deployment',
              'M0.5-007 COOP header構成',
              'M0.5-008 COEP header構成',
              'M0.5-009 cross-origin isolation対応asset配信',
              'M0.5-010 critical asset self-hosting',
              'M0.5-011 公開版build SHA表示',
              'M0.5-012 公開版diagnostics入口',
              'M0.5-013 secure-context runtime確認導線',
              'M0.5-014 PreviewからPWA manifest取得可能化',
          ]
          for item in items:
              old = f'{item}:未完了'
              new = f'{item}:完了'
              if old not in text and new not in text:
                  raise SystemExit(f'missing progress item: {item}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit verified progress
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add IMPLEMENTATION_PROGRESS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: record M0.5 preview verification [skip ci]'
          git push origin HEAD:main
