name: Temporary M6A Eraser Integration

on:
  push:
    branches: [work/m6a-eraser-integration-20260902]

permissions:
  contents: write

jobs:
  integrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/m6a-eraser-integration-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Import verified Eraser production files
        run: |
          git fetch origin e62c307c932c7d567783dc5b8910c704bdd8430c
          git checkout e62c307c932c7d567783dc5b8910c704bdd8430c -- \
            public/app-shell.css \
            scripts/verify-m5d-color.mjs \
            scripts/verify-m6a-brush.mjs \
            src/app/canonical-raster-brush.ts \
            src/app/main.ts \
            src/app/paint-session-controller.ts \
            src/app/renderer-controller.ts \
            src/gpu/baseline-brush.ts \
            src/gpu/baseline-paint-renderer.ts \
            src/gpu/baseline-raster-tile-store.ts \
            src/index.html \
            src/workers/render.worker.ts \
            tests/unit/canonical-raster-brush.test.ts \
            tests/unit/eraser-mode.test.ts
      - name: Merge canonical docs onto latest main base
        run: |
          python - <<'PY'
          from pathlib import Path

          progress_path = Path('IMPLEMENTATION_PROGRESS.md')
          progress = progress_path.read_text()
          old = 'M6A-002 Eraser mode:未完了'
          new = 'M6A-002 Eraser mode:完了'
          if old not in progress and new not in progress:
              raise RuntimeError('M6A-002 progress marker missing')
          if old in progress:
              progress = progress.replace(old, new, 1)
          memo = ('再開メモ: M6A-002 Eraser modeはRaster Brushと同じ増分dab geometryを共有し、'
                  'canonical Raster Tile上でactive layerのalphaをdestination-out相当で削る。'
                  'flatten済みsceneを直接消さず、影響Tileのみ再compositeして下層レイヤーを正しく露出する。'
                  'Worker/Main/Canvas2D fallback・stroke永続化/旧raster互換・Tile差分Undo/Redoへoperationを接続し、'
                  'Primary Tool RailからBrush/Eraserを48pxボタンで切替可能。次はM6A-003 Smudge/Finger modeから再開する。')
          if memo not in progress:
              marker = new + '\nM6A-003 Smudge/Finger mode:未完了'
              if marker not in progress:
                  raise RuntimeError('M6A-003 insertion marker missing')
              progress = progress.replace(marker, new + '\n' + memo + '\nM6A-003 Smudge/Finger mode:未完了', 1)
          progress_path.write_text(progress)

          design_path = Path('ILLUSTRO_DESIGN_MEMO.md')
          design = design_path.read_text()
          heading = '### 2026-09-02 — M6A Eraser compositing semantics'
          if heading not in design:
              design += '''\n\n### 2026-09-02 — M6A Eraser compositing semantics\n\n- Canonical Eraser is an alpha-removal operation on the targeted Raster Layer, never a white-paint approximation.\n- Eraser shares Raster Brush geometry/spacing and the incremental confirmed-sample path, but its canonical pixel operation reduces destination alpha by brush coverage while preserving surviving RGB values.\n- Because the visible retained scene is a composite of multiple layers, erasing the flattened presentation directly is incorrect: it would punch through lower layers. Eraser therefore mutates only the active layer's canonical Raster Tiles and recomposites/presents only affected tile coordinates so lower layers are revealed correctly.\n- Erasing an already-transparent/unallocated tile is a no-op and must not allocate a canonical tile or history payload.\n'''
          design_path.write_text(design)
          PY
      - name: Formatting
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Prepare generated assets
        run: npm run prepare:generated
      - name: Focused Eraser tests
        run: npx vitest run tests/unit/eraser-mode.test.ts tests/unit/canonical-raster-brush.test.ts tests/unit/baseline-paint-renderer.test.ts tests/unit/paint-session-controller.test.ts tests/unit/paint-raster-tile-bridge.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: M5D compatibility inspection
        run: npm run verify:m5d
      - name: M6A contract inspection
        run: npm run verify:m6a
      - name: Full unit suite
        run: npm run test:unit
      - name: Production build
        env:
          ILLUSTRO_BUILD_MODE: production
        run: npm run build
      - name: Integration tests
        run: npm run test:integration
      - name: Persist clean verified integration tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-m6a-eraser-integration.yml
          git add \
            ILLUSTRO_DESIGN_MEMO.md \
            IMPLEMENTATION_PROGRESS.md \
            public/app-shell.css \
            scripts/verify-m5d-color.mjs \
            scripts/verify-m6a-brush.mjs \
            src/app/canonical-raster-brush.ts \
            src/app/main.ts \
            src/app/paint-session-controller.ts \
            src/app/renderer-controller.ts \
            src/gpu/baseline-brush.ts \
            src/gpu/baseline-paint-renderer.ts \
            src/gpu/baseline-raster-tile-store.ts \
            src/index.html \
            src/workers/render.worker.ts \
            tests/unit/canonical-raster-brush.test.ts \
            tests/unit/eraser-mode.test.ts
          git commit -m "feat: integrate M6A Eraser mode"
          git push origin HEAD:work/m6a-eraser-integration-20260902
