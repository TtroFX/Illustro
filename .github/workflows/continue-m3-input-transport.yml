name: Continue M3 input transport

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continue-m3-input-transport.yml'

permissions:
  contents: write

jobs:
  implement-verify-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - name: Implement bounded input transport
        run: |
          python - <<'PY'
          from pathlib import Path
          
          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one marker, found {count}')
              return text.replace(old, new, 1)
          
          files = {
              'src/input/input-queue.ts': "import type { PointerInputBatchV1, PointerInputSampleV1 } from './pointer-input.js';\n\nexport const DEFAULT_POINTER_INPUT_QUEUE_CAPACITY_V1 = 256;\n\nexport interface PointerInputQueueSnapshotV1 {\n  readonly schema: 'illustro.pointer-input-queue/1';\n  readonly capacity: number;\n  readonly size: number;\n  readonly enqueued: number;\n  readonly dropped: number;\n  readonly coalesced: number;\n}\n\nfunction isHighFrequencyUpdate(sample: PointerInputSampleV1): boolean {\n  return sample.eventType === 'pointermove' || sample.eventType === 'pointerrawupdate';\n}\n\nfunction canCoalesce(previous: PointerInputSampleV1, incoming: PointerInputSampleV1): boolean {\n  return (\n    previous.pointerId === incoming.pointerId &&\n    isHighFrequencyUpdate(previous) &&\n    isHighFrequencyUpdate(incoming)\n  );\n}\n\nexport class BoundedPointerInputQueueV1 {\n  readonly #capacity: number;\n  readonly #items: PointerInputSampleV1[] = [];\n  #enqueued = 0;\n  #dropped = 0;\n  #coalesced = 0;\n\n  constructor(capacity = DEFAULT_POINTER_INPUT_QUEUE_CAPACITY_V1) {\n    if (!Number.isSafeInteger(capacity) || capacity < 1) {\n      throw new RangeError('pointer input queue capacity must be a positive safe integer');\n    }\n    this.#capacity = capacity;\n  }\n\n  get size(): number {\n    return this.#items.length;\n  }\n\n  enqueue(sample: PointerInputSampleV1): void {\n    this.#enqueued += 1;\n    if (this.#items.length < this.#capacity) {\n      this.#items.push(sample);\n      return;\n    }\n\n    if (isHighFrequencyUpdate(sample)) {\n      for (let index = this.#items.length - 1; index >= 0; index -= 1) {\n        const previous = this.#items[index];\n        if (previous !== undefined && canCoalesce(previous, sample)) {\n          this.#items[index] = sample;\n          this.#coalesced += 1;\n          return;\n        }\n      }\n    }\n\n    const expendableIndex = this.#items.findIndex(isHighFrequencyUpdate);\n    if (expendableIndex >= 0) {\n      this.#items.splice(expendableIndex, 1);\n    } else {\n      this.#items.shift();\n    }\n    this.#dropped += 1;\n    this.#items.push(sample);\n  }\n\n  enqueueBatch(batch: PointerInputBatchV1): void {\n    for (const sample of batch.confirmed) this.enqueue(sample);\n  }\n\n  drain(maxCount = this.#items.length): readonly PointerInputSampleV1[] {\n    if (!Number.isSafeInteger(maxCount) || maxCount < 0) {\n      throw new RangeError('pointer input drain count must be a non-negative safe integer');\n    }\n    if (maxCount === 0 || this.#items.length === 0) return Object.freeze([]);\n    return Object.freeze(this.#items.splice(0, Math.min(maxCount, this.#items.length)));\n  }\n\n  snapshot(): PointerInputQueueSnapshotV1 {\n    return Object.freeze({\n      schema: 'illustro.pointer-input-queue/1' as const,\n      capacity: this.#capacity,\n      size: this.#items.length,\n      enqueued: this.#enqueued,\n      dropped: this.#dropped,\n      coalesced: this.#coalesced,\n    });\n  }\n}\n",
              'src/input/input-transport.ts': "import { BoundedPointerInputQueueV1 } from './input-queue.js';\nimport type {\n  PointerInputBatchV1,\n  PointerInputEventTypeV1,\n  PointerInputSampleV1,\n  PointerInputSourceV1,\n  PointerSampleOriginV1,\n} from './pointer-input.js';\n\nexport const POINTER_INPUT_RECORD_STRIDE_V1 = 22;\nexport const DEFAULT_POINTER_SHARED_RING_CAPACITY_V1 = 256;\n\nconst HEADER_WRITE_INDEX = 0;\nconst HEADER_READ_INDEX = 1;\nconst HEADER_COUNT_INDEX = 2;\nconst HEADER_LENGTH = 3;\n\nconst SOURCE_CODES: Readonly<Record<PointerInputSourceV1, number>> = Object.freeze({\n  unknown: 0,\n  pen: 1,\n  touch: 2,\n  mouse: 3,\n});\n\nconst EVENT_CODES: Readonly<Record<PointerInputEventTypeV1, number>> = Object.freeze({\n  pointerdown: 0,\n  pointermove: 1,\n  pointerup: 2,\n  pointercancel: 3,\n  pointerrawupdate: 4,\n});\n\nconst ORIGIN_CODES: Readonly<Record<PointerSampleOriginV1, number>> = Object.freeze({\n  direct: 0,\n  coalesced: 1,\n  predicted: 2,\n});\n\nfunction sourceFromCode(code: number): PointerInputSourceV1 {\n  if (code === 1) return 'pen';\n  if (code === 2) return 'touch';\n  if (code === 3) return 'mouse';\n  return 'unknown';\n}\n\nfunction eventTypeFromCode(code: number): PointerInputEventTypeV1 {\n  if (code === 0) return 'pointerdown';\n  if (code === 1) return 'pointermove';\n  if (code === 2) return 'pointerup';\n  if (code === 3) return 'pointercancel';\n  if (code === 4) return 'pointerrawupdate';\n  throw new RangeError(`unsupported pointer event code: ${code}`);\n}\n\nfunction originFromCode(code: number): PointerSampleOriginV1 {\n  if (code === 0) return 'direct';\n  if (code === 1) return 'coalesced';\n  if (code === 2) return 'predicted';\n  throw new RangeError(`unsupported pointer origin code: ${code}`);\n}\n\nexport function writePointerSampleRecordV1(\n  view: Float64Array,\n  offset: number,\n  sample: PointerInputSampleV1,\n): void {\n  if (!Number.isSafeInteger(offset) || offset < 0 || offset + POINTER_INPUT_RECORD_STRIDE_V1 > view.length) {\n    throw new RangeError('pointer sample record offset is outside the destination view');\n  }\n  view[offset] = sample.sequence;\n  view[offset + 1] = sample.pointerId;\n  view[offset + 2] = SOURCE_CODES[sample.source];\n  view[offset + 3] = EVENT_CODES[sample.eventType];\n  view[offset + 4] = ORIGIN_CODES[sample.origin];\n  view[offset + 5] = sample.isPrimary ? 1 : 0;\n  view[offset + 6] = sample.timestampMs;\n  view[offset + 7] = sample.clientX;\n  view[offset + 8] = sample.clientY;\n  view[offset + 9] = sample.surfaceX;\n  view[offset + 10] = sample.surfaceY;\n  view[offset + 11] = sample.pressure;\n  view[offset + 12] = sample.tangentialPressure;\n  view[offset + 13] = sample.tiltX;\n  view[offset + 14] = sample.tiltY;\n  view[offset + 15] = sample.twist;\n  view[offset + 16] = sample.altitudeAngle ?? Number.NaN;\n  view[offset + 17] = sample.azimuthAngle ?? Number.NaN;\n  view[offset + 18] = sample.contactWidth;\n  view[offset + 19] = sample.contactHeight;\n  view[offset + 20] = sample.buttons;\n  view[offset + 21] = sample.button;\n}\n\nexport function readPointerSampleRecordV1(\n  view: Float64Array,\n  offset: number,\n): PointerInputSampleV1 {\n  if (!Number.isSafeInteger(offset) || offset < 0 || offset + POINTER_INPUT_RECORD_STRIDE_V1 > view.length) {\n    throw new RangeError('pointer sample record offset is outside the source view');\n  }\n  const altitude = view[offset + 16];\n  const azimuth = view[offset + 17];\n  return Object.freeze({\n    schema: 'illustro.pointer-sample/1' as const,\n    sequence: Math.max(0, Math.trunc(view[offset] ?? 0)),\n    pointerId: Math.max(0, Math.trunc(view[offset + 1] ?? 0)),\n    source: sourceFromCode(Math.trunc(view[offset + 2] ?? 0)),\n    eventType: eventTypeFromCode(Math.trunc(view[offset + 3] ?? -1)),\n    origin: originFromCode(Math.trunc(view[offset + 4] ?? -1)),\n    isPrimary: (view[offset + 5] ?? 0) !== 0,\n    timestampMs: Math.max(0, view[offset + 6] ?? 0),\n    clientX: view[offset + 7] ?? 0,\n    clientY: view[offset + 8] ?? 0,\n    surfaceX: view[offset + 9] ?? 0,\n    surfaceY: view[offset + 10] ?? 0,\n    pressure: view[offset + 11] ?? 0,\n    tangentialPressure: view[offset + 12] ?? 0,\n    tiltX: view[offset + 13] ?? 0,\n    tiltY: view[offset + 14] ?? 0,\n    twist: view[offset + 15] ?? 0,\n    altitudeAngle: altitude === undefined || Number.isNaN(altitude) ? null : altitude,\n    azimuthAngle: azimuth === undefined || Number.isNaN(azimuth) ? null : azimuth,\n    contactWidth: view[offset + 18] ?? 0,\n    contactHeight: view[offset + 19] ?? 0,\n    buttons: Math.max(0, Math.trunc(view[offset + 20] ?? 0)),\n    button: Math.trunc(view[offset + 21] ?? -1),\n  });\n}\n\nexport function encodePointerSamplesV1(samples: readonly PointerInputSampleV1[]): ArrayBuffer {\n  const buffer = new ArrayBuffer(\n    samples.length * POINTER_INPUT_RECORD_STRIDE_V1 * Float64Array.BYTES_PER_ELEMENT,\n  );\n  const view = new Float64Array(buffer);\n  samples.forEach((sample, index) => {\n    writePointerSampleRecordV1(view, index * POINTER_INPUT_RECORD_STRIDE_V1, sample);\n  });\n  return buffer;\n}\n\nexport function decodePointerSamplesV1(\n  buffer: ArrayBuffer,\n  count: number,\n): readonly PointerInputSampleV1[] {\n  if (!Number.isSafeInteger(count) || count < 0) {\n    throw new RangeError('pointer sample count must be a non-negative safe integer');\n  }\n  const requiredBytes = count * POINTER_INPUT_RECORD_STRIDE_V1 * Float64Array.BYTES_PER_ELEMENT;\n  if (buffer.byteLength < requiredBytes) {\n    throw new RangeError('pointer sample buffer is shorter than the declared count');\n  }\n  const view = new Float64Array(buffer, 0, count * POINTER_INPUT_RECORD_STRIDE_V1);\n  const samples: PointerInputSampleV1[] = [];\n  for (let index = 0; index < count; index += 1) {\n    samples.push(readPointerSampleRecordV1(view, index * POINTER_INPUT_RECORD_STRIDE_V1));\n  }\n  return Object.freeze(samples);\n}\n\nexport type PointerInputTransportModeV1 = 'shared-memory' | 'transferable';\n\nexport interface PointerInputTransportTargetV1 {\n  postMessage(message: unknown, transfer?: Transferable[]): void;\n}\n\nexport interface PointerInputTransportOptionsV1 {\n  readonly sharedMemoryFastPath: boolean;\n  readonly queueCapacity?: number;\n  readonly sharedRingCapacity?: number;\n}\n\nexport interface PointerInputTransportSnapshotV1 {\n  readonly schema: 'illustro.pointer-input-transport/1';\n  readonly mode: PointerInputTransportModeV1;\n  readonly queue: ReturnType<BoundedPointerInputQueueV1['snapshot']>;\n  readonly sentSamples: number;\n  readonly sentMessages: number;\n  readonly sharedPendingSamples: number;\n}\n\nexport class PointerInputTransportV1 {\n  readonly #target: PointerInputTransportTargetV1;\n  readonly #queue: BoundedPointerInputQueueV1;\n  readonly #mode: PointerInputTransportModeV1;\n  readonly #sharedCapacity: number;\n  #sharedHeader: Int32Array | null = null;\n  #sharedData: Float64Array | null = null;\n  #disposed = false;\n  #sentSamples = 0;\n  #sentMessages = 0;\n\n  constructor(target: PointerInputTransportTargetV1, options: PointerInputTransportOptionsV1) {\n    this.#target = target;\n    this.#queue = new BoundedPointerInputQueueV1(options.queueCapacity);\n    const sharedMemoryAvailable =\n      options.sharedMemoryFastPath &&\n      typeof SharedArrayBuffer !== 'undefined' &&\n      typeof Atomics !== 'undefined';\n    this.#mode = sharedMemoryAvailable ? 'shared-memory' : 'transferable';\n    const requestedCapacity = options.sharedRingCapacity ?? DEFAULT_POINTER_SHARED_RING_CAPACITY_V1;\n    if (!Number.isSafeInteger(requestedCapacity) || requestedCapacity < 1) {\n      throw new RangeError('pointer shared ring capacity must be a positive safe integer');\n    }\n    this.#sharedCapacity = requestedCapacity;\n\n    if (this.#mode === 'shared-memory') {\n      const headerBuffer = new SharedArrayBuffer(Int32Array.BYTES_PER_ELEMENT * HEADER_LENGTH);\n      const dataBuffer = new SharedArrayBuffer(\n        Float64Array.BYTES_PER_ELEMENT *\n          this.#sharedCapacity *\n          POINTER_INPUT_RECORD_STRIDE_V1,\n      );\n      this.#sharedHeader = new Int32Array(headerBuffer);\n      this.#sharedData = new Float64Array(dataBuffer);\n      this.#target.postMessage({\n        type: 'renderer.input.sab.init',\n        schema: 'illustro.pointer-sab/1',\n        capacity: this.#sharedCapacity,\n        stride: POINTER_INPUT_RECORD_STRIDE_V1,\n        header: headerBuffer,\n        data: dataBuffer,\n      });\n      this.#sentMessages += 1;\n    }\n  }\n\n  enqueueBatch(batch: PointerInputBatchV1): void {\n    if (this.#disposed) return;\n    this.#queue.enqueueBatch(batch);\n    this.flush();\n  }\n\n  flush(): void {\n    if (this.#disposed || this.#queue.size === 0) return;\n    if (this.#mode === 'shared-memory') {\n      this.#flushShared();\n      return;\n    }\n    const samples = this.#queue.drain();\n    if (samples.length === 0) return;\n    const buffer = encodePointerSamplesV1(samples);\n    this.#target.postMessage(\n      {\n        type: 'renderer.input.transfer',\n        schema: 'illustro.pointer-transfer/1',\n        stride: POINTER_INPUT_RECORD_STRIDE_V1,\n        count: samples.length,\n        buffer,\n      },\n      [buffer],\n    );\n    this.#sentSamples += samples.length;\n    this.#sentMessages += 1;\n  }\n\n  snapshot(): PointerInputTransportSnapshotV1 {\n    return Object.freeze({\n      schema: 'illustro.pointer-input-transport/1' as const,\n      mode: this.#mode,\n      queue: this.#queue.snapshot(),\n      sentSamples: this.#sentSamples,\n      sentMessages: this.#sentMessages,\n      sharedPendingSamples:\n        this.#sharedHeader === null ? 0 : Atomics.load(this.#sharedHeader, HEADER_COUNT_INDEX),\n    });\n  }\n\n  dispose(): void {\n    if (this.#disposed) return;\n    this.#disposed = true;\n    this.#queue.drain();\n    this.#sharedHeader = null;\n    this.#sharedData = null;\n  }\n\n  #flushShared(): void {\n    const header = this.#sharedHeader;\n    const data = this.#sharedData;\n    if (header === null || data === null) return;\n    let written = 0;\n    while (this.#queue.size > 0 && Atomics.load(header, HEADER_COUNT_INDEX) < this.#sharedCapacity) {\n      const sample = this.#queue.drain(1)[0];\n      if (sample === undefined) break;\n      const writeIndex = Atomics.load(header, HEADER_WRITE_INDEX);\n      writePointerSampleRecordV1(\n        data,\n        writeIndex * POINTER_INPUT_RECORD_STRIDE_V1,\n        sample,\n      );\n      Atomics.store(header, HEADER_WRITE_INDEX, (writeIndex + 1) % this.#sharedCapacity);\n      Atomics.add(header, HEADER_COUNT_INDEX, 1);\n      written += 1;\n    }\n    if (written === 0) return;\n    this.#target.postMessage({\n      type: 'renderer.input.sab.notify',\n      schema: 'illustro.pointer-sab/1',\n      written,\n    });\n    this.#sentSamples += written;\n    this.#sentMessages += 1;\n  }\n}\n\nexport function createPointerInputTransportV1(\n  target: PointerInputTransportTargetV1,\n  options: PointerInputTransportOptionsV1,\n): PointerInputTransportV1 {\n  return new PointerInputTransportV1(target, options);\n}\n\nexport const POINTER_INPUT_SHARED_HEADER_INDICES_V1 = Object.freeze({\n  write: HEADER_WRITE_INDEX,\n  read: HEADER_READ_INDEX,\n  count: HEADER_COUNT_INDEX,\n});\n",
              'src/workers/input-ingress-extension.ts': "import { BoundedPointerInputQueueV1 } from '../input/input-queue.js';\nimport {\n  decodePointerSamplesV1,\n  POINTER_INPUT_RECORD_STRIDE_V1,\n  POINTER_INPUT_SHARED_HEADER_INDICES_V1,\n  readPointerSampleRecordV1,\n} from '../input/input-transport.js';\nimport type { PointerInputSampleV1 } from '../input/pointer-input.js';\n\nexport interface RenderInputIngressScopeV1 {\n  postMessage(message: unknown): void;\n}\n\nexport interface RenderInputIngressSnapshotV1 {\n  readonly schema: 'illustro.render-input-ingress/1';\n  readonly mode: 'uninitialized' | 'transferable' | 'shared-memory';\n  readonly receivedSamples: number;\n  readonly queue: ReturnType<BoundedPointerInputQueueV1['snapshot']>;\n}\n\nexport interface RenderInputIngressControllerV1 {\n  readonly schema: 'illustro.render-input-ingress-controller/1';\n  handle(message: unknown): boolean;\n  snapshot(): RenderInputIngressSnapshotV1;\n  drain(maxCount?: number): readonly PointerInputSampleV1[];\n  dispose(): void;\n}\n\nfunction isRecord(value: unknown): value is Readonly<Record<string, unknown>> {\n  return typeof value === 'object' && value !== null && !Array.isArray(value);\n}\n\nexport function installRenderInputIngressV1(\n  scope: RenderInputIngressScopeV1,\n  queueCapacity = 512,\n): RenderInputIngressControllerV1 {\n  const queue = new BoundedPointerInputQueueV1(queueCapacity);\n  let disposed = false;\n  let mode: RenderInputIngressSnapshotV1['mode'] = 'uninitialized';\n  let receivedSamples = 0;\n  let sharedHeader: Int32Array | null = null;\n  let sharedData: Float64Array | null = null;\n  let sharedCapacity = 0;\n\n  const snapshot = (): RenderInputIngressSnapshotV1 =>\n    Object.freeze({\n      schema: 'illustro.render-input-ingress/1' as const,\n      mode,\n      receivedSamples,\n      queue: queue.snapshot(),\n    });\n\n  const drainShared = (): void => {\n    const header = sharedHeader;\n    const data = sharedData;\n    if (header === null || data === null || sharedCapacity < 1) return;\n    let remaining = Atomics.load(header, POINTER_INPUT_SHARED_HEADER_INDICES_V1.count);\n    let guard = 0;\n    while (remaining > 0 && guard < sharedCapacity) {\n      const readIndex = Atomics.load(header, POINTER_INPUT_SHARED_HEADER_INDICES_V1.read);\n      queue.enqueue(\n        readPointerSampleRecordV1(\n          data,\n          readIndex * POINTER_INPUT_RECORD_STRIDE_V1,\n        ),\n      );\n      Atomics.store(\n        header,\n        POINTER_INPUT_SHARED_HEADER_INDICES_V1.read,\n        (readIndex + 1) % sharedCapacity,\n      );\n      Atomics.sub(header, POINTER_INPUT_SHARED_HEADER_INDICES_V1.count, 1);\n      receivedSamples += 1;\n      guard += 1;\n      remaining = Atomics.load(header, POINTER_INPUT_SHARED_HEADER_INDICES_V1.count);\n    }\n  };\n\n  const handle = (message: unknown): boolean => {\n    if (disposed || !isRecord(message) || typeof message.type !== 'string') return false;\n\n    if (message.type === 'renderer.input.transfer') {\n      if (\n        message.schema !== 'illustro.pointer-transfer/1' ||\n        message.stride !== POINTER_INPUT_RECORD_STRIDE_V1 ||\n        !(message.buffer instanceof ArrayBuffer) ||\n        typeof message.count !== 'number' ||\n        !Number.isSafeInteger(message.count) ||\n        message.count < 0\n      ) {\n        scope.postMessage({ type: 'renderer.input.error', reason: 'invalid-transfer-message' });\n        return true;\n      }\n      const samples = decodePointerSamplesV1(message.buffer, message.count);\n      for (const sample of samples) queue.enqueue(sample);\n      receivedSamples += samples.length;\n      mode = 'transferable';\n      return true;\n    }\n\n    if (message.type === 'renderer.input.sab.init') {\n      const sharedMemoryAvailable = typeof SharedArrayBuffer !== 'undefined';\n      if (\n        !sharedMemoryAvailable ||\n        message.schema !== 'illustro.pointer-sab/1' ||\n        message.stride !== POINTER_INPUT_RECORD_STRIDE_V1 ||\n        typeof message.capacity !== 'number' ||\n        !Number.isSafeInteger(message.capacity) ||\n        message.capacity < 1 ||\n        !(message.header instanceof SharedArrayBuffer) ||\n        !(message.data instanceof SharedArrayBuffer)\n      ) {\n        scope.postMessage({ type: 'renderer.input.error', reason: 'invalid-shared-memory-init' });\n        return true;\n      }\n      const header = new Int32Array(message.header);\n      const data = new Float64Array(message.data);\n      if (\n        header.length <= POINTER_INPUT_SHARED_HEADER_INDICES_V1.count ||\n        data.length < message.capacity * POINTER_INPUT_RECORD_STRIDE_V1\n      ) {\n        scope.postMessage({ type: 'renderer.input.error', reason: 'short-shared-memory-buffer' });\n        return true;\n      }\n      queue.drain();\n      sharedHeader = header;\n      sharedData = data;\n      sharedCapacity = message.capacity;\n      mode = 'shared-memory';\n      return true;\n    }\n\n    if (message.type === 'renderer.input.sab.notify') {\n      if (message.schema !== 'illustro.pointer-sab/1') {\n        scope.postMessage({ type: 'renderer.input.error', reason: 'invalid-shared-memory-notify' });\n        return true;\n      }\n      drainShared();\n      return true;\n    }\n\n    if (message.type === 'renderer.input.inspect') {\n      if (typeof message.requestId === 'string') {\n        scope.postMessage({\n          type: 'renderer.input.snapshot',\n          requestId: message.requestId,\n          snapshot: snapshot(),\n        });\n      }\n      return true;\n    }\n\n    return false;\n  };\n\n  return Object.freeze({\n    schema: 'illustro.render-input-ingress-controller/1' as const,\n    handle,\n    snapshot,\n    drain(maxCount?: number) {\n      drainShared();\n      return maxCount === undefined ? queue.drain() : queue.drain(maxCount);\n    },\n    dispose() {\n      if (disposed) return;\n      disposed = true;\n      queue.drain();\n      sharedHeader = null;\n      sharedData = null;\n      sharedCapacity = 0;\n    },\n  });\n}\n",
              'tests/unit/input-queue.test.ts': "import { describe, expect, it } from 'vitest';\nimport { BoundedPointerInputQueueV1 } from '../../src/input/input-queue.js';\nimport type {\n  PointerInputBatchV1,\n  PointerInputEventTypeV1,\n  PointerInputSampleV1,\n} from '../../src/input/pointer-input.js';\n\nfunction sample(\n  sequence: number,\n  eventType: PointerInputEventTypeV1,\n  pointerId = 1,\n): PointerInputSampleV1 {\n  return Object.freeze({\n    schema: 'illustro.pointer-sample/1' as const,\n    sequence,\n    pointerId,\n    source: 'pen' as const,\n    eventType,\n    origin: 'direct' as const,\n    isPrimary: true,\n    timestampMs: sequence,\n    clientX: sequence,\n    clientY: sequence,\n    surfaceX: sequence,\n    surfaceY: sequence,\n    pressure: 0.5,\n    tangentialPressure: 0,\n    tiltX: 0,\n    tiltY: 0,\n    twist: 0,\n    altitudeAngle: null,\n    azimuthAngle: null,\n    contactWidth: 1,\n    contactHeight: 1,\n    buttons: eventType === 'pointerup' ? 0 : 1,\n    button: eventType === 'pointerdown' ? 0 : -1,\n  });\n}\n\nfunction batch(samples: readonly PointerInputSampleV1[]): PointerInputBatchV1 {\n  return Object.freeze({\n    schema: 'illustro.pointer-batch/1' as const,\n    eventType: samples.at(-1)?.eventType ?? 'pointermove',\n    pointerId: samples.at(-1)?.pointerId ?? 1,\n    confirmed: Object.freeze([...samples]),\n    predicted: Object.freeze([]),\n  });\n}\n\ndescribe('M3 bounded pointer input queue', () => {\n  it('stays bounded and coalesces newest high-frequency updates for the same pointer', () => {\n    const queue = new BoundedPointerInputQueueV1(4);\n    queue.enqueue(sample(0, 'pointerdown'));\n    for (let sequence = 1; sequence <= 20; sequence += 1) {\n      queue.enqueue(sample(sequence, 'pointermove'));\n    }\n    expect(queue.snapshot().size).toBe(4);\n    expect(queue.snapshot().coalesced).toBeGreaterThan(0);\n    expect(queue.drain().at(-1)?.sequence).toBe(20);\n  });\n\n  it('evicts expendable move samples before stroke boundary events under backpressure', () => {\n    const queue = new BoundedPointerInputQueueV1(4);\n    queue.enqueueBatch(\n      batch([\n        sample(0, 'pointerdown'),\n        sample(1, 'pointermove'),\n        sample(2, 'pointermove'),\n        sample(3, 'pointermove'),\n        sample(4, 'pointerup'),\n      ]),\n    );\n    const drained = queue.drain();\n    expect(drained).toHaveLength(4);\n    expect(drained[0]?.eventType).toBe('pointerdown');\n    expect(drained.at(-1)?.eventType).toBe('pointerup');\n    expect(queue.snapshot().dropped).toBe(1);\n  });\n\n  it('bounds multi-pointer bursts without unbounded growth', () => {\n    const queue = new BoundedPointerInputQueueV1(8);\n    for (let sequence = 0; sequence < 100; sequence += 1) {\n      queue.enqueue(sample(sequence, 'pointerrawupdate', (sequence % 3) + 1));\n    }\n    expect(queue.snapshot().size).toBeLessThanOrEqual(8);\n    expect(queue.snapshot().enqueued).toBe(100);\n    expect(queue.snapshot().coalesced + queue.snapshot().dropped).toBeGreaterThan(0);\n  });\n});\n",
              'tests/unit/input-transport.test.ts': "import { describe, expect, it } from 'vitest';\nimport {\n  createPointerInputTransportV1,\n  decodePointerSamplesV1,\n  encodePointerSamplesV1,\n  POINTER_INPUT_RECORD_STRIDE_V1,\n} from '../../src/input/input-transport.js';\nimport { installRenderInputIngressV1 } from '../../src/workers/input-ingress-extension.js';\nimport type {\n  PointerInputBatchV1,\n  PointerInputEventTypeV1,\n  PointerInputSampleV1,\n} from '../../src/input/pointer-input.js';\n\nfunction sample(\n  sequence: number,\n  eventType: PointerInputEventTypeV1 = 'pointermove',\n): PointerInputSampleV1 {\n  return Object.freeze({\n    schema: 'illustro.pointer-sample/1' as const,\n    sequence,\n    pointerId: 9,\n    source: 'pen' as const,\n    eventType,\n    origin: 'direct' as const,\n    isPrimary: true,\n    timestampMs: 100 + sequence,\n    clientX: 10 + sequence,\n    clientY: 20 + sequence,\n    surfaceX: 5 + sequence,\n    surfaceY: 6 + sequence,\n    pressure: 0.75,\n    tangentialPressure: -0.1,\n    tiltX: 12,\n    tiltY: -18,\n    twist: 240,\n    altitudeAngle: 0.8,\n    azimuthAngle: 1.2,\n    contactWidth: 3,\n    contactHeight: 4,\n    buttons: eventType === 'pointerup' ? 0 : 1,\n    button: eventType === 'pointerdown' ? 0 : -1,\n  });\n}\n\nfunction batch(samples: readonly PointerInputSampleV1[]): PointerInputBatchV1 {\n  return Object.freeze({\n    schema: 'illustro.pointer-batch/1' as const,\n    eventType: samples.at(-1)?.eventType ?? 'pointermove',\n    pointerId: 9,\n    confirmed: Object.freeze([...samples]),\n    predicted: Object.freeze([]),\n  });\n}\n\nclass FakeTarget {\n  readonly messages: { readonly message: unknown; readonly transfer: readonly Transferable[] }[] = [];\n\n  postMessage(message: unknown, transfer: Transferable[] = []): void {\n    this.messages.push({ message, transfer: Object.freeze([...transfer]) });\n  }\n}\n\nclass FakeScope {\n  readonly messages: unknown[] = [];\n\n  postMessage(message: unknown): void {\n    this.messages.push(message);\n  }\n}\n\nfunction record(value: unknown): Readonly<Record<string, unknown>> {\n  if (typeof value !== 'object' || value === null) throw new TypeError('expected record');\n  return value as Readonly<Record<string, unknown>>;\n}\n\ndescribe('M3 pointer input transport codec', () => {\n  it('round-trips complete pointer samples through the fixed-stride binary format', () => {\n    const original = [sample(1, 'pointerdown'), sample(2), sample(3, 'pointerup')];\n    const decoded = decodePointerSamplesV1(encodePointerSamplesV1(original), original.length);\n    expect(decoded).toEqual(original);\n  });\n});\n\ndescribe('M3 Transferable fallback transport', () => {\n  it('moves bounded confirmed samples through an ArrayBuffer transfer list', () => {\n    const target = new FakeTarget();\n    const transport = createPointerInputTransportV1(target, {\n      sharedMemoryFastPath: false,\n      queueCapacity: 8,\n    });\n    transport.enqueueBatch(batch([sample(1, 'pointerdown'), sample(2)]));\n    expect(transport.snapshot().mode).toBe('transferable');\n    expect(target.messages).toHaveLength(1);\n\n    const posted = target.messages[0];\n    const message = record(posted?.message);\n    expect(message.type).toBe('renderer.input.transfer');\n    expect(message.stride).toBe(POINTER_INPUT_RECORD_STRIDE_V1);\n    expect(message.count).toBe(2);\n    expect(message.buffer).toBeInstanceOf(ArrayBuffer);\n    expect(posted?.transfer).toEqual([message.buffer]);\n    const decoded = decodePointerSamplesV1(message.buffer as ArrayBuffer, 2);\n    expect(decoded.map((entry) => entry.sequence)).toEqual([1, 2]);\n  });\n\n  it('is the functional mode whenever the shared-memory fast path is disabled', () => {\n    const target = new FakeTarget();\n    const transport = createPointerInputTransportV1(target, { sharedMemoryFastPath: false });\n    expect(transport.snapshot().mode).toBe('transferable');\n  });\n});\n\ndescribe('M3 render worker input ingress', () => {\n  it('accepts transferred ArrayBuffer messages into a bounded worker-side queue', () => {\n    const scope = new FakeScope();\n    const ingress = installRenderInputIngressV1(scope, 4);\n    const samples = [sample(1), sample(2)];\n    expect(\n      ingress.handle({\n        type: 'renderer.input.transfer',\n        schema: 'illustro.pointer-transfer/1',\n        stride: POINTER_INPUT_RECORD_STRIDE_V1,\n        count: samples.length,\n        buffer: encodePointerSamplesV1(samples),\n      }),\n    ).toBe(true);\n    expect(ingress.snapshot().mode).toBe('transferable');\n    expect(ingress.drain().map((entry) => entry.sequence)).toEqual([1, 2]);\n  });\n\n  it('uses SharedArrayBuffer + Atomics when available and preserves transferable fallback separately', () => {\n    if (typeof SharedArrayBuffer === 'undefined' || typeof Atomics === 'undefined') return;\n    const target = new FakeTarget();\n    const transport = createPointerInputTransportV1(target, {\n      sharedMemoryFastPath: true,\n      queueCapacity: 8,\n      sharedRingCapacity: 8,\n    });\n    expect(transport.snapshot().mode).toBe('shared-memory');\n    expect(target.messages).toHaveLength(1);\n\n    const scope = new FakeScope();\n    const ingress = installRenderInputIngressV1(scope, 8);\n    expect(ingress.handle(target.messages[0]?.message)).toBe(true);\n\n    transport.enqueueBatch(batch([sample(10, 'pointerdown'), sample(11), sample(12, 'pointerup')]));\n    expect(target.messages).toHaveLength(2);\n    expect(ingress.handle(target.messages[1]?.message)).toBe(true);\n    expect(ingress.snapshot().mode).toBe('shared-memory');\n    expect(ingress.drain().map((entry) => entry.sequence)).toEqual([10, 11, 12]);\n    expect(transport.snapshot().sharedPendingSamples).toBe(0);\n  });\n});\n",
