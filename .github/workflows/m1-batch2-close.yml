name: Close M1 document state batch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-batch2-close.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Close verified M1 document and state items
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text(encoding='utf-8')
          items = [
              'M1-007 DocumentV1',
              'M1-008 CanvasSpec',
              'M1-009 document color metadata',
              'M1-010 document precision metadata',
              'M1-011 resolution/DPI metadata',
              'M1-012 project metadata state',
              'M1-013 workspace/session state store',
              'M1-014 derived/cache state boundary',
          ]
          for item in items:
              old = f'{item}:未完了'
              new = f'{item}:完了'
              if old not in text and new not in text:
                  raise SystemExit(f'missing progress item: {item}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit verified progress
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add IMPLEMENTATION_PROGRESS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: close M1 document state batch [skip ci]'
          git push origin HEAD:main
