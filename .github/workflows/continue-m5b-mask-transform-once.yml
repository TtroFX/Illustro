name: Continue M5B mask transform once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  continue-m5b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci
      - name: Implement mask independent move and transform
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'anchor missing in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1))

          Path('src/app/layer-mask-transform.ts').write_text(r'''import { createNodeId, type LayerId, type MaskId, type Revision } from '../domain/identity.js';
          import type { LayerBaseV1, RasterMaskAttachmentV1, TransformNodeV1 } from '../domain/layers.js';
          import type { PaintProjectSnapshotV1 } from './paint-session-controller.js';
          import { maskLinkedToLayerV1 } from './layer-mask-operations.js';

          export interface IndependentMaskAffineTransformInputV1 {
            readonly translateX: number;
            readonly translateY: number;
            readonly scaleX: number;
            readonly scaleY: number;
            readonly rotationDeg: number;
            readonly pivotX: number;
            readonly pivotY: number;
          }

          export interface IndependentMaskTransformEligibilityV1 {
            readonly schema: 'illustro.independent-mask-transform-eligibility/1';
            readonly eligible: boolean;
            readonly reason: string | null;
          }

          function eligibility(eligible: boolean, reason: string | null): IndependentMaskTransformEligibilityV1 {
            return Object.freeze({
              schema: 'illustro.independent-mask-transform-eligibility/1' as const,
              eligible,
              reason,
            });
          }

          function rasterMask(
            snapshot: PaintProjectSnapshotV1,
            layerId: LayerId,
            maskId: MaskId,
          ): { readonly layer: LayerBaseV1; readonly mask: RasterMaskAttachmentV1 } | null {
            const layer = snapshot.document.layerTree.layers[layerId];
            if (layer === undefined) return null;
            const mask = layer.masks.find((entry) => entry.id === maskId);
            if (mask?.kind !== 'raster-mask') return null;
            return Object.freeze({ layer, mask });
          }

          export function independentMaskTransformEligibilityV1(
            snapshot: PaintProjectSnapshotV1,
            layerId: LayerId,
            maskId: MaskId,
          ): IndependentMaskTransformEligibilityV1 {
            const target = rasterMask(snapshot, layerId, maskId);
            if (target === null) return eligibility(false, 'independent transform requires a Raster Mask');
            if (target.layer.type === 'lineartBoundary') {
              return eligibility(false, 'Lineart Boundary mask transform is unavailable');
            }
            if (target.layer.locks.all || target.layer.locks.position) {
              return eligibility(false, 'mask transform is blocked by the layer position lock');
            }
            if (maskLinkedToLayerV1(target.mask)) {
              return eligibility(false, 'unlink the mask before moving or transforming it independently');
            }
            return eligibility(true, null);
          }

          function finite(value: number, label: string): number {
            if (!Number.isFinite(value)) throw new RangeError(`${label} must be finite`);
            return value;
          }

          function normalizeInput(
            input: IndependentMaskAffineTransformInputV1,
          ): IndependentMaskAffineTransformInputV1 {
            const normalized = Object.freeze({
              translateX: finite(input.translateX, 'translateX'),
              translateY: finite(input.translateY, 'translateY'),
              scaleX: finite(input.scaleX, 'scaleX'),
              scaleY: finite(input.scaleY, 'scaleY'),
              rotationDeg: finite(input.rotationDeg, 'rotationDeg'),
              pivotX: finite(input.pivotX, 'pivotX'),
              pivotY: finite(input.pivotY, 'pivotY'),
            });
            if (normalized.scaleX <= 0 || normalized.scaleY <= 0) {
              throw new RangeError('mask transform scale must be greater than zero');
            }
            if (
              normalized.translateX === 0 &&
              normalized.translateY === 0 &&
              normalized.scaleX === 1 &&
              normalized.scaleY === 1 &&
              normalized.rotationDeg === 0
            ) {
              throw new Error('mask transform has no changes');
            }
            return normalized;
          }

          function affineMatrix(
            input: IndependentMaskAffineTransformInputV1,
          ): readonly [number, number, number, number, number, number] {
            const radians = (input.rotationDeg * Math.PI) / 180;
            const cosine = Math.cos(radians);
            const sine = Math.sin(radians);
            const a = cosine * input.scaleX;
            const b = sine * input.scaleX;
            const c = -sine * input.scaleY;
            const d = cosine * input.scaleY;
            const e = input.translateX + input.pivotX - a * input.pivotX - c * input.pivotY;
            const f = input.translateY + input.pivotY - b * input.pivotX - d * input.pivotY;
            return Object.freeze([a, b, c, d, e, f]);
          }

          export function applyIndependentMaskAffineTransformSnapshotV1(
            snapshot: PaintProjectSnapshotV1,
            layerId: LayerId,
            maskId: MaskId,
            input: IndependentMaskAffineTransformInputV1,
            revision: Revision,
            now: Date = new Date(),
          ): PaintProjectSnapshotV1 {
            const check = independentMaskTransformEligibilityV1(snapshot, layerId, maskId);
            if (!check.eligible) throw new Error(check.reason ?? 'independent mask transform is unavailable');
            const target = rasterMask(snapshot, layerId, maskId);
            if (target === null) throw new Error('independent transform lost its Raster Mask target');
            const normalized = normalizeInput(input);
            const node: TransformNodeV1 = Object.freeze({
              id: createNodeId(),
              revision,
              kind: 'affine',
              parameters: Object.freeze({
                schema: 'illustro.mask-affine-transform/1',
                translateX: normalized.translateX,
                translateY: normalized.translateY,
                scaleX: normalized.scaleX,
                scaleY: normalized.scaleY,
                rotationDeg: normalized.rotationDeg,
                pivotX: normalized.pivotX,
                pivotY: normalized.pivotY,
                matrix: affineMatrix(normalized),
              }),
            });
            const nextMask: RasterMaskAttachmentV1 = Object.freeze({
              ...target.mask,
              revision,
              transformStack: Object.freeze([...target.mask.transformStack, node]),
            });
            const nextLayer = Object.freeze({
              ...target.layer,
              revision,
              masks: Object.freeze(
                target.layer.masks.map((entry) => (entry.id === maskId ? nextMask : entry)),
              ),
            }) as LayerBaseV1;
            return Object.freeze({
              ...snapshot,
              document: Object.freeze({
                ...snapshot.document,
                revision,
                modifiedAt: now.toISOString(),
                layerTree: Object.freeze({
                  rootLayerIds: snapshot.document.layerTree.rootLayerIds,
                  layers: Object.freeze({
                    ...snapshot.document.layerTree.layers,
                    [layerId]: nextLayer,
                  }),
                }),
              }),
              committedStrokes: snapshot.committedStrokes,
            });
          }

          export function applyIndependentMaskMoveSnapshotV1(
            snapshot: PaintProjectSnapshotV1,
            layerId: LayerId,
            maskId: MaskId,
            translateX: number,
            translateY: number,
            revision: Revision,
            now: Date = new Date(),
          ): PaintProjectSnapshotV1 {
            return applyIndependentMaskAffineTransformSnapshotV1(
              snapshot,
              layerId,
              maskId,
              {
                translateX,
                translateY,
                scaleX: 1,
                scaleY: 1,
                rotationDeg: 0,
                pivotX: 0,
                pivotY: 0,
              },
              revision,
              now,
            );
          }
          ''')

          Path('tests/unit/layer-mask-transform.test.ts').write_text(r'''import { describe, expect, it } from 'vitest';
          import {
            applyIndependentMaskAffineTransformSnapshotV1,
            applyIndependentMaskMoveSnapshotV1,
            independentMaskTransformEligibilityV1,
          } from '../../src/app/layer-mask-transform.js';
          import { setMaskLinkedToLayerSnapshotV1 } from '../../src/app/layer-mask-operations.js';
          import type { PaintProjectSnapshotV1 } from '../../src/app/paint-session-controller.js';
          import { createDocumentV1 } from '../../src/domain/document.js';
          import { parseRevision } from '../../src/domain/identity.js';
          import { createRasterLayer, createRasterMask, createRasterTileReference } from '../../src/domain/layers.js';

          function fixture(): {
            readonly snapshot: PaintProjectSnapshotV1;
            readonly layer: ReturnType<typeof createRasterLayer>;
            readonly mask: ReturnType<typeof createRasterMask>;
          } {
            const tile = createRasterTileReference({ x: 0, y: 0, payloadRef: 'mask-tile-0' });
            const mask = createRasterMask({ defaultCoverage: 1, tiles: [tile] });
            const layer = createRasterLayer({ name: 'Masked', masks: [mask] });
            const document = createDocumentV1({ width: 64, height: 64 });
            return {
              snapshot: Object.freeze({
                schema: 'illustro.paint-project-snapshot/1' as const,
                document: Object.freeze({
                  ...document,
                  layerTree: Object.freeze({
                    rootLayerIds: Object.freeze([layer.id]),
                    layers: Object.freeze({ [layer.id]: layer }),
                  }),
                }),
                committedStrokes: Object.freeze([]),
              }),
              layer,
              mask,
            };
          }

          function unlink(
            snapshot: PaintProjectSnapshotV1,
            layer: ReturnType<typeof createRasterLayer>,
            mask: ReturnType<typeof createRasterMask>,
          ): PaintProjectSnapshotV1 {
            return setMaskLinkedToLayerSnapshotV1(
              snapshot,
              layer.id,
              mask.id,
              false,
              parseRevision(1),
              new Date(0),
            );
          }

          describe('M5B independent mask move/transform', () => {
            it('requires the Raster Mask to be unlinked from its layer', () => {
              const { snapshot, layer, mask } = fixture();
              const linked = independentMaskTransformEligibilityV1(snapshot, layer.id, mask.id);
              expect(linked.eligible).toBe(false);
              expect(linked.reason).toMatch(/unlink/i);

              const unlinked = unlink(snapshot, layer, mask);
              expect(independentMaskTransformEligibilityV1(unlinked, layer.id, mask.id).eligible).toBe(true);
            });

            it('moves only the mask by appending a non-destructive affine transform node', () => {
              const { snapshot, layer, mask } = fixture();
              const unlinked = unlink(snapshot, layer, mask);
              const moved = applyIndependentMaskMoveSnapshotV1(
                unlinked,
                layer.id,
                mask.id,
                12,
                -7,
                parseRevision(2),
                new Date(1),
              );
              const movedLayer = moved.document.layerTree.layers[layer.id];
              const movedMask = movedLayer?.masks.find((entry) => entry.id === mask.id);
              expect(movedLayer?.transformStack).toEqual(layer.transformStack);
              expect(movedMask?.transformStack).toHaveLength(1);
              expect(movedMask?.transformStack[0]?.parameters).toMatchObject({
                schema: 'illustro.mask-affine-transform/1',
                translateX: 12,
                translateY: -7,
                scaleX: 1,
                scaleY: 1,
                rotationDeg: 0,
                matrix: [1, 0, 0, 1, 12, -7],
              });
              expect(movedMask?.kind === 'raster-mask' ? movedMask.tiles : []).toEqual(mask.tiles);
              expect(moved.document.revision).toBe(2);
            });

            it('applies scale/rotation/pivot to the mask transform stack without rewriting coverage tiles', () => {
              const { snapshot, layer, mask } = fixture();
              const unlinked = unlink(snapshot, layer, mask);
              const transformed = applyIndependentMaskAffineTransformSnapshotV1(
                unlinked,
                layer.id,
                mask.id,
                {
                  translateX: 3,
                  translateY: 4,
                  scaleX: 2,
                  scaleY: 0.5,
                  rotationDeg: 90,
                  pivotX: 8,
                  pivotY: 6,
                },
                parseRevision(2),
                new Date(1),
              );
              const transformedMask = transformed.document.layerTree.layers[layer.id]?.masks.find(
                (entry) => entry.id === mask.id,
              );
              expect(transformedMask?.transformStack).toHaveLength(1);
              expect(transformedMask?.transformStack[0]?.parameters).toMatchObject({
                schema: 'illustro.mask-affine-transform/1',
                scaleX: 2,
                scaleY: 0.5,
                rotationDeg: 90,
                pivotX: 8,
                pivotY: 6,
              });
              expect(transformedMask?.kind === 'raster-mask' ? transformedMask.tiles : []).toEqual(mask.tiles);
            });

            it('rejects no-op and invalid scale transforms', () => {
              const { snapshot, layer, mask } = fixture();
              const unlinked = unlink(snapshot, layer, mask);
              expect(() =>
                applyIndependentMaskMoveSnapshotV1(
                  unlinked,
                  layer.id,
                  mask.id,
                  0,
                  0,
                  parseRevision(2),
                ),
              ).toThrow(/no changes/);
              expect(() =>
                applyIndependentMaskAffineTransformSnapshotV1(
                  unlinked,
                  layer.id,
                  mask.id,
                  {
                    translateX: 1,
                    translateY: 0,
                    scaleX: 0,
                    scaleY: 1,
                    rotationDeg: 0,
                    pivotX: 0,
                    pivotY: 0,
                  },
                  parseRevision(2),
                ),
              ).toThrow(/greater than zero/);
            });
          });
          ''')

          replace_once(
              'src/app/layer-workflow-controller.ts',
              "import type { MaskPaintControllerV1 } from './layer-mask-paint.js';",
              """import type { MaskPaintControllerV1 } from './layer-mask-paint.js';
          import {
            applyIndependentMaskAffineTransformSnapshotV1,
            applyIndependentMaskMoveSnapshotV1,
            independentMaskTransformEligibilityV1,
          } from './layer-mask-transform.js';""",
          )

          replace_once(
              'src/app/layer-workflow-controller.ts',
              """  const maskInvertButton = required<HTMLButtonElement>('#mask-invert');
            const maskLinkButton = required<HTMLButtonElement>('#mask-link');
            const groupedTransformDialog = required<HTMLDialogElement>('#layer-group-transform-dialog');""",
              """  const maskInvertButton = required<HTMLButtonElement>('#mask-invert');
            const maskLinkButton = required<HTMLButtonElement>('#mask-link');
            const maskMoveButton = required<HTMLButtonElement>('#mask-move');
            const maskTransformButton = required<HTMLButtonElement>('#mask-transform');
            const maskTransformDialog = required<HTMLDialogElement>('#mask-transform-dialog');
            const maskTransformForm = required<HTMLFormElement>('#mask-transform-form');
            const maskTransformCancel = required<HTMLButtonElement>('#mask-transform-cancel');
            const maskTransformX = required<HTMLInputElement>('#mask-transform-x');
            const maskTransformY = required<HTMLInputElement>('#mask-transform-y');
            const maskTransformScaleX = required<HTMLInputElement>('#mask-transform-scale-x');
            const maskTransformScaleY = required<HTMLInputElement>('#mask-transform-scale-y');
            const maskTransformRotation = required<HTMLInputElement>('#mask-transform-rotation');
            const maskTransformPivotX = required<HTMLInputElement>('#mask-transform-pivot-x');
            const maskTransformPivotY = required<HTMLInputElement>('#mask-transform-pivot-y');
            const maskTransformStatus = required<HTMLOutputElement>('#mask-transform-status');
            const maskTransformTitle = required<HTMLElement>('#mask-transform-title');
            const groupedTransformDialog = required<HTMLDialogElement>('#layer-group-transform-dialog');""",
          )

          replace_once(
              'src/app/layer-workflow-controller.ts',
              """    maskLinkButton.title = maskLinked
                ? 'マスクとレイヤーのリンクを解除'
                : 'マスクをレイヤーへリンク';
              root.dataset.illustroMaskPaintLayerId = maskPaintSnapshot.layerId ?? '';""",
              """    maskLinkButton.title = maskLinked
                ? 'マスクとレイヤーのリンクを解除'
                : 'マスクをレイヤーへリンク';
              const maskIndependentTransformEnabled =
                selectedRasterMask !== undefined &&
                !maskLinked &&
                active !== null &&
                !active.layer.locks.all &&
                !active.layer.locks.position;
              maskMoveButton.disabled = !maskIndependentTransformEnabled;
              maskTransformButton.disabled = !maskIndependentTransformEnabled;
              maskMoveButton.title = maskLinked
                ? '独立移動するには先にマスクのリンクを解除'
                : 'マスクだけを移動';
              maskTransformButton.title = maskLinked
                ? '独立変形するには先にマスクのリンクを解除'
                : 'マスクだけを非破壊変形';
              root.dataset.illustroMaskIndependentTransform = maskIndependentTransformEnabled
                ? 'enabled'
                : 'disabled';
              root.dataset.illustroMaskPaintLayerId = maskPaintSnapshot.layerId ?? '';""",
          )

          insert_anchor = "\n\n  const onLayerSearchInput = (): void => {"
          controller = Path('src/app/layer-workflow-controller.ts').read_text()
          if insert_anchor not in controller:
              raise SystemExit('mask transform handler insertion anchor missing')
          handlers = r'''

            let maskTransformMode: 'move' | 'transform' = 'transform';

            const finiteMaskTransformValue = (input: HTMLInputElement, label: string): number => {
              const value = Number(input.value);
              if (!Number.isFinite(value)) throw new RangeError(`${label} must be finite`);
              return value;
            };

            const openMaskTransformDialog = (mode: 'move' | 'transform'): void => {
              clearError();
              const target = options.maskPaint.snapshot();
              const current = options.paintSession.projectSnapshot();
              if (current === null || target.layerId === null || target.maskId === null) return;
              const check = independentMaskTransformEligibilityV1(current, target.layerId, target.maskId);
              if (!check.eligible) {
                publishError(new Error(check.reason ?? 'mask transform is unavailable'));
                return;
              }
              maskTransformMode = mode;
              maskTransformTitle.textContent = mode === 'move' ? 'マスクを独立移動' : 'マスクを独立変形';
              maskTransformX.value = '0';
              maskTransformY.value = '0';
              maskTransformScaleX.value = '100';
              maskTransformScaleY.value = '100';
              maskTransformRotation.value = '0';
              maskTransformPivotX.value = '0';
              maskTransformPivotY.value = '0';
              const moveOnly = mode === 'move';
              maskTransformScaleX.disabled = moveOnly;
              maskTransformScaleY.disabled = moveOnly;
              maskTransformRotation.disabled = moveOnly;
              maskTransformPivotX.disabled = moveOnly;
              maskTransformPivotY.disabled = moveOnly;
              maskTransformStatus.value = moveOnly
                ? 'リンク解除済みマスクだけをX/Y方向へ移動します。'
                : 'マスク画素を焼き直さずAffine変形を追加します。';
              maskTransformDialog.showModal();
            };

            const onMaskMove = (): void => openMaskTransformDialog('move');
            const onMaskTransform = (): void => openMaskTransformDialog('transform');
            const onMaskTransformCancel = (): void => maskTransformDialog.close();
            const onMaskTransformSubmit = (event: SubmitEvent): void => {
              event.preventDefault();
              try {
                const target = options.maskPaint.snapshot();
                const layerId = target.layerId;
                const maskId = target.maskId;
                if (layerId === null || maskId === null) return;
                const translateX = finiteMaskTransformValue(maskTransformX, 'mask translateX');
                const translateY = finiteMaskTransformValue(maskTransformY, 'mask translateY');
                if (maskTransformMode === 'move') {
                  if (translateX === 0 && translateY === 0) {
                    throw new Error('mask move has no changes');
                  }
                  commitMutation(
                    'mask.move',
                    (before, revision) =>
                      applyIndependentMaskMoveSnapshotV1(
                        before,
                        layerId,
                        maskId,
                        translateX,
                        translateY,
                        revision,
                      ),
                    () => layerId,
                  );
                } else {
                  const scaleX = finiteMaskTransformValue(maskTransformScaleX, 'mask scaleX') / 100;
                  const scaleY = finiteMaskTransformValue(maskTransformScaleY, 'mask scaleY') / 100;
                  const rotationDeg = finiteMaskTransformValue(maskTransformRotation, 'mask rotation');
                  const pivotX = finiteMaskTransformValue(maskTransformPivotX, 'mask pivotX');
                  const pivotY = finiteMaskTransformValue(maskTransformPivotY, 'mask pivotY');
                  if (
                    translateX === 0 &&
                    translateY === 0 &&
                    scaleX === 1 &&
                    scaleY === 1 &&
                    rotationDeg === 0
                  ) {
                    throw new Error('mask transform has no changes');
                  }
                  commitMutation(
                    'mask.transform',
                    (before, revision) =>
                      applyIndependentMaskAffineTransformSnapshotV1(
                        before,
                        layerId,
                        maskId,
                        { translateX, translateY, scaleX, scaleY, rotationDeg, pivotX, pivotY },
                        revision,
                      ),
                    () => layerId,
                  );
                }
                maskTransformDialog.close();
              } catch (error) {
                publishError(error);
                maskTransformStatus.value = error instanceof Error ? error.message : String(error);
              }
            };
          '''
          Path('src/app/layer-workflow-controller.ts').write_text(controller.replace(insert_anchor, handlers + insert_anchor, 1))

          replace_once(
              'src/app/layer-workflow-controller.ts',
              """  maskInvertButton.addEventListener('click', onMaskInvert);
            maskLinkButton.addEventListener('click', onMaskLink);
            list.addEventListener('click', onListClick);""",
              """  maskInvertButton.addEventListener('click', onMaskInvert);
            maskLinkButton.addEventListener('click', onMaskLink);
            maskMoveButton.addEventListener('click', onMaskMove);
            maskTransformButton.addEventListener('click', onMaskTransform);
            maskTransformCancel.addEventListener('click', onMaskTransformCancel);
            maskTransformForm.addEventListener('submit', onMaskTransformSubmit);
            list.addEventListener('click', onListClick);""",
          )

          replace_once(
              'src/app/layer-workflow-controller.ts',
              """      maskInvertButton.removeEventListener('click', onMaskInvert);
                maskLinkButton.removeEventListener('click', onMaskLink);
                list.removeEventListener('click', onListClick);""",
              """      maskInvertButton.removeEventListener('click', onMaskInvert);
                maskLinkButton.removeEventListener('click', onMaskLink);
                maskMoveButton.removeEventListener('click', onMaskMove);
                maskTransformButton.removeEventListener('click', onMaskTransform);
                maskTransformCancel.removeEventListener('click', onMaskTransformCancel);
                maskTransformForm.removeEventListener('submit', onMaskTransformSubmit);
                list.removeEventListener('click', onListClick);""",
          )

          replace_once(
              'src/index.html',
              '<button id="mask-link" type="button" aria-label="マスクとレイヤーをリンク" title="マスクとレイヤーをリンク" aria-pressed="true" disabled>⌁</button>\n            </div>',
              '<button id="mask-link" type="button" aria-label="マスクとレイヤーをリンク" title="マスクとレイヤーをリンク" aria-pressed="true" disabled>⌁</button>\n              <button id="mask-move" type="button" aria-label="マスクを独立移動" title="マスクを独立移動" disabled>↔</button>\n              <button id="mask-transform" type="button" aria-label="マスクを独立変形" title="マスクを独立変形" disabled>⤢</button>\n            </div>',
          )

          dialog = r'''    <dialog id="mask-transform-dialog" class="document-dialog" aria-labelledby="mask-transform-title">
              <form id="mask-transform-form" method="dialog" class="document-dialog-form">
                <header><h2 id="mask-transform-title">マスクを独立変形</h2></header>
                <p class="document-dialog-help">リンク解除済みのRaster Maskだけを、画素を焼き直さず非破壊Affine変形します。</p>
                <div class="document-dialog-grid">
                  <label>移動 X (px)<input id="mask-transform-x" type="number" step="0.1" value="0" /></label>
                  <label>移動 Y (px)<input id="mask-transform-y" type="number" step="0.1" value="0" /></label>
                  <label>回転 (°)<input id="mask-transform-rotation" type="number" step="0.1" value="0" /></label>
                  <span></span>
                  <label>拡大率 X (%)<input id="mask-transform-scale-x" type="number" min="0.01" step="0.1" value="100" /></label>
                  <label>拡大率 Y (%)<input id="mask-transform-scale-y" type="number" min="0.01" step="0.1" value="100" /></label>
                  <label>基準点 X<input id="mask-transform-pivot-x" type="number" step="0.1" value="0" /></label>
                  <label>基準点 Y<input id="mask-transform-pivot-y" type="number" step="0.1" value="0" /></label>
                </div>
                <output id="mask-transform-status" class="document-dialog-status" aria-live="polite"></output>
                <footer>
                  <button id="mask-transform-cancel" type="button" class="document-dialog-secondary">キャンセル</button>
                  <button type="submit" class="document-dialog-primary">適用</button>
                </footer>
              </form>
            </dialog>
          '''
          replace_once(
              'src/index.html',
              '    <dialog id="layer-group-transform-dialog" class="document-dialog"',
              dialog + '    <dialog id="layer-group-transform-dialog" class="document-dialog"',
          )

          progress_path = Path('IMPLEMENTATION_PROGRESS.md')
          progress = progress_path.read_text()
          progress = progress.replace(
              'USER-01 新規作成・描画・Undo/Redo・保存再読込・PNG Exportユーザー確認PASS:未完了',
              'USER-01 新規作成・描画・Undo/Redo・保存再読込・PNG Exportユーザー確認PASS:完了',
              1,
          )
          if 'USER-01-MOBILE-003 スマホUndo/Redo・保存再読込ユーザー実機PASS:完了' not in progress:
              progress = progress.replace(
                  'USER-01-EXPORT-002 スマホPNG Exportユーザー実機PASS:完了',
                  'USER-01-EXPORT-002 スマホPNG Exportユーザー実機PASS:完了\nUSER-01-MOBILE-003 スマホUndo/Redo・保存再読込ユーザー実機PASS:完了',
                  1,
              )
          progress = progress.replace('M5B-039 Mask independent move:未完了', 'M5B-039 Mask independent move:完了', 1)
          progress = progress.replace('M5B-040 Mask independent transform:未完了', 'M5B-040 Mask independent transform:完了', 1)
          progress = re.sub(
              r'(MOBILE-007 smartphone実機・最低限のcompatibility regression確認):未完了',
              r'\1:完了',
              progress,
              count=1,
          )
          progress = progress.replace(
              '次はUSER-01のユーザー実機再確認を待つ。',
              'USER-01はスマホ実機で新規作成・描画・Undo/Redo・保存再読込・PNG Export・性能確認まで明示PASS済み。次はM5B-041 Mask featherから再開する。',
              1,
          )
          progress_path.write_text(progress)
          PY
