name: Close M7A Quick Mask once

on:
  push:
    branches: [main]
    paths:
      - '.github/m7a-quick-mask-progress-trigger'

permissions:
  contents: write

jobs:
  close-m7a-quick-mask:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Mark M7A-017 complete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          before = 'M7A-017 Quick Mask:未完了'
          after = 'M7A-017 Quick Mask:完了'
          if before in text:
              if text.count(before) != 1:
                  raise SystemExit(f'expected exactly one progress line: {before}')
              text = text.replace(before, after, 1)
              path.write_text(text)
          elif after not in text:
              raise SystemExit(f'progress line missing: {before}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPLEMENTATION_PROGRESS.md
          if git diff --cached --quiet; then
            echo 'M7A-017 already complete.'
            exit 0
          fi
          git commit -m 'chore: close M7A Quick Mask'
          git pull --rebase origin main
          git push origin HEAD:main
