name: Close M1 identity revision batch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-batch1-close.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Close verified M1 identity and revision items
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text(encoding='utf-8')
          items = [
              'M1-001 Document ID',
              'M1-002 Layer ID',
              'M1-003 Resource ID',
              'M1-004 Object ID',
              'M1-005 Node ID',
              'M1-006 revision model',
          ]
          for item in items:
              old = f'{item}:未完了'
              new = f'{item}:完了'
              if old not in text and new not in text:
                  raise SystemExit(f'missing progress item: {item}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit verified progress
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add IMPLEMENTATION_PROGRESS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: close M1 identity revision batch [skip ci]'
          git push origin HEAD:main
