name: Temporary M9A production wiring
on:
  push:
    branches:
      - feature/m9a-complete
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - run: python scripts/tmp-m9a-production.py
      - run: npm run format
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - name: Commit production wiring
        run: |
          rm scripts/tmp-m9a-production.py .github/workflows/tmp-m9a-production.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(M9A): connect production Project Library"
          git push