name: Illustro one-shot M6A-059 patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore dependencies
        run: npm ci
      - name: Align M6A-059 particle-density UI anchor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/patch-m6a059-particle-density.py')
          s = p.read_text(encoding='utf-8')
          old = '\n'.join([
              '    """  const sprayParticleSizeRange = requireElement(\'#brush-spray-particle-size-range\', HTMLInputElement);',
              '  const sprayParticleSizeNumber = requireElement(\'#brush-spray-particle-size-number\', HTMLInputElement);',
              "  const tipShape = requireElement('#brush-tip-shape', HTMLSelectElement);",
              '""",',
              '    """  const sprayParticleSizeRange = requireElement(\'#brush-spray-particle-size-range\', HTMLInputElement);',
              '  const sprayParticleSizeNumber = requireElement(\'#brush-spray-particle-size-number\', HTMLInputElement);',
              "  const sprayParticleDensityRange = requireElement('#brush-spray-particle-density-range', HTMLInputElement);",
              "  const sprayParticleDensityNumber = requireElement('#brush-spray-particle-density-number', HTMLInputElement);",
              "  const tipShape = requireElement('#brush-tip-shape', HTMLSelectElement);",
              '""",',
          ])
          new = '\n'.join([
              '    """  const sprayParticleSizeRange = requireElement(',
              "    '#brush-spray-particle-size-range',",
              '    HTMLInputElement,',
              '  );',
              '  const sprayParticleSizeNumber = requireElement(',
              "    '#brush-spray-particle-size-number',",
              '    HTMLInputElement,',
              '  );',
              "  const tipShape = requireElement('#brush-tip-shape', HTMLSelectElement);",
              '""",',
              '    """  const sprayParticleSizeRange = requireElement(',
              "    '#brush-spray-particle-size-range',",
              '    HTMLInputElement,',
              '  );',
              '  const sprayParticleSizeNumber = requireElement(',
              "    '#brush-spray-particle-size-number',",
              '    HTMLInputElement,',
              '  );',
              '  const sprayParticleDensityRange = requireElement(',
              "    '#brush-spray-particle-density-range',",
              '    HTMLInputElement,',
              '  );',
              '  const sprayParticleDensityNumber = requireElement(',
              "    '#brush-spray-particle-density-number',",
              '    HTMLInputElement,',
              '  );',
              "  const tipShape = requireElement('#brush-tip-shape', HTMLSelectElement);",
              '""",',
          ])
          if s.count(old) != 1:
              raise SystemExit(f'expected one UI anchor source block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply M6A-059 particle-density patch
        run: python3 scripts/patch-m6a059-particle-density.py
      - name: Format changed TypeScript and verifier
        run: >-
          npx biome format --write
          src/domain/brush-schema.ts
          src/gpu/baseline-brush.ts
          src/app/canonical-raster-brush.ts
          src/app/paint-session-controller.ts
          src/app/brush-preset-library.ts
          src/app/brush-preset-controller.ts
          tests/unit/brush-particle-density.test.ts
          scripts/verify-m6a-brush.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: M6A-059 particle-density regression
        run: npx vitest run tests/unit/brush-particle-density.test.ts
      - name: Spray and density-chain regression
        run: >-
          npx vitest run
          tests/unit/brush-spray-mode.test.ts
          tests/unit/brush-particle-size.test.ts
          tests/unit/brush-density-jitter.test.ts
          tests/unit/brush-position-jitter.test.ts
          tests/unit/brush-color-jitter.test.ts
          tests/unit/brush-stroke-repetition.test.ts
          tests/unit/brush-forced-taper.test.ts
          tests/unit/brush-post-stroke-correction.test.ts
      - name: M6A verification
        run: npm run verify:m6a
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f scripts/patch-m6a059-particle-density.py .github/workflows/illustro-m6a059-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: implement M6A particle density'
          git push origin HEAD:main
