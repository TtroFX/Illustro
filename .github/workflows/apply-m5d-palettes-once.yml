name: Apply M5D palettes once

on:
  push:
    branches:
      - work/m5d-palettes-20260902
    paths:
      - .github/workflows/apply-m5d-palettes-once.yml
      - scripts/apply-m5d-palettes.py

permissions:
  contents: write

jobs:
  apply-verify-persist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply M5D palettes
        run: npm run --silent prepare:build-info >/dev/null 2>&1 || true; python scripts/apply-m5d-palettes.py
      - name: Correct palette accessibility markup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/index.html')
          text = p.read_text()
          text = text.replace('<div class="shell-color-palette-order" aria-label="パレット順序">', '<div class="shell-color-palette-order">')
          p.write_text(text)
          PY
      - name: Format
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Prepare generated assets
        run: npm run prepare:generated
      - name: Focused M5D palette tests
        run: npx vitest run tests/unit/color-workflow.test.ts tests/unit/palette-workflow.test.ts tests/unit/baseline-color-paint.test.ts tests/unit/paint-session-controller.test.ts tests/unit/renderer-controller.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: M5D contract inspection
        run: npm run verify:m5d
      - name: Full unit regression
        run: npm run test:unit
      - name: Production build
        env:
          ILLUSTRO_BUILD_MODE: production
        run: npm run build
      - name: Integration regression
        run: npm run test:integration
      - name: Persist verified production implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-m5d-palettes.py
          git checkout HEAD -- .github/workflows/apply-m5d-palettes-once.yml
          git config user.name "TtroFX"
          git config user.email "ttro0419@gmail.com"
          git add -A
          git commit -m "feat: add named color palettes"
          git push origin HEAD:work/m5d-palettes-20260902
