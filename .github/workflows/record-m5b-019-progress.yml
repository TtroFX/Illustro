name: Record M5B-019 Progress

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  record:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Record verified progress
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          old = 'M5B-019 merge down:未完了'
          new = 'M5B-019 merge down:完了'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one progress marker, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/record-m5b-019-progress.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: record verified M5B-019 progress [skip ci]'
          git push origin HEAD:main
