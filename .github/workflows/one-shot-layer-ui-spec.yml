name: One-shot layer UI spec update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-layer-ui-spec.yml"

permissions:
  contents: write

jobs:
  update-layer-ui-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Patch canonical design memo
        run: python .github/scripts/patch_layer_ui_spec.py
      - name: Commit and push canonical memo update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ILLUSTRO_DESIGN_MEMO.md
          if git diff --cached --quiet; then
            echo "No memo changes to commit."
            exit 0
          fi
          git commit -m "docs: adopt compact symbol-first layer controls"
          git push origin HEAD:main
