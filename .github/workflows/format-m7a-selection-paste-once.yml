name: Format M7A selection paste once

on:
  push:
    branches: [main]
    paths:
      - '.github/format-m7a-selection-paste-trigger'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Format paste implementation and tests
        run: npx biome format --write src/app/selection-paste-engine.ts tests/unit/selection-paste-engine.test.ts
      - name: Commit formatter output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/selection-paste-engine.ts tests/unit/selection-paste-engine.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'style(M7A): format selection paste'
          git push origin HEAD:main
