name: Freeze lasso selection contract once

on:
  push:
    branches: [main]
    paths:
      - '.github/lasso-selection-contract-trigger'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Rebase latest main
        run: git pull --rebase origin main
      - name: Freeze authoritative lasso contract and reopen M8E
        run: python scripts/freeze-lasso-selection-contract-once.py
      - name: Remove temporary helpers
        run: rm .github/workflows/freeze-lasso-selection-contract-once.yml .github/lasso-selection-contract-trigger scripts/freeze-lasso-selection-contract-once.py
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: freeze canonical lasso selection contract'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
