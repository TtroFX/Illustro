name: Apply Illustro I final closure

'on':
  push:
    branches:
      - main
    paths:
      - '.phase-i-final-closure.md'
      - '.github/workflows/apply-phase-i-final-closure.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append closure once
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq '# Phase I Final Sampled-Asset Closure — 2026-08-30' ILLUSTRO_DESIGN_MEMO.md; then
            echo 'I final closure already present; no append needed.'
          else
            printf '\n\n' >> ILLUSTRO_DESIGN_MEMO.md
            cat .phase-i-final-closure.md >> ILLUSTRO_DESIGN_MEMO.md
          fi
      - name: Commit canonical memo
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- ILLUSTRO_DESIGN_MEMO.md; then
            echo 'No memo change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ILLUSTRO_DESIGN_MEMO.md
          git commit -m 'docs: formally close I sampled asset phase'
          git push origin main
