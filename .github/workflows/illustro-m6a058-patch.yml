name: Illustro one-shot M6A-058 patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore dependencies
        run: npm ci
      - name: Align M6A-058 disposal patch anchor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/patch-m6a058-particle-size.py')
          s = p.read_text(encoding='utf-8')
          old_anchor = "      sprayEnabledButton.removeEventListener('click', onSprayEnabled);\\n      tipShape.removeEventListener('change', onTipShape);\\n"
          new_anchor = "      sprayEnabledButton.removeEventListener('click', onSprayEnabled);\\n      pressureCurveEditor?.dispose();\\n"
          if s.count(old_anchor) != 1:
              raise SystemExit(f'expected one old disposal anchor, found {s.count(old_anchor)}')
          s = s.replace(old_anchor, new_anchor, 1)
          old_replacement = """      sprayEnabledButton.removeEventListener('click', onSprayEnabled);
      sprayParticleSizeRange.removeEventListener('input', onSprayParticleSizeRange);
      sprayParticleSizeNumber.removeEventListener('change', onSprayParticleSizeNumber);
      tipShape.removeEventListener('change', onTipShape);
"""
          new_replacement = """      sprayEnabledButton.removeEventListener('click', onSprayEnabled);
      sprayParticleSizeRange.removeEventListener('input', onSprayParticleSizeRange);
      sprayParticleSizeNumber.removeEventListener('change', onSprayParticleSizeNumber);
      pressureCurveEditor?.dispose();
"""
          if s.count(old_replacement) != 1:
              raise SystemExit(f'expected one old disposal replacement, found {s.count(old_replacement)}')
          p.write_text(s.replace(old_replacement, new_replacement, 1), encoding='utf-8')
          PY
      - name: Apply M6A-058 particle-size patch
        run: python3 scripts/patch-m6a058-particle-size.py
      - name: Format changed TypeScript and verifier
        run: >-
          npx biome format --write
          src/domain/brush-schema.ts
          src/gpu/baseline-brush.ts
          src/app/canonical-raster-brush.ts
          src/app/paint-session-controller.ts
          src/app/brush-preset-library.ts
          src/app/brush-preset-controller.ts
          tests/unit/brush-particle-size.test.ts
          scripts/verify-m6a-brush.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: M6A-058 particle-size regression
        run: npx vitest run tests/unit/brush-particle-size.test.ts
      - name: Spray and size-chain regression
        run: >-
          npx vitest run
          tests/unit/brush-spray-mode.test.ts
          tests/unit/brush-size-jitter.test.ts
          tests/unit/brush-pressure-dynamics.test.ts
          tests/unit/brush-tilt-dynamics.test.ts
          tests/unit/brush-velocity-dynamics.test.ts
          tests/unit/brush-random-dynamics.test.ts
          tests/unit/brush-size-taper.test.ts
          tests/unit/brush-forced-taper.test.ts
          tests/unit/brush-post-stroke-correction.test.ts
      - name: M6A verification
        run: npm run verify:m6a
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f scripts/patch-m6a058-particle-size.py .github/workflows/illustro-m6a058-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: implement M6A particle size'
          git push origin HEAD:main
