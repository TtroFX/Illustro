name: Format M1 command contracts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m1-batch5-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - name: Apply Biome formatting
        run: npx biome format --write src/domain/command-registry.ts src/domain/serialization.ts tests/unit/command-registry.test.ts tests/unit/serialization.test.ts
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/domain/command-registry.ts src/domain/serialization.ts tests/unit/command-registry.test.ts tests/unit/serialization.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style: format M1 command contracts [skip ci]'
          git push origin HEAD:main
