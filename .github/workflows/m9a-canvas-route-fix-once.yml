name: Fix Library canvas route once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m9a-canvas-route-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Rebase latest main
        run: git pull --rebase origin main
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply route patch
        run: python scripts/m9a-canvas-route-fix-once.py
      - name: Format and verify
        run: |
          npx biome format --write src/app/m9a-library-surface.ts tests/unit/m9a-library-production.test.ts
          npm run typecheck
          npx vitest run tests/unit/m9a-library-production.test.ts
      - name: Remove temporary helpers
        run: |
          rm .github/workflows/m9a-canvas-route-fix-once.yml
          rm scripts/m9a-canvas-route-fix-once.py
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/m9a-library-surface.ts tests/unit/m9a-library-production.test.ts .github/workflows/m9a-canvas-route-fix-once.yml scripts/m9a-canvas-route-fix-once.py
          git commit -m 'fix: restore Library to Canvas navigation'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
