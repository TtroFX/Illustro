name: Apply Illustro phase 2 UX closure

'on':
  push:
    paths:
      - '.github/workflows/apply-phase2-ux-closure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply phase 2 UX closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          memo = Path('ILLUSTRO_DESIGN_MEMO.md')
          stage = Path('.phase2-ux-closure.md')
          text = memo.read_text(encoding='utf-8')
          closure = stage.read_text(encoding='utf-8').strip()
          marker = '# Phase 2 UX / Interaction Closure — 2026-08-30'
          if marker not in text:
              text = text.rstrip() + '\n\n' + closure + '\n'
          for line in [
              '- Exact editor information architecture and panel inventory\n',
              '- Exact left-toolbar tool inventory/order\n',
              '- Exact right-inspector tabs/panels and fixed-bottom controls\n',
          ]:
              text = text.replace(line, '')
          memo.write_text(text, encoding='utf-8')
          PY
          grep -F '# Phase 2 UX / Interaction Closure — 2026-08-30' ILLUSTRO_DESIGN_MEMO.md
          grep -F '## P2-2. Primary Tool Rail inventory and order — CLOSED' ILLUSTRO_DESIGN_MEMO.md
          grep -F '## P2-3. Right Inspector block inventory and default order — CLOSED' ILLUSTRO_DESIGN_MEMO.md
          grep -F '## P2-8. Canonical Command Registry — CLOSED' ILLUSTRO_DESIGN_MEMO.md
          ! grep -F -- '- Exact editor information architecture and panel inventory' ILLUSTRO_DESIGN_MEMO.md
          ! grep -F -- '- Exact left-toolbar tool inventory/order' ILLUSTRO_DESIGN_MEMO.md
          ! grep -F -- '- Exact right-inspector tabs/panels and fixed-bottom controls' ILLUSTRO_DESIGN_MEMO.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ILLUSTRO_DESIGN_MEMO.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: close phase 2 UX interaction specification'
          git push origin HEAD:main
