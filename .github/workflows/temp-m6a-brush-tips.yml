name: Temporary M6A Brush Tips

on:
  push:
    branches: [work/m6a-brush-tips-20260903]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply M6A brush tips
        run: python scripts/apply-m6a-brush-tips.py
      - name: Formatting
        run: |
          npm run format
          npm run format:check
      - name: Lint
        run: npm run lint
      - name: Focused M6A brush-tip tests
        run: npx vitest run tests/unit/brush-tip.test.ts tests/unit/baseline-brush.test.ts tests/unit/canonical-raster-brush.test.ts tests/unit/brush-properties.test.ts tests/unit/paint-session-controller.test.ts tests/unit/baseline-raster-tile-store.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: M5D compatibility inspection
        run: npm run verify:m5d
      - name: M6A contract inspection
        run: npm run verify:m6a
      - name: Full unit suite
        run: npm run test:unit
      - name: Production build
        env:
          ILLUSTRO_BUILD_MODE: production
        run: npm run build
      - name: Integration tests
        run: npm run test:integration
      - name: Persist verified implementation
        run: |
          rm -f .github/workflows/temp-m6a-brush-tips.yml scripts/apply-m6a-brush-tips.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement M6A brush tip system"
          git push origin HEAD:work/m6a-brush-tips-20260903
