name: Close M7A003004 once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Verify integrated selection AA
        run: |
          grep -q 'polygonPixelCoverageV1' src/app/selection-shape-engine.ts
          npx biome format src/app/selection-shape-engine.ts tests/unit/selection-shape-engine.test.ts
          npx biome lint src/app/selection-shape-engine.ts tests/unit/selection-shape-engine.test.ts
          cat > tsconfig.m7a003004.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": { "rootDir": "." },
            "include": [
              "src/app/selection-shape-engine.ts",
              "tests/unit/selection-shape-engine.test.ts"
            ]
          }
          EOF
          npx tsc -p tsconfig.m7a003004.json --noEmit
          rm tsconfig.m7a003004.json
          npx vitest run tests/unit/selection-shape-engine.test.ts
      - name: Close canonical progress
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('IMPLEMENTATION_PROGRESS.md')
          text = p.read_text()
          replacements = [
            ('M7A-003 Lasso selection:未完了', 'M7A-003 Lasso selection:完了'),
            ('M7A-004 freehand selection:未完了', 'M7A-004 freehand selection:完了'),
          ]
          for old, new in replacements:
            if old in text:
              text = text.replace(old, new, 1)
            elif new not in text:
              raise SystemExit(f'progress anchor missing: {old}')
          p.write_text(text)
          PY
      - name: Commit progress closure
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPLEMENTATION_PROGRESS.md
          git commit -m 'chore: close M7A-003 and M7A-004'
          git push
