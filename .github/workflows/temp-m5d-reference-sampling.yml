name: temp M5D reference sampling

on:
  push:
    branches:
      - work/m5d-reference-sampling-20260902

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/m5d-reference-sampling-20260902
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi
          npm ci --ignore-scripts
      - name: Apply M5D reference sampling fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/index.html')
          text = p.read_text()
          open_old = '<div class="shell-reference-view-actions" aria-label="参照画像の表示操作">'
          open_role = '<div class="shell-reference-view-actions" role="group" aria-label="参照画像の表示操作">'
          open_new = '<fieldset class="shell-reference-view-actions" aria-label="参照画像の表示操作">'
          if open_old in text:
              text = text.replace(open_old, open_new, 1)
          elif open_role in text:
              text = text.replace(open_role, open_new, 1)
          elif open_new not in text:
              raise SystemExit('expected reference group opening missing')
          close_old = '<button id="reference-rotate-right" type="button" aria-label="参照画像を右へ90度回転" disabled>↷</button>\n            </div>'
          close_new = '<button id="reference-rotate-right" type="button" aria-label="参照画像を右へ90度回転" disabled>↷</button>\n            </fieldset>'
          if close_old in text:
              text = text.replace(close_old, close_new, 1)
          elif close_new not in text:
              raise SystemExit('expected reference group closing missing')
          p.write_text(text)
          css = Path('public/app-shell.css')
          css_text = css.read_text()
          anchor = '.shell-reference-view-actions {\n  display: grid;\n  grid-template-columns: repeat(5, minmax(0, 1fr));\n  gap: 0.35rem;\n}'
          replacement = '.shell-reference-view-actions {\n  display: grid;\n  grid-template-columns: repeat(5, minmax(0, 1fr));\n  gap: 0.35rem;\n  min-inline-size: 0;\n  margin: 0;\n  border: 0;\n  padding: 0;\n}'
          if anchor in css_text:
              css_text = css_text.replace(anchor, replacement, 1)
          elif replacement not in css_text:
              raise SystemExit('expected reference action CSS anchor missing')
          css.write_text(css_text)
          PY
      - name: Formatting
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Prepare generated assets
        run: npm run prepare:generated
      - name: Focused M5D tests
        run: npx vitest run tests/unit/reference-workspace.test.ts tests/unit/color-sampling.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: M5D contract inspection
        run: npm run verify:m5d
      - name: Full unit suite
        run: npm run test:unit
      - name: Production build
        env:
          ILLUSTRO_BUILD_MODE: production
        run: npm run build
      - name: Integration tests
        run: npm run test:integration
      - name: Persist verified implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.html public/app-shell.css
          git commit -m "fix: group reference view controls semantically"
          git push origin HEAD:work/m5d-reference-sampling-20260902
