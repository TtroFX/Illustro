name: temp M5D reference sampling

on:
  push:
    branches:
      - work/m5d-reference-sampling-20260902

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/m5d-reference-sampling-20260902
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm toolchain
        run: corepack enable
      - name: Restore locked dependencies
        run: npm ci
      - name: Apply M5D reference sampling
        run: python scripts/apply-m5d-reference-sampling.py
      - name: Formatting
        run: npm run format
      - name: Prepare generated assets
        run: npm run prepare:generated
      - name: Focused M5D tests
        run: npx vitest run tests/unit/reference-workspace.test.ts tests/unit/color-sampling.test.ts tests/unit/color-workspace.test.ts tests/unit/color-palettes.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: M5D contract inspection
        run: npm run verify:m5d
      - name: Full unit suite
        run: npm test -- --run
      - name: Production build
        run: npm run build
      - name: Integration tests
        run: npm run test:integration
      - name: Persist verified implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/reference-workspace-state.ts src/app/reference-workflow-controller.ts src/app/color-workflow-controller.ts src/app/main.ts src/index.html public/app-shell.css tests/unit/reference-workspace.test.ts scripts/verify-m5d-color.mjs IMPLEMENTATION_PROGRESS.md ILLUSTRO_DESIGN_MEMO.md
          git commit -m "feat: add M5D reference image sampling"
          git push origin HEAD:work/m5d-reference-sampling-20260902
