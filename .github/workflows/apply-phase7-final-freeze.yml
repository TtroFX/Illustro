name: Apply Illustro final design freeze

'on':
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-phase7-final-freeze.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append final completion gate once
        shell: bash
        run: |
          set -euo pipefail
          marker='# Phase 7C Final Completion Gate — IMPLEMENTATION READY / DESIGN FREEZE — 2026-08-30'
          if ! grep -Fqx "$marker" ILLUSTRO_DESIGN_MEMO.md; then
            printf '\n\n' >> ILLUSTRO_DESIGN_MEMO.md
            cat .phase7-final-completion-gate.md >> ILLUSTRO_DESIGN_MEMO.md
            printf '\n' >> ILLUSTRO_DESIGN_MEMO.md
          fi
      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ILLUSTRO_DESIGN_MEMO.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: declare implementation ready design freeze'
          git push
