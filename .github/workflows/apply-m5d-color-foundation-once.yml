name: Apply M5D color foundation once

on:
  push:
    branches:
      - work/m5d-color-foundation-20260902
    paths:
      - .github/workflows/apply-m5d-color-foundation-once.yml
      - scripts/apply-m5d-color-foundation.py

permissions:
  contents: write

jobs:
  apply-verify-persist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Correct generated lint details
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-m5d-color-foundation.py')
          t = p.read_text()
          t = t.replace('constructor:', 'elementType:')
          t = t.replace('instanceof constructor', 'instanceof elementType')
          t = t.replace(' role=\\"group\\" aria-label=\\"RGB入力\\"', '')
          t = t.replace(' role=\\"group\\" aria-label=\\"HSV入力\\"', '')
          t = t.replace(' role=\\"group\\" aria-label=\\"色履歴\\"', '')
          t = t.replace(' aria-label=\\"RGB入力\\"', '')
          t = t.replace(' aria-label=\\"HSV入力\\"', '')
          t = t.replace(' aria-label=\\"色履歴\\"', '')
          p.write_text(t)
          PY
      - name: Apply M5D color foundation
        run: python scripts/apply-m5d-color-foundation.py
      - name: Update retained-scene instance expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/unit/baseline-paint-renderer.test.ts')
          t = p.read_text()
          replacements = [
              ('instanceCounts: [3],\n      bufferWrites: [15],', 'instanceCounts: [3],\n      bufferWrites: [24],'),
              ('instanceCounts: [2, 1, 1],\n      bufferWrites: [10, 5, 5],', 'instanceCounts: [2, 1, 1],\n      bufferWrites: [16, 8, 8],'),
              ('instanceCounts: [1],\n      bufferWrites: [5],', 'instanceCounts: [1],\n      bufferWrites: [8],'),
              ('instanceCounts: [1, 1],\n      bufferWrites: [5, 5],', 'instanceCounts: [1, 1],\n      bufferWrites: [8, 8],'),
          ]
          for before, after in replacements:
              if t.count(before) != 1:
                  raise SystemExit(f'expected one renderer test anchor: {before!r}')
              t = t.replace(before, after, 1)
          p.write_text(t)
          PY
      - name: Format
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Prepare generated assets
        run: npm run prepare:generated
      - name: Focused M5D tests
        run: npx vitest run tests/unit/color-workflow.test.ts tests/unit/baseline-color-paint.test.ts tests/unit/baseline-brush.test.ts tests/unit/baseline-raster-tile-store.test.ts tests/unit/paint-session-controller.test.ts tests/unit/renderer-controller.test.ts tests/unit/baseline-paint-renderer.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: M5D contract inspection
        run: npm run verify:m5d
      - name: Full unit regression
        run: npm run test:unit
      - name: Production build
        env:
          ILLUSTRO_BUILD_MODE: production
        run: npm run build
      - name: Integration regression
        run: npm run test:integration
      - name: Persist verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-m5d-color-foundation-once.yml scripts/apply-m5d-color-foundation.py
          git config user.name "TtroFX"
          git config user.email "ttro0419@gmail.com"
          git add -A
          git commit -m "feat: implement M5D color foundation"
          git push origin HEAD:work/m5d-color-foundation-20260902
