name: Fix baseline lint once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-baseline-lint-once.yml'

permissions:
  contents: write

jobs:
  fix-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fix curve-editor ARIA roles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/index.html')
          text = path.read_text(encoding='utf-8')
          anchors = [
              '<div class="shell-brush-pressure-curve-editor" aria-label="筆圧レスポンスカーブ">',
              '<div class="shell-brush-pressure-curve-editor shell-brush-tilt-curve-editor" aria-label="傾きレスポンスカーブ">',
              '<div class="shell-brush-pressure-curve-editor shell-brush-velocity-curve-editor" aria-label="速度レスポンスカーブ">',
              '<div class="shell-brush-pressure-curve-editor shell-brush-random-curve-editor" aria-label="ランダムレスポンスカーブ">',
          ]
          for old in anchors:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one curve-editor ARIA anchor, found {count}: {old!r}')
              text = text.replace(old, old.replace(' aria-label=', ' role="group" aria-label='), 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Format repaired file
        run: npx biome format --write src/index.html

      - name: Lint
        run: npx biome lint --max-diagnostics=200 src tests scripts bench vitest.config.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Verify M6A contracts
        run: npm run verify:m6a

      - name: Production build
        run: npm run build

      - name: Integration tests
        run: npm run test:integration

      - name: Commit verified lint repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.html
          git diff --cached --check
          git commit -m 'fix: repair brush curve editor ARIA roles'
          git push origin HEAD:main
