name: Fix baseline lint once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-baseline-lint-once.yml'

permissions:
  contents: write

jobs:
  fix-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use semantic curve-editor fieldsets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/index.html')
          text = path.read_text(encoding='utf-8')
          anchors = [
              '<div class="shell-brush-pressure-curve-editor" aria-label="筆圧レスポンスカーブ">',
              '<div class="shell-brush-pressure-curve-editor shell-brush-tilt-curve-editor" aria-label="傾きレスポンスカーブ">',
              '<div class="shell-brush-pressure-curve-editor shell-brush-velocity-curve-editor" aria-label="速度レスポンスカーブ">',
              '<div class="shell-brush-pressure-curve-editor shell-brush-random-curve-editor" aria-label="ランダムレスポンスカーブ">',
          ]

          edits = []
          for old in anchors:
              start = text.find(old)
              if start < 0 or text.find(old, start + 1) >= 0:
                  raise SystemExit(f'expected one curve-editor container: {old!r}')
              depth = 0
              closing_start = None
              closing_end = None
              for match in re.finditer(r'<div\b[^>]*>|</div>', text[start:]):
                  token = match.group(0)
                  if token.startswith('<div'):
                      depth += 1
                  else:
                      depth -= 1
                      if depth == 0:
                          closing_start = start + match.start()
                          closing_end = start + match.end()
                          break
              if closing_start is None or closing_end is None:
                  raise SystemExit(f'unmatched curve-editor container: {old!r}')
              new_open = old.replace('<div ', '<fieldset ', 1)
              edits.append((start, start + len(old), new_open))
              edits.append((closing_start, closing_end, '</fieldset>'))

          for start, end, replacement in sorted(edits, reverse=True):
              text = text[:start] + replacement + text[end:]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Lint
        run: npx biome lint --max-diagnostics=200 src tests scripts bench vitest.config.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Verify M6A contracts
        run: npm run verify:m6a

      - name: Production build
        run: npm run build

      - name: Integration tests
        run: npm run test:integration

      - name: Commit verified lint repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.html
          git diff --cached --check
          git commit -m 'fix: use semantic brush curve editor fieldsets'
          git push origin HEAD:main
