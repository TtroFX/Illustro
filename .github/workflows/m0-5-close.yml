name: Close M0.5 deployment foundation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m0-5-close.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Close verified M0.5 items
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text(encoding='utf-8')
          items = [
              'M0.5-002 Production deployment target作成',
              'M0.5-004 main branchからProduction自動更新',
              'M0.5-006 Preview URL固定導線',
              'M0.5-検査 M0.5公開基盤内部検査',
          ]
          for item in items:
              old = f'{item}:未完了'
              new = f'{item}:完了'
              if old not in text and new not in text:
                  raise SystemExit(f'missing progress item: {item}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit verified progress
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add IMPLEMENTATION_PROGRESS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: close M0.5 deployment foundation [skip ci]'
          git push origin HEAD:main
