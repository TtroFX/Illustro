name: Close M3 render scheduling foundation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m3-render-foundation-close.yml'

permissions:
  contents: write

jobs:
  verify-close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - name: Verify production wiring
        run: |
          grep -q "MAX_DIRECT_TILE_HALO_PX = 64" src/gpu/transient-targets.ts
          grep -q "RENDER_COMMAND_QUEUE_SOFT_BOUND = 1_024" src/gpu/render-scheduler.ts
          grep -q "frame.composite-node" src/gpu/frame-compositor.ts
          grep -q "installRenderSchedulingExtensionV1" src/workers/render.worker.ts
          grep -q "renderSchedulingController?.attachGpuDevice(device)" src/workers/render.worker.ts
      - name: Render foundation unit matrix
        run: >-
          npx vitest run
          tests/unit/transient-targets.test.ts
          tests/unit/render-scheduler.test.ts
          tests/unit/frame-compositor.test.ts
          tests/unit/render-scheduling-extension.test.ts
      - name: Close M3-027 through M3-030
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          items = [
              'M3-027 transient halo/filter target management',
              'M3-028 render scheduling',
              'M3-029 priority scheduling foundation',
              'M3-030 frame compositor foundation',
          ]
          for item in items:
              old = f'{item}:未完了'
              new = f'{item}:完了'
              if old not in text:
                  raise SystemExit(f'missing progress item: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit verified closure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPLEMENTATION_PROGRESS.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: close M3 render scheduling foundation [skip ci]'
          git push
