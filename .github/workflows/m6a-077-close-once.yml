name: Close M6A-077 once

'on':
  push:
    branches:
      - main
    paths:
      - '.github/m6a-077-close-trigger'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close exact progress marker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          old = 'M6A-077 deterministic brush thumbnails:未完了'
          new = 'M6A-077 deterministic brush thumbnails:完了'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one unfinished M6A-077 marker, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPLEMENTATION_PROGRESS.md
          git diff --cached --check
          git diff --cached --exit-code -- . ':!IMPLEMENTATION_PROGRESS.md'
          git commit -m 'docs: close M6A-077 deterministic thumbnails'
          git push origin HEAD:main
