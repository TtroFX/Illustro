name: Verify M7A024 branch

on:
  push:
    branches:
      - work/m7a-024-selection-fill-20260905

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Format M7A024 files
        run: npx biome format --write src/app/selection-fill-engine.ts tests/unit/selection-fill-engine.test.ts
      - name: Lint M7A024 files
        run: npx biome lint src/app/selection-fill-engine.ts tests/unit/selection-fill-engine.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted unit test
        run: npx vitest run tests/unit/selection-fill-engine.test.ts
      - name: Persist formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/selection-fill-engine.ts tests/unit/selection-fill-engine.test.ts
          git commit -m 'style(M7A): format selection-scoped fill'
          git push
