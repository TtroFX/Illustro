name: Format M8C once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m8c-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Format M8C files
        run: npx biome format --write src/app/m8-tool-rail.ts tests/unit/m8-tool-rail.test.ts
      - name: Remove helper
        run: rm .github/workflows/m8c-format-once.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/m8-tool-rail.ts tests/unit/m8-tool-rail.test.ts .github/workflows/m8c-format-once.yml
          git commit -m 'style: format M8C tool rail'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
