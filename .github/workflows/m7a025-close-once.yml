name: Close M7A025 once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Verify integrated M7A025 files
        run: |
          npx biome format src/app/selection-layer-operation-engine.ts src/app/layer-workflow-controller.ts tests/unit/selection-layer-operation-engine.test.ts
          npx biome lint src/app/selection-layer-operation-engine.ts src/app/layer-workflow-controller.ts tests/unit/selection-layer-operation-engine.test.ts
          cat > tsconfig.m7a025.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": { "rootDir": "." },
            "include": [
              "src/app/selection-layer-operation-engine.ts",
              "tests/unit/selection-layer-operation-engine.test.ts"
            ]
          }
          EOF
          npx tsc -p tsconfig.m7a025.json --noEmit
          rm tsconfig.m7a025.json
          npx vitest run tests/unit/selection-layer-operation-engine.test.ts tests/unit/selection-cut-engine.test.ts tests/unit/selection-filter-engine.test.ts
          grep -q "layer.selection.clear" src/app/layer-workflow-controller.ts
          grep -q "layer.selection.invert" src/app/layer-workflow-controller.ts
      - name: Close canonical progress item
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          old = 'M7A-025 selection-scoped layer operations:未完了'
          new = 'M7A-025 selection-scoped layer operations:完了'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one open M7A-025 item, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit progress closure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPLEMENTATION_PROGRESS.md
          git commit -m 'chore: close M7A-025 selection layer operations'
          git push
