name: Close M7A selection copy once

on:
  push:
    branches: [main]
    paths:
      - '.github/m7a-selection-copy-progress-trigger'

permissions:
  contents: write

jobs:
  close-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Close exact progress item
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text(encoding='utf-8')
          old = 'M7A-020 selection copy:未完了'
          new = 'M7A-020 selection copy:完了'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one progress item, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit progress closure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPLEMENTATION_PROGRESS.md
          git diff --cached --quiet && exit 0
          git commit -m 'chore: close M7A selection copy'
          git push origin HEAD:main
