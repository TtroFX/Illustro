name: Format M3 pointer ingestion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m3-pointer-format.yml'

permissions:
  contents: write

jobs:
  format-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - name: Format pointer ingestion
        run: >-
          npx biome format --write
          src/input/pointer-input.ts
          tests/unit/pointer-input.test.ts
          tests/unit/pointer-input-controller.test.ts
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Commit verified formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/input/pointer-input.ts tests/unit/pointer-input.test.ts tests/unit/pointer-input-controller.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'style: format M3 pointer ingestion [skip ci]'
          git push
