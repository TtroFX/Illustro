name: Integrate M8E context once

on:
  push:
    branches: [main]
    paths:
      - '.github/m8e-context-integrate-trigger'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Rebase latest main
        run: git pull --rebase origin main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: |
          npm install --global npm@11.19.1
          npm ci --ignore-scripts
      - name: Apply M8E context integration
        run: node scripts/integrate-m8e-context-once.mjs
      - name: Format M8E context integration
        run: npx biome format --write src/app/main.ts src/app/m8-selection-launcher.ts src/app/m8-contextual-canvas-controller.ts tests/unit/m8-selection-launcher.test.ts tests/unit/m8-contextual-canvas-controller.test.ts
      - name: Repository format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Focused M8E tests
        run: npx vitest run tests/unit/m8-selection-launcher.test.ts tests/unit/m8-selection-transform-controller.test.ts tests/unit/m8-contextual-canvas-controller.test.ts tests/unit/selection-cut-engine.test.ts tests/unit/selection-fill-engine.test.ts
      - name: Production build
        run: npm run build
      - name: Remove temporary helpers
        run: rm .github/workflows/integrate-m8e-context-once.yml .github/m8e-context-integrate-trigger scripts/integrate-m8e-context-once.mjs
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrate M8E contextual canvas controls'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
