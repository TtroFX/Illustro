name: Illustro one-shot M6A-031 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/illustro-m6a031-patch.py'
      - '.github/workflows/illustro-m6a031-patch.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply M6A-031 opacity-taper patch
        run: python .github/illustro-m6a031-patch.py
      - name: Align zero-envelope visibility expectation
        run: >-
          python -c "from pathlib import Path; p=Path('tests/unit/brush-opacity-taper.test.ts'); s=p.read_text(); old='    expect(start).toEqual([]);\n'; new='    expect(start).toHaveLength(1);\n    expect(start[0]?.radius).toBeCloseTo(4, 6);\n    expect(start[0]?.flow).toBeCloseTo(0.8, 6);\n'; assert s.count(old)==1; p.write_text(s.replace(old,new,1))"
      - name: Format changed TypeScript and verifier
        run: >-
          npx biome format --write
          src/domain/brush-schema.ts
          src/gpu/baseline-brush.ts
          src/app/canonical-raster-brush.ts
          src/app/paint-session-controller.ts
          src/app/brush-preset-library.ts
          src/app/brush-preset-controller.ts
          tests/unit/brush-opacity-taper.test.ts
          scripts/verify-m6a-brush.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted regression tests
        run: >-
          npx vitest run
          tests/unit/brush-opacity-taper.test.ts
          tests/unit/brush-size-taper.test.ts
          tests/unit/brush-stroke-end.test.ts
          tests/unit/brush-stroke-start.test.ts
          tests/unit/brush-stroke-repetition.test.ts
          tests/unit/brush-follow-rotation.test.ts
          tests/unit/brush-tip-direction.test.ts
          tests/unit/brush-tip-angle.test.ts
          tests/unit/brush-spacing.test.ts
          tests/unit/brush-tip-density.test.ts
          tests/unit/sampled-image-brush-tip.test.ts
          tests/unit/custom-brush-tip.test.ts
          tests/unit/procedural-brush-tip.test.ts
          tests/unit/baseline-brush.test.ts
          tests/unit/canonical-raster-brush.test.ts
          tests/unit/paint-session-controller.test.ts
          tests/unit/baseline-raster-tile-store.test.ts
          tests/unit/baseline-paint-renderer.test.ts
      - name: M6A verification
        run: npm run verify:m6a
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/illustro-m6a031-patch.py
          rm -f .github/workflows/illustro-m6a031-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: implement M6A brush opacity taper"
          git push origin HEAD:main