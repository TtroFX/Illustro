name: Format canonical M8B once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m8b-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format M8B implementation
        run: npx biome format --write src/app/m8-product-shell.ts tests/unit/m8-product-shell.test.ts
      - name: Commit formatting and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m8b-format-once.yml
          git add src/app/m8-product-shell.ts tests/unit/m8-product-shell.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format canonical M8B shell"
          git push origin HEAD:main
