name: Illustro one-shot M6A-050 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/illustro-m6a050-patch.py'
      - '.github/workflows/illustro-m6a050-patch.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Normalize M6A-049 UI anchors for patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/app/brush-preset-controller.ts')
          text = path.read_text()

          declaration_pattern = re.compile(
              r"  const flowMinimumResponseRange = requireElement\([\s\S]*?  const tipShape = requireElement\('#brush-tip-shape', HTMLSelectElement\);"
          )
          declaration_replacement = "  const flowMinimumResponseRange = requireElement('#brush-flow-minimum-response-range', HTMLInputElement);\n  const flowMinimumResponseNumber = requireElement('#brush-flow-minimum-response-number', HTMLInputElement);\n  const tipShape = requireElement('#brush-tip-shape', HTMLSelectElement);"
          text, declaration_count = declaration_pattern.subn(declaration_replacement, text, count=1)
          if declaration_count != 1:
              raise SystemExit(f'M6A-049 declaration anchor normalization matched {declaration_count} blocks')

          render_pattern = re.compile(
              r"    const flowMinimumResponse = brushFlowMinimumResponseV1\(selected\.preset\);[\s\S]*?    tipShape\.value = brushTipShapeV1\(selected\.preset\);"
          )
          render_replacement = "    const flowMinimumResponse = brushFlowMinimumResponseV1(selected.preset);\n    configurePair(flowMinimumResponseRange, flowMinimumResponseNumber, 0, 100, 1, flowMinimumResponse * 100);\n    tipShape.value = brushTipShapeV1(selected.preset);"
          text, render_count = render_pattern.subn(render_replacement, text, count=1)
          if render_count != 1:
              raise SystemExit(f'M6A-049 render anchor normalization matched {render_count} blocks')

          label_pattern = re.compile(
              r"    const minimumResponseLabel = `\$\{[\s\S]*?\$\{flowMinimumResponse > 0 \? ` · DynFlowMin\$\{Math\.round\(flowMinimumResponse \* 100\)\}%` : ''\}`;\n    propertyStatus\.textContent ="
          )
          label_replacement = "    const minimumResponseLabel = `${\n      sizeMinimumResponse > 0 ? ` · DynSizeMin${Math.round(sizeMinimumResponse * 100)}%` : ''\n    }${\n      opacityMinimumResponse > 0 ? ` · DynOpacityMin${Math.round(opacityMinimumResponse * 100)}%` : ''\n    }${flowMinimumResponse > 0 ? ` · DynFlowMin${Math.round(flowMinimumResponse * 100)}%` : ''}`;\n    propertyStatus.textContent ="
          text, label_count = label_pattern.subn(label_replacement, text, count=1)
          if label_count != 1:
              raise SystemExit(f'M6A-049 label anchor normalization matched {label_count} blocks')

          path.write_text(text)
          PY
      - name: Apply M6A-050 maximum-response patch
        run: python3 .github/illustro-m6a050-patch.py
      - name: Format changed TypeScript and verifier
        run: npx biome format --write src/domain/brush-schema.ts src/gpu/baseline-brush.ts src/app/canonical-raster-brush.ts src/app/paint-session-controller.ts src/app/brush-preset-library.ts src/app/brush-preset-controller.ts tests/unit/brush-maximum-response.test.ts scripts/verify-m6a-brush.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted regression tests
        run: npx vitest run tests/unit/brush-maximum-response.test.ts tests/unit/brush-minimum-response.test.ts tests/unit/brush-random-dynamics.test.ts tests/unit/brush-pressure-response-curve.test.ts tests/unit/brush-tilt-mapping.test.ts tests/unit/brush-velocity-mapping.test.ts tests/unit/brush-forced-taper.test.ts tests/unit/brush-post-stroke-correction.test.ts
      - name: M6A verification
        run: npm run verify:m6a
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        run: |
          rm -f .github/illustro-m6a050-patch.py .github/workflows/illustro-m6a050-patch.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement M6A maximum response'
          git push origin HEAD:main