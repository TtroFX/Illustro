name: Complete M6A-071 regenerated sampled resources

'on':
  push:
    branches:
      - main
    paths:
      - '.github/workflows/complete-m6a-071-regeneration.yml'

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Materialize approved deterministic regeneration implementation
        shell: bash
        env:
          GENERATOR_GZIP_B64: 
          PATCH_GZIP_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$GENERATOR_GZIP_B64" | base64 -d | gzip -d > scripts/generate-m6a-sampled-resources.mjs
          printf '%s' "$PATCH_GZIP_B64" | base64 -d | gzip -d > .m6a-071-apply.py
          python .m6a-071-apply.py
      - name: Install dependencies
        run: npm ci
      - name: Verify deterministic sampled resource generator
        run: node scripts/generate-m6a-sampled-resources.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Loader unit test
        run: npx vitest run tests/unit/builtin-sampled-resource-loader.test.ts
      - name: Production build
        run: npm run build
      - name: Production sampled-resource integration test
        run: npx vitest run tests/integration/m6a-sampled-assets.test.ts
      - name: Commit completed M6A-071 unit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .m6a-071-apply.py .github/workflows/complete-m6a-071-regeneration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete M6A-071 sampled resource loading'
          git push origin main
