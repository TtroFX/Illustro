name: Record mobile PNG user pass once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/record-mobile-png-user-pass-once.yml'

permissions:
  contents: write

jobs:
  record-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Record explicit smartphone PNG export pass
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          marker = 'USER-01-EXPORT-001 スマホPNG Export direct handler接続・hidden button中継除去・Exportのcheckpoint依存除去・可視status feedback:完了\n'
          addition = marker + 'USER-01-EXPORT-002 スマホPNG Exportユーザー実機PASS:完了\n'
          if 'USER-01-EXPORT-002 スマホPNG Exportユーザー実機PASS:完了' not in text:
              if marker not in text:
                  raise SystemExit('USER-01 export progress marker not found')
              text = text.replace(marker, addition, 1)
              path.write_text(text)
          PY
      - name: Commit progress record and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/record-mobile-png-user-pass-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPLEMENTATION_PROGRESS.md
          git commit -m 'chore: record smartphone PNG export user pass'
          git push origin HEAD:main
