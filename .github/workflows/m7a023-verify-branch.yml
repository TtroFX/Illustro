name: Verify M7A023 branch

on:
  push:
    branches:
      - work/m7a-023-selection-filter-20260905

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/m7a-023-selection-filter-20260905
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format target files
        run: npx biome format --write src/app/selection-filter-engine.ts tests/unit/selection-filter-engine.test.ts
      - name: Lint target files
        run: npx biome lint src/app/selection-filter-engine.ts tests/unit/selection-filter-engine.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Target unit tests
        run: npx vitest run tests/unit/selection-filter-engine.test.ts
      - name: Finalize verified branch
        shell: bash
        run: |
          rm -f .github/workflows/m7a023-verify-branch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: finalize verified M7A-023 branch'
          git push origin HEAD:work/m7a-023-selection-filter-20260905
