name: Verify M6A-063 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m6a-063-verify-once.yml'

permissions:
  contents: write

jobs:
  verify-m6a-063:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply M6A-063 patch
        run: python3 .github/m6a-063-run-fixed.py

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Format changed sources
        run: >-
          npx biome format --write
          src/domain/brush-schema.ts
          src/gpu/baseline-brush.ts
          src/app/paint-session-controller.ts
          src/app/brush-preset-library.ts
          src/app/brush-preset-controller.ts
          src/gpu/baseline-paint-renderer.ts
          src/workers/render.worker.ts
          src/gpu/baseline-raster-tile-store.ts
          tests/unit/baseline-raster-tile-store.test.ts
          scripts/verify-m6a-brush.mjs

      - name: Lint
        run: npx biome lint --max-diagnostics=200 src tests scripts bench vitest.config.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Verify M6A contracts
        run: npm run verify:m6a

      - name: Production build
        run: npm run build

      - name: Integration tests
        run: npm run test:integration

      - name: Commit verified M6A-063
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            ILLUSTRO_DESIGN_MEMO.md \
            IMPLEMENTATION_PROGRESS.md \
            src/domain/brush-schema.ts \
            src/gpu/baseline-brush.ts \
            src/app/paint-session-controller.ts \
            src/app/brush-preset-library.ts \
            src/app/brush-preset-controller.ts \
            src/gpu/baseline-paint-renderer.ts \
            src/workers/render.worker.ts \
            src/gpu/baseline-raster-tile-store.ts \
            src/index.html \
            tests/unit/baseline-raster-tile-store.test.ts \
            scripts/verify-m6a-brush.mjs
          git diff --cached --check
          git commit -m 'feat: implement wet color pickup'
          git push origin HEAD:main
# retry after explicit runtime parameter types
