name: Apply USER-01 performance and history controls fix

on:
  push:
    paths:
      - '.github/workflows/fix-user01-performance-history.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply focused USER-01 fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected patch target missing: {path}')
              p.write_text(text.replace(old, new, 1))

          # 1) Lightweight per-stroke history state + exact undo/redo restore.
          replace(
              'src/app/paint-session-controller.ts',
              """export interface PaintStrokeCommitV1 {\n  readonly before: PaintProjectSnapshotV1;\n  readonly after: PaintProjectSnapshotV1;\n  readonly committed: CompletedPaintStrokeV1;\n}\n\nexport interface PaintDocumentSettingsUpdateV1 {""",
              """export interface PaintStrokeCommitV1 {\n  readonly before: PaintProjectSnapshotV1;\n  readonly after: PaintProjectSnapshotV1;\n  readonly committed: CompletedPaintStrokeV1;\n}\n\nexport interface PaintStrokeHistoryStateV1 {\n  readonly schema: 'illustro.paint-stroke-history/1';\n  readonly revision: Revision;\n  readonly modifiedAt: string;\n  readonly strokeIndex: number;\n  readonly present: boolean;\n  readonly stroke: CompletedPaintStrokeV1;\n}\n\nexport interface PaintDocumentSettingsUpdateV1 {""",
          )
          replace(
              'src/app/paint-session-controller.ts',
              """export function parsePaintProjectSnapshotV1(value: unknown): PaintProjectSnapshotV1 {""",
              """export function parsePaintStrokeHistoryStateV1(value: unknown): PaintStrokeHistoryStateV1 {\n  if (!isRecord(value) || value.schema !== 'illustro.paint-stroke-history/1') {\n    throw new TypeError('invalid paint stroke history schema');\n  }\n  if (!Number.isSafeInteger(value.strokeIndex) || (value.strokeIndex as number) < 0) {\n    throw new TypeError('invalid paint stroke history index');\n  }\n  if (typeof value.present !== 'boolean') {\n    throw new TypeError('invalid paint stroke history presence');\n  }\n  if (typeof value.modifiedAt !== 'string' || Number.isNaN(Date.parse(value.modifiedAt))) {\n    throw new TypeError('invalid paint stroke history timestamp');\n  }\n  return Object.freeze({\n    schema: 'illustro.paint-stroke-history/1' as const,\n    revision: parseRevision(value.revision),\n    modifiedAt: value.modifiedAt,\n    strokeIndex: value.strokeIndex as number,\n    present: value.present,\n    stroke: parseStoredCompletedStroke(value.stroke),\n  });\n}\n\nexport function parsePaintProjectSnapshotV1(value: unknown): PaintProjectSnapshotV1 {""",
          )
          replace(
              'src/app/paint-session-controller.ts',
              """  activeDabs(): readonly BaselineBrushDabV1[] {\n    return this.#activeDabBuilder?.dabs() ?? Object.freeze([]);\n  }""",
              """  async restoreStrokeHistoryState(\n    state: PaintStrokeHistoryStateV1,\n  ): Promise<PaintProjectSnapshotV1> {\n    if (this.#disposed) throw new Error('paint session is disposed');\n    const normalized = parsePaintStrokeHistoryStateV1(state);\n    const document = this.#document;\n    if (document === null) throw new Error('paint stroke history requires an active document');\n    if (!(normalized.stroke.stroke.layerId in document.layerTree.layers)) {\n      throw new Error('paint stroke history targets a missing layer');\n    }\n\n    const strokeId = normalized.stroke.stroke.strokeId;\n    const existingIndex = this.#committedStrokes.findIndex(\n      (entry) => entry.stroke.strokeId === strokeId,\n    );\n    if (normalized.present) {\n      if (existingIndex >= 0) this.#committedStrokes.splice(existingIndex, 1);\n      const insertionIndex = Math.min(normalized.strokeIndex, this.#committedStrokes.length);\n      this.#committedStrokes.splice(insertionIndex, 0, normalized.stroke);\n    } else if (existingIndex >= 0) {\n      this.#committedStrokes.splice(existingIndex, 1);\n    }\n\n    this.#document = Object.freeze({\n      ...document,\n      revision: normalized.revision,\n      modifiedAt: normalized.modifiedAt,\n    });\n    this.#clearActiveStroke();\n    this.#completedStrokes.length = 0;\n    await this.#renderer.restoreBaselineStrokes(\n      this.#committedStrokes.map((entry) => ({\n        strokeId: entry.stroke.strokeId,\n        dabs: entry.dabs,\n      })),\n    );\n    const snapshot = this.projectSnapshot();\n    if (snapshot === null) throw new Error('paint stroke history restore lost the active document');\n    return snapshot;\n  }\n\n  activeDabs(): readonly BaselineBrushDabV1[] {\n    return this.#activeDabBuilder?.dabs() ?? Object.freeze([]);\n  }""",
          )

          replace(
              'src/app/paint-history-controller.ts',
              """import {\n  PaintSessionControllerV1,\n  parsePaintProjectSnapshotV1,\n  type PaintDocumentSettingsUpdateV1,\n} from './paint-session-controller.js';""",
              """import {\n  PaintSessionControllerV1,\n  parsePaintProjectSnapshotV1,\n  parsePaintStrokeHistoryStateV1,\n  type PaintDocumentSettingsUpdateV1,\n} from './paint-session-controller.js';""",
          )
          replace(
              'src/app/paint-history-controller.ts',
              """  commitCompletedStroke(strokeId: string): HistoryTransactionV1 {\n    const before = this.#session.projectSnapshot();\n    if (before === null) throw new Error('paint history requires an active document');\n    if (this.#revisionHighWater >= Number.MAX_SAFE_INTEGER) {\n      throw new RangeError('paint document revision high-water is exhausted');\n    }\n    const afterRevision = parseRevision(\n      Math.max(this.#revisionHighWater, before.document.revision) + 1,\n    );\n    const committed = this.#session.commitCompletedPaintStroke(strokeId, afterRevision);\n    if (committed === null) throw new Error(`completed paint stroke not found: ${strokeId}`);\n    const transaction = createHistoryTransactionV1({\n      transactionId: crypto.randomUUID(),\n      commandId: 'brush.stroke',\n      beforeRevision: committed.before.document.revision,\n      afterRevision: committed.after.document.revision,\n      payload: createHistoryPayloadV1({\n        strategy: 'object-before-after',\n        before: committed.before,\n        after: committed.after,\n      }),\n    });\n    this.#spine.commit(transaction);\n    this.#revisionHighWater = Math.max(this.#revisionHighWater, committed.after.document.revision);\n    return transaction;\n  }""",
              """  commitCompletedStroke(strokeId: string): HistoryTransactionV1 {\n    const before = this.#session.projectSnapshot();\n    if (before === null) throw new Error('paint history requires an active document');\n    if (this.#revisionHighWater >= Number.MAX_SAFE_INTEGER) {\n      throw new RangeError('paint document revision high-water is exhausted');\n    }\n    const strokeIndex = before.committedStrokes.length;\n    const afterRevision = parseRevision(\n      Math.max(this.#revisionHighWater, before.document.revision) + 1,\n    );\n    const committed = this.#session.commitCompletedPaintStroke(strokeId, afterRevision);\n    if (committed === null) throw new Error(`completed paint stroke not found: ${strokeId}`);\n    const sharedStrokeState = {\n      schema: 'illustro.paint-stroke-history/1' as const,\n      strokeIndex,\n      stroke: committed.committed,\n    };\n    const transaction = createHistoryTransactionV1({\n      transactionId: crypto.randomUUID(),\n      commandId: 'brush.stroke',\n      beforeRevision: committed.before.document.revision,\n      afterRevision: committed.after.document.revision,\n      payload: createHistoryPayloadV1({\n        strategy: 'typed-before-after',\n        before: {\n          ...sharedStrokeState,\n          revision: committed.before.document.revision,\n          modifiedAt: committed.before.document.modifiedAt,\n          present: false,\n        },\n        after: {\n          ...sharedStrokeState,\n          revision: committed.after.document.revision,\n          modifiedAt: committed.after.document.modifiedAt,\n          present: true,\n        },\n      }),\n    });\n    this.#spine.commit(transaction);\n    this.#revisionHighWater = Math.max(this.#revisionHighWater, committed.after.document.revision);\n    return transaction;\n  }""",
          )
          replace(
              'src/app/paint-history-controller.ts',
              """  async undo(spillAdapter?: HistorySpillAdapterV1): Promise<boolean> {\n    return this.#spine.undo(async (transaction, direction) => {\n      const value = direction === 'undo' ? transaction.payload.before : transaction.payload.after;\n      await this.#session.restoreProjectSnapshot(parsePaintProjectSnapshotV1(value));\n    }, spillAdapter);\n  }\n\n  async redo(spillAdapter?: HistorySpillAdapterV1): Promise<boolean> {\n    return this.#spine.redo(async (transaction, direction) => {\n      const value = direction === 'undo' ? transaction.payload.before : transaction.payload.after;\n      await this.#session.restoreProjectSnapshot(parsePaintProjectSnapshotV1(value));\n    }, spillAdapter);\n  }""",
              """  async undo(spillAdapter?: HistorySpillAdapterV1): Promise<boolean> {\n    return this.#spine.undo(async (transaction, direction) => {\n      const value = direction === 'undo' ? transaction.payload.before : transaction.payload.after;\n      if (transaction.commandId === 'brush.stroke' && transaction.payload.strategy === 'typed-before-after') {\n        await this.#session.restoreStrokeHistoryState(parsePaintStrokeHistoryStateV1(value));\n        return;\n      }\n      await this.#session.restoreProjectSnapshot(parsePaintProjectSnapshotV1(value));\n    }, spillAdapter);\n  }\n\n  async redo(spillAdapter?: HistorySpillAdapterV1): Promise<boolean> {\n    return this.#spine.redo(async (transaction, direction) => {\n      const value = direction === 'undo' ? transaction.payload.before : transaction.payload.after;\n      if (transaction.commandId === 'brush.stroke' && transaction.payload.strategy === 'typed-before-after') {\n        await this.#session.restoreStrokeHistoryState(parsePaintStrokeHistoryStateV1(value));\n        return;\n      }\n      await this.#session.restoreProjectSnapshot(parsePaintProjectSnapshotV1(value));\n    }, spillAdapter);\n  }""",
          )

          # 2) Coalesce brush dirty notifications on the main thread before structured cloning snapshots.
          replace(
              'src/app/paint-persistence-controller.ts',
              """export const PAINT_STORAGE_REQUEST_TIMEOUT_MS = 10_000 as const;""",
              """export const PAINT_STORAGE_REQUEST_TIMEOUT_MS = 10_000 as const;\nexport const PAINT_DIRTY_COALESCE_MS = 120 as const;""",
          )
          replace(
              'src/app/paint-persistence-controller.ts',
              """  #lastError: string | null = null;\n  #disposed = false;""",
              """  #lastError: string | null = null;\n  #scheduledDirtyTransactionId: CommandTransactionId | null = null;\n  #scheduledDirtyTimer: number | null = null;\n  #dirtyTail: Promise<void> = Promise.resolve();\n  #disposed = false;""",
          )
          old_mark = """  async markDirty(\n    transactionIdValue: CommandTransactionId | string = crypto.randomUUID(),\n  ): Promise<void> {\n    this.#assertNotDisposed();\n    const projectId = this.#requireProject();\n    if (!isCommandTransactionId(transactionIdValue)) {\n      throw new TypeError('paint persistence transactionId must be a UUID');\n    }\n    const document = this.#session.currentDocument();\n    if (document === null) throw new Error('paint persistence requires an active document');\n    const nextSequence = this.#sequence + 1;\n    if (!Number.isSafeInteger(nextSequence))\n      throw new RangeError('paint persistence sequence exhausted');\n    try {\n      await this.#request({\n        type: 'storage.persistence.markDirty',\n        projectId,\n        transactionId: transactionIdValue,\n        sequence: nextSequence,\n        documentRevision: document.revision,\n        snapshot: this.projectSnapshot(),\n      });\n      this.#sequence = nextSequence;\n      this.#lastError = null;\n      this.#setStatus('dirty');\n    } catch (error) {\n      this.#fail(error);\n      throw error;\n    }\n  }\n"""
          new_mark = """  scheduleDirty(\n    transactionIdValue: CommandTransactionId | string = crypto.randomUUID(),\n  ): void {\n    this.#assertNotDisposed();\n    this.#requireProject();\n    if (!isCommandTransactionId(transactionIdValue)) {\n      throw new TypeError('paint persistence transactionId must be a UUID');\n    }\n    this.#scheduledDirtyTransactionId = transactionIdValue;\n    if (this.#scheduledDirtyTimer !== null) return;\n    this.#scheduledDirtyTimer = globalThis.setTimeout(() => {\n      this.#scheduledDirtyTimer = null;\n      void this.#flushScheduledDirty().catch(() => undefined);\n    }, PAINT_DIRTY_COALESCE_MS);\n  }\n\n  async markDirty(\n    transactionIdValue: CommandTransactionId | string = crypto.randomUUID(),\n  ): Promise<void> {\n    this.#assertNotDisposed();\n    if (!isCommandTransactionId(transactionIdValue)) {\n      throw new TypeError('paint persistence transactionId must be a UUID');\n    }\n    await this.#flushScheduledDirty();\n    await this.#enqueueDirtyNow(transactionIdValue);\n  }\n\n  async #flushScheduledDirty(): Promise<void> {\n    const transactionId = this.#scheduledDirtyTransactionId;\n    if (transactionId === null) return;\n    this.#scheduledDirtyTransactionId = null;\n    if (this.#scheduledDirtyTimer !== null) {\n      globalThis.clearTimeout(this.#scheduledDirtyTimer);\n      this.#scheduledDirtyTimer = null;\n    }\n    await this.#enqueueDirtyNow(transactionId);\n  }\n\n  #enqueueDirtyNow(transactionId: CommandTransactionId): Promise<void> {\n    const task = this.#dirtyTail.then(\n      () => this.#markDirtyNow(transactionId),\n      () => this.#markDirtyNow(transactionId),\n    );\n    this.#dirtyTail = task;\n    return task;\n  }\n\n  async #markDirtyNow(transactionId: CommandTransactionId): Promise<void> {\n    this.#assertNotDisposed();\n    const projectId = this.#requireProject();\n    const document = this.#session.currentDocument();\n    if (document === null) throw new Error('paint persistence requires an active document');\n    const nextSequence = this.#sequence + 1;\n    if (!Number.isSafeInteger(nextSequence))\n      throw new RangeError('paint persistence sequence exhausted');\n    try {\n      await this.#request({\n        type: 'storage.persistence.markDirty',\n        projectId,\n        transactionId,\n        sequence: nextSequence,\n        documentRevision: document.revision,\n        snapshot: this.projectSnapshot(),\n      });\n      this.#sequence = nextSequence;\n      this.#lastError = null;\n      this.#setStatus('dirty');\n    } catch (error) {\n      this.#fail(error);\n      throw error;\n    }\n  }\n"""
          replace('src/app/paint-persistence-controller.ts', old_mark, new_mark)
          replace(
              'src/app/paint-persistence-controller.ts',
              """  dispose(): void {\n    if (this.#disposed) return;\n    this.#disposed = true;\n    this.#worker.removeEventListener('message', this.#messageListener);""",
              """  dispose(): void {\n    if (this.#disposed) return;\n    this.#disposed = true;\n    if (this.#scheduledDirtyTimer !== null) {\n      globalThis.clearTimeout(this.#scheduledDirtyTimer);\n      this.#scheduledDirtyTimer = null;\n    }\n    this.#scheduledDirtyTransactionId = null;\n    this.#worker.removeEventListener('message', this.#messageListener);""",
          )
          replace(
              'src/app/paint-persistence-controller.ts',
              """  async #flush(reason: 'recovery' | 'autosave'): Promise<void> {\n    this.#assertNotDisposed();\n    const projectId = this.#requireProject();""",
              """  async #flush(reason: 'recovery' | 'autosave'): Promise<void> {\n    this.#assertNotDisposed();\n    await this.#flushScheduledDirty();\n    await this.#dirtyTail;\n    const projectId = this.#requireProject();""",
          )

          # 3) Keep Undo/Redo visible and remove persistence from the hot render queue.
          replace(
              'src/app/main.ts',
              """let paintRenderTask: Promise<void> = Promise.resolve();\nlet refreshLayerUi = (): void => {};""",
              """let paintRenderTask: Promise<void> = Promise.resolve();\nlet refreshLayerUi = (): void => {};\nconst historyUndoButton = document.querySelector<HTMLButtonElement>('#history-undo');\nconst historyRedoButton = document.querySelector<HTMLButtonElement>('#history-redo');""",
          )
          replace(
              'src/app/main.ts',
              """  root.dataset.illustroHistoryUndo = history.canUndo ? 'enabled' : 'disabled';\n  root.dataset.illustroHistoryRedo = history.canRedo ? 'enabled' : 'disabled';\n}""",
              """  root.dataset.illustroHistoryUndo = history.canUndo ? 'enabled' : 'disabled';\n  root.dataset.illustroHistoryRedo = history.canRedo ? 'enabled' : 'disabled';\n  if (historyUndoButton !== null) historyUndoButton.disabled = !history.canUndo;\n  if (historyRedoButton !== null) historyRedoButton.disabled = !history.canRedo;\n}""",
          )
          replace(
              'src/app/main.ts',
              """            const transaction = paintHistory.commitCompletedStroke(strokeId);\n            await paintPersistence.markDirty(transaction.transactionId);\n            root.dataset.illustroHistoryTransaction = transaction.transactionId;""",
              """            const transaction = paintHistory.commitCompletedStroke(strokeId);\n            paintPersistence.scheduleDirty(transaction.transactionId);\n            root.dataset.illustroHistoryTransaction = transaction.transactionId;""",
          )
          old_history_ui = """const onPaintHistoryKeyDown = (event: KeyboardEvent): void => {\n  if (!(event.ctrlKey || event.metaKey) || event.altKey) return;\n  const target = event.target;\n  if (\n    target instanceof HTMLInputElement ||\n    target instanceof HTMLTextAreaElement ||\n    target instanceof HTMLSelectElement ||\n    (target instanceof HTMLElement && target.isContentEditable)\n  )\n    return;\n  const key = event.key.toLowerCase();\n  const redo = (key === 'z' && event.shiftKey) || key === 'y';\n  const undo = key === 'z' && !event.shiftKey;\n  if (!undo && !redo) return;\n  event.preventDefault();\n  enqueuePaintRender(async () => {\n    const changed = redo ? await paintHistory.redo() : await paintHistory.undo();\n    if (!changed) return;\n    await paintPersistence.markDirty();\n    root.dataset.illustroPaintVisible = 'committed';\n    const documentValue = paintSession.currentDocument();\n    if (documentValue !== null) publishDocumentState(documentValue);\n    publishPaintHistory();\n    incrementPerformanceCounter(redo ? 'history.paint.redo' : 'history.paint.undo');\n  });\n};\nwindow.addEventListener('keydown', onPaintHistoryKeyDown);\n"""
          new_history_ui = """function requestPaintHistoryAction(direction: 'undo' | 'redo'): void {\n  enqueuePaintRender(async () => {\n    const changed = direction === 'redo' ? await paintHistory.redo() : await paintHistory.undo();\n    if (!changed) {\n      publishPaintHistory();\n      return;\n    }\n    paintPersistence.scheduleDirty();\n    root.dataset.illustroPaintVisible = 'committed';\n    const documentValue = paintSession.currentDocument();\n    if (documentValue !== null) publishDocumentState(documentValue);\n    publishPaintHistory();\n    incrementPerformanceCounter(\n      direction === 'redo' ? 'history.paint.redo' : 'history.paint.undo',\n    );\n  });\n}\n\nconst onPaintHistoryKeyDown = (event: KeyboardEvent): void => {\n  if (!(event.ctrlKey || event.metaKey) || event.altKey) return;\n  const target = event.target;\n  if (\n    target instanceof HTMLInputElement ||\n    target instanceof HTMLTextAreaElement ||\n    target instanceof HTMLSelectElement ||\n    (target instanceof HTMLElement && target.isContentEditable)\n  )\n    return;\n  const key = event.key.toLowerCase();\n  const redo = (key === 'z' && event.shiftKey) || key === 'y';\n  const undo = key === 'z' && !event.shiftKey;\n  if (!undo && !redo) return;\n  event.preventDefault();\n  requestPaintHistoryAction(redo ? 'redo' : 'undo');\n};\nhistoryUndoButton?.addEventListener('click', () => requestPaintHistoryAction('undo'));\nhistoryRedoButton?.addEventListener('click', () => requestPaintHistoryAction('redo'));\nwindow.addEventListener('keydown', onPaintHistoryKeyDown);\n"""
          replace('src/app/main.ts', old_history_ui, new_history_ui)

          replace(
              'src/index.html',
              """        <div class=\"shell-topbar-actions\">\n          <button id=\"export-png\" class=\"shell-export-button\" type=\"button\" disabled>Export PNG</button>""",
              """        <div class=\"shell-topbar-actions\">\n          <button id=\"history-undo\" class=\"shell-history-button\" type=\"button\" aria-label=\"元に戻す\" title=\"元に戻す (Ctrl/Cmd+Z)\" disabled><span aria-hidden=\"true\">↶</span><span class=\"shell-history-label\">戻す</span></button>\n          <button id=\"history-redo\" class=\"shell-history-button\" type=\"button\" aria-label=\"やり直す\" title=\"やり直す (Ctrl/Cmd+Shift+Z)\" disabled><span aria-hidden=\"true\">↷</span><span class=\"shell-history-label\">進む</span></button>\n          <button id=\"export-png\" class=\"shell-export-button\" type=\"button\" disabled>Export PNG</button>""",
          )

          replace(
              'public/app-shell.css',
              """.shell-build-identity,\n.shell-diagnostics-link,\n.shell-export-button {""",
              """.shell-build-identity,\n.shell-diagnostics-link,\n.shell-export-button,\n.shell-history-button {""",
          )
          replace(
              'public/app-shell.css',
              """.shell-diagnostics-link,\n.shell-export-button {\n  padding: 8px 10px;\n}\n\n.shell-export-button {\n  cursor: pointer;\n  font-family: inherit;\n}\n\n.shell-export-button:disabled {\n  cursor: default;\n  opacity: 0.5;\n}\n\n.shell-diagnostics-link:focus-visible,\n.shell-export-button:focus-visible {""",
              """.shell-diagnostics-link,\n.shell-export-button {\n  padding: 8px 10px;\n}\n\n.shell-export-button,\n.shell-history-button {\n  cursor: pointer;\n  font-family: inherit;\n}\n\n.shell-history-button {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 5px;\n  min-width: 58px;\n  min-height: 32px;\n  padding: 7px 9px;\n  color: #344058;\n  font-weight: 700;\n}\n\n.shell-history-button > span[aria-hidden='true'] {\n  font-size: 18px;\n  line-height: 0.8;\n}\n\n.shell-export-button:disabled,\n.shell-history-button:disabled {\n  cursor: default;\n  opacity: 0.38;\n}\n\n.shell-history-button:not(:disabled):hover {\n  border-color: #cbd8ea;\n  background: #f6f9ff;\n}\n\n.shell-diagnostics-link:focus-visible,\n.shell-export-button:focus-visible,\n.shell-history-button:focus-visible {""",
          )
          replace(
              'public/app-shell.css',
              """@media (max-width: 900px) {\n  .shell-topbar-menus > span:nth-of-type(n + 3) {\n    display: none;\n  }""",
              """@media (max-width: 900px) {\n  .shell-topbar-menus > span:nth-of-type(n + 3) {\n    display: none;\n  }\n\n  .shell-history-button {\n    min-width: 36px;\n    padding-inline: 8px;\n  }\n\n  .shell-history-label {\n    display: none;\n  }""",
          )

          # Force installed/PWA clients to pick up the changed shell and application code.
          replace(
              'public/service-worker.js',
              "const CACHE_NAME = 'illustro-foundation-v2';",
              "const CACHE_NAME = 'illustro-foundation-v3';",
          )

          # Regression checks for the specific failure mode and visible controls.
          replace(
              'tests/unit/paint-history-controller.test.ts',
              """    expect(transaction.commandId).toBe('brush.stroke');\n    expect(transaction.beforeRevision).toBe(0);""",
              """    expect(transaction.commandId).toBe('brush.stroke');\n    expect(transaction.payload.strategy).toBe('typed-before-after');\n    expect(JSON.stringify(transaction.payload)).toContain('illustro.paint-stroke-history/1');\n    expect(JSON.stringify(transaction.payload)).not.toContain('illustro.paint-project-snapshot/1');\n    expect(transaction.beforeRevision).toBe(0);""",
          )
          replace(
              'scripts/verify-m4-vertical-slice.mjs',
              """const exportSource = fs.readFileSync('src/export/png-export.ts', 'utf8');""",
              """const indexSource = fs.readFileSync('src/index.html', 'utf8');\nfor (const control of ['id=\"history-undo\"', 'id=\"history-redo\"']) {\n  if (!indexSource.includes(control)) throw new Error(`M4 visible history control missing: ${control}`);\n}\nif (!main.includes('paintPersistence.scheduleDirty')) {\n  throw new Error('M4 brush persistence must stay off the immediate render queue');\n}\nconst exportSource = fs.readFileSync('src/export/png-export.ts', 'utf8');""",
          )
          PY
      - name: Format TypeScript and HTML
        run: npm run format
      - name: Typecheck
        run: npm run typecheck
      - name: Focused unit verification
        run: npx vitest run tests/unit/paint-history-controller.test.ts tests/unit/paint-persistence-controller.test.ts
      - name: M4 verification
        run: npm run verify:m4
      - name: Production build
        env:
          ILLUSTRO_BUILD_SHA: ${{ github.sha }}
        run: npm run build
      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-user01-performance-history.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: keep brush history incremental and expose undo redo'
          git push origin HEAD:main
