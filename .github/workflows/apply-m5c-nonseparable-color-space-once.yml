name: Apply M5C nonseparable blend modes once

on:
  push:
    branches:
      - work/m5c-nonseparable-color-space-20260902
    paths:
      - '.github/workflows/apply-m5c-nonseparable-color-space-once.yml'

permissions:
  contents: write

jobs:
  apply-verify-persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply M5C-023 through M5C-027
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, before, after):
              p = Path(path)
              text = p.read_text()
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {before[:120]!r}')
              p.write_text(text.replace(before, after, 1))

          # Explicit blend-space contract + W3C non-separable modes.
          replace_once(
              'src/gpu/blend-modes.ts',
              "import type { BlendModeId } from '../domain/layers.js';\n",
              "import type { DocumentColorSpace } from '../domain/document.js';\nimport type { BlendModeId } from '../domain/layers.js';\n",
          )
          replace_once(
              'src/gpu/blend-modes.ts',
              """  'subtract',\n  'divide',\n] as const satisfies readonly BlendModeId[]);\n""",
              """  'subtract',\n  'divide',\n  'hue',\n  'saturation',\n  'color',\n  'luminosity',\n] as const satisfies readonly BlendModeId[]);\n\nexport const M5C_BLEND_COLOR_SPACE_SEMANTICS_V1 = Object.freeze({\n  schema: 'illustro.blend-color-space-semantics/1' as const,\n  supportedWorkingSpaces: Object.freeze(['srgb', 'display-p3'] as const),\n  componentDomain: 'normalized-document-rgb' as const,\n  transferDomain: 'encoded-working-space-components' as const,\n  alphaMode: 'straight' as const,\n  compositingOperator: 'source-over' as const,\n  nonSeparableModel: 'w3c-lum-sat' as const,\n});\n""",
          )
          replace_once(
              'src/gpu/blend-modes.ts',
              """const BASE_BLEND_MODE_SET = new Set<BlendModeId>(M5C_BASE_BLEND_MODE_IDS_V1);\n\nfunction clamp01(value: number): number {\n""",
              """const BASE_BLEND_MODE_SET = new Set<BlendModeId>(M5C_BASE_BLEND_MODE_IDS_V1);\nconst BLEND_WORKING_SPACE_SET = new Set<DocumentColorSpace>(\n  M5C_BLEND_COLOR_SPACE_SEMANTICS_V1.supportedWorkingSpaces,\n);\n\nexport function assertBlendWorkingSpaceV1(workingSpace: DocumentColorSpace): DocumentColorSpace {\n  if (!BLEND_WORKING_SPACE_SET.has(workingSpace)) {\n    throw new Error(`unsupported blend working space: ${workingSpace}`);\n  }\n  return workingSpace;\n}\n\nfunction clamp01(value: number): number {\n""",
          )
          replace_once(
              'src/gpu/blend-modes.ts',
              """function softLight(backdrop: number, source: number): number {\n  if (source <= 0.5) {\n    return backdrop - (1 - 2 * source) * backdrop * (1 - backdrop);\n  }\n  const d =\n    backdrop <= 0.25 ? ((16 * backdrop - 12) * backdrop + 4) * backdrop : Math.sqrt(backdrop);\n  return backdrop + (2 * source - 1) * (d - backdrop);\n}\n\n""",
              """function softLight(backdrop: number, source: number): number {\n  if (source <= 0.5) {\n    return backdrop - (1 - 2 * source) * backdrop * (1 - backdrop);\n  }\n  const d =\n    backdrop <= 0.25 ? ((16 * backdrop - 12) * backdrop + 4) * backdrop : Math.sqrt(backdrop);\n  return backdrop + (2 * source - 1) * (d - backdrop);\n}\n\nfunction luminosity(rgb: BlendRgbV1): number {\n  return 0.3 * rgb[0] + 0.59 * rgb[1] + 0.11 * rgb[2];\n}\n\nfunction saturation(rgb: BlendRgbV1): number {\n  return Math.max(rgb[0], rgb[1], rgb[2]) - Math.min(rgb[0], rgb[1], rgb[2]);\n}\n\nfunction clipColor(rgb: BlendRgbV1): BlendRgbV1 {\n  const l = luminosity(rgb);\n  const minimum = Math.min(rgb[0], rgb[1], rgb[2]);\n  const maximum = Math.max(rgb[0], rgb[1], rgb[2]);\n  let result: BlendRgbV1 = rgb;\n  if (minimum < 0) {\n    const scale = l / (l - minimum);\n    result = [\n      l + (result[0] - l) * scale,\n      l + (result[1] - l) * scale,\n      l + (result[2] - l) * scale,\n    ];\n  }\n  if (maximum > 1) {\n    const scale = (1 - l) / (maximum - l);\n    result = [\n      l + (result[0] - l) * scale,\n      l + (result[1] - l) * scale,\n      l + (result[2] - l) * scale,\n    ];\n  }\n  return result;\n}\n\nfunction setLuminosity(rgb: BlendRgbV1, target: number): BlendRgbV1 {\n  const delta = target - luminosity(rgb);\n  return clipColor([rgb[0] + delta, rgb[1] + delta, rgb[2] + delta]);\n}\n\nfunction setSaturation(rgb: BlendRgbV1, target: number): BlendRgbV1 {\n  const minimum = Math.min(rgb[0], rgb[1], rgb[2]);\n  const maximum = Math.max(rgb[0], rgb[1], rgb[2]);\n  if (maximum <= minimum) return [0, 0, 0];\n  const scale = target / (maximum - minimum);\n  return [\n    (rgb[0] - minimum) * scale,\n    (rgb[1] - minimum) * scale,\n    (rgb[2] - minimum) * scale,\n  ];\n}\n\n""",
          )
          replace_once(
              'src/gpu/blend-modes.ts',
              """export function blendRgbV1(\n  mode: M5cBaseBlendModeIdV1,\n  backdrop: BlendRgbV1,\n  source: BlendRgbV1,\n): BlendRgbV1 {\n""",
              """export function blendRgbV1(\n  mode: M5cBaseBlendModeIdV1,\n  backdrop: BlendRgbV1,\n  source: BlendRgbV1,\n  workingSpace: DocumentColorSpace = 'srgb',\n): BlendRgbV1 {\n  assertBlendWorkingSpaceV1(workingSpace);\n""",
          )
          replace_once(
              'src/gpu/blend-modes.ts',
              """  if (mode === 'darker-color' || mode === 'lighter-color') {\n    const backdropTotal = cb[0] + cb[1] + cb[2];\n    const sourceTotal = cs[0] + cs[1] + cs[2];\n    if (mode === 'darker-color') return sourceTotal < backdropTotal ? cs : cb;\n    return sourceTotal > backdropTotal ? cs : cb;\n  }\n\n  const blendChannel = (backdropChannel: number, sourceChannel: number): number => {\n""",
              """  if (mode === 'darker-color' || mode === 'lighter-color') {\n    const backdropTotal = cb[0] + cb[1] + cb[2];\n    const sourceTotal = cs[0] + cs[1] + cs[2];\n    if (mode === 'darker-color') return sourceTotal < backdropTotal ? cs : cb;\n    return sourceTotal > backdropTotal ? cs : cb;\n  }\n  if (mode === 'hue') return setLuminosity(setSaturation(cs, saturation(cb)), luminosity(cb));\n  if (mode === 'saturation')\n    return setLuminosity(setSaturation(cb, saturation(cs)), luminosity(cb));\n  if (mode === 'color') return setLuminosity(cs, luminosity(cb));\n  if (mode === 'luminosity') return setLuminosity(cb, luminosity(cs));\n\n  const blendChannel = (backdropChannel: number, sourceChannel: number): number => {\n""",
          )
          replace_once(
              'src/gpu/blend-modes.ts',
              """  mode: M5cBaseBlendModeIdV1,\n): BlendRgbaV1 {\n""",
              """  mode: M5cBaseBlendModeIdV1,\n  workingSpace: DocumentColorSpace = 'srgb',\n): BlendRgbaV1 {\n  assertBlendWorkingSpaceV1(workingSpace);\n""",
          )
          replace_once(
              'src/gpu/blend-modes.ts',
              """  const blended = blendRgbV1(mode, cb, cs);\n""",
              """  const blended = blendRgbV1(mode, cb, cs, workingSpace);\n""",
          )

          # Carry the document working space into the canonical tile compositor on main/worker paths.
          replace_once(
              'src/gpu/baseline-raster-tile-store.ts',
              "import type { DocumentPrecision } from '../domain/document.js';\n",
              "import type { DocumentColorSpace, DocumentPrecision } from '../domain/document.js';\n",
          )
          replace_once(
              'src/gpu/baseline-raster-tile-store.ts',
              """  readonly #pixelFormat: DocumentPrecision;\n  readonly #tiles = new Map<string, BaselineRasterTileImageV1>();\n""",
              """  readonly #pixelFormat: DocumentPrecision;\n  readonly #workingSpace: DocumentColorSpace;\n  readonly #tiles = new Map<string, BaselineRasterTileImageV1>();\n""",
          )
          replace_once(
              'src/gpu/baseline-raster-tile-store.ts',
              """    pixelFormat: DocumentPrecision,\n    layers: readonly BaselineRasterLayerDescriptorV1[] = [],\n  ) {\n""",
              """    pixelFormat: DocumentPrecision,\n    layers: readonly BaselineRasterLayerDescriptorV1[] = [],\n    workingSpace: DocumentColorSpace = 'srgb',\n  ) {\n""",
          )
          replace_once(
              'src/gpu/baseline-raster-tile-store.ts',
              """    this.#pixelFormat = pixelFormat;\n    this.#layers = this.#normalizeLayers(layers);\n""",
              """    this.#pixelFormat = pixelFormat;\n    this.#workingSpace = workingSpace;\n    this.#layers = this.#normalizeLayers(layers);\n""",
          )
          replace_once(
              'src/gpu/baseline-raster-tile-store.ts',
              """          compositeBlendRgbaV1(destination, sourcePixel, layer.opacity, blendMode),\n""",
              """          compositeBlendRgbaV1(\n            destination,\n            sourcePixel,\n            layer.opacity,\n            blendMode,\n            this.#workingSpace,\n          ),\n""",
          )

          replace_once(
              'src/gpu/baseline-paint-renderer.ts',
              "import type { DocumentPrecision } from '../domain/document.js';\n",
              "import type { DocumentColorSpace, DocumentPrecision } from '../domain/document.js';\n",
          )
          replace_once(
              'src/gpu/baseline-paint-renderer.ts',
              """    precision: DocumentPrecision = 'rgba8-unorm',\n    layers: readonly BaselineRasterLayerDescriptorV1[] = Object.freeze([]),\n  ): BaselinePaintRendererSnapshotV1 {\n""",
              """    precision: DocumentPrecision = 'rgba8-unorm',\n    layers: readonly BaselineRasterLayerDescriptorV1[] = Object.freeze([]),\n    workingSpace: DocumentColorSpace = 'srgb',\n  ): BaselinePaintRendererSnapshotV1 {\n""",
          )
          replace_once(
              'src/gpu/baseline-paint-renderer.ts',
              """    this.#canonicalTiles = new BaselineRasterTileStoreV1(width, height, precision, this.#layers);\n""",
              """    this.#canonicalTiles = new BaselineRasterTileStoreV1(\n      width,\n      height,\n      precision,\n      this.#layers,\n      workingSpace,\n    );\n""",
          )
          replace_once(
              'src/app/renderer-controller.ts',
              """      input.precision,\n      input.rasterLayers,\n    );\n""",
              """      input.precision,\n      input.rasterLayers,\n      input.workingSpace,\n    );\n""",
          )
          replace_once(
              'src/workers/render.worker.ts',
              """        request.precision,\n        request.rasterLayers,\n      );\n""",
              """        request.precision,\n        request.rasterLayers,\n        request.workingSpace,\n      );\n""",
          )

          # Numerical and semantic coverage for all non-separable modes.
          replace_once(
              'tests/unit/blend-modes.test.ts',
              """  blendRgbV1,\n  compositeBlendRgbaV1,\n  type M5cBaseBlendModeIdV1,\n""",
              """  blendRgbV1,\n  compositeBlendRgbaV1,\n  M5C_BLEND_COLOR_SPACE_SEMANTICS_V1,\n  type M5cBaseBlendModeIdV1,\n""",
          )
          replace_once(
              'tests/unit/blend-modes.test.ts',
              """  divide: [1, 1, 0.25],\n};\n""",
              """  divide: [1, 1, 0.25],\n  hue: [0.5212727272727272, 0.33945454545454545, 0.7394545454545454],\n  saturation: [0.66075, 0.38575, 0.11075],\n  color: [0.5525, 0.3025, 0.8525],\n  luminosity: [0.5475, 0.3475, 0.1475],\n};\n""",
          )
          replace_once(
              'tests/unit/blend-modes.test.ts',
              """  it('keeps comparative arithmetic edge cases bounded', () => {\n    expect(blendRgbV1('difference', [0.2, 0.4, 0.6], [1, 0, 0.6])).toEqual([0.8, 0.4, 0]);\n    expect(blendRgbV1('subtract', [0.2, 0.4, 0.6], [0.8, 0.1, 1])).toEqual([\n      0, 0.30000000000000004, 0,\n    ]);\n    expect(blendRgbV1('divide', [0.2, 0.4, 0.6], [0, 1, 0.3])).toEqual([1, 0.4, 1]);\n  });\n""",
              """  it('keeps comparative arithmetic edge cases bounded', () => {\n    expect(blendRgbV1('difference', [0.2, 0.4, 0.6], [1, 0, 0.6])).toEqual([0.8, 0.4, 0]);\n    expect(blendRgbV1('subtract', [0.2, 0.4, 0.6], [0.8, 0.1, 1])).toEqual([\n      0, 0.30000000000000004, 0,\n    ]);\n    expect(blendRgbV1('divide', [0.2, 0.4, 0.6], [0, 1, 0.3])).toEqual([1, 0.4, 1]);\n  });\n\n  it('declares and executes blend math in the selected document working RGB space', () => {\n    expect(M5C_BLEND_COLOR_SPACE_SEMANTICS_V1.supportedWorkingSpaces).toEqual([\n      'srgb',\n      'display-p3',\n    ]);\n    expect(M5C_BLEND_COLOR_SPACE_SEMANTICS_V1.componentDomain).toBe('normalized-document-rgb');\n    expect(M5C_BLEND_COLOR_SPACE_SEMANTICS_V1.transferDomain).toBe(\n      'encoded-working-space-components',\n    );\n    expect(blendRgbV1('multiply', backdrop, source, 'display-p3')).toEqual([0.3, 0.1, 0.16]);\n  });\n\n  it('keeps W3C non-separable grayscale edge cases finite', () => {\n    for (const mode of ['hue', 'saturation', 'color', 'luminosity'] as const) {\n      const result = blendRgbV1(mode, [0.5, 0.5, 0.5], [0.2, 0.2, 0.2], 'display-p3');\n      expect(result.every(Number.isFinite)).toBe(true);\n      expect(result.every((value) => value >= 0 && value <= 1)).toBe(true);\n    }\n  });\n""",
          )

          replace_once(
              'tests/unit/baseline-blend-compositor.test.ts',
              """  });\n});\n""",
              """  });\n\n  it('uses document working-space semantics for non-separable modes', () => {\n    const store = new BaselineRasterTileStoreV1(1, 1, 'rgba8-unorm', [\n      { layerId: 'bottom', visible: true, opacity: 1 },\n      { layerId: 'top', visible: true, opacity: 1, blendMode: 'hue' },\n    ], 'display-p3');\n    store.restore([\n      pixelTile('bottom', [153, 102, 51, 255]),\n      pixelTile('top', [128, 64, 204, 255]),\n    ]);\n    expect([...store.compositeTiles()[0]!.bytes]).toEqual([133, 87, 189, 255]);\n  });\n});\n""",
          )

          replace_once(
              'src/index.html',
              """<option value=\"subtract\">減算</option><option value=\"divide\">除算</option></select>""",
              """<option value=\"subtract\">減算</option><option value=\"divide\">除算</option><option value=\"hue\">色相</option><option value=\"saturation\">彩度</option><option value=\"color\">カラー</option><option value=\"luminosity\">輝度</option></select>""",
          )

          replace_once(
              'scripts/verify-m5c-compositor.mjs',
              """  \"'subtract'\",\n  \"'divide'\",\n  'compositeBlendRgbaV1',\n""",
              """  \"'subtract'\",\n  \"'divide'\",\n  \"'hue'\",\n  \"'saturation'\",\n  \"'color'\",\n  \"'luminosity'\",\n  'M5C_BLEND_COLOR_SPACE_SEMANTICS_V1',\n  'normalized-document-rgb',\n  'encoded-working-space-components',\n  'w3c-lum-sat',\n  'compositeBlendRgbaV1',\n""",
          )
          replace_once(
              'scripts/verify-m5c-compositor.mjs',
              """  'compositeBlendRgbaV1',\n  \"layer.blendMode ?? 'normal'\",\n]);\n""",
              """  'compositeBlendRgbaV1',\n  \"layer.blendMode ?? 'normal'\",\n  'this.#workingSpace',\n]);\n""",
          )
          replace_once(
              'scripts/verify-m5c-compositor.mjs',
              """  'value=\"subtract\"',\n  'value=\"divide\"',\n]);\n""",
              """  'value=\"subtract\"',\n  'value=\"divide\"',\n  'value=\"hue\"',\n  'value=\"saturation\"',\n  'value=\"color\"',\n  'value=\"luminosity\"',\n]);\n""",
          )
          replace_once(
              'scripts/verify-m5c-compositor.mjs',
              """  'M5C-022 Divide:完了',\n  'M5C-023 Hue:未完了',\n]);\n""",
              """  'M5C-022 Divide:完了',\n  'M5C-023 Hue:完了',\n  'M5C-024 Saturation:完了',\n  'M5C-025 Color:完了',\n  'M5C-026 Luminosity:完了',\n  'M5C-027 explicit color-space blend semantics:完了',\n  'M5C-028 mask/clipping compositor integration:未完了',\n]);\n""",
          )
          replace_once(
              'scripts/verify-m5c-compositor.mjs',
              """requireText('src/app/renderer-controller.ts', [\n  'layer.blendMode',\n  '{ blendMode: layer.blendMode }',\n]);\n""",
              """requireText('src/app/renderer-controller.ts', [\n  'layer.blendMode',\n  '{ blendMode: layer.blendMode }',\n  'input.workingSpace',\n]);\nrequireText('src/gpu/baseline-paint-renderer.ts', ['workingSpace: DocumentColorSpace']);\n""",
          )

          for item in [
              'M5C-023 Hue',
              'M5C-024 Saturation',
              'M5C-025 Color',
              'M5C-026 Luminosity',
              'M5C-027 explicit color-space blend semantics',
          ]:
              replace_once('IMPLEMENTATION_PROGRESS.md', f'{item}:未完了', f'{item}:完了')
          replace_once(
              'IMPLEMENTATION_PROGRESS.md',
              'M5C-011〜018のLighter Color / contrast-light系とM5C-019〜022のdifference arithmetic系blend modeはcanonical Raster Tile compositorへ接続済み。次はM5C-023 Hueから再開する。',
              'M5C-011〜022のseparable/extended blendに加え、M5C-023〜026のW3C non-separable blendとM5C-027のdocument working-space semanticsをcanonical Raster Tile compositorへ接続済み。次はM5C-028 mask/clipping compositor integrationから再開する。',
          )
          PY
      - name: Format
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Prepare generated assets
        run: npm run prepare:generated
      - name: Focused M5C tests
        run: npx vitest run tests/unit/blend-modes.test.ts tests/unit/baseline-blend-compositor.test.ts tests/unit/baseline-paint-renderer.test.ts tests/unit/renderer-controller.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: M5C contract inspection
        run: npm run verify:m5c
      - name: Full unit regression
        run: npm run test:unit
      - name: Production build
        env:
          ILLUSTRO_BUILD_MODE: production
        run: npm run build
      - name: Integration regression
        run: npm run test:integration
      - name: Persist verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gpu/blend-modes.ts src/gpu/baseline-raster-tile-store.ts src/gpu/baseline-paint-renderer.ts src/app/renderer-controller.ts src/workers/render.worker.ts src/index.html tests/unit/blend-modes.test.ts tests/unit/baseline-blend-compositor.test.ts scripts/verify-m5c-compositor.mjs IMPLEMENTATION_PROGRESS.md
          git commit -m 'feat: implement M5C nonseparable blend modes [skip ci]'
          git push origin HEAD:work/m5c-nonseparable-color-space-20260902
