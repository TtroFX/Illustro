name: Mark M8E provisional once

on:
  push:
    branches: [main]
    paths:
      - '.github/m8e-progress-trigger'

permissions:
  contents: write

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Rebase latest main
        run: git pull --rebase origin main
      - name: Verify M8E checkpoint inputs
        run: |
          test -f verification/m8e-user-review-checkpoint.json
          grep -q "commitPreparedSnapshot('selection.cut'" src/app/m8-selection-launcher.ts
          grep -q "commitPreparedSnapshot('selection.fill'" src/app/m8-selection-launcher.ts
          grep -q "installM8SelectionTransformControllerV1" src/app/main.ts
          grep -q "m8e-preview" src/app/m8-contextual-canvas-controller.ts
      - name: Mark M8E provisional
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          labels = [
              'M8E-001 Selection Launcher creation',
              'M8E-002 non-empty selection only visibility',
              'M8E-003 Transform launcher command',
              'M8E-004 Cut/Copy launcher commands',
              'M8E-005 Clear launcher command',
              'M8E-006 Invert launcher command',
              'M8E-007 Feather/Expand/Shrink launcher commands',
              'M8E-008 Fill launcher command',
              'M8E-009 Selection Launcher placement',
              'M8E-010 workspace boundary avoidance',
              'M8E-011 handle/Inspector avoidance',
              'M8E-012 hide during active drawing',
              'M8E-013 dismissal without clearing selection',
              'M8E-014 transform on-canvas handles',
              'M8E-015 ruler contextual controls',
              'M8E-016 Lineart contextual overlay',
              'M8E-検査 M8E内部検査',
          ]
          for label in labels:
              old = f'{label}:未完了'
              new = f'{label}:仮完了'
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'missing M8E progress anchor: {label}')
          if 'PUB-M8E M8Eユーザー確認用Preview公開:未完了' not in text:
              raise SystemExit('PUB-M8E must remain pending until Pages verification')
          if 'USER-M8E M8E UI/UX/Visualユーザー確認PASS:未完了' not in text:
              raise SystemExit('USER-M8E must remain pending')
          path.write_text(text)
          PY
      - name: Remove helper and commit
        run: |
          rm .github/workflows/mark-m8e-provisional-once.yml .github/m8e-progress-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: mark M8E preview provisional'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
