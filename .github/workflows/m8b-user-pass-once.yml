name: Record M8B user approval once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m8b-user-pass-once.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Record explicit M8B user approval
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          old = 'USER-M8B M8B UI/UX/Visualユーザー確認PASS:未完了'
          new = 'USER-M8B M8B UI/UX/Visualユーザー確認PASS:完了'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('M8B user approval line not found')
          path.write_text(text)
          PY
      - name: Remove one-shot helper
        run: rm .github/workflows/m8b-user-pass-once.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPLEMENTATION_PROGRESS.md .github/workflows/m8b-user-pass-once.yml
          git commit -m 'chore: record M8B user approval'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
