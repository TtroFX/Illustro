name: Temporary M9A finalization
on:
  push:
    branches:
      - feature/m9a-complete
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - run: python scripts/tmp-m9a-finalize.py
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run verify:m9a
      - run: npm run build
      - run: npm run test:integration
      - name: Commit final M9A hardening
        run: |
          rm scripts/tmp-m9a-finalize.py .github/workflows/tmp-m9a-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(M9A): finalize Local Project Library"
          git push