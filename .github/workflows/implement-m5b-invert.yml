name: Implement M5B Layer Invert

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  implement-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Capture checked out identity
        run: echo "ILLUSTRO_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify deployment branches
        run: |
          git fetch origin preview:refs/remotes/origin/preview
          git show-ref --verify refs/remotes/origin/preview
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply layer invert implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one anchor in {path}; found {count}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1))

          Path('src/app/layer-raster-invert.ts').write_text(r'''import { parseRevision, type LayerId, type Revision } from '../domain/identity.js';
          import type { RasterLayerV1, RasterTileReferenceV1 } from '../domain/layers.js';
          import { tileBoundsForDocumentV1 } from '../gpu/sparse-tile-model.js';
          import type {
            PaintDecodedRasterTileV1,
            PaintRasterTilePixelFormatV1,
          } from './paint-persistence-controller.js';
          import type { PaintProjectSnapshotV1 } from './paint-session-controller.js';
          import type {
            PreparedRasterMergeTileV1,
            RasterMergePersistencePortV1,
          } from './layer-raster-merge.js';
          import { prepareLayerRasterizeV1 } from './layer-rasterize.js';

          export interface LayerInvertEligibilityV1 {
            readonly eligible: boolean;
            readonly layerId: LayerId;
            readonly reason: string | null;
          }

          export interface PreparedLayerInvertV1 {
            readonly schema: 'illustro.prepared-layer-invert/1';
            readonly layerId: LayerId;
            readonly sourceRevision: Revision;
            readonly documentRevision: Revision;
            readonly tiles: readonly PreparedRasterMergeTileV1[];
          }

          function unavailable(layerId: LayerId, reason: string): LayerInvertEligibilityV1 {
            return Object.freeze({ eligible: false, layerId, reason });
          }

          function hasUnbakedLayerStrokeV1(snapshot: PaintProjectSnapshotV1, layerId: LayerId): boolean {
            return snapshot.committedStrokes.some(
              (entry) => entry.stroke.layerId === layerId && entry.bakedToRasterLayer !== true,
            );
          }

          export function layerInvertEligibilityV1(
            snapshot: PaintProjectSnapshotV1,
            layerId: LayerId,
          ): LayerInvertEligibilityV1 {
            const layer = snapshot.document.layerTree.layers[layerId];
            if (layer === undefined) return unavailable(layerId, 'invert target layer is missing');
            if (layer.type !== 'raster') {
              return unavailable(layerId, 'layer invert currently requires a Raster Layer');
            }
            if (layer.locks.all || layer.locks.pixels) {
              return unavailable(layerId, 'layer invert is blocked by the layer pixel lock');
            }
            const hasUnbakedStroke = hasUnbakedLayerStrokeV1(snapshot, layerId);
            if (hasUnbakedStroke && layer.transformStack.length > 0) {
              return unavailable(
                layerId,
                'inverting pending stroke content under a live transform requires transform renderer integration',
              );
            }
            if (hasUnbakedStroke && layer.effectStack.length > 0) {
              return unavailable(
                layerId,
                'inverting pending stroke content under live effects requires effect compositor integration',
              );
            }
            if (layer.tiles.length === 0 && !hasUnbakedStroke) {
              return unavailable(layerId, 'layer invert requires raster content');
            }
            return Object.freeze({ eligible: true, layerId, reason: null });
          }

          function halfToFloat(value: number): number {
            const sign = (value & 0x8000) !== 0 ? -1 : 1;
            const exponent = (value >>> 10) & 0x1f;
            const fraction = value & 0x03ff;
            if (exponent === 0) return sign * 2 ** -14 * (fraction / 1024);
            if (exponent === 0x1f) {
              return fraction === 0 ? sign * Number.POSITIVE_INFINITY : Number.NaN;
            }
            return sign * 2 ** (exponent - 15) * (1 + fraction / 1024);
          }

          function floatToHalf(value: number): number {
            const float = new Float32Array([value]);
            const bits = new Uint32Array(float.buffer)[0] ?? 0;
            const sign = (bits >>> 16) & 0x8000;
            const sourceExponent = (bits >>> 23) & 0xff;
            let fraction = bits & 0x7fffff;
            if (sourceExponent === 0xff) {
              return sign | (fraction === 0 ? 0x7c00 : 0x7e00);
            }
            let exponent = sourceExponent - 127 + 15;
            if (exponent <= 0) {
              if (exponent < -10) return sign;
              fraction = (fraction | 0x800000) >>> (1 - exponent);
              return sign | ((fraction + 0x1000) >>> 13);
            }
            if (exponent >= 31) return sign | 0x7c00;
            fraction += 0x1000;
            if ((fraction & 0x800000) !== 0) {
              fraction = 0;
              exponent += 1;
              if (exponent >= 31) return sign | 0x7c00;
            }
            return sign | (exponent << 10) | (fraction >>> 13);
          }

          function assertTileContract(
            tile: PaintDecodedRasterTileV1,
            format: PaintRasterTilePixelFormatV1,
            width: number,
            height: number,
          ): void {
            if (tile.pixelFormat !== format || tile.width !== width || tile.height !== height) {
              throw new Error('canonical invert tile does not match the document tile contract');
            }
            const expectedLength = width * height * (format === 'rgba8-unorm' ? 4 : 8);
            if (tile.bytes.byteLength !== expectedLength) {
              throw new Error('canonical invert tile byte length is invalid');
            }
          }

          export function invertStraightRgbaBytesV1(
            bytes: Uint8Array,
            format: PaintRasterTilePixelFormatV1,
            width: number,
            height: number,
          ): Uint8Array<ArrayBuffer> {
            const expectedLength = width * height * (format === 'rgba8-unorm' ? 4 : 8);
            if (bytes.byteLength !== expectedLength) {
              throw new RangeError('invert source byte length does not match dimensions');
            }
            const output = new Uint8Array(bytes);
            if (format === 'rgba8-unorm') {
              for (let offset = 0; offset < output.byteLength; offset += 4) {
                output[offset] = 255 - (bytes[offset] ?? 0);
                output[offset + 1] = 255 - (bytes[offset + 1] ?? 0);
                output[offset + 2] = 255 - (bytes[offset + 2] ?? 0);
              }
              return output;
            }
            const source = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
            const target = new DataView(output.buffer, output.byteOffset, output.byteLength);
            for (let offset = 0; offset < output.byteLength; offset += 8) {
              for (const channelOffset of [0, 2, 4] as const) {
                const channel = halfToFloat(source.getUint16(offset + channelOffset, true));
                target.setUint16(offset + channelOffset, floatToHalf(1 - channel), true);
              }
            }
            return output;
          }

          async function sourceTilesV1(
            snapshot: PaintProjectSnapshotV1,
            layer: RasterLayerV1,
            persistence: RasterMergePersistencePortV1,
          ): Promise<readonly PreparedRasterMergeTileV1[]> {
            if (hasUnbakedLayerStrokeV1(snapshot, layer.id)) {
              return (await prepareLayerRasterizeV1(snapshot, layer.id, persistence)).tiles;
            }
            return Object.freeze(
              layer.tiles.map((tile) =>
                Object.freeze({ x: tile.x, y: tile.y, payloadRef: tile.payloadRef }),
              ),
            );
          }

          export async function prepareLayerInvertV1(
            snapshot: PaintProjectSnapshotV1,
            layerId: LayerId,
            persistence: RasterMergePersistencePortV1,
          ): Promise<PreparedLayerInvertV1> {
            const eligibility = layerInvertEligibilityV1(snapshot, layerId);
            if (!eligibility.eligible) throw new Error(eligibility.reason ?? 'layer invert is unavailable');
            const source = snapshot.document.layerTree.layers[layerId];
            if (source?.type !== 'raster') throw new Error('layer invert source changed');
            const width = snapshot.document.canvas.width;
            const height = snapshot.document.canvas.height;
            const format = snapshot.document.color.precision;
            const tiles: PreparedRasterMergeTileV1[] = [];
            const materialized = await sourceTilesV1(snapshot, source, persistence);
            for (const tile of [...materialized].sort((left, right) => left.y - right.y || left.x - right.x)) {
              const bounds = tileBoundsForDocumentV1(width, height, { tx: tile.x, ty: tile.y });
              const decoded = await persistence.readRasterTile(tile.payloadRef);
              assertTileContract(decoded, format, bounds.validWidth, bounds.validHeight);
              const persisted = await persistence.persistRasterTile({
                width: bounds.validWidth,
                height: bounds.validHeight,
                pixelFormat: format,
                bytes: invertStraightRgbaBytesV1(
                  decoded.bytes,
                  format,
                  bounds.validWidth,
                  bounds.validHeight,
                ),
              });
              tiles.push(Object.freeze({ x: tile.x, y: tile.y, payloadRef: persisted.payloadRef }));
            }
            return Object.freeze({
              schema: 'illustro.prepared-layer-invert/1' as const,
              layerId,
              sourceRevision: source.revision,
              documentRevision: snapshot.document.revision,
              tiles: Object.freeze(tiles),
            });
          }

          export function applyPreparedLayerInvertV1(
            snapshot: PaintProjectSnapshotV1,
            prepared: PreparedLayerInvertV1,
            revisionValue: Revision | number,
            now: Date = new Date(),
          ): PaintProjectSnapshotV1 {
            const revision = parseRevision(revisionValue);
            if (snapshot.document.revision !== prepared.documentRevision) {
              throw new Error('layer invert document changed before commit');
            }
            const source = snapshot.document.layerTree.layers[prepared.layerId];
            if (source?.type !== 'raster' || source.revision !== prepared.sourceRevision) {
              throw new Error('layer invert source changed before commit');
            }
            const eligibility = layerInvertEligibilityV1(snapshot, prepared.layerId);
            if (!eligibility.eligible) throw new Error(eligibility.reason ?? 'layer invert is unavailable');
            const inverted = Object.freeze({
              ...source,
              revision,
              boundsHint: null,
              tiles: Object.freeze(
                prepared.tiles.map(
                  (tile): RasterTileReferenceV1 =>
                    Object.freeze({
                      x: tile.x,
                      y: tile.y,
                      revision,
                      payloadRef: tile.payloadRef,
                    }),
                ),
              ),
            }) as RasterLayerV1;
            const committedStrokes = snapshot.committedStrokes.map((entry) =>
              entry.stroke.layerId === prepared.layerId
                ? Object.freeze({ ...entry, bakedToRasterLayer: true })
                : entry,
            );
            return Object.freeze({
              schema: 'illustro.paint-project-snapshot/1' as const,
              document: Object.freeze({
                ...snapshot.document,
                revision,
                modifiedAt: now.toISOString(),
                layerTree: Object.freeze({
                  rootLayerIds: snapshot.document.layerTree.rootLayerIds,
                  layers: Object.freeze({
                    ...snapshot.document.layerTree.layers,
                    [prepared.layerId]: inverted,
                  }),
                }),
              }),
              committedStrokes: Object.freeze(committedStrokes),
            });
          }
          ''')

          Path('tests/unit/layer-raster-invert.test.ts').write_text(r'''import { describe, expect, it } from 'vitest';
          import {
            applyPreparedLayerInvertV1,
            invertStraightRgbaBytesV1,
            layerInvertEligibilityV1,
            prepareLayerInvertV1,
          } from '../../src/app/layer-raster-invert.js';
          import type { RasterMergePersistencePortV1 } from '../../src/app/layer-raster-merge.js';
          import type {
            PaintDecodedRasterTileV1,
            PaintPersistedRasterTileV1,
            PaintRasterTilePixelFormatV1,
          } from '../../src/app/paint-persistence-controller.js';
          import type { PaintProjectSnapshotV1 } from '../../src/app/paint-session-controller.js';
          import { createDocumentV1 } from '../../src/domain/document.js';
          import { parseRevision } from '../../src/domain/identity.js';
          import {
            createRasterLayer,
            createRasterTileReference,
            createVectorLayer,
          } from '../../src/domain/layers.js';

          class MemoryRasterPersistence implements RasterMergePersistencePortV1 {
            readonly tiles = new Map<string, PaintDecodedRasterTileV1>();
            readonly writes: PaintPersistedRasterTileV1[] = [];

            seed(input: {
              readonly payloadRef: string;
              readonly width: number;
              readonly height: number;
              readonly pixelFormat: PaintRasterTilePixelFormatV1;
              readonly bytes: Uint8Array;
            }): void {
              this.tiles.set(
                input.payloadRef,
                Object.freeze({
                  schema: 'illustro.paint-decoded-raster-tile/1' as const,
                  payloadRef: input.payloadRef,
                  objectHash: input.payloadRef.replace('sha256:', ''),
                  codec: 'raw' as const,
                  pixelFormat: input.pixelFormat,
                  width: input.width,
                  height: input.height,
                  bytes: new Uint8Array(input.bytes),
                }),
              );
            }

            async readRasterTile(payloadRef: string): Promise<PaintDecodedRasterTileV1> {
              const tile = this.tiles.get(payloadRef);
              if (tile === undefined) throw new Error(`missing tile ${payloadRef}`);
              return tile;
            }

            async persistRasterTile(input: {
              readonly width: number;
              readonly height: number;
              readonly pixelFormat: PaintRasterTilePixelFormatV1;
              readonly bytes: Uint8Array | ArrayBuffer;
            }): Promise<PaintPersistedRasterTileV1> {
              const index = this.writes.length + 1;
              const objectHash = index.toString(16).padStart(64, '0');
              const payloadRef = `sha256:${objectHash}`;
              const bytes =
                input.bytes instanceof Uint8Array
                  ? new Uint8Array(input.bytes)
                  : new Uint8Array(input.bytes.slice(0));
              this.tiles.set(
                payloadRef,
                Object.freeze({
                  schema: 'illustro.paint-decoded-raster-tile/1' as const,
                  payloadRef,
                  objectHash,
                  codec: 'raw' as const,
                  pixelFormat: input.pixelFormat,
                  width: input.width,
                  height: input.height,
                  bytes,
                }),
              );
              const persisted = Object.freeze({
                schema: 'illustro.paint-persisted-raster-tile/1' as const,
                payloadRef,
                objectHash,
                codec: 'raw' as const,
                pixelFormat: input.pixelFormat,
                width: input.width,
                height: input.height,
                rawByteLength: bytes.byteLength,
                encodedByteLength: bytes.byteLength,
              });
              this.writes.push(persisted);
              return persisted;
            }
          }

          function snapshotWith(
            layer: ReturnType<typeof createRasterLayer> | ReturnType<typeof createVectorLayer>,
            input: {
              readonly width?: number;
              readonly height?: number;
              readonly precision?: 'rgba8-unorm' | 'rgba16-float';
              readonly committedStrokes?: PaintProjectSnapshotV1['committedStrokes'];
            } = {},
          ): PaintProjectSnapshotV1 {
            const document = createDocumentV1({
              width: input.width ?? 2,
              height: input.height ?? 1,
              precision: input.precision ?? 'rgba8-unorm',
            });
            return Object.freeze({
              schema: 'illustro.paint-project-snapshot/1' as const,
              document: Object.freeze({
                ...document,
                layerTree: Object.freeze({
                  rootLayerIds: Object.freeze([layer.id]),
                  layers: Object.freeze({ [layer.id]: layer }),
                }),
              }),
              committedStrokes: input.committedStrokes ?? Object.freeze([]),
            });
          }

          function unbakedStroke(layerId: string): PaintProjectSnapshotV1['committedStrokes'][number] {
            return Object.freeze({
              stroke: Object.freeze({
                schema: 'illustro.paint-stroke/1' as const,
                strokeId: '11111111-1111-4111-8111-111111111111',
                pointerId: 1,
                source: 'pen' as const,
                layerId: layerId as never,
                samples: Object.freeze([]),
              }),
              dabs: Object.freeze([
                Object.freeze({
                  schema: 'illustro.baseline-brush-dab/1' as const,
                  x: 20,
                  y: 20,
                  radius: 8,
                  radiusX: 8,
                  radiusY: 8,
                  opacity: 1,
                }),
              ]),
              bakedToRasterLayer: false,
            });
          }

          describe('M5B layer invert', () => {
            it('requires editable Raster Layer content', () => {
              const emptyRaster = createRasterLayer({ name: 'Empty' });
              const emptySnapshot = snapshotWith(emptyRaster);
              expect(layerInvertEligibilityV1(emptySnapshot, emptyRaster.id)).toMatchObject({
                eligible: false,
                reason: expect.stringContaining('requires raster content'),
              });

              const vector = createVectorLayer({ name: 'Vector' });
              expect(layerInvertEligibilityV1(snapshotWith(vector), vector.id)).toMatchObject({
                eligible: false,
                reason: expect.stringContaining('Raster Layer'),
              });

              const locked = createRasterLayer({
                name: 'Locked',
                locks: { pixels: true },
                tiles: [
                  createRasterTileReference({
                    x: 0,
                    y: 0,
                    payloadRef: `sha256:${'a'.repeat(64)}`,
                  }),
                ],
              });
              expect(layerInvertEligibilityV1(snapshotWith(locked), locked.id)).toMatchObject({
                eligible: false,
                reason: expect.stringContaining('pixel lock'),
              });
            });

            it('inverts straight RGBA8 RGB while preserving alpha and layer properties', async () => {
              const payloadRef = `sha256:${'b'.repeat(64)}`;
              const raster = createRasterLayer({
                name: 'Paint',
                opacity: 0.75,
                locks: { alpha: true },
                roleFlags: { reference: true },
                tiles: [createRasterTileReference({ x: 0, y: 0, payloadRef })],
              });
              const snapshot = snapshotWith(raster);
              const persistence = new MemoryRasterPersistence();
              persistence.seed({
                payloadRef,
                width: 2,
                height: 1,
                pixelFormat: 'rgba8-unorm',
                bytes: new Uint8Array([10, 20, 30, 40, 250, 128, 0, 255]),
              });
              const prepared = await prepareLayerInvertV1(snapshot, raster.id, persistence);
              expect(prepared.tiles).toHaveLength(1);
              const resultRef = prepared.tiles[0]?.payloadRef;
              expect(resultRef).toBeDefined();
              const result = resultRef === undefined ? undefined : persistence.tiles.get(resultRef);
              expect(result === undefined ? [] : [...result.bytes]).toEqual([
                245, 235, 225, 40, 5, 127, 255, 255,
              ]);
              const after = applyPreparedLayerInvertV1(snapshot, prepared, parseRevision(1), new Date(0));
              const layer = after.document.layerTree.layers[raster.id];
              expect(layer).toMatchObject({
                id: raster.id,
                type: 'raster',
                revision: 1,
                opacity: 0.75,
                locks: { alpha: true },
                roleFlags: { reference: true },
              });
            });

            it('preserves RGBA16F alpha bits and supports 16F RGB inversion', () => {
              const bytes = new Uint8Array(8);
              const view = new DataView(bytes.buffer);
              view.setUint16(0, 0x3400, true);
              view.setUint16(2, 0x3800, true);
              view.setUint16(4, 0x3a00, true);
              view.setUint16(6, 0x3800, true);
              const inverted = invertStraightRgbaBytesV1(bytes, 'rgba16-float', 1, 1);
              const result = new DataView(inverted.buffer, inverted.byteOffset, inverted.byteLength);
              expect(result.getUint16(0, true)).toBe(0x3a00);
              expect(result.getUint16(2, true)).toBe(0x3800);
              expect(result.getUint16(4, true)).toBe(0x3400);
              expect(result.getUint16(6, true)).toBe(0x3800);
            });

            it('materializes unbaked stroke pixels before inversion and marks history as baked', async () => {
              const raster = createRasterLayer({ name: 'Stroke' });
              const snapshot = snapshotWith(raster, {
                width: 64,
                height: 64,
                committedStrokes: Object.freeze([unbakedStroke(raster.id)]),
              });
              expect(layerInvertEligibilityV1(snapshot, raster.id).eligible).toBe(true);
              const persistence = new MemoryRasterPersistence();
              const prepared = await prepareLayerInvertV1(snapshot, raster.id, persistence);
              expect(prepared.tiles).toHaveLength(1);
              const resultRef = prepared.tiles[0]?.payloadRef;
              const result = resultRef === undefined ? undefined : persistence.tiles.get(resultRef);
              expect(result).toBeDefined();
              const centerOffset = (20 * 64 + 20) * 4;
              expect(result?.bytes[centerOffset]).toBe(255);
              expect(result?.bytes[centerOffset + 1]).toBe(255);
              expect(result?.bytes[centerOffset + 2]).toBe(255);
              expect(result?.bytes[centerOffset + 3]).toBeGreaterThan(0);
              const after = applyPreparedLayerInvertV1(snapshot, prepared, parseRevision(1));
              expect(after.committedStrokes[0]?.bakedToRasterLayer).toBe(true);
            });
          });
          ''')

          replace_once(
              'src/app/layer-workflow-controller.ts',
              "} from './layer-rasterize.js';\nimport type { PaintHistoryControllerV1 } from './paint-history-controller.js';",
              "} from './layer-rasterize.js';\nimport {\n  applyPreparedLayerInvertV1,\n  layerInvertEligibilityV1,\n  prepareLayerInvertV1,\n} from './layer-raster-invert.js';\nimport type { PaintHistoryControllerV1 } from './paint-history-controller.js';",
          )
          replace_once(
              'src/app/layer-workflow-controller.ts',
              "  const rasterizeButton = required<HTMLButtonElement>('#layer-rasterize');\n  const deleteButton = required<HTMLButtonElement>('#layer-delete');",
              "  const rasterizeButton = required<HTMLButtonElement>('#layer-rasterize');\n  const invertButton = required<HTMLButtonElement>('#layer-invert');\n  const deleteButton = required<HTMLButtonElement>('#layer-delete');",
          )
          replace_once(
              'src/app/layer-workflow-controller.ts',
              "    rasterizeButton.title = rasterizeEligibility?.reason ?? 'ラスタライズ';\n    deleteButton.disabled = disabled;",
              "    rasterizeButton.title = rasterizeEligibility?.reason ?? 'ラスタライズ';\n    const invertEligibility =\n      active === null || projectSnapshot === null\n        ? null\n        : layerInvertEligibilityV1(projectSnapshot, active.id);\n    invertButton.disabled =\n      invertEligibility?.eligible !== true || options.paintSession.activeStrokeId() !== null;\n    invertButton.title = invertEligibility?.reason ?? '色反転';\n    deleteButton.disabled = disabled;",
          )
          replace_once(
              'src/app/layer-workflow-controller.ts',
              "  const onDelete = (): void => {",
              "  const onInvert = (): void => {\n    const layerId = options.paintSession.activeLayerId();\n    if (layerId === null) return;\n    options.schedule(async () => {\n      try {\n        if (options.paintSession.activeStrokeId() !== null) {\n          throw new Error('layer invert is unavailable while a stroke is active');\n        }\n        const current = options.paintSession.projectSnapshot();\n        if (current === null) return;\n        const prepared = await prepareLayerInvertV1(current, layerId, options.paintPersistence);\n        const transaction = await options.paintHistory.commitSnapshotTransform(\n          'layer.invert',\n          (before, revision) => applyPreparedLayerInvertV1(before, prepared, revision),\n        );\n        options.paintSession.setActiveLayer(layerId);\n        await options.paintPersistence.markDirty(transaction.transactionId);\n        root.dataset.illustroLayerTransaction = transaction.transactionId;\n        clearError();\n        refresh();\n        options.onHistoryChanged();\n      } catch (error) {\n        publishError(error);\n      }\n    });\n  };\n\n  const onDelete = (): void => {",
          )
          replace_once(
              'src/app/layer-workflow-controller.ts',
              "  rasterizeButton.addEventListener('click', onRasterize);\n  deleteButton.addEventListener('click', onDelete);",
              "  rasterizeButton.addEventListener('click', onRasterize);\n  invertButton.addEventListener('click', onInvert);\n  deleteButton.addEventListener('click', onDelete);",
          )
          replace_once(
              'src/app/layer-workflow-controller.ts',
              "      rasterizeButton.removeEventListener('click', onRasterize);\n      deleteButton.removeEventListener('click', onDelete);",
              "      rasterizeButton.removeEventListener('click', onRasterize);\n      invertButton.removeEventListener('click', onInvert);\n      deleteButton.removeEventListener('click', onDelete);",
          )
          replace_once(
              'src/index.html',
              '              <button id="layer-rasterize" type="button" aria-label="選択レイヤーをラスタライズ" title="ラスタライズ">▦</button>\n              <button id="layer-rename"',
              '              <button id="layer-rasterize" type="button" aria-label="選択レイヤーをラスタライズ" title="ラスタライズ">▦</button>\n              <button id="layer-invert" type="button" aria-label="選択レイヤーの色を反転" title="色反転">◑</button>\n              <button id="layer-rename"',
          )
          replace_once(
