name: Illustro one-shot M6A-018 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/illustro-m6a018-patch.mjs'
      - '.github/workflows/illustro-m6a018-patch.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply M6A-018 sampled image tip patch
        run: node .github/illustro-m6a018-patch.mjs
      - name: Format changed TypeScript
        run: >-
          npx biome format --write
          src/domain/brush-schema.ts
          src/gpu/baseline-brush.ts
          src/app/brush-preset-library.ts
          src/app/brush-preset-controller.ts
          src/app/paint-session-controller.ts
          tests/unit/sampled-image-brush-tip.test.ts
          scripts/verify-m6a-brush.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted regression tests
        run: >-
          npx vitest run
          tests/unit/procedural-brush-tip.test.ts
          tests/unit/sampled-image-brush-tip.test.ts
          tests/unit/brush-preset-library.test.ts
          tests/unit/paint-session-controller.test.ts
      - name: M6A verification
        run: npm run verify:m6a
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/domain/brush-schema.ts \
            src/gpu/baseline-brush.ts \
            src/app/brush-preset-library.ts \
            src/app/brush-preset-controller.ts \
            src/app/paint-session-controller.ts \
            src/index.html \
            tests/unit/sampled-image-brush-tip.test.ts \
            scripts/verify-m6a-brush.mjs \
            ILLUSTRO_DESIGN_MEMO.md \
            IMPLEMENTATION_PROGRESS.md \
            .github/illustro-m6a018-patch.mjs \
            .github/workflows/illustro-m6a018-patch.yml
          git diff --cached --check
          git commit -m "feat: implement M6A sampled image tip"
          git push origin HEAD:main
