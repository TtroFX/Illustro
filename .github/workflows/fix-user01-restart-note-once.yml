name: Fix USER-01 restart note once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-user01-restart-note-once.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Align canonical progress restart note
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('IMPLEMENTATION_PROGRESS.md')
          s = p.read_text()
          old = 'M5B-043/044 Mask↔Selection conversionまで完了。次はM5B-045 Reference Layer designationから再開する。'
          new = 'M5B-043/044 Mask↔Selection conversionまで完了しているが、USER-01の残りの実機確認が明示PASSするまでM5B-045以降へ再開しない。'
          if s.count(old) != 1:
              raise SystemExit('restart-note anchor mismatch')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -F 'USER-01の残りの実機確認が明示PASSするまでM5B-045以降へ再開しない。' IMPLEMENTATION_PROGRESS.md
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-user01-restart-note-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPLEMENTATION_PROGRESS.md
          git commit -m 'docs: keep USER-01 gate authoritative'
          git push origin HEAD:main
