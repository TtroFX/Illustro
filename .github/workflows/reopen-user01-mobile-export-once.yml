name: Reopen USER-01 and harden mobile export once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reopen-user01-mobile-export-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1

      - name: Restore locked dependencies
        run: npm ci --ignore-scripts

      - name: Apply USER-01 export and canonical-note corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, before: str, after: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(before) != 1:
                  raise SystemExit(f'expected one anchor in {path}: {before[:120]!r}')
              p.write_text(text.replace(before, after, 1))

          # Mobile Export must not become untappable merely because an availability
          # signal is stale. Desktop/menu controls may remain disabled while no
          # document is present; the phone action itself is disabled only in-flight.
          replace_once(
              'src/app/main.ts',
              """  if (mobileExportButton !== null) {\n    mobileExportButton.disabled = disabled;\n    mobileExportButton.setAttribute('aria-busy', pngExportInFlight ? 'true' : 'false');\n  }\n""",
              """  if (mobileExportButton !== null) {\n    mobileExportButton.disabled = pngExportInFlight;\n    mobileExportButton.setAttribute('aria-busy', pngExportInFlight ? 'true' : 'false');\n  }\n""",
          )
          replace_once(
              'src/app/main.ts',
              """  if (paintSession.currentDocument() === null) {\n    root.dataset.illustroPngExport = 'unavailable';\n    setPngExportControlsDisabled(true);\n    return;\n  }\n""",
              """  if (paintSession.currentDocument() === null) {\n    root.dataset.illustroPngExport = 'unavailable';\n    setMobilePngExportLabel('未準備');\n    restoreMobilePngExportLabel();\n    setPngExportControlsDisabled(true);\n    return;\n  }\n""",
          )

          replace_once(
              'src/index.html',
              """<button id=\"mobile-export\" type=\"button\" aria-label=\"PNGを書き出す\" aria-busy=\"false\" disabled><span aria-hidden=\"true\">⇩</span><small>書出</small></button>""",
              """<button id=\"mobile-export\" type=\"button\" aria-label=\"PNGを書き出す\" aria-busy=\"false\"><span aria-hidden=\"true\">⇩</span><small>書出</small></button>""",
          )

          replace_once(
              'public/mobile-shell.css',
              """  html[data-illustro-history-undo='disabled'] #mobile-history-undo,\n  html[data-illustro-history-redo='disabled'] #mobile-history-redo,\n  html[data-illustro-png-export='unavailable'] #mobile-export,\n  html[data-illustro-png-export='exporting'] #mobile-export {\n""",
              """  html[data-illustro-history-undo='disabled'] #mobile-history-undo,\n  html[data-illustro-history-redo='disabled'] #mobile-history-redo,\n  html[data-illustro-png-export='exporting'] #mobile-export {\n""",
          )

          # main.ts is the single production owner of all PNG export triggers.
          path = Path('src/app/document-workflow-controller.ts')
          text = path.read_text()
          for before in [
              "  const exportMenuButton = requireElement<HTMLButtonElement>('#export-png-menu');\n",
              "  const exportButton = document.querySelector<HTMLButtonElement>('#export-png');\n",
              """  const onExportMenuClick = (): void => {\n    closeContainingMenu(exportMenuButton);\n    exportButton?.click();\n  };\n""",
              "  exportMenuButton.addEventListener('click', onExportMenuClick);\n",
              "      exportMenuButton.removeEventListener('click', onExportMenuClick);\n",
          ]:
              if text.count(before) != 1:
                  raise SystemExit(f'expected one document-workflow export forwarding anchor: {before[:100]!r}')
              text = text.replace(before, '', 1)
          path.write_text(text)

          # User-test findings are canonical product/design evidence. Internal CI
          # may never manufacture USER-* PASS state.
          memo_path = Path('ILLUSTRO_DESIGN_MEMO.md')
          memo = memo_path.read_text()
          heading = '## USER-01 physical-device change log and verification guardrails — 2026-09-02'
          if heading not in memo:
              memo = memo.rstrip() + r'''


## USER-01 physical-device change log and verification guardrails — 2026-09-02

**Status: AUTHORITATIVE / USER-TEST EVIDENCE / IMPLEMENTATION GUARDRAIL.**

This section records product and architecture corrections established during USER-01 smartphone physical-device testing. It must be read together with the authoritative `Mobile full-editor target supersession` and `Phone touch and narrow-editor UX supersession` sections. Later implementation must not silently regress these decisions.

1. **Phone full editor remains mandatory.** Phone-class devices are full editor targets. Viewport width and preferred GPU availability may alter presentation or acceleration policy, but may not remove adopted single-illustration editing capabilities.
2. **Phone touch ownership is fixed by physical testing.** On the phone narrow editor, one Touch draws with the active drawing-capable tool; multi-touch owns canvas navigation. Arrival of a second Touch cancels the provisional one-finger stroke before navigation takes ownership so no partial stroke is committed accidentally.
3. **Phone Canvas First shell is required.** Frequent actions must remain reachable from the narrow editor, Layers must remain accessible through a sheet/overlay rather than disappearing, safe-area insets must be honored, and required touch targets use at least 44 CSS px effective target size.
4. **WebGPU remains the preferred accelerator, never the sole editor-admission condition.** WebGPU Worker, then main-thread WebGPU, remain preferred whenever usable. `navigator.gpu` with `requestAdapter() == null` is a supported compatibility case. Compatibility presentation must preserve the same canonical Raster Tiles, Tile History, persistence, recovery and export semantics.
5. **USER-01 smartphone performance evidence is scoped.** Physical testing explicitly accepted the current drawing, canvas-navigation and stroke-finalization lightness. This is a performance-only PASS; it does not by itself complete USER-01 or any unrelated functional check.
6. **Visible required phone commands must remain actionable.** USER-01 exposed that the visible mobile PNG Export action could become untappable because a derived availability flag and initial `disabled` state jointly locked it. A required phone command must not be made non-interactive solely because a derived or stale availability signal says `unavailable`. Mobile PNG Export may be temporarily disabled while an export is actually in flight. If no document is ready, tapping the visible action must produce explicit unavailable/not-ready feedback instead of silently doing nothing.
7. **PNG Export has one production command path.** Desktop Export, File-menu Export and phone Export invoke the same production export handler directly. Hidden-button forwarding and duplicate controller ownership of the same export command are prohibited. PNG flattening continues to consume canonical Composite Raster Tiles rather than replaying the Stroke/Event Log.
8. **USER-* truth comes only from explicit user evidence.** CI, unit tests, integration tests, build checks, bots and implementation completion may close internal implementation/check items, but must never mark a `USER-*` gate PASS. A `USER-*` item becomes complete only after explicit user confirmation. A later contradictory physical-device report reopens the affected USER-* gate even if an automation previously marked it complete.
9. **USER-01 state at this correction.** Smartphone new-document creation, one-finger drawing and performance/lightness have explicit user PASS. Undo/Redo, persistence across reload and PNG Export do not yet have explicit user PASS in the current verification cycle. Therefore USER-01 remains open until those remaining checks are explicitly accepted by the user.
'''
              memo_path.write_text(memo)

          progress_path = Path('IMPLEMENTATION_PROGRESS.md')
          progress = progress_path.read_text()
          replacements = {
              'USER-01 新規作成・描画・Undo/Redo・保存再読込・PNG Exportユーザー確認PASS:完了':
                  'USER-01 新規作成・描画・Undo/Redo・保存再読込・PNG Exportユーザー確認PASS:未完了',
              'USER-01-EXPORT-002 スマホPNG Exportユーザー実機PASS:完了':
                  'USER-01-EXPORT-002 スマホPNG Exportユーザー実機PASS:未完了',
              'USER-01-MOBILE-003 スマホUndo/Redo・保存再読込ユーザー実機PASS:完了':
                  'USER-01-MOBILE-003 スマホUndo/Redo・保存再読込ユーザー実機PASS:未完了',
              'USER-01は2026-09-02のスマホ実機確認で明示PASS済み。':
                  'USER-01は2026-09-02のスマホ実機確認を継続中。新規作成・1本指描画・性能は明示PASS済みだが、Undo/Redo・保存再読込・PNG Exportは未PASSのためUSER-01全体は未完了。',
              'MOBILE-007 smartphone実機・最低限のcompatibility regression確認:完了':
                  'MOBILE-007 smartphone実機・最低限のcompatibility regression確認:未完了',
              'MOBILE-007のスマホ実機確認とUSER-01明示PASSまで完了。通常の実装順序へ復帰済み。':
                  'MOBILE-007はスマホ新規作成・描画・性能のみ実機PASS。Undo/Redo・保存再読込・PNG Exportの明示PASSが残るため未完了。USER-01を閉じるまで通常の後続実装へ自動復帰しない。',
              'USER-01はスマホ実機で新規作成・描画・Undo/Redo・保存再読込・PNG Export・性能確認まで明示PASS済み。':
                  'USER-01はスマホ実機で新規作成・1本指描画・性能確認のみ明示PASS済み。Undo/Redo・保存再読込・PNG Exportは引き続きユーザー確認待ち。',
          }
          for before, after in replacements.items():
              if progress.count(before) != 1:
                  raise SystemExit(f'expected one progress correction anchor: {before}')
              progress = progress.replace(before, after, 1)

          anchor = 'USER-01-EXPORT-001 スマホPNG Export direct handler接続・hidden button中継除去・Exportのcheckpoint依存除去・可視status feedback:完了\n'
          additions = (
              'USER-01-MOBILE-001 スマホ新規キャンバス作成ユーザー実機PASS:完了\n'
              'USER-01-MOBILE-002 スマホ1本指描画ユーザー実機PASS:完了\n'
              'USER-01-PERF-008 スマホ描画・キャンバス移動・ストローク確定の軽さユーザー実機PASS:完了\n'
              'USER-01-EXPORT-003 スマホ書出ボタンstale availability lockout除去・single production handler ownership:完了\n'
          )
          if 'USER-01-EXPORT-003 ' not in progress:
              if progress.count(anchor) != 1:
                  raise SystemExit('expected USER-01 export anchor')
              progress = progress.replace(anchor, anchor + additions, 1)
          progress_path.write_text(progress)
          PY

      - name: Format focused implementation files
        run: npx biome format --write src/app/main.ts src/app/document-workflow-controller.ts public/mobile-shell.css src/index.html

      - name: Verify focused mobile export contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F "mobileExportButton?.addEventListener('click', onExportPngClick)" src/app/main.ts
          ! grep -F "html[data-illustro-png-export='unavailable'] #mobile-export" public/mobile-shell.css
          ! grep -F 'id="mobile-export" type="button" aria-label="PNGを書き出す" aria-busy="false" disabled' src/index.html
          ! grep -F "exportButton?.click()" src/app/document-workflow-controller.ts
          grep -F 'USER-01 新規作成・描画・Undo/Redo・保存再読込・PNG Exportユーザー確認PASS:未完了' IMPLEMENTATION_PROGRESS.md
          grep -F '## USER-01 physical-device change log and verification guardrails — 2026-09-02' ILLUSTRO_DESIGN_MEMO.md

      - name: Typecheck
        run: npm run typecheck

      - name: PNG export unit test
        run: npx vitest run tests/unit/png-export.test.ts

      - name: Production build
        run: npm run build

      - name: Commit correction and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/reopen-user01-mobile-export-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/main.ts src/app/document-workflow-controller.ts src/index.html public/mobile-shell.css ILLUSTRO_DESIGN_MEMO.md IMPLEMENTATION_PROGRESS.md
          git commit -m 'fix: keep mobile export actionable and reopen USER-01'
          git push origin HEAD:main
