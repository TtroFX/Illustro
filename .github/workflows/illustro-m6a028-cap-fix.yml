name: Illustro one-shot M6A-028 opacity-cap correction

on:
  push:
    branches: [main]
    paths:
      - '.github/illustro-m6a028-cap-fix.py'
      - '.github/workflows/illustro-m6a028-cap-fix.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply M6A-028 opacity-cap correction
        run: python .github/illustro-m6a028-cap-fix.py
      - name: Format changed TypeScript
        run: >-
          npx biome format --write
          src/gpu/baseline-brush.ts
          tests/unit/brush-stroke-start.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted regression tests
        run: >-
          npx vitest run
          tests/unit/brush-stroke-start.test.ts
          tests/unit/brush-stroke-repetition.test.ts
          tests/unit/baseline-brush.test.ts
          tests/unit/baseline-raster-tile-store.test.ts
          tests/unit/baseline-paint-renderer.test.ts
          tests/unit/paint-session-controller.test.ts
      - name: M6A verification
        run: npm run verify:m6a
      - name: Production build
        run: npm run build
      - name: Commit verified correction
        shell: bash
        run: |
          rm -f .github/illustro-m6a028-cap-fix.py
          rm -f .github/workflows/illustro-m6a028-cap-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve M6A stroke opacity cap"
          git push origin HEAD:main