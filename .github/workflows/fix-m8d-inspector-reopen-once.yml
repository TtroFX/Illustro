name: Fix M8D Inspector reopen once

on:
  push:
    branches: [main]
    paths:
      - '.github/m8d-inspector-reopen-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Rebase latest main
        run: git pull --rebase origin main
      - name: Apply M8D reopen affordance fix
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('public/m8-inspector.css')
          css = css_path.read_text()
          old = '''.m8d-inspector-collapsed .m8-editor-layout {
            grid-template-columns: var(--m8-rail-width) minmax(320px, 1fr) 0;
          }

          .m8d-inspector-collapsed .m8-inspector-dock {
            visibility: hidden;
            width: 0;
            border: 0;
            box-shadow: none;
          }

          .m8d-inspector-collapsed .m8-inspector-action-strip { display: none; }
          '''
          new = '''.m8d-inspector-collapsed .m8-editor-layout {
            grid-template-columns: var(--m8-rail-width) minmax(320px, 1fr) 42px;
          }

          .m8d-inspector-collapsed .m8-inspector-dock {
            visibility: visible;
            width: 42px;
            border-left: 1px solid #edf1f6;
            box-shadow: none;
          }

          .m8d-inspector-collapsed .m8d-inspector-toolbar {
            grid-template-columns: 34px;
            gap: 0;
            padding: 4px;
            border-bottom: 0;
          }

          .m8d-inspector-collapsed .m8d-inspector-toolbar > span,
          .m8d-inspector-collapsed [data-m8d-panel-manager],
          .m8d-inspector-collapsed .m8d-block-list,
          .m8d-inspector-collapsed .m8d-inspector-resize {
            display: none !important;
          }

          .m8d-inspector-collapsed [data-m8d-inspector-toggle] {
            display: grid !important;
            width: 34px;
            min-width: 34px;
          }

          .m8d-inspector-collapsed .m8-inspector-action-strip { display: none; }
          '''
          if old not in css:
              if new not in css:
                  raise SystemExit('collapsed Inspector CSS anchor not found')
          else:
              css = css.replace(old, new, 1)
              css_path.write_text(css)

          test_path = Path('tests/unit/m8-inspector-dock.test.ts')
          test = test_path.read_text()
          anchor = "    expect(css).toContain('.m8d-inspector-collapsed .m8-inspector-dock');\n    expect(css).not.toContain('.m8d-inspector-collapsed .m8d-floating-layer');\n"
          replacement = "    expect(css).toContain('.m8d-inspector-collapsed .m8-inspector-dock');\n    expect(css).toContain('minmax(320px, 1fr) 42px');\n    expect(css).toContain('visibility: visible;');\n    expect(css).toContain('[data-m8d-inspector-toggle]');\n    expect(css).not.toContain('.m8d-inspector-collapsed .m8d-floating-layer');\n"
          if anchor in test:
              test = test.replace(anchor, replacement, 1)
              test_path.write_text(test)
          elif replacement not in test:
              raise SystemExit('M8D collapse test anchor not found')
          PY
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Format test
        run: npx biome format --write tests/unit/m8-inspector-dock.test.ts
      - name: Verify formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Focused M8D test
        run: npx vitest run tests/unit/m8-inspector-dock.test.ts tests/unit/m8-product-shell.test.ts tests/unit/m8-tool-rail.test.ts
      - name: Production build
        run: npm run build
      - name: Remove temporary fix workflow
        run: rm .github/workflows/fix-m8d-inspector-reopen-once.yml .github/m8d-inspector-reopen-trigger
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep Inspector reopen affordance visible'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1