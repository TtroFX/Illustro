name: Repair M5B Grouped Transform Workflow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'ci: repair M5B grouped transform workflow' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Repair workflow syntax and restage
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/implement-m5b-grouped-transform.yml')
          text = path.read_text()
          old = "    if: github.event.head_commit.message == 'ci: stage M5B grouped transform implementation'"
          new = "    if: \"${{ github.event.head_commit.message == 'ci: stage M5B grouped transform implementation' }}\""
          if text.count(old) != 1:
              raise SystemExit('grouped transform workflow guard anchor mismatch')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/repair-m5b-grouped-transform-workflow.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/implement-m5b-grouped-transform.yml .github/workflows/repair-m5b-grouped-transform-workflow.yml
          git commit -m 'ci: stage M5B grouped transform implementation'
          git push origin HEAD:main
