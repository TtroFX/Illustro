name: Temporary M6A Raster Brush

on:
  push:
    branches: [work/m6a-raster-brush-20260902]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/m6a-raster-brush-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply M6A Raster Brush wiring
        run: python scripts/apply-m6a-raster-brush.py
      - name: Formatting
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Prepare generated assets
        run: npm run prepare:generated
      - name: Focused M6A Raster Brush tests
        run: npx vitest run tests/unit/canonical-raster-brush.test.ts tests/unit/baseline-brush.test.ts tests/unit/paint-session-controller.test.ts tests/unit/paint-raster-tile-bridge.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: M6A contract inspection
        run: npm run verify:m6a
      - name: Full unit suite
        run: npm run test:unit
      - name: Production build
        env:
          ILLUSTRO_BUILD_MODE: production
        run: npm run build
      - name: Integration tests
        run: npm run test:integration
      - name: Persist verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ILLUSTRO_DESIGN_MEMO.md \
            IMPLEMENTATION_PROGRESS.md \
            package.json \
            scripts/verify-m6a-brush.mjs \
            src/app/canonical-raster-brush.ts \
            src/app/paint-session-controller.ts \
            src/app/main.ts \
            tests/unit/canonical-raster-brush.test.ts
          if git diff --cached --quiet; then
            echo "No implementation changes to persist"
            exit 0
          fi
          git commit -m "feat: implement M6A Raster Brush mode"
          git push origin HEAD:work/m6a-raster-brush-20260902
