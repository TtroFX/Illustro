name: Repair M2 project lifecycle types

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m2-project-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - name: Patch strict optional properties
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/storage/project-library.ts')
          s = p.read_text()
          old = "        now: input.now,\n        previewResourceId: input.previewResourceId ?? null,\n"
          new = "        ...(input.now === undefined ? {} : { now: input.now }),\n        ...(input.previewResourceId === undefined\n          ? {}\n          : { previewResourceId: input.previewResourceId }),\n"
          if old not in s:
              raise SystemExit('create optional target missing')
          s = s.replace(old, new, 1)
          old = "      documentRevision: source.documentRevision,\n      now: input.now,\n      previewResourceId: source.metadata.previewResourceId,\n"
          new = "      documentRevision: source.documentRevision,\n      ...(input.now === undefined ? {} : { now: input.now }),\n      previewResourceId: source.metadata.previewResourceId,\n"
          if old not in s:
              raise SystemExit('duplicate optional target missing')
          p.write_text(s.replace(old, new, 1))
          p = Path('tests/unit/project-library.test.ts')
          s = p.read_text()
          old = "    const illustroRoot = storage.root.directories.get('illustro');\n    expect(illustroRoot).toBeDefined();\n    const newest = illustroRoot!.files.get('library-b.json');\n    expect(newest).toBeDefined();\n    newest!.bytes = new TextEncoder().encode('{broken');\n"
          new = "    const illustroRoot = storage.root.directories.get('illustro');\n    if (illustroRoot === undefined) throw new Error('Illustro OPFS root missing');\n    const newest = illustroRoot.files.get('library-b.json');\n    if (newest === undefined) throw new Error('newest library slot missing');\n    newest.bytes = new TextEncoder().encode('{broken');\n"
          if old not in s:
              raise SystemExit('test assertion target missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npx biome format --write src/storage/project-library.ts tests/unit/project-library.test.ts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
        env:
          ILLUSTRO_BUILD_MODE: production
      - name: Commit repaired source and clean one-shot workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m2-project-repair.yml
          if [ -f .github/workflows/m2-project-fix-verify.yml ]; then git rm .github/workflows/m2-project-fix-verify.yml; fi
          if [ -f .github/workflows/m2-project-verify.yml ]; then git rm .github/workflows/m2-project-verify.yml; fi
          git add src/storage/project-library.ts tests/unit/project-library.test.ts
          git commit -m 'fix: repair local project lifecycle types [skip ci]'
          git push
