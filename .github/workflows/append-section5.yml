name: Append finalized Section 5

on:
  push:
    paths:
      - '.github/workflows/append-section5.yml'

permissions:
  contents: write

jobs:
  append-section-5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append Section 5 to master design
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          target = Path('ILLUSTRO_MASTER_DESIGN.md')
          text = target.read_text(encoding='utf-8')
          marker = '## 5. 各機能の詳細仕様 — 確定'
          if marker in text:
              print('Section 5 already exists; nothing to append.')
          else:
              parts = [Path(f'.github/section5.part{i}.md').read_text(encoding='utf-8').rstrip() for i in range(1, 5)]
              target.write_text(text.rstrip() + '\n\n' + '\n\n'.join(parts) + '\n', encoding='utf-8')
              print('Section 5 appended.')
          PY
          if git diff --quiet -- ILLUSTRO_MASTER_DESIGN.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ILLUSTRO_MASTER_DESIGN.md
          git commit -m 'docs: finalize section 5 feature specifications'
          git push
