name: Continue M5B Layer Clear Fixed

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  implement-verify-record:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply M5B layer clear
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          source = subprocess.check_output([
              'git', 'show',
              'd538ff9d38cfb9048a926d2e510b6d58a5226af1:.github/workflows/continue-m5b-layer-clear.yml'
          ], text=True)
          start_marker = '      - name: Apply M5B layer clear\n        run: |\n'
          end_marker = '      - name: Canonical formatting\n'
          if start_marker not in source or end_marker not in source:
              raise SystemExit('M5B layer clear apply block not found')
          body = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = []
          for line in body.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              elif line == '':
                  lines.append('')
              else:
                  raise SystemExit(f'unexpected apply-block indentation: {line!r}')
          Path('/tmp/apply-m5b-layer-clear.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/apply-m5b-layer-clear.sh
      - name: Canonical formatting
        run: npm run format
      - name: Formatting check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: M1 contract inspection
        run: npm run verify:m1
      - name: M2 persistence inspection
        run: npm run verify:m2
      - name: M3 foundation inspection
        run: npm run verify:m3
      - name: M4 vertical-slice inspection
        run: npm run verify:m4
      - name: M5A inspection
        run: npm run verify:m5a
      - name: Existing M5B inspection
        run: npm run verify:m5b
      - name: Layer clear contract inspection
        run: |
          grep -q 'clearLayerSnapshotV1' src/app/layer-operations.ts
          grep -q "'layer.clear'" src/app/layer-workflow-controller.ts
          grep -q 'id="layer-clear"' src/index.html
      - name: Production build
        env:
          ILLUSTRO_BUILD_MODE: production
        run: npm run build
      - name: Integration tests
        run: npm run test:integration
      - name: Deployment contract
        run: npm run verify:m0.5
      - name: Record verified M5B layer clear
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          old = 'M5B-018 layer clear:未完了'
          if old not in text:
              raise SystemExit(f'progress target missing: {old}')
          path.write_text(text.replace(old, 'M5B-018 layer clear:完了', 1))
          PY
          rm .github/workflows/continue-m5b-layer-clear-fixed.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: implement M5B layer clear [skip ci]'
          git push origin HEAD:main
