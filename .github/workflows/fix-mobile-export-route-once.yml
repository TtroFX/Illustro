name: Fix mobile export route once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-export-route-once.yml'

permissions:
  contents: write

jobs:
  fix-mobile-export-route:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1

      - name: Restore locked dependencies
        run: npm ci --ignore-scripts

      - name: Apply direct mobile PNG export route
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main_path = Path('src/app/main.ts')
          main = main_path.read_text()

          before = """const exportPngButton = document.querySelector<HTMLButtonElement>('#export-png');
          const exportPngMenuButton = document.querySelector<HTMLButtonElement>('#export-png-menu');

          function setPngExportControlsDisabled(disabled: boolean): void {
            if (exportPngButton !== null) exportPngButton.disabled = disabled;
            if (exportPngMenuButton !== null) exportPngMenuButton.disabled = disabled;
          }

          const onExportPngClick = (): void => {
            if (exportPngButton === null || exportPngButton.disabled) return;
            setPngExportControlsDisabled(true);
            root.dataset.illustroPngExport = 'exporting';
            enqueuePaintRender(async () => {
              try {
                await paintPersistence.flushCheckpoint();
                const documentValue = paintSession.currentDocument();
                if (documentValue === null) throw new Error('PNG export requires an active document');
                const tiles = await paintSession.exportCompositeRasterTiles();
                const blob = await encodeCompositeRasterTilesToPngV1(documentValue, tiles);
                downloadPngBlobV1(blob, 'Illustro.png');
                root.dataset.illustroPngExport = 'complete';
                incrementPerformanceCounter('export.png.complete');
              } catch (error) {
                root.dataset.illustroPngExport = 'error';
                incrementPerformanceCounter('export.png.failure');
                logger.error('export.png-failed', error);
              } finally {
                setPngExportControlsDisabled(false);
              }
            });
          };
          exportPngButton?.addEventListener('click', onExportPngClick);
          exportPngMenuButton?.addEventListener('click', () => {
            exportPngMenuButton.closest('details')?.removeAttribute('open');
            onExportPngClick();
          });
          if (exportPngMenuButton !== null) exportPngMenuButton.disabled = true;
          root.dataset.illustroPngExport = exportPngButton === null ? 'unavailable' : 'ready';
          """

          after = """const exportPngButton = document.querySelector<HTMLButtonElement>('#export-png');
          const exportPngMenuButton = document.querySelector<HTMLButtonElement>('#export-png-menu');
          const mobileExportButton = document.querySelector<HTMLButtonElement>('#mobile-export');
          const mobileExportLabel = mobileExportButton?.querySelector('small') ?? null;
          let pngExportInFlight = false;

          function setMobilePngExportLabel(label: string): void {
            if (mobileExportLabel !== null) mobileExportLabel.textContent = label;
          }

          function setPngExportControlsDisabled(disabled: boolean): void {
            if (exportPngButton !== null) exportPngButton.disabled = disabled;
            if (exportPngMenuButton !== null) exportPngMenuButton.disabled = disabled;
            if (mobileExportButton !== null) {
              mobileExportButton.disabled = disabled;
              mobileExportButton.setAttribute('aria-busy', pngExportInFlight ? 'true' : 'false');
            }
          }

          const restoreMobilePngExportLabel = (): void => {
            globalThis.setTimeout(() => {
              if (!pngExportInFlight) setMobilePngExportLabel('書出');
            }, 1_500);
          };

          const onExportPngClick = (): void => {
            if (pngExportInFlight) return;
            if (paintSession.currentDocument() === null) {
              root.dataset.illustroPngExport = 'unavailable';
              setPngExportControlsDisabled(true);
              return;
            }
            pngExportInFlight = true;
            setPngExportControlsDisabled(true);
            setMobilePngExportLabel('書出中');
            root.dataset.illustroPngExport = 'exporting';
            enqueuePaintRender(async () => {
              try {
                const documentValue = paintSession.currentDocument();
                if (documentValue === null) throw new Error('PNG export requires an active document');
                const tiles = await paintSession.exportCompositeRasterTiles();
                const blob = await encodeCompositeRasterTilesToPngV1(documentValue, tiles);
                downloadPngBlobV1(blob, 'Illustro.png');
                root.dataset.illustroPngExport = 'complete';
                setMobilePngExportLabel('完了');
                restoreMobilePngExportLabel();
                incrementPerformanceCounter('export.png.complete');
              } catch (error) {
                root.dataset.illustroPngExport = 'error';
                setMobilePngExportLabel('失敗');
                restoreMobilePngExportLabel();
                incrementPerformanceCounter('export.png.failure');
                logger.error('export.png-failed', error);
              } finally {
                pngExportInFlight = false;
                setPngExportControlsDisabled(paintSession.currentDocument() === null);
              }
            });
          };
          const onExportPngMenuClick = (): void => {
            exportPngMenuButton?.closest('details')?.removeAttribute('open');
            onExportPngClick();
          };
          exportPngButton?.addEventListener('click', onExportPngClick);
          exportPngMenuButton?.addEventListener('click', onExportPngMenuClick);
          mobileExportButton?.addEventListener('click', onExportPngClick);
          setPngExportControlsDisabled(true);
          root.dataset.illustroPngExport = 'unavailable';
          """

          if main.count(before) != 1:
            raise SystemExit('expected one current PNG export control block')
          main = main.replace(before, after, 1)

          before = """    setPngExportControlsDisabled(false);
              publishPaintHistory();
          """
          after = """    setPngExportControlsDisabled(false);
              root.dataset.illustroPngExport = 'ready';
              publishPaintHistory();
          """
          if main.count(before) != 1:
            raise SystemExit('expected one document-ready PNG enable block')
          main = main.replace(before, after, 1)

          before = """    exportPngButton?.removeEventListener('click', onExportPngClick);
              document.removeEventListener('visibilitychange', onPaintVisibilityChange);
          """
          after = """    exportPngButton?.removeEventListener('click', onExportPngClick);
              exportPngMenuButton?.removeEventListener('click', onExportPngMenuClick);
              mobileExportButton?.removeEventListener('click', onExportPngClick);
              document.removeEventListener('visibilitychange', onPaintVisibilityChange);
          """
          if main.count(before) != 1:
            raise SystemExit('expected one PNG listener cleanup block')
          main = main.replace(before, after, 1)
          main_path.write_text(main)

          index_path = Path('src/index.html')
          index = index_path.read_text()
          before = """<button id=\"mobile-export\" type=\"button\" aria-label=\"PNGを書き出す\" onclick=\"document.getElementById('export-png')?.click()\"><span aria-hidden=\"true\">⇩</span><small>書出</small></button>"""
          after = """<button id=\"mobile-export\" type=\"button\" aria-label=\"PNGを書き出す\" aria-busy=\"false\" disabled><span aria-hidden=\"true\">⇩</span><small>書出</small></button>"""
          if index.count(before) != 1:
            raise SystemExit('expected one proxy mobile export button')
          index = index.replace(before, after, 1)
          index_path.write_text(index)

          progress_path = Path('IMPLEMENTATION_PROGRESS.md')
          progress = progress_path.read_text()
          marker = """USER-01-PERF-007 main統合・GitHub Pages preview更新:完了
          """
          insert = """USER-01-PERF-007 main統合・GitHub Pages preview更新:完了
          USER-01-EXPORT-001 スマホPNG Export direct handler接続・hidden button中継除去・Exportのcheckpoint依存除去・可視status feedback:完了
          """
          if 'USER-01-EXPORT-001 ' not in progress:
            if progress.count(marker) != 1:
              raise SystemExit('expected USER-01 performance progress marker')
            progress = progress.replace(marker, insert, 1)
            progress_path.write_text(progress)
          PY

      - name: Format focused changes
        run: npx biome format --write src/app/main.ts src/index.html

      - name: Verify direct mobile route contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq "onclick=\"document.getElementById('export-png')?.click()\"" src/index.html
          grep -Fq "mobileExportButton?.addEventListener('click', onExportPngClick);" src/app/main.ts
          grep -Fq "setMobilePngExportLabel('書出中');" src/app/main.ts
          grep -Fq "setMobilePngExportLabel('完了');" src/app/main.ts
          grep -Fq "setMobilePngExportLabel('失敗');" src/app/main.ts
          if sed -n '350,430p' src/app/main.ts | grep -Fq 'paintPersistence.flushCheckpoint'; then
            echo 'PNG export still blocks on persistence checkpoint' >&2
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: PNG export unit test
        run: npx vitest run tests/unit/png-export.test.ts

      - name: Production build
        run: npm run build

      - name: Commit focused fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-mobile-export-route-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/main.ts src/index.html IMPLEMENTATION_PROGRESS.md
          git commit -m 'fix: connect mobile PNG export directly'
          git push origin HEAD:main
