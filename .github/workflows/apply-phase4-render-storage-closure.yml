name: Apply Illustro phase 4 renderer closure

'on':
  push:
    paths:
      - '.github/workflows/apply-phase4-render-storage-closure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Phase 4 renderer performance persistence closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('ILLUSTRO_DESIGN_MEMO.md')
          stage = Path('.phase4-render-storage-closure.md').read_text(encoding='utf-8').strip()
          t = p.read_text(encoding='utf-8')

          marker = '# Rendering / Brush / Performance\n\n## GPU/rendering architecture — 2026-08-30'
          if marker not in t:
              raise SystemExit('Rendering marker not found')
          t = t.replace(marker, '# Rendering / Brush / Performance\n\n' + stage + '\n\n## GPU/rendering architecture — 2026-08-30', 1)

          t = t.replace(
              '- Tile dimensions, border/seam strategy, dirty-region representation, eviction policy, and exact memory budgets are to be selected by benchmark and visual correctness testing rather than fixed prematurely.',
              '- Canonical tile dimensions, seam/halo rules, dirty scheduling, eviction priorities and adaptive numeric memory budgets are defined by **P4-3 through P4-6**. Benchmarks validate those choices; they no longer remain unspecified implementation decisions.'
          )
          t = t.replace(
              '- Autosave and recovery are first-class persistence behaviors. Exact checkpoint cadence, journal format, tile-delta representation, and Undo spill format remain to be specified.',
              '- Autosave and recovery are first-class persistence behaviors. The live OPFS layout, journal/checkpoint cadence, recovery publication and Undo spill/retention policy are defined by **P4-10 through P4-14**.'
          )
          t = t.replace(
              '- **CompressionStream** may be used for compatible metadata, logs, journals, or auxiliary streams. Image-tile compression/storage codecs are to be chosen separately from benchmarks and quality/storage requirements rather than assuming gzip/deflate is optimal for pixel tiles.',
              '- **CompressionStream** may be used for compatible metadata or auxiliary streams where useful. Live working raster/mask tile storage uses the **raw/LZ4-block policy in P4-10**; external `.illustro` archive encoding remains governed by P3-17/P3-18.'
          )
          t = t.replace('- Tile dimensions, seam/border policy, cache budgets, and numeric performance targets\n', '')

          p.write_text(t, encoding='utf-8')
          PY

          grep -F '# Phase 4 Renderer / Performance / Persistence Closure — 2026-08-30' ILLUSTRO_DESIGN_MEMO.md
          grep -F '## P4-3. Canonical tile geometry — CLOSED' ILLUSTRO_DESIGN_MEMO.md
          grep -F '## P4-11. Journal, checkpoint and autosave publication — CLOSED' ILLUSTRO_DESIGN_MEMO.md
          grep -F '## P4-15. Phase 4 completion result — CLOSED' ILLUSTRO_DESIGN_MEMO.md
          ! grep -F -- '- Tile dimensions, seam/border policy, cache budgets, and numeric performance targets' ILLUSTRO_DESIGN_MEMO.md
          ! grep -F 'Exact checkpoint cadence, journal format, tile-delta representation, and Undo spill format remain to be specified' ILLUSTRO_DESIGN_MEMO.md
          ! grep -F 'Image-tile compression/storage codecs are to be chosen separately' ILLUSTRO_DESIGN_MEMO.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ILLUSTRO_DESIGN_MEMO.md
          git commit -m 'docs: close phase 4 renderer performance persistence specification'
          git push origin HEAD:main
