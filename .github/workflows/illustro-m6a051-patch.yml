name: Illustro one-shot M6A-051 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/illustro-m6a051-patch.py'
      - '.github/workflows/illustro-m6a051-patch.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply M6A-051 size-jitter patch
        run: python3 .github/illustro-m6a051-patch.py
      - name: Format changed sources
        run: npx biome format --write src/domain/brush-schema.ts src/gpu/baseline-brush.ts src/app/canonical-raster-brush.ts src/app/paint-session-controller.ts src/app/brush-preset-library.ts src/app/brush-preset-controller.ts src/index.html tests/unit/brush-size-jitter.test.ts scripts/verify-m6a-brush.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted regression tests
        run: npx vitest run tests/unit/brush-size-jitter.test.ts tests/unit/brush-random-dynamics.test.ts tests/unit/brush-maximum-response.test.ts tests/unit/brush-minimum-response.test.ts tests/unit/brush-forced-taper.test.ts tests/unit/brush-post-stroke-correction.test.ts tests/unit/brush-stroke-repetition.test.ts
      - name: M6A verification
        run: npm run verify:m6a
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        run: |
          rm -f .github/illustro-m6a051-patch.py .github/workflows/illustro-m6a051-patch.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement M6A size jitter'
          git push origin HEAD:main