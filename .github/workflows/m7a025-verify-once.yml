name: Verify M7A025 branch

on:
  push:
    branches:
      - work/m7a-025-selection-layer-ops-20260905

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Format M7A025 files
        run: npx biome format --write src/app/selection-layer-operation-engine.ts tests/unit/selection-layer-operation-engine.test.ts
      - name: Lint M7A025 files
        run: npx biome lint src/app/selection-layer-operation-engine.ts tests/unit/selection-layer-operation-engine.test.ts
      - name: Focused typecheck
        run: |
          cat > tsconfig.m7a025.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": { "rootDir": "." },
            "include": [
              "src/app/selection-layer-operation-engine.ts",
              "tests/unit/selection-layer-operation-engine.test.ts"
            ]
          }
          EOF
          npx tsc -p tsconfig.m7a025.json --noEmit
          rm tsconfig.m7a025.json
      - name: Targeted unit test
        run: npx vitest run tests/unit/selection-layer-operation-engine.test.ts
      - name: Persist formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/selection-layer-operation-engine.ts tests/unit/selection-layer-operation-engine.test.ts
          git commit -m 'style(M7A): format selection-scoped layer operations'
          git push
