name: Close M8E preview gate once

on:
  push:
    branches: [main]
    paths:
      - '.github/m8e-preview-gate-trigger'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Rebase latest main
        run: git pull --rebase origin main
      - name: Record published M8E preview
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          old = 'PUB-M8E M8Eユーザー確認用Preview公開:未完了'
          new = 'PUB-M8E M8Eユーザー確認用Preview公開:完了'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('PUB-M8E progress gate not found')
          if 'USER-M8E M8E UI/UX/Visualユーザー確認PASS:未完了' not in text:
              raise SystemExit('USER-M8E must remain pending')
          path.write_text(text)
          PY
      - name: Remove temporary helpers
        run: rm .github/workflows/close-m8e-preview-gate-once.yml .github/m8e-preview-gate-trigger
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: record published M8E preview'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
