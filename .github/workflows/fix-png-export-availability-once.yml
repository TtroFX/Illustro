name: Fix PNG export availability once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-png-export-availability-once.yml'

permissions:
  contents: write

jobs:
  fix-png-export-availability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1

      - name: Restore locked dependencies
        run: npm ci --ignore-scripts

      - name: Sync PNG export availability to active document
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/main.ts')
          text = path.read_text()

          before = """let paintRenderTask: Promise<void> = Promise.resolve();
          let refreshLayerUi = (): void => {};
          const historyUndoButton = document.querySelector<HTMLButtonElement>('#history-undo');
          """
          after = """let paintRenderTask: Promise<void> = Promise.resolve();
          let refreshLayerUi = (): void => {};
          let syncPngExportAvailability = (): void => {};
          const historyUndoButton = document.querySelector<HTMLButtonElement>('#history-undo');
          """
          if text.count(before) != 1:
              raise SystemExit('expected one application state declaration block')
          text = text.replace(before, after, 1)

          before = """  refreshLayerUi();
          }

          const documentWorkflow = installDocumentWorkflowControllerV1({
          """
          after = """  refreshLayerUi();
            syncPngExportAvailability();
          }

          const documentWorkflow = installDocumentWorkflowControllerV1({
          """
          if text.count(before) != 1:
              raise SystemExit('expected one publishDocumentState tail')
          text = text.replace(before, after, 1)

          before = """function setPngExportControlsDisabled(disabled: boolean): void {
            if (exportPngButton !== null) exportPngButton.disabled = disabled;
            if (exportPngMenuButton !== null) exportPngMenuButton.disabled = disabled;
            if (mobileExportButton !== null) {
              mobileExportButton.disabled = disabled;
              mobileExportButton.setAttribute('aria-busy', pngExportInFlight ? 'true' : 'false');
            }
          }

          const restoreMobilePngExportLabel = (): void => {
          """
          after = """function setPngExportControlsDisabled(disabled: boolean): void {
            if (exportPngButton !== null) exportPngButton.disabled = disabled;
            if (exportPngMenuButton !== null) exportPngMenuButton.disabled = disabled;
            if (mobileExportButton !== null) {
              mobileExportButton.disabled = disabled;
              mobileExportButton.setAttribute('aria-busy', pngExportInFlight ? 'true' : 'false');
            }
          }

          syncPngExportAvailability = (): void => {
            if (pngExportInFlight) return;
            const available = paintSession.currentDocument() !== null;
            setPngExportControlsDisabled(!available);
            root.dataset.illustroPngExport = available ? 'ready' : 'unavailable';
          };

          const restoreMobilePngExportLabel = (): void => {
          """
          if text.count(before) != 1:
              raise SystemExit('expected one PNG export control helper block')
          text = text.replace(before, after, 1)

          before = """    } finally {
                pngExportInFlight = false;
                setPngExportControlsDisabled(paintSession.currentDocument() === null);
              }
          """
          after = """    } finally {
                pngExportInFlight = false;
                syncPngExportAvailability();
              }
          """
          if text.count(before) != 1:
              raise SystemExit('expected one PNG export finally block')
          text = text.replace(before, after, 1)

          before = """mobileExportButton?.addEventListener('click', onExportPngClick);
          setPngExportControlsDisabled(true);
          root.dataset.illustroPngExport = 'unavailable';
          """
          after = """mobileExportButton?.addEventListener('click', onExportPngClick);
          syncPngExportAvailability();
          """
          if text.count(before) != 1:
              raise SystemExit('expected one PNG initial availability block')
          text = text.replace(before, after, 1)

          before = """    setPngExportControlsDisabled(false);
              root.dataset.illustroPngExport = 'ready';
              publishPaintHistory();
          """
          after = """    syncPngExportAvailability();
              publishPaintHistory();
          """
          if text.count(before) != 1:
              raise SystemExit('expected one renderer document-ready export enable block')
          text = text.replace(before, after, 1)

          path.write_text(text)
          PY

      - name: Format focused change
        run: npx biome format --write src/app/main.ts

      - name: Verify availability contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F "let syncPngExportAvailability = (): void => {};" src/app/main.ts
          grep -F "const available = paintSession.currentDocument() !== null;" src/app/main.ts
          grep -F "root.dataset.illustroPngExport = available ? 'ready' : 'unavailable';" src/app/main.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit focused fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-png-export-availability-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/main.ts
          git commit -m 'fix: enable PNG export for active documents'
          git push origin HEAD:main
