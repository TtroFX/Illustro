name: Apply Illustro F G closure

'on':
  push:
    paths:
      - '.github/workflows/apply-phase5-fg-closure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append authoritative F/G closure
        run: |
          python - <<'PY'
          from pathlib import Path
          memo = Path('ILLUSTRO_DESIGN_MEMO.md')
          staging = Path('.phase5-fg-closure.md')
          marker = '# Phase 5A F/G UI Structure + Visual Design Closure — 2026-08-30'
          text = memo.read_text(encoding='utf-8')
          if marker in text:
              print('F/G closure already present; no append required.')
          else:
              addition = staging.read_text(encoding='utf-8').strip()
              memo.write_text(text.rstrip() + '\n\n' + addition + '\n', encoding='utf-8')
          PY
          if git diff --quiet -- ILLUSTRO_DESIGN_MEMO.md; then
            echo 'No memo change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ILLUSTRO_DESIGN_MEMO.md
          git commit -m 'docs: close F and G UI design specification'
          git push
