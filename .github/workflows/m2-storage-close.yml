name: Close M2 storage recovery batch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m2-storage-close.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Close verified M2 items
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text(encoding='utf-8')
          for index in range(1, 15):
              prefix = f'M2-{index:03d} '
              lines = text.splitlines(keepends=True)
              matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f'expected exactly one progress line for {prefix.strip()}')
              i = matches[0]
              if lines[i].rstrip('\n').endswith(':完了'):
                  continue
              if not lines[i].rstrip('\n').endswith(':未完了'):
                  raise SystemExit(f'unexpected status for {prefix.strip()}')
              lines[i] = lines[i].replace(':未完了', ':完了', 1)
              text = ''.join(lines)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit verified progress
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add IMPLEMENTATION_PROGRESS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: close M2 storage recovery batch [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
