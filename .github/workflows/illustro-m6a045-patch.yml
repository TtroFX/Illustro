name: Illustro one-shot M6A-045 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/illustro-m6a045-patch.py'
      - '.github/workflows/illustro-m6a045-patch.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Align patch anchor with M6A-044 curve cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/illustro-m6a045-patch.py')
          text = path.read_text()
          old = '''    """      pressureFlowButton.removeEventListener('click', onPressureFlow);\n      tipShape.removeEventListener('change', onTipShape);\n""",\n    """      pressureFlowButton.removeEventListener('click', onPressureFlow);\n      tiltSizeButton.removeEventListener('click', onTiltSize);\n      tiltOpacityButton.removeEventListener('click', onTiltOpacity);\n      tiltFlowButton.removeEventListener('click', onTiltFlow);\n      pressureCurveEditor?.dispose();\n      tiltCurveEditor?.dispose();\n      tipShape.removeEventListener('change', onTipShape);\n""",'''
          new = '''    """      pressureFlowButton.removeEventListener('click', onPressureFlow);\n      pressureCurveEditor?.dispose();\n      pressureCurveEditor = null;\n      tipShape.removeEventListener('change', onTipShape);\n""",\n    """      pressureFlowButton.removeEventListener('click', onPressureFlow);\n      tiltSizeButton.removeEventListener('click', onTiltSize);\n      tiltOpacityButton.removeEventListener('click', onTiltOpacity);\n      tiltFlowButton.removeEventListener('click', onTiltFlow);\n      pressureCurveEditor?.dispose();\n      pressureCurveEditor = null;\n      tiltCurveEditor?.dispose();\n      tiltCurveEditor = null;\n      tipShape.removeEventListener('change', onTipShape);\n""",'''
          if old not in text:
              raise SystemExit('M6A-045 cleanup patch-source anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply M6A-045 tilt-mapping patch
        run: python3 .github/illustro-m6a045-patch.py
      - name: Format changed TypeScript and verifier
        run: npx biome format --write src/domain/brush-schema.ts src/gpu/baseline-brush.ts src/app/canonical-raster-brush.ts src/app/paint-session-controller.ts src/app/brush-preset-library.ts src/app/brush-preset-controller.ts tests/unit/brush-tilt-mapping.test.ts scripts/verify-m6a-brush.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted regression tests
        run: npx vitest run tests/unit/brush-tilt-mapping.test.ts tests/unit/brush-pressure-size.test.ts tests/unit/brush-pressure-opacity.test.ts tests/unit/brush-pressure-flow.test.ts tests/unit/brush-pressure-response-curve.test.ts tests/unit/brush-realtime-stabilizer.test.ts tests/unit/brush-post-stroke-correction.test.ts
      - name: M6A verification
        run: npm run verify:m6a
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        run: |
          rm -f .github/illustro-m6a045-patch.py .github/workflows/illustro-m6a045-patch.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement M6A tilt mapping'
          git push origin HEAD:main
