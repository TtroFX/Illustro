name: Apply M6A-061 particle orientation once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-m6a061-particle-orientation-once.yml'

permissions:
  contents: write

jobs:
  apply-m6a061:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply staged M6A-061 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          patch_path = Path('scripts/patch-m6a061-particle-orientation.py')
          source = patch_path.read_text(encoding='utf-8')
          old_helper = '''def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected exactly one anchor, found {count}: {old[:180]!r}')
              write(path, text.replace(old, new, 1))
          '''
          new_helper = '''def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count == 1:
                  write(path, text.replace(old, new, 1))
                  return
              parts = re.split(r'(\\s+)', old)
              pattern = ''.join(r'\\s+' if part.isspace() else re.escape(part) for part in parts if part)
              matches = list(re.finditer(pattern, text, flags=re.MULTILINE))
              if len(matches) != 1:
                  raise RuntimeError(
                      f'{path}: expected exactly one exact/flexible anchor, found exact={count}, flexible={len(matches)}: {old[:180]!r}'
                  )
              match = matches[0]
              write(path, text[:match.start()] + new + text[match.end():])
          '''
          if source.count(old_helper) != 1:
              raise SystemExit('staged patch helper shape changed unexpectedly')
          source = 'import re\n' + source.replace(old_helper, new_helper, 1)
          exec(compile(source, str(patch_path), 'exec'), {'__name__': '__main__'})
          PY

      - name: Format changed source and tests
        run: >-
          npx biome format --write
          src/domain/brush-schema.ts
          src/gpu/baseline-brush.ts
          src/app/canonical-raster-brush.ts
          src/app/paint-session-controller.ts
          src/app/brush-preset-library.ts
          src/app/brush-preset-controller.ts
          src/index.html
          tests/unit/brush-particle-orientation.test.ts
          scripts/verify-m6a-brush.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Particle-orientation regression tests
        run: npx vitest run tests/unit/brush-particle-orientation.test.ts

      - name: Verify canonical M6A contracts
        run: npm run verify:m6a

      - name: Production build
        run: npm run build

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/patch-m6a061-particle-orientation.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            ILLUSTRO_DESIGN_MEMO.md \
            IMPLEMENTATION_PROGRESS.md \
            src/domain/brush-schema.ts \
            src/gpu/baseline-brush.ts \
            src/app/canonical-raster-brush.ts \
            src/app/paint-session-controller.ts \
            src/app/brush-preset-library.ts \
            src/app/brush-preset-controller.ts \
            src/index.html \
            tests/unit/brush-particle-orientation.test.ts \
            scripts/verify-m6a-brush.mjs \
            scripts/patch-m6a061-particle-orientation.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'feat: implement M6A-061 spray particle orientation'
          git push origin HEAD:main
