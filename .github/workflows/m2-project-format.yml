name: Format M2 project lifecycle foundation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m2-project-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci --ignore-scripts
      - run: npx biome format --write src/storage/project-library.ts src/storage/project-worker-extension.ts tests/unit/project-library.test.ts
      - name: Commit formatting and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m2-project-format.yml
          git add src/storage/project-library.ts src/storage/project-worker-extension.ts tests/unit/project-library.test.ts
          git commit -m 'style: format M2 project lifecycle foundation [skip ci]'
          git push
