name: Fix canonical M8B typecheck once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m8b-tsfix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Replace non-iterable NodeList spreads
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/m8-product-shell.ts')
          text = path.read_text()
          text = text.replace('for (const child of [...app.childNodes]) compatibilityHost.append(child);', 'for (const child of Array.from(app.childNodes)) compatibilityHost.append(child);')
          text = text.replace('for (const child of [...compatibilityHost.childNodes]) app.append(child);', 'for (const child of Array.from(compatibilityHost.childNodes)) app.append(child);')
          path.write_text(text)
          PY
          npx biome format --write src/app/m8-product-shell.ts
      - name: Verify targeted typecheck
        run: npm run typecheck
      - name: Commit fix and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m8b-tsfix-once.yml
          git add src/app/m8-product-shell.ts
          git commit -m "fix: make M8B shell DOM iteration type-safe"
          git push origin HEAD:main
