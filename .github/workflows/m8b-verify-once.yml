name: Verify provisional M8 product shell once

on:
  push:
    branches: [main]
    paths:
      - '.github/m8b-verify-trigger'

permissions:
  contents: read

jobs:
  verify-m8-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Focused M8 unit tests
        run: npx vitest run tests/unit/m8-product-shell.test.ts tests/unit/m7-ui-shell.test.ts

      - name: Production build
        run: npm run build
