name: Continue M5A Grid Admission

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  implement-verify-record:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply M5A grid and admission integration
        run: |
          python scripts/.tmp-m5a-grid-admission.py
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/canvas-admission-controller.ts')
          text = path.read_text().replace('grid.tilesX * grid.tilesY', 'grid.columns * grid.rows')
          path.write_text(text)
          PY
      - name: Canonical formatting
        run: npm run format
      - name: Formatting check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: M1 contract inspection
        run: npm run verify:m1
      - name: M2 persistence inspection
        run: npm run verify:m2
      - name: M3 foundation inspection
        run: npm run verify:m3
      - name: M4 vertical-slice inspection
        run: npm run verify:m4
      - name: M5A production inspection
        run: npm run verify:m5a
      - name: M5A completion audit
        run: |
          python - <<'PY'
          from pathlib import Path
          required_files = [
              'src/app/document-workflow-controller.ts',
              'src/app/document-geometry-workflow-controller.ts',
              'src/app/viewport-controller.ts',
              'src/app/grid-controller.ts',
              'src/app/canvas-admission-controller.ts',
          ]
          for name in required_files:
              text = Path(name).read_text()
              for marker in ('TODO', 'FIXME', 'STUB'):
                  if marker in text:
                      raise SystemExit(f'M5A completion audit found {marker} in {name}')
          progress = Path('IMPLEMENTATION_PROGRESS.md').read_text()
          for number in range(1, 26):
              prefix = f'M5A-{number:03d} '
              line = next((line for line in progress.splitlines() if line.startswith(prefix)), None)
              if line is None or not line.endswith(':完了'):
                  raise SystemExit(f'prior M5A item not closed: {prefix}')
          print('M5A completion audit passed')
          PY
      - name: Production build
        env:
          ILLUSTRO_BUILD_MODE: production
        run: npm run build
      - name: Integration tests
        run: npm run test:integration
      - name: Deployment contract
        run: npm run verify:m0.5
      - name: Record M5A completion and push source
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          for item in [
              'M5A-026 grid display',
              'M5A-027 grid spacing',
              'M5A-028 grid offset',
              'M5A-029 grid color',
              'M5A-030 create/resize/import admission control integration',
              'M5A-検査 M5A内部検査',
          ]:
              old = f'{item}:未完了'
              if old not in text:
                  raise SystemExit(f'progress target missing: {old}')
              text = text.replace(old, f'{item}:完了', 1)
          path.write_text(text)
          PY
          rm scripts/.tmp-m5a-grid-admission.py
          git checkout HEAD -- .github/workflows/continue-m5a-grid-admission.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: complete M5A grid and admission integration [skip ci]'
          git push origin HEAD:main
