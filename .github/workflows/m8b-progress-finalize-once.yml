name: Finalize M8B provisional progress once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m8b-progress-finalize-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Record M8B provisional completion and published preview
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          for n in range(9, 27):
              prefix = f'M8B-{n:03d} '
              lines = []
              for line in text.splitlines():
                  if line.startswith(prefix) and line.endswith(':未完了'):
                      line = line[:-3] + '仮完了'
                  lines.append(line)
              text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
          text = text.replace('M8B-検査 M8B内部検査:未完了', 'M8B-検査 M8B内部検査:仮完了')
          text = text.replace('PUB-M8B M8Bユーザー確認用Preview公開:未完了', 'PUB-M8B M8Bユーザー確認用Preview公開:完了')
          path.write_text(text)
          PY
      - name: Remove temporary verification trigger and helper
        run: |
          rm -f .github/m8b-preview-trigger
          rm -f .github/workflows/m8b-progress-finalize-once.yml
      - name: Commit progress checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A IMPLEMENTATION_PROGRESS.md .github/m8b-preview-trigger .github/workflows/m8b-progress-finalize-once.yml
          git commit -m "chore: checkpoint M8B for user review"
          git push origin HEAD:main
