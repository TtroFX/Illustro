name: Format M6A-077 once

'on':
  push:
    branches:
      - main
    paths:
      - '.github/m6a-077-format-trigger'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: npm ci
      - name: Canonical format and verify
        shell: bash
        run: |
          set -euo pipefail
          npm run format
          npm run format:check
          npm run typecheck
          npm run test:unit -- --run tests/unit/default-brush-thumbnails.test.ts tests/unit/default-brush-pack.test.ts
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate-m6a-brush-thumbnails.mjs \
            src/app/default-brush-thumbnails.ts tests/unit/default-brush-thumbnails.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'M6A-077 sources already formatted.'
            exit 0
          fi
          git commit -m 'style: format deterministic brush thumbnail sources'
          git push origin HEAD:main
