name: Cleanup temporary M8 workflows once

on:
  push:
    branches: [main]
    paths:
      - '.github/m8-cleanup-trigger'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary M8 workflow helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in $(seq 1 12); do
            git fetch origin main
            git reset --hard origin/main
            git rm -f --ignore-unmatch \
              .github/workflows/m8b-verify-once.yml \
              .github/m8b-verify-trigger \
              .github/workflows/m8-format-once.yml \
              .github/m8-format-trigger \
              .github/workflows/m8b-progress-once.yml \
              .github/m8b-progress-trigger \
              .github/workflows/m8-cleanup-once.yml \
              .github/m8-cleanup-trigger
            if git diff --cached --quiet; then
              echo 'Temporary M8 workflow helpers already removed.'
              exit 0
            fi
            git commit -m 'chore: remove temporary M8 workflow helpers'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update detected; retrying ($attempt/12)."
            sleep 2
          done
          exit 1
