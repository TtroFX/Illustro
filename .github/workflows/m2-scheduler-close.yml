name: Close M2 persistence schedulers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m2-scheduler-close.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Close scheduler items
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text(encoding='utf-8')
          for index in (15, 16):
              old = f'M2-{index:03d} ' 
              lines = text.splitlines(keepends=True)
              matches = [i for i, line in enumerate(lines) if line.startswith(old)]
              if len(matches) != 1:
                  raise SystemExit(f'expected one {old.strip()} line')
              i = matches[0]
              if ':完了' in lines[i]:
                  continue
              if ':未完了' not in lines[i]:
                  raise SystemExit(f'unexpected status for {old.strip()}')
              lines[i] = lines[i].replace(':未完了', ':完了', 1)
              text = ''.join(lines)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit verified progress
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add IMPLEMENTATION_PROGRESS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: close M2 persistence schedulers [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
