name: Persist M5C base blend modes

on:
  push:
    branches:
      - work/m5c-base-blend-modes-20260902
    paths:
      - '.github/workflows/persist-m5c-base-blend-modes.yml'

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Reproduce verified M5C tree
        run: python scripts/apply-m5c-base-blend-modes.py
      - name: Normalize verified files
        run: npm run format
      - name: Keep workflow files connector-managed
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- .github/workflows/ci.yml
          git checkout HEAD -- .github/workflows/apply-m5c-base-blend-modes.yml
          git checkout HEAD -- .github/workflows/apply-m5c-base-blend-modes-v2.yml
          git checkout HEAD -- .github/workflows/persist-m5c-base-blend-modes.yml
      - name: Persist verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/apply-m5c-base-blend-modes.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: persist verified M5C base blend modes [skip ci]'
          git push origin HEAD:work/m5c-base-blend-modes-20260902
