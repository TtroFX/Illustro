name: Mark M8B shell provisional once

on:
  push:
    branches: [main]
    paths:
      - '.github/m8b-progress-trigger'

permissions:
  contents: write

jobs:
  mark-m8b-provisional:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record M8B provisional shell progress
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in $(seq 1 12); do
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          from pathlib import Path

          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          replacements = {
              'M8B-001 Library shell:未完了': 'M8B-001 Library shell:仮完了',
              'M8B-002 Editor shell:未完了': 'M8B-002 Editor shell:仮完了',
              'M8B-003 Task surfaces framework:未完了': 'M8B-003 Task surfaces framework:仮完了',
              'M8B-004 Application/Document Bar:未完了': 'M8B-004 Application/Document Bar:仮完了',
              'M8B-005 Canvas Workspace:未完了': 'M8B-005 Canvas Workspace:仮完了',
              'M8B-006 Primary Tool Rail shell:未完了': 'M8B-006 Primary Tool Rail shell:仮完了',
              'M8B-007 Inspector Dock shell:未完了': 'M8B-007 Inspector Dock shell:仮完了',
              'M8B-008 Inspector Action Strip:未完了': 'M8B-008 Inspector Action Strip:仮完了',
          }
          for before, after in replacements.items():
              if before in text:
                  if text.count(before) != 1:
                      raise SystemExit(f'expected one progress line: {before}')
                  text = text.replace(before, after, 1)
              elif after not in text:
                  raise SystemExit(f'progress line missing: {before}')
          path.write_text(text)
          PY

            git add IMPLEMENTATION_PROGRESS.md
            if git diff --cached --quiet; then
              echo 'M8B shell progress already recorded.'
              exit 0
            fi
            git commit -m 'chore: mark M8B shell provisionally complete'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update detected; retrying ($attempt/12)."
            sleep 2
          done

          echo 'Unable to publish M8B provisional progress after retries.' >&2
          exit 1
