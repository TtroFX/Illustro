name: Implement M5B Layer Vertical Flip

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  implement-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Capture checked out identity
        run: echo "ILLUSTRO_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify deployment branches
        run: |
          git fetch origin preview:refs/remotes/origin/preview
          git show-ref --verify refs/remotes/origin/preview
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply layer vertical flip integration
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one anchor in {path}; found {count}: {old[:140]!r}')
              file.write_text(text.replace(old, new, 1))

          Path('tests/unit/layer-raster-flip-vertical.test.ts').write_text(r'''import { describe, expect, it } from 'vitest';
          import { prepareLayerRasterFlipV1 } from '../../src/app/layer-raster-flip.js';
          import type { RasterMergePersistencePortV1 } from '../../src/app/layer-raster-merge.js';
          import type {
            PaintDecodedRasterTileV1,
            PaintPersistedRasterTileV1,
            PaintRasterTilePixelFormatV1,
          } from '../../src/app/paint-persistence-controller.js';
          import type { PaintProjectSnapshotV1 } from '../../src/app/paint-session-controller.js';
          import { createDocumentV1 } from '../../src/domain/document.js';
          import { createRasterLayer, createRasterTileReference } from '../../src/domain/layers.js';

          class MemoryRasterPersistence implements RasterMergePersistencePortV1 {
            readonly tiles = new Map<string, PaintDecodedRasterTileV1>();
            readonly writes: PaintPersistedRasterTileV1[] = [];

            seed(input: {
              readonly payloadRef: string;
              readonly width: number;
              readonly height: number;
              readonly pixelFormat: PaintRasterTilePixelFormatV1;
              readonly bytes: Uint8Array;
            }): void {
              this.tiles.set(
                input.payloadRef,
                Object.freeze({
                  schema: 'illustro.paint-decoded-raster-tile/1' as const,
                  payloadRef: input.payloadRef,
                  objectHash: input.payloadRef.replace('sha256:', ''),
                  codec: 'raw' as const,
                  pixelFormat: input.pixelFormat,
                  width: input.width,
                  height: input.height,
                  bytes: new Uint8Array(input.bytes),
                }),
              );
            }

            async readRasterTile(payloadRef: string): Promise<PaintDecodedRasterTileV1> {
              const tile = this.tiles.get(payloadRef);
              if (tile === undefined) throw new Error(`missing tile ${payloadRef}`);
              return tile;
            }

            async persistRasterTile(input: {
              readonly width: number;
              readonly height: number;
              readonly pixelFormat: PaintRasterTilePixelFormatV1;
              readonly bytes: Uint8Array | ArrayBuffer;
            }): Promise<PaintPersistedRasterTileV1> {
              const index = this.writes.length + 1;
              const objectHash = index.toString(16).padStart(64, '0');
              const payloadRef = `sha256:${objectHash}`;
              const bytes =
                input.bytes instanceof Uint8Array
                  ? new Uint8Array(input.bytes)
                  : new Uint8Array(input.bytes.slice(0));
              this.tiles.set(
                payloadRef,
                Object.freeze({
                  schema: 'illustro.paint-decoded-raster-tile/1' as const,
                  payloadRef,
                  objectHash,
                  codec: 'raw' as const,
                  pixelFormat: input.pixelFormat,
                  width: input.width,
                  height: input.height,
                  bytes,
                }),
              );
              const persisted = Object.freeze({
                schema: 'illustro.paint-persisted-raster-tile/1' as const,
                payloadRef,
                objectHash,
                codec: 'raw' as const,
                pixelFormat: input.pixelFormat,
                width: input.width,
                height: input.height,
                rawByteLength: bytes.byteLength,
                encodedByteLength: bytes.byteLength,
              });
              this.writes.push(persisted);
              return persisted;
            }
          }

          function pixel(bytes: Uint8Array, width: number, x: number, y: number): number[] {
            const offset = (y * width + x) * 4;
            return [...bytes.slice(offset, offset + 4)];
          }

          describe('M5B layer vertical flip', () => {
            it('mirrors selected layer through partial sparse-tile bottom edges', async () => {
              const topRef = `sha256:${'e'.repeat(64)}`;
              const bottomRef = `sha256:${'f'.repeat(64)}`;
              const raster = createRasterLayer({
                name: 'Vertical',
                tiles: [
                  createRasterTileReference({ x: 0, y: 0, payloadRef: topRef }),
                  createRasterTileReference({ x: 0, y: 1, payloadRef: bottomRef }),
                ],
              });
              const document = createDocumentV1({ width: 1, height: 300 });
              const snapshot: PaintProjectSnapshotV1 = Object.freeze({
                schema: 'illustro.paint-project-snapshot/1' as const,
                document: Object.freeze({
                  ...document,
                  layerTree: Object.freeze({
                    rootLayerIds: Object.freeze([raster.id]),
                    layers: Object.freeze({ [raster.id]: raster }),
                  }),
                }),
                committedStrokes: Object.freeze([]),
              });
              const persistence = new MemoryRasterPersistence();
              const top = new Uint8Array(256 * 4);
              top.set([10, 20, 30, 40], 0);
              top.set([50, 60, 70, 80], 255 * 4);
              const bottom = new Uint8Array(44 * 4);
              bottom.set([90, 100, 110, 120], 43 * 4);
              persistence.seed({
                payloadRef: topRef,
                width: 1,
                height: 256,
                pixelFormat: 'rgba8-unorm',
                bytes: top,
              });
              persistence.seed({
                payloadRef: bottomRef,
                width: 1,
                height: 44,
                pixelFormat: 'rgba8-unorm',
                bytes: bottom,
              });

              const prepared = await prepareLayerRasterFlipV1(
                snapshot,
                raster.id,
                'vertical',
                persistence,
              );
              expect(prepared.tiles.map(({ x, y }) => [x, y])).toEqual([
                [0, 0],
                [0, 1],
              ]);
              const output0 = persistence.tiles.get(prepared.tiles[0]?.payloadRef ?? '');
              const output1 = persistence.tiles.get(prepared.tiles[1]?.payloadRef ?? '');
              expect(output0).toBeDefined();
              expect(output1).toBeDefined();
              if (output0 === undefined || output1 === undefined) return;
              expect(pixel(output0.bytes, 1, 0, 0)).toEqual([90, 100, 110, 120]);
              expect(pixel(output0.bytes, 1, 0, 44)).toEqual([50, 60, 70, 80]);
              expect(pixel(output1.bytes, 1, 0, 43)).toEqual([10, 20, 30, 40]);
            });
          });
          ''')

          replace_once(
              'src/app/layer-workflow-controller.ts',
              "  const horizontalFlipButton = required<HTMLButtonElement>('#layer-flip-horizontal');\n  const deleteButton",
              "  const horizontalFlipButton = required<HTMLButtonElement>('#layer-flip-horizontal');\n  const verticalFlipButton = required<HTMLButtonElement>('#layer-flip-vertical');\n  const deleteButton",
          )
          replace_once(
              'src/app/layer-workflow-controller.ts',
              "    horizontalFlipButton.title = flipEligibility?.reason ?? 'レイヤーを左右反転';\n    deleteButton.disabled",
              "    horizontalFlipButton.title = flipEligibility?.reason ?? 'レイヤーを左右反転';\n    verticalFlipButton.disabled =\n      flipEligibility?.eligible !== true || options.paintSession.activeStrokeId() !== null;\n    verticalFlipButton.title = flipEligibility?.reason ?? 'レイヤーを上下反転';\n    deleteButton.disabled",
          )
          replace_once(
              'src/app/layer-workflow-controller.ts',
              "  const onDelete = (): void => {",
              "  const onVerticalFlip = (): void => {\n    const layerId = options.paintSession.activeLayerId();\n    if (layerId === null) return;\n    options.schedule(async () => {\n      try {\n        if (options.paintSession.activeStrokeId() !== null) {\n          throw new Error('layer vertical flip is unavailable while a stroke is active');\n        }\n        const current = options.paintSession.projectSnapshot();\n        if (current === null) return;\n        const prepared = await prepareLayerRasterFlipV1(\n          current,\n          layerId,\n          'vertical',\n          options.paintPersistence,\n        );\n        const transaction = await options.paintHistory.commitSnapshotTransform(\n          'layer.flip.vertical',\n          (before, revision) => applyPreparedLayerRasterFlipV1(before, prepared, revision),\n        );\n        options.paintSession.setActiveLayer(layerId);\n        await options.paintPersistence.markDirty(transaction.transactionId);\n        root.dataset.illustroLayerTransaction = transaction.transactionId;\n        clearError();\n        refresh();\n        options.onHistoryChanged();\n      } catch (error) {\n        publishError(error);\n      }\n    });\n  };\n\n  const onDelete = (): void => {",
          )
          replace_once(
              'src/app/layer-workflow-controller.ts',
              "  horizontalFlipButton.addEventListener('click', onHorizontalFlip);\n  deleteButton.addEventListener",
              "  horizontalFlipButton.addEventListener('click', onHorizontalFlip);\n  verticalFlipButton.addEventListener('click', onVerticalFlip);\n  deleteButton.addEventListener",
          )
          replace_once(
              'src/app/layer-workflow-controller.ts',
              "      horizontalFlipButton.removeEventListener('click', onHorizontalFlip);\n      deleteButton.removeEventListener",
              "      horizontalFlipButton.removeEventListener('click', onHorizontalFlip);\n      verticalFlipButton.removeEventListener('click', onVerticalFlip);\n      deleteButton.removeEventListener",
          )

          replace_once(
              'src/index.html',
              '              <button id="layer-flip-horizontal" type="button" aria-label="選択レイヤーを左右反転" title="左右反転">⇆</button>\n',
              '              <button id="layer-flip-horizontal" type="button" aria-label="選択レイヤーを左右反転" title="左右反転">⇆</button>\n              <button id="layer-flip-vertical" type="button" aria-label="選択レイヤーを上下反転" title="上下反転">⇅</button>\n',
          )

          replace_once(
              'scripts/verify-m5b-layer-foundation.mjs',
              "  \"'layer.flip.horizontal'\",\n  'prepareRasterMergeDownV1'",
              "  \"'layer.flip.horizontal'\",\n  \"'layer.flip.vertical'\",\n  'prepareRasterMergeDownV1'",
          )
          replace_once(
              'scripts/verify-m5b-layer-foundation.mjs',
              "  'id=\"layer-flip-horizontal\"',\n  'id=\"layer-rename\"'",
              "  'id=\"layer-flip-horizontal\"',\n  'id=\"layer-flip-vertical\"',\n  'id=\"layer-rename\"'",
          )
          PY
      - name: Canonical formatting
        run: npm run format
      - name: Formatting check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: M1 contract inspection
        run: npm run verify:m1
      - name: M2 persistence inspection
        run: npm run verify:m2
      - name: M3 foundation inspection
        run: npm run verify:m3
      - name: M4 vertical-slice inspection
        run: npm run verify:m4
      - name: M5A document foundation inspection
        run: npm run verify:m5a
      - name: M5B layer system inspection
        run: npm run verify:m5b
      - name: Production build
        env:
          ILLUSTRO_BUILD_MODE: production
        run: npm run build
      - name: Integration tests
        run: npm run test:integration
      - name: Deployment contract
        run: npm run verify:m0.5
      - name: Record verified progress and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('IMPLEMENTATION_PROGRESS.md')
          text = path.read_text()
          old = 'M5B-024 layer vertical flip:未完了'
          new = 'M5B-024 layer vertical flip:完了'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one progress marker, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/layer-workflow-controller.ts src/index.html tests/unit/layer-raster-flip-vertical.test.ts scripts/verify-m5b-layer-foundation.mjs IMPLEMENTATION_PROGRESS.md
          git commit -m 'feat: implement M5B layer vertical flip [skip ci]'
          git push origin HEAD:main
