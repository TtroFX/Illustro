name: Continue M4 stroke history

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  implement-verify-record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply M4 history implementation
        shell: bash
        run: |
          cat > src/app/paint-history-controller.ts <<'EOF'
          import {
            createHistoryPayloadV1,
            createHistoryTransactionV1,
            HistorySpineV1,
            type HistorySpillAdapterV1,
            type HistorySpineStateV1,
            type HistoryTransactionV1,
          } from '../history/history.js';
          import { parseRevision } from '../domain/identity.js';
          import {
            PaintSessionControllerV1,
            parsePaintProjectSnapshotV1,
          } from './paint-session-controller.js';

          export interface PaintHistorySnapshotV1 {
            readonly schema: 'illustro.paint-history/1';
            readonly length: number;
            readonly cursor: number;
            readonly canUndo: boolean;
            readonly canRedo: boolean;
            readonly revisionHighWater: number;
          }

          export class PaintHistoryControllerV1 {
            readonly #session: PaintSessionControllerV1;
            #spine = new HistorySpineV1();
            #revisionHighWater = 0;

            constructor(session: PaintSessionControllerV1) {
              this.#session = session;
            }

            snapshot(): PaintHistorySnapshotV1 {
              return Object.freeze({
                schema: 'illustro.paint-history/1' as const,
                length: this.#spine.length,
                cursor: this.#spine.cursor,
                canUndo: this.#spine.canUndo,
                canRedo: this.#spine.canRedo,
                revisionHighWater: this.#revisionHighWater,
              });
            }

            reset(): PaintHistorySnapshotV1 {
              this.#spine = new HistorySpineV1();
              this.#revisionHighWater = this.#session.currentDocument()?.revision ?? 0;
              return this.snapshot();
            }

            hydrate(state: HistorySpineStateV1, revisionHighWater = 0): PaintHistorySnapshotV1 {
              this.#spine = HistorySpineV1.hydrate(state);
              this.#revisionHighWater = Math.max(
                revisionHighWater,
                this.#session.currentDocument()?.revision ?? 0,
              );
              return this.snapshot();
            }

            exportState(): HistorySpineStateV1 {
              return this.#spine.exportState();
            }

            commitCompletedStroke(strokeId: string): HistoryTransactionV1 {
              const before = this.#session.projectSnapshot();
              if (before === null) throw new Error('paint history requires an active document');
              if (this.#revisionHighWater >= Number.MAX_SAFE_INTEGER) {
                throw new RangeError('paint document revision high-water is exhausted');
              }
              const afterRevision = parseRevision(
                Math.max(this.#revisionHighWater, before.document.revision) + 1,
              );
              const committed = this.#session.commitCompletedPaintStroke(strokeId, afterRevision);
              if (committed === null) throw new Error(`completed paint stroke not found: ${strokeId}`);
              const transaction = createHistoryTransactionV1({
                transactionId: crypto.randomUUID(),
                commandId: 'brush.stroke',
                beforeRevision: committed.before.document.revision,
                afterRevision: committed.after.document.revision,
                payload: createHistoryPayloadV1({
                  strategy: 'object-before-after',
                  before: committed.before,
                  after: committed.after,
                }),
              });
              this.#spine.commit(transaction);
              this.#revisionHighWater = Math.max(
                this.#revisionHighWater,
                committed.after.document.revision,
              );
              return transaction;
            }

            async undo(spillAdapter?: HistorySpillAdapterV1): Promise<boolean> {
              return this.#spine.undo(async (transaction, direction) => {
                const value = direction === 'undo' ? transaction.payload.before : transaction.payload.after;
                await this.#session.restoreProjectSnapshot(parsePaintProjectSnapshotV1(value));
              }, spillAdapter);
            }

            async redo(spillAdapter?: HistorySpillAdapterV1): Promise<boolean> {
              return this.#spine.redo(async (transaction, direction) => {
                const value = direction === 'undo' ? transaction.payload.before : transaction.payload.after;
                await this.#session.restoreProjectSnapshot(parsePaintProjectSnapshotV1(value));
              }, spillAdapter);
            }
          }
          EOF

          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern missing in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          p = Path('src/app/paint-session-controller.ts')
          text = p.read_text()
          text = text.replace(
              "import type { LayerId } from '../domain/identity.js';",
              "import { isUuid, parseDocumentId, parseLayerId, parseProjectId, parseRevision, type LayerId, type Revision } from '../domain/identity.js';",
          )
          text = text.replace(
              "export interface PaintRendererDocumentPortV1 {\n  configureDocument(input: { readonly width: number; readonly height: number }): Promise<unknown>;\n}",
              "export interface PaintRendererDocumentPortV1 {\n  configureDocument(input: { readonly width: number; readonly height: number }): Promise<unknown>;\n  restoreBaselineStrokes(\n    strokes: readonly { readonly strokeId: string; readonly dabs: readonly BaselineBrushDabV1[] }[],\n  ): Promise<unknown>;\n}",
          )
          text = text.replace(
              "export interface CompletedPaintStrokeV1 {\n  readonly stroke: PaintStrokeV1;\n  readonly dabs: readonly BaselineBrushDabV1[];\n}\n",
              "export interface CompletedPaintStrokeV1 {\n  readonly stroke: PaintStrokeV1;\n  readonly dabs: readonly BaselineBrushDabV1[];\n}\n\nexport interface PaintProjectSnapshotV1 {\n  readonly schema: 'illustro.paint-project-snapshot/1';\n  readonly document: DocumentV1;\n  readonly committedStrokes: readonly CompletedPaintStrokeV1[];\n}\n\nexport interface PaintStrokeCommitV1 {\n  readonly before: PaintProjectSnapshotV1;\n  readonly after: PaintProjectSnapshotV1;\n  readonly committed: CompletedPaintStrokeV1;\n}\n",
          )
          text = text.replace(
              "  readonly pendingCompletedStrokeCount: number;\n}",
              "  readonly pendingCompletedStrokeCount: number;\n  readonly committedStrokeCount: number;\n}",
          )
          marker = "export type PaintDocumentCreationInputV1 = Parameters<typeof createDocumentV1>[0];\n"
          parser = r'''

function isRecord(value: unknown): value is Readonly<Record<string, unknown>> {
  return typeof value === 'object' && value !== null && !Array.isArray(value);
}

function finiteNumber(value: unknown, label: string): number {
  if (typeof value !== 'number' || !Number.isFinite(value)) {
    throw new TypeError(`${label} must be finite`);
  }
  return value;
}

function parseStoredStrokeSample(value: unknown): PaintStrokeSampleV1 {
  if (!isRecord(value) || value.schema !== 'illustro.paint-stroke-sample/1') {
    throw new TypeError('invalid paint stroke sample schema');
  }
  if (!Number.isSafeInteger(value.sequence) || (value.sequence as number) < 0) {
    throw new TypeError('invalid paint stroke sample sequence');
  }
  const nullableAngle = (angle: unknown, label: string): number | null =>
    angle === null ? null : finiteNumber(angle, label);
  return Object.freeze({
    schema: 'illustro.paint-stroke-sample/1' as const,
    sequence: value.sequence as number,
    timestampMs: finiteNumber(value.timestampMs, 'stroke timestamp'),
    documentX: finiteNumber(value.documentX, 'stroke x'),
    documentY: finiteNumber(value.documentY, 'stroke y'),
    pressure: finiteNumber(value.pressure, 'stroke pressure'),
    tangentialPressure: finiteNumber(value.tangentialPressure, 'stroke tangential pressure'),
    tiltX: finiteNumber(value.tiltX, 'stroke tiltX'),
    tiltY: finiteNumber(value.tiltY, 'stroke tiltY'),
    twist: finiteNumber(value.twist, 'stroke twist'),
    altitudeAngle: nullableAngle(value.altitudeAngle, 'stroke altitude'),
    azimuthAngle: nullableAngle(value.azimuthAngle, 'stroke azimuth'),
  });
}

function parseStoredDab(value: unknown): BaselineBrushDabV1 {
  if (!isRecord(value) || value.schema !== 'illustro.baseline-brush-dab/1') {
    throw new TypeError('invalid baseline dab schema');
  }
  const radius = finiteNumber(value.radius, 'baseline dab radius');
  const opacity = finiteNumber(value.opacity, 'baseline dab opacity');
  if (radius <= 0 || opacity < 0 || opacity > 1) throw new RangeError('invalid baseline dab range');
  return Object.freeze({
    schema: 'illustro.baseline-brush-dab/1' as const,
    x: finiteNumber(value.x, 'baseline dab x'),
    y: finiteNumber(value.y, 'baseline dab y'),
    radius,
    opacity,
  });
}

function parseStoredCompletedStroke(value: unknown): CompletedPaintStrokeV1 {
  if (!isRecord(value) || !isRecord(value.stroke) || !Array.isArray(value.dabs)) {
    throw new TypeError('invalid completed paint stroke');
  }
  const stroke = value.stroke;
  if (stroke.schema !== 'illustro.paint-stroke/1' || !isUuid(stroke.strokeId)) {
    throw new TypeError('invalid paint stroke identity');
  }
  if (!Number.isSafeInteger(stroke.pointerId) || (stroke.pointerId as number) < 0) {
    throw new TypeError('invalid paint stroke pointerId');
  }
  if (stroke.source !== 'pen' && stroke.source !== 'mouse') throw new TypeError('invalid paint stroke source');
  if (!Array.isArray(stroke.samples)) throw new TypeError('paint stroke samples must be an array');
  const normalizedStroke: PaintStrokeV1 = Object.freeze({
    schema: 'illustro.paint-stroke/1' as const,
    strokeId: stroke.strokeId,
    pointerId: stroke.pointerId as number,
    source: stroke.source,
    layerId: parseLayerId(stroke.layerId),
    samples: Object.freeze(stroke.samples.map(parseStoredStrokeSample)),
  });
  return freezeCompletedStroke(normalizedStroke, value.dabs.map(parseStoredDab));
}

export function parsePaintProjectSnapshotV1(value: unknown): PaintProjectSnapshotV1 {
  if (!isRecord(value) || value.schema !== 'illustro.paint-project-snapshot/1') {
    throw new TypeError('invalid paint project snapshot schema');
  }
  if (!isRecord(value.document) || value.document.schema !== 'illustro.document/1') {
    throw new TypeError('invalid paint project document');
  }
  const documentValue = value.document;
  if (!isRecord(documentValue.canvas) || !isRecord(documentValue.layerTree)) {
    throw new TypeError('invalid paint project document structure');
  }
  if (
    !Number.isSafeInteger(documentValue.canvas.width) ||
    (documentValue.canvas.width as number) < 1 ||
    !Number.isSafeInteger(documentValue.canvas.height) ||
    (documentValue.canvas.height as number) < 1
  ) {
    throw new RangeError('invalid recovered canvas dimensions');
  }
  if (!Array.isArray(documentValue.layerTree.rootLayerIds) || !isRecord(documentValue.layerTree.layers)) {
    throw new TypeError('invalid recovered layer tree');
  }
  const rootLayerIds = Object.freeze(documentValue.layerTree.rootLayerIds.map(parseLayerId));
  if (rootLayerIds.length === 0) throw new Error('paint snapshot requires an active raster layer');
  for (const layerId of rootLayerIds) {
    if (!(layerId in documentValue.layerTree.layers)) throw new Error('paint snapshot root layer is missing');
  }
  const document = Object.freeze({
    ...documentValue,
    documentId: parseDocumentId(documentValue.documentId),
    projectId: parseProjectId(documentValue.projectId),
    revision: parseRevision(documentValue.revision),
    layerTree: Object.freeze({
      rootLayerIds,
      layers: Object.freeze({ ...documentValue.layerTree.layers }),
    }),
  }) as unknown as DocumentV1;
  if (!Array.isArray(value.committedStrokes)) {
    throw new TypeError('paint snapshot committed strokes must be an array');
  }
  const committedStrokes = Object.freeze(value.committedStrokes.map(parseStoredCompletedStroke));
  for (const completed of committedStrokes) {
    if (!(completed.stroke.layerId in document.layerTree.layers)) {
      throw new Error('paint stroke targets a missing layer');
    }
  }
  return Object.freeze({
    schema: 'illustro.paint-project-snapshot/1' as const,
    document,
    committedStrokes,
  });
}
'''
          if marker not in text:
              raise SystemExit('paint document creation marker missing')
          text = text.replace(marker, marker + parser, 1)
          text = text.replace(
              "  readonly #completedStrokes: CompletedPaintStrokeV1[] = [];\n  #disposed = false;",
              "  readonly #completedStrokes: CompletedPaintStrokeV1[] = [];\n  readonly #committedStrokes: CompletedPaintStrokeV1[] = [];\n  #disposed = false;",
          )
          text = text.replace(
              "      pendingCompletedStrokeCount: this.#completedStrokes.length,\n    });",
              "      pendingCompletedStrokeCount: this.#completedStrokes.length,\n      committedStrokeCount: this.#committedStrokes.length,\n    });",
          )
          method_marker = "  activeStroke(): PaintStrokeV1 | null {\n    return this.#activeStroke;\n  }\n"
          methods = r'''

  projectSnapshot(): PaintProjectSnapshotV1 | null {
    const document = this.#document;
    if (document === null) return null;
    return Object.freeze({
      schema: 'illustro.paint-project-snapshot/1' as const,
      document,
      committedStrokes: Object.freeze([...this.#committedStrokes]),
    });
  }

  committedStrokes(): readonly CompletedPaintStrokeV1[] {
    return Object.freeze([...this.#committedStrokes]);
  }

  commitCompletedPaintStroke(
    strokeId: string,
    afterRevision: Revision | number,
    now: Date = new Date(),
  ): PaintStrokeCommitV1 | null {
    const document = this.#document;
    if (document === null) return null;
    const index = this.#completedStrokes.findIndex((entry) => entry.stroke.strokeId === strokeId);
    if (index < 0) return null;
    const revision = parseRevision(afterRevision);
    if (revision <= document.revision) {
      throw new RangeError('committed paint stroke revision must advance the document');
    }
    const timestamp = now.toISOString();
    if (Number.isNaN(Date.parse(timestamp))) throw new TypeError('paint commit timestamp is invalid');
    const before = this.projectSnapshot();
    if (before === null) return null;
    const [committed] = this.#completedStrokes.splice(index, 1);
    if (committed === undefined) return null;
    this.#committedStrokes.push(committed);
    this.#document = Object.freeze({ ...document, revision, modifiedAt: timestamp });
    const after = this.projectSnapshot();
    if (after === null) throw new Error('paint project snapshot disappeared during commit');
    return Object.freeze({ before, after, committed });
  }

  async restoreProjectSnapshot(snapshot: PaintProjectSnapshotV1): Promise<PaintProjectSnapshotV1> {
    if (this.#disposed) throw new Error('paint session is disposed');
    const normalized = parsePaintProjectSnapshotV1(snapshot);
    await this.#renderer.configureDocument({
      width: normalized.document.canvas.width,
      height: normalized.document.canvas.height,
    });
    await this.#renderer.restoreBaselineStrokes(
      normalized.committedStrokes.map((entry) => ({
        strokeId: entry.stroke.strokeId,
        dabs: entry.dabs,
      })),
    );
    this.#document = normalized.document;
    this.#activeLayerId = normalized.document.layerTree.rootLayerIds[0] ?? null;
    this.#clearActiveStroke();
    this.#completedStrokes.length = 0;
    this.#committedStrokes.length = 0;
    this.#committedStrokes.push(...normalized.committedStrokes);
    return this.projectSnapshot()!;
  }
'''
          if method_marker not in text:
              raise SystemExit('activeStroke method marker missing')
          text = text.replace(method_marker, method_marker + methods, 1)
          text = text.replace(
              "    this.#completedStrokes.length = 0;\n    return initial.document;",
              "    this.#completedStrokes.length = 0;\n    this.#committedStrokes.length = 0;\n    return initial.document;",
