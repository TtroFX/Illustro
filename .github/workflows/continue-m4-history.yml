name: Continue M4 stroke history

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  implement-verify-record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.1
      - name: Restore locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply M4 history implementation
        run: python .github/continue-m4-history.py
      - name: Canonical formatting
        run: npm run format
      - name: Formatting check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: M1 contract inspection
        run: npm run verify:m1
      - name: M2 persistence inspection
        run: npm run verify:m2
      - name: M3 foundation inspection
        run: npm run verify:m3
      - name: Production build
        env:
          ILLUSTRO_BUILD_MODE: production
        run: npm run build
      - name: Integration tests
        run: npm run test:integration
      - name: Deployment contract
        run: npm run verify:m0.5
      - name: Record progress and push
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('IMPLEMENTATION_PROGRESS.md')
          text = p.read_text()
          for item in [
              'M4-010 strokeを1 history transactionとしてcommit',
              'M4-011 stroke Undo',
              'M4-012 stroke Redo',
          ]:
              old = f'{item}:未完了'
              new = f'{item}:完了'
              if old not in text:
                  raise SystemExit(f'progress marker missing: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          rm .github/workflows/continue-m4-history.yml .github/continue-m4-history.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: connect M4 stroke history [skip ci]'
          git push origin HEAD:main
