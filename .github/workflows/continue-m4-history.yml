          )
          p.write_text(text)

          replace_once(
              'src/gpu/renderer-tile-state.ts',
              "  getDirty(coordinate: TileCoordinateV1): DirtyTileStateV1 | null {\n    return this.#dirty.get(coordinate);\n  }\n\n  dispose(): void {",
              "  getDirty(coordinate: TileCoordinateV1): DirtyTileStateV1 | null {\n    return this.#dirty.get(coordinate);\n  }\n\n  resetContent(): void {\n    for (const entry of this.#tiles.entries()) this.deallocate(entry.coordinate);\n    this.#dirty.clearAll();\n  }\n\n  dispose(): void {",
          )

          p = Path('src/gpu/baseline-paint-renderer.ts')
          text = p.read_text()
          text = text.replace(
              "export interface BaselinePaintAffectedTileV1 {",
              "export interface BaselinePaintCommittedStrokeV1 {\n  readonly strokeId: string;\n  readonly dabs: readonly BaselineBrushDabV1[];\n}\n\nexport interface BaselinePaintAffectedTileV1 {",
              1,
          )
          text = text.replace(
              "  attachDevice(device: IllustroGpuDeviceV1 | null): void {\n    this.#device = device;\n    this.#gpu.attachDevice(device);\n  }",
              "  attachDevice(device: IllustroGpuDeviceV1 | null): void {\n    this.#device = device;\n    this.#gpu.attachDevice(device);\n    this.#present();\n  }",
              1,
          )
          text = text.replace(
              "    this.#surface = surface;\n    this.#surfaceFormat = format;\n  }",
              "    this.#surface = surface;\n    this.#surfaceFormat = format;\n    this.#present();\n  }",
              1,
          )
          marker = "  dispose(): void {\n"
          restore = r'''  restoreCommittedStrokes(
    strokes: readonly BaselinePaintCommittedStrokeV1[],
  ): BaselinePaintRendererSnapshotV1 {
    const { tileState, width, height } = this.#requireDocument();
    tileState.resetContent();
    this.#activeStroke = null;
    this.#committedStrokes.clear();
    this.#finalizations.clear();
    const seen = new Set<string>();
    for (const stroke of strokes) {
      if (stroke.strokeId.length === 0 || seen.has(stroke.strokeId)) {
        throw new TypeError('baseline restored stroke IDs must be unique and non-empty');
      }
      seen.add(stroke.strokeId);
      const dabs = freezeDabs(stroke.dabs);
      if (dabs.some((dab) => !isRenderableDab(dab))) throw new RangeError('invalid restored baseline dab');
      for (const plan of planBaselineBrushTilesV1(dabs, width, height)) {
        tileState.allocate(plan.coordinate);
        tileState.markDirty(plan.coordinate, plan.dirtyRect);
      }
      this.#committedStrokes.set(stroke.strokeId, dabs);
    }
    this.#present();
    return this.snapshot();
  }

'''
          if marker not in text:
              raise SystemExit('baseline renderer dispose marker missing')
          text = text.replace(marker, restore + marker, 1)
          p.write_text(text)

          p = Path('src/app/renderer-controller.ts')
          text = p.read_text()
          text = text.replace(
