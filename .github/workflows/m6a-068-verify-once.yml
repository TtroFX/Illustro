name: Verify M6A-068 once

on:
  push:
    branches: [main]
    paths:
      - '.github/m6a-068-apply-once.py'
      - '.github/workflows/m6a-068-verify-once.yml'

permissions:
  contents: write

concurrency:
  group: m6a-068-one-shot
  cancel-in-progress: false

jobs:
  verify-m6a-068:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply M6A-068 patch
        run: python3 .github/m6a-068-apply-once.py
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Pin npm toolchain
        run: npm install -g npm@11.19.1
      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline
      - name: Format changed sources
        run: npm run format
      - name: Dedicated pressure-response tests
        run: npx vitest run tests/unit/brush-pressure-response-curve.test.ts tests/unit/global-pressure-response.test.ts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Verify M6A contracts
        run: npm run verify:m6a
      - name: Production build
        run: npm run build
      - name: Integration tests
        run: npm run test:integration
      - name: Commit verified M6A-068
        env:
          EXPECTED_TRIGGER_SHA: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_TRIGGER_SHA" ]; then
            echo 'trigger checkout changed unexpectedly' >&2
            exit 1
          fi
          git add ILLUSTRO_DESIGN_MEMO.md IMPLEMENTATION_PROGRESS.md scripts/verify-m6a-brush.mjs src/domain/brush-schema.ts src/app/brush-preset-library.ts src/app/global-pressure-response-controller.ts src/app/brush-preset-controller.ts src/app/main.ts src/index.html tests/unit/brush-pressure-response-curve.test.ts tests/unit/global-pressure-response.test.ts
          git diff --cached --check
          git commit -m 'feat: implement global pressure response controls'
          git push origin HEAD:main
