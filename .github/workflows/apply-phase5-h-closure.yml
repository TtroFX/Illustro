name: Apply Illustro H closure

'on':
  push:
    branches:
      - main
    paths:
      - '.phase5-h-closure.md'
      - '.github/workflows/apply-phase5-h-closure.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append H closure once
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq '# Phase 5B H Iconography Closure — 2026-08-30' ILLUSTRO_DESIGN_MEMO.md; then
            echo 'H closure already present; no-op.'
            exit 0
          fi
          printf '\n\n' >> ILLUSTRO_DESIGN_MEMO.md
          cat .phase5-h-closure.md >> ILLUSTRO_DESIGN_MEMO.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ILLUSTRO_DESIGN_MEMO.md
          git commit -m 'docs: close H iconography specification'
          git push
