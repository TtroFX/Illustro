name: Illustro one-shot M6A-024 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/illustro-m6a024-core.py'
      - '.github/illustro-m6a024-app.py'
      - '.github/workflows/illustro-m6a024-patch.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply M6A-024 core patch
        run: python .github/illustro-m6a024-core.py
      - name: Apply M6A-024 app tests and docs patch
        run: python .github/illustro-m6a024-app.py
      - name: Format changed TypeScript
        run: >-
          npx biome format --write
          src/domain/brush-schema.ts
          src/gpu/baseline-brush.ts
          src/gpu/baseline-raster-tile-store.ts
          src/gpu/baseline-paint-renderer.ts
          src/app/canonical-raster-brush.ts
          src/app/paint-session-controller.ts
          src/app/brush-preset-library.ts
          src/app/brush-preset-controller.ts
          src/workers/render.worker.ts
          tests/unit/brush-tip-angle.test.ts
          scripts/verify-m6a-brush.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted regression tests
        run: >-
          npx vitest run
          tests/unit/brush-tip-angle.test.ts
          tests/unit/brush-tip-density.test.ts
          tests/unit/brush-spacing.test.ts
          tests/unit/procedural-brush-tip.test.ts
          tests/unit/custom-brush-tip.test.ts
          tests/unit/baseline-brush.test.ts
          tests/unit/baseline-raster-tile-store.test.ts
          tests/unit/baseline-paint-renderer.test.ts
          tests/unit/paint-session-controller.test.ts
      - name: M6A verification
        run: npm run verify:m6a
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/illustro-m6a024-core.py
          rm -f .github/illustro-m6a024-app.py
          rm -f .github/workflows/illustro-m6a024-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: implement M6A brush tip angle"
          git push origin HEAD:main