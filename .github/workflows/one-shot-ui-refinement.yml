name: One-shot UI memo refinement integration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-ui-refinement.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch canonical memo
        run: python .github/scripts/integrate-ui-memo.py

      - name: Commit integrated memo and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-ui-refinement.yml .github/scripts/integrate-ui-memo.py
          git add ILLUSTRO_DESIGN_MEMO.md
          git commit -m "docs: integrate editor UI refinement [skip ci]"
          git push origin main
