name: Illustro one-shot M6A-060 patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore dependencies
        run: npm ci
      - name: Apply M6A-060 particle-spread patch
        run: python3 scripts/patch-m6a060-particle-spread.py
      - name: Format changed TypeScript and verifier
        run: >-
          npx biome format --write
          src/domain/brush-schema.ts
          src/gpu/baseline-brush.ts
          src/app/canonical-raster-brush.ts
          src/app/paint-session-controller.ts
          src/app/brush-preset-library.ts
          src/app/brush-preset-controller.ts
          tests/unit/brush-particle-spread.test.ts
          scripts/verify-m6a-brush.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: M6A-060 particle-spread regression
        run: npx vitest run tests/unit/brush-particle-spread.test.ts
      - name: Spray-chain regression
        run: >-
          npx vitest run
          tests/unit/brush-spray-mode.test.ts
          tests/unit/brush-particle-size.test.ts
          tests/unit/brush-particle-density.test.ts
          tests/unit/brush-position-jitter.test.ts
          tests/unit/brush-density-jitter.test.ts
          tests/unit/brush-rotation-jitter.test.ts
          tests/unit/brush-color-jitter.test.ts
          tests/unit/brush-forced-taper.test.ts
          tests/unit/brush-post-stroke-correction.test.ts
      - name: M6A verification
        run: npm run verify:m6a
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f scripts/patch-m6a060-particle-spread.py .github/workflows/illustro-m6a060-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: implement M6A particle spread'
          git push origin HEAD:main
