name: Illustro one-shot M6A-054 patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore dependencies
        run: npm ci
      - name: Normalize controller anchor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/app/brush-preset-controller.ts')
          text = path.read_text(encoding='utf-8')
          old = "  const onRotationJitterNumber = (): void =>\n    updateRotationJitter(Number(rotationJitterNumber.value));\n"
          new = "  const onRotationJitterNumber = (): void => updateRotationJitter(Number(rotationJitterNumber.value));\n"
          if text.count(old) != 1:
              raise SystemExit('rotation-jitter handler anchor not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply M6A-054 position-jitter patch
        run: python3 scripts/patch-m6a054-position-jitter.py
      - name: Format changed TypeScript and verifier
        run: >-
          npx biome format --write
          src/domain/brush-schema.ts
          src/gpu/baseline-brush.ts
          src/app/canonical-raster-brush.ts
          src/app/paint-session-controller.ts
          src/app/brush-preset-library.ts
          src/app/brush-preset-controller.ts
          tests/unit/brush-position-jitter.test.ts
          scripts/verify-m6a-brush.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: M6A-054 position-jitter regression
        run: npx vitest run tests/unit/brush-position-jitter.test.ts
      - name: Existing random, spacing and tail regression
        run: >-
          npx vitest run
          tests/unit/brush-size-jitter.test.ts
          tests/unit/brush-opacity-jitter.test.ts
          tests/unit/brush-rotation-jitter.test.ts
          tests/unit/brush-random-dynamics.test.ts
          tests/unit/brush-spacing.test.ts
          tests/unit/brush-follow-rotation.test.ts
          tests/unit/brush-forced-taper.test.ts
          tests/unit/brush-post-stroke-correction.test.ts
          tests/unit/brush-stroke-repetition.test.ts
      - name: M6A verification
        run: npm run verify:m6a
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f scripts/patch-m6a054-position-jitter.py .github/workflows/illustro-m6a054-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: implement M6A position jitter'
          git push origin HEAD:main
