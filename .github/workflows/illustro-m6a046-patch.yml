name: Illustro one-shot M6A-046 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/illustro-m6a046-patch.py'
      - '.github/workflows/illustro-m6a046-patch.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Align release endpoint patch anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/illustro-m6a046-patch.py')
          text = path.read_text()
          old = '''    """                altitudeAngle:\n                  active.source === 'pen' ? rawEndpoint.altitudeAngle : Math.PI / 2,\n""",\n    """                altitudeAngle:\n                  active.source === 'pen' ? rawEndpoint.altitudeAngle : Math.PI / 2,\n                azimuthAngle: active.source === 'pen' ? rawEndpoint.azimuthAngle : 0,\n                twist: active.source === 'pen' ? rawEndpoint.twist : 0,\n""",'''
          new = '''    """                altitudeAngle: active.source === 'pen' ? rawEndpoint.altitudeAngle : Math.PI / 2,\n""",\n    """                altitudeAngle: active.source === 'pen' ? rawEndpoint.altitudeAngle : Math.PI / 2,\n                azimuthAngle: active.source === 'pen' ? rawEndpoint.azimuthAngle : 0,\n                twist: active.source === 'pen' ? rawEndpoint.twist : 0,\n""",'''
          if old not in text:
              raise SystemExit('M6A-046 release endpoint patch-source anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply M6A-046 orientation patch
        run: python3 .github/illustro-m6a046-patch.py
      - name: Format changed TypeScript and verifier
        run: npx biome format --write src/domain/brush-schema.ts src/gpu/baseline-brush.ts src/app/canonical-raster-brush.ts src/app/paint-session-controller.ts src/app/brush-preset-library.ts src/app/brush-preset-controller.ts tests/unit/brush-orientation-mapping.test.ts scripts/verify-m6a-brush.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted regression tests
        run: npx vitest run tests/unit/brush-orientation-mapping.test.ts tests/unit/brush-follow-rotation.test.ts tests/unit/brush-tip-angle.test.ts tests/unit/brush-tip-direction.test.ts tests/unit/brush-tilt-mapping.test.ts tests/unit/brush-pressure-response-curve.test.ts tests/unit/brush-realtime-stabilizer.test.ts tests/unit/brush-post-stroke-correction.test.ts
      - name: M6A verification
        run: npm run verify:m6a
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        run: |
          rm -f .github/illustro-m6a046-patch.py .github/workflows/illustro-m6a046-patch.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement M6A orientation mapping'
          git push origin HEAD:main
