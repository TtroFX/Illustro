<!doctype html>
<html lang="en">
  <head>

    <title>Illustro Diagnostics</title>
    <style>
      :root { color-scheme: light; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; background: #f6f8fc; color: #15203a; }

  </head>
  <body>
    <header>
      <div>
        <h1>Illustro Diagnostics</h1>

      <output id="state">Collecting…</output>
    </header>
    <p>This page reports only deployment/runtime capability state and contains no document or user content.</p>
    <pre id="report" aria-live="polite">Loading…</pre>
    <script type="module" src="./runtime.js"></script>
