<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="illustro-build-mode" content="__ILLUSTRO_BUILD_MODE__" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./app-shell.css" />
    <title>Illustro</title>
  </head>
  <body>
    <div id="app" class="illustro-shell" data-illustro-shell="foundation" role="application" aria-label="Illustro">
      <header class="shell-topbar">
        <div class="shell-brand">
          <span class="shell-menu-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <strong>Illustro</strong>
        </div>
        <nav class="shell-topbar-menus" aria-label="Application menus">
          <details class="shell-menu-dropdown">
            <summary>ファイル</summary>
            <div class="shell-menu-popover">
              <button id="new-document" type="button">新規作成…</button>
              <button id="export-png-menu" type="button">PNGを書き出し…</button>
            </div>
          </details>
          <span>編集</span>
          <details class="shell-menu-dropdown">
            <summary>ページ</summary>
            <div class="shell-menu-popover">
              <button id="document-settings" type="button">ドキュメント設定…</button>
              <button id="canvas-resize" type="button">キャンバスサイズ…</button>
              <button id="canvas-crop" type="button">クロップ…</button>
              <button id="canvas-trim" type="button">透明部分をトリミング</button>
            </div>
          </details>
          <span>選択範囲</span><span>表示</span><span>フィルター</span>
        </nav>
        <div class="shell-topbar-actions">
          <button id="export-png" class="shell-export-button" type="button" disabled>Export PNG</button>
          <output id="build-identity" class="shell-build-identity" aria-label="Build identity">Build …</output>
          <a class="shell-diagnostics-link" href="./diagnostics/">Diagnostics</a>
        </div>
      </header>
      <div class="shell-workspace">
        <aside class="shell-tool-rail" aria-label="Primary tool rail">
          <div class="shell-rail-slots" aria-hidden="true">
            <span class="is-active"></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </aside>
        <main class="shell-document" aria-label="Document workspace">
          <div class="shell-tabstrip" aria-hidden="true">
            <span class="shell-home-dot"></span>
            <span class="shell-document-tab">Illustration</span>
          </div>
          <div class="shell-canvas-stage">
            <canvas id="render-surface" class="shell-canvas" width="1" height="1" aria-label="Illustration canvas"></canvas>
          </div>
        </main>
        <aside class="shell-inspector" aria-label="Inspector">
          <div class="shell-inspector-tabs" aria-hidden="true">
            <span class="is-active"></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="shell-inspector-card" aria-hidden="true">
            <span class="shell-line shell-line-wide"></span>
            <span class="shell-line"></span>
            <span class="shell-line shell-line-short"></span>
          </div>
          <div class="shell-inspector-list" aria-hidden="true">
            <span></span><span></span><span class="is-selected"></span><span></span><span></span>
          </div>
          <div class="shell-inspector-card shell-inspector-card-lower" aria-hidden="true">
            <span class="shell-line shell-line-wide"></span>
            <div class="shell-preset-grid"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          </div>
        </aside>
      </div>
    </div>
    <dialog id="document-dialog" class="document-dialog" aria-labelledby="document-dialog-title">
      <form id="document-form" method="dialog" class="document-dialog-form">
        <header><h2 id="document-dialog-title">新規ドキュメント</h2></header>
        <label>名前<input id="document-name" type="text" value="Untitled" maxlength="120" /></label>
        <label>プリセット<select id="document-preset"><option value="custom">カスタム</option></select></label>
        <div class="document-dialog-grid">
          <label>幅 <input id="document-width" type="number" min="1" max="32768" step="1" value="2048" /></label>
          <label>高さ <input id="document-height" type="number" min="1" max="32768" step="1" value="2048" /></label>
          <label>PPI <input id="document-ppi" type="number" min="0.01" step="0.01" value="300" /></label>
        </div>
        <div class="document-dialog-grid document-dialog-grid-wide">
          <label>背景<select id="document-background-mode"><option value="transparent">透明</option><option value="solid">単色</option></select></label>
          <label>背景色<input id="document-background-color" type="color" value="#ffffff" /></label>
          <label>背景不透明度<input id="document-background-alpha" type="number" min="0" max="100" step="1" value="100" /></label>
        </div>
        <div class="document-dialog-grid">
          <label>色空間<select id="document-working-space"><option value="srgb">sRGB</option><option value="display-p3">Display-P3</option></select></label>
          <label>精度<select id="document-precision"><option value="rgba8-unorm">RGBA8</option><option value="rgba16-float">RGBA16F</option></select></label>
        </div>
        <output id="document-dialog-status" class="document-dialog-status" aria-live="polite"></output>
        <footer>
          <button type="button" class="document-dialog-secondary" onclick="this.closest('dialog').close()">キャンセル</button>
          <button id="document-submit" type="submit" class="document-dialog-primary">作成</button>
        </footer>
      </form>
    </dialog>
    <dialog id="canvas-geometry-dialog" class="document-dialog" aria-labelledby="canvas-geometry-title">
      <form id="canvas-geometry-form" method="dialog" class="document-dialog-form">
        <header><h2 id="canvas-geometry-title">キャンバスサイズ</h2></header>
        <div class="document-dialog-grid">
          <label id="canvas-geometry-x-row"><span id="canvas-geometry-x-label">内容オフセット X</span><input id="canvas-geometry-x" type="number" step="1" value="0" /></label>
          <label id="canvas-geometry-y-row"><span id="canvas-geometry-y-label">内容オフセット Y</span><input id="canvas-geometry-y" type="number" step="1" value="0" /></label>
          <span></span>
          <label>幅 <input id="canvas-geometry-width" type="number" min="1" max="32768" step="1" /></label>
          <label>高さ <input id="canvas-geometry-height" type="number" min="1" max="32768" step="1" /></label>
        </div>
        <p class="document-dialog-help">オフセットは既存内容を新しいキャンバス座標へ移動します。大きくする場合は余白追加として扱われます。</p>
        <output id="canvas-geometry-status" class="document-dialog-status" aria-live="polite"></output>
        <footer>
          <button id="canvas-geometry-cancel" type="button" class="document-dialog-secondary">キャンセル</button>
          <button id="canvas-geometry-submit" type="submit" class="document-dialog-primary">適用</button>
        </footer>
      </form>
    </dialog>
    <script type="module" src="./app/main.js"></script>
  </body>
</html>
