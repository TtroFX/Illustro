<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="illustro-build-mode" content="__ILLUSTRO_BUILD_MODE__" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./app-shell.css" />
    <title>Illustro</title>
  </head>
  <body>
    <div id="app" class="illustro-shell" data-illustro-shell="foundation" role="application" aria-label="Illustro">
      <header class="shell-topbar">
        <div class="shell-brand">
          <span class="shell-menu-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <strong>Illustro</strong>
        </div>
        <nav class="shell-topbar-menus" aria-label="Application menus">
          <details class="shell-menu-dropdown">
            <summary>ファイル</summary>
            <div class="shell-menu-popover">
              <button id="new-document" type="button">新規作成…</button>
              <button id="export-png-menu" type="button">PNGを書き出し…</button>
            </div>
          </details>
          <span>編集</span>
          <details class="shell-menu-dropdown">
            <summary>ページ</summary>
            <div class="shell-menu-popover">
              <button id="document-settings" type="button">ドキュメント設定…</button>
              <button id="image-resize" type="button">画像サイズ…</button>
              <button id="canvas-resize" type="button">キャンバスサイズ…</button>
              <button id="canvas-crop" type="button">クロップ…</button>
              <button id="canvas-trim" type="button">透明部分をトリミング</button>
              <button id="document-rotate-cw" type="button">右に90°回転</button>
              <button id="document-rotate-ccw" type="button">左に90°回転</button>
              <button id="document-rotate-180" type="button">180°回転</button>
              <button id="document-flip-horizontal" type="button">左右反転</button>
              <button id="document-flip-vertical" type="button">上下反転</button>
            </div>
          </details>
          <details class="shell-menu-dropdown">
            <summary>レイヤー</summary>
            <div class="shell-menu-popover">
              <button id="layer-add-raster" type="button">ラスターレイヤーを追加</button>
              <button id="layer-add-folder" type="button">フォルダを追加</button>
              <button id="layer-add-vector" type="button">ベクター/シェイプレイヤーを追加</button>
              <button id="layer-add-adjustment" type="button">調整レイヤーを追加</button>
              <button id="layer-add-fill" type="button">塗りレイヤーを追加</button>
              <button id="layer-add-gradient" type="button">グラデーションレイヤーを追加</button>
              <button id="layer-add-mask" type="button">レイヤーマスクを追加</button>
              <button id="layer-add-linked-object" type="button">リンクオブジェクトを追加</button>
            </div>
          </details>
          <span>選択範囲</span>
          <details class="shell-menu-dropdown">
            <summary>表示</summary>
            <div class="shell-menu-popover">
              <button id="view-zoom-in" type="button">拡大</button>
              <button id="view-zoom-out" type="button">縮小</button>
              <button id="view-rotate-left" type="button">表示を左へ15°回転</button>
              <button id="view-rotate-right" type="button">表示を右へ15°回転</button>
              <button id="view-reset" type="button">表示をリセット</button>
              <button id="view-fit" type="button">画面に合わせる</button>
              <button id="view-mirror" type="button">左右反転プレビュー</button>
              <button id="view-pixel" type="button">ピクセル表示</button>
              <button id="view-grid-toggle" type="button">グリッド表示</button>
              <button id="view-grid-settings" type="button">グリッド設定…</button>
              <button id="view-workspace" type="button">全画面ワークスペース</button>
            </div>
          </details>
          <span>フィルター</span>
        </nav>
        <div class="shell-topbar-actions">
          <button id="export-png" class="shell-export-button" type="button" disabled>Export PNG</button>
          <output id="build-identity" class="shell-build-identity" aria-label="Build identity">Build …</output>
          <a class="shell-diagnostics-link" href="./diagnostics/">Diagnostics</a>
        </div>
      </header>
      <div class="shell-workspace">
        <aside class="shell-tool-rail" aria-label="Primary tool rail">
          <div class="shell-rail-slots" aria-hidden="true">
            <span class="is-active"></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </aside>
        <main class="shell-document" aria-label="Document workspace">
          <div class="shell-tabstrip" aria-hidden="true">
            <span class="shell-home-dot"></span>
            <span class="shell-document-tab">Illustration</span>
          </div>
          <div class="shell-canvas-stage">
            <div id="canvas-viewport-frame" class="shell-canvas-frame">
              <canvas id="render-surface" class="shell-canvas" width="1" height="1" aria-label="Illustration canvas"></canvas>
              <div id="canvas-grid-overlay" class="shell-grid-overlay" aria-hidden="true" hidden></div>
            </div>
          </div>
        </main>
        <aside class="shell-inspector" aria-label="Inspector">
          <div class="shell-inspector-tabs" aria-hidden="true">
            <span class="is-active"></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="shell-inspector-card" aria-hidden="true">
            <span class="shell-line shell-line-wide"></span>
            <span class="shell-line"></span>
            <span class="shell-line shell-line-short"></span>
          </div>
          <fieldset id="layer-list" class="shell-inspector-list" aria-label="レイヤー一覧"></fieldset>
          <fieldset id="layer-actions" class="shell-layer-actions" aria-label="選択レイヤー操作">
            <div class="shell-layer-action-strip">
              <button id="layer-duplicate" type="button" aria-label="レイヤーを複製" title="複製">⧉</button>
              <button id="layer-merge-down" type="button" aria-label="下のレイヤーと結合" title="下のレイヤーと結合">↧</button>
              <button id="layer-merge-visible-copy" type="button" aria-label="表示レイヤーを結合コピー" title="表示レイヤーを結合コピー">⇊</button>
              <button id="layer-rasterize" type="button" aria-label="選択レイヤーをラスタライズ" title="ラスタライズ">▦</button>
              <button id="layer-invert" type="button" aria-label="選択レイヤーの色を反転" title="色反転">◑</button>
              <button id="layer-flip-horizontal" type="button" aria-label="選択レイヤーを左右反転" title="左右反転">⇆</button>
              <button id="layer-flip-vertical" type="button" aria-label="選択レイヤーを上下反転" title="上下反転">⇅</button>
              <button id="layer-group-transform" type="button" aria-label="選択中の複数レイヤーをまとめて変形" title="複数レイヤー変形">⤢</button>
              <button id="layer-rename" type="button" aria-label="レイヤー名を変更" title="名前を変更">✎</button>
              <button id="layer-delete" type="button" aria-label="レイヤーを削除" title="削除">×</button>
              <button id="layer-clear" type="button" aria-label="レイヤー内容をクリア" title="内容をクリア">⌫</button>
              <button id="layer-move-up" type="button" aria-label="レイヤーを上へ移動" title="上へ">↑</button>
              <button id="layer-move-down" type="button" aria-label="レイヤーを下へ移動" title="下へ">↓</button>
              <button id="layer-lock" type="button" aria-label="レイヤーをロック" title="ロック" aria-pressed="false">◇</button>
              <button id="layer-alpha-lock" type="button" aria-label="透明ピクセルをロック" title="Alpha Lock" aria-pressed="false">α</button>
              <label class="shell-layer-opacity" title="不透明度"><span aria-hidden="true">◐</span><input id="layer-opacity" type="number" min="0" max="100" step="1" value="100" aria-label="レイヤー不透明度 パーセント" /></label>
            </div>
            <form id="layer-rename-editor" class="shell-layer-rename-editor" hidden>
              <input id="layer-rename-input" type="text" maxlength="120" aria-label="レイヤー名" />
              <button type="submit" aria-label="名前変更を適用">✓</button>
              <button id="layer-rename-cancel" type="button" aria-label="名前変更をキャンセル">×</button>
            </form>
            <output id="layer-action-status" class="shell-layer-action-status" aria-live="polite"></output>
          </fieldset>
          <div class="shell-inspector-card shell-inspector-card-lower" aria-hidden="true">
            <span class="shell-line shell-line-wide"></span>
            <div class="shell-preset-grid"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          </div>
        </aside>
      </div>
    </div>
    <dialog id="layer-group-transform-dialog" class="document-dialog" aria-labelledby="layer-group-transform-title">
      <form id="layer-group-transform-form" method="dialog" class="document-dialog-form">
        <header><h2 id="layer-group-transform-title">複数レイヤー変形</h2></header>
        <p class="document-dialog-help">選択中の複数レイヤーへ同じ非破壊Affine変形を適用します。</p>
        <div class="document-dialog-grid">
          <label>移動 X (px)<input id="layer-group-transform-x" type="number" step="0.1" value="0" /></label>
          <label>移動 Y (px)<input id="layer-group-transform-y" type="number" step="0.1" value="0" /></label>
          <label>回転 (°)<input id="layer-group-transform-rotation" type="number" step="0.1" value="0" /></label>
          <label>拡大率 X (%)<input id="layer-group-transform-scale-x" type="number" min="0.01" step="0.1" value="100" /></label>
          <label>拡大率 Y (%)<input id="layer-group-transform-scale-y" type="number" min="0.01" step="0.1" value="100" /></label>
          <span></span>
          <label>基準点 X<input id="layer-group-transform-pivot-x" type="number" step="0.1" value="0" /></label>
          <label>基準点 Y<input id="layer-group-transform-pivot-y" type="number" step="0.1" value="0" /></label>
        </div>
        <output id="layer-group-transform-status" class="document-dialog-status" aria-live="polite"></output>
        <footer>
          <button id="layer-group-transform-cancel" type="button" class="document-dialog-secondary">キャンセル</button>
          <button type="submit" class="document-dialog-primary">適用</button>
        </footer>
      </form>
    </dialog>
    <dialog id="document-dialog" class="document-dialog" aria-labelledby="document-dialog-title">
      <form id="document-form" method="dialog" class="document-dialog-form">
        <header><h2 id="document-dialog-title">新規ドキュメント</h2></header>
        <label>名前<input id="document-name" type="text" value="Untitled" maxlength="120" /></label>
        <label>プリセット<select id="document-preset"><option value="custom">カスタム</option></select></label>
        <div class="document-dialog-grid">
          <label>幅 <input id="document-width" type="number" min="1" max="32768" step="1" value="2048" /></label>
          <label>高さ <input id="document-height" type="number" min="1" max="32768" step="1" value="2048" /></label>
          <label>PPI <input id="document-ppi" type="number" min="0.01" step="0.01" value="300" /></label>
        </div>
        <div class="document-dialog-grid document-dialog-grid-wide">
          <label>背景<select id="document-background-mode"><option value="transparent">透明</option><option value="solid">単色</option></select></label>
          <label>背景色<input id="document-background-color" type="color" value="#ffffff" /></label>
          <label>背景不透明度<input id="document-background-alpha" type="number" min="0" max="100" step="1" value="100" /></label>
        </div>
        <div class="document-dialog-grid">
          <label>色空間<select id="document-working-space"><option value="srgb">sRGB</option><option value="display-p3">Display-P3</option></select></label>
          <label>精度<select id="document-precision"><option value="rgba8-unorm">RGBA8</option><option value="rgba16-float">RGBA16F</option></select></label>
        </div>
        <output id="document-dialog-status" class="document-dialog-status" aria-live="polite"></output>
        <footer>
          <button type="button" class="document-dialog-secondary" onclick="this.closest('dialog').close()">キャンセル</button>
          <button id="document-submit" type="submit" class="document-dialog-primary">作成</button>
        </footer>
      </form>
    </dialog>
    <dialog id="canvas-geometry-dialog" class="document-dialog" aria-labelledby="canvas-geometry-title">
      <form id="canvas-geometry-form" method="dialog" class="document-dialog-form">
        <header><h2 id="canvas-geometry-title">キャンバスサイズ</h2></header>
        <div class="document-dialog-grid">
          <label id="canvas-geometry-x-row"><span id="canvas-geometry-x-label">内容オフセット X</span><input id="canvas-geometry-x" type="number" step="1" value="0" /></label>
          <label id="canvas-geometry-y-row"><span id="canvas-geometry-y-label">内容オフセット Y</span><input id="canvas-geometry-y" type="number" step="1" value="0" /></label>
          <span></span>
          <label>幅 <input id="canvas-geometry-width" type="number" min="1" max="32768" step="1" /></label>
          <label>高さ <input id="canvas-geometry-height" type="number" min="1" max="32768" step="1" /></label>
        </div>
        <p id="canvas-geometry-help" class="document-dialog-help">オフセットは既存内容を新しいキャンバス座標へ移動します。大きくする場合は余白追加として扱われます。</p>
        <output id="canvas-geometry-status" class="document-dialog-status" aria-live="polite"></output>
        <footer>
          <button id="canvas-geometry-cancel" type="button" class="document-dialog-secondary">キャンセル</button>
          <button id="canvas-geometry-submit" type="submit" class="document-dialog-primary">適用</button>
        </footer>
      </form>
    </dialog>
    <dialog id="grid-dialog" class="document-dialog" aria-labelledby="grid-dialog-title">
      <form id="grid-form" method="dialog" class="document-dialog-form">
        <header><h2 id="grid-dialog-title">グリッド設定</h2></header>
        <div class="document-dialog-grid">
          <label>間隔 (px)<input id="grid-spacing" type="number" min="1" max="32768" step="1" value="64" /></label>
          <label>オフセット X<input id="grid-offset-x" type="number" step="1" value="0" /></label>
          <label>オフセット Y<input id="grid-offset-y" type="number" step="1" value="0" /></label>
          <label>色<input id="grid-color" type="color" value="#64748b" /></label>
        </div>
        <output id="grid-status" class="document-dialog-status" aria-live="polite"></output>
        <footer>
          <button id="grid-cancel" type="button" class="document-dialog-secondary">キャンセル</button>
          <button type="submit" class="document-dialog-primary">適用</button>
        </footer>
      </form>
    </dialog>
    <script type="module" src="./app/main.js"></script>
  </body>
</html>
